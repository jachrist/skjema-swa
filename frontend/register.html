<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <script>
        (function() {
            const t = localStorage.getItem('theme');
            if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        })();
    </script>
    <style>
        :root {
            --bg-page: #e8edf2;
            --bg-container: rgba(255, 255, 255, 0.85);
            --bg-section: rgba(255, 255, 255, 0.55);
            --bg-svar: rgba(255, 255, 255, 0.7);
            --bg-input: white;
            --text-primary: #1c1c1e;
            --text-secondary: #6e6e73;
            --text-heading: #0a84ff;
            --border-color: rgba(0, 0, 0, 0.1);
            --input-border: #d1d1d6;
            --shadow: 0 4px 30px rgba(0, 0, 0, 0.06);
            --accent: #0a84ff;
            --accent-light: rgba(10, 132, 255, 0.12);
            --danger: #ff3b30;
            --danger-light: rgba(255, 59, 48, 0.1);
            --status-utkast: #ff9500;
            --status-innsendt: #34c759;
            --status-avvist: #ff3b30;
            --status-behandling: #af52de;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 18px;
            --radius-xl: 24px;
        }
        [data-theme="dark"] {
            --bg-page: #0d1117;
            --bg-container: rgba(30, 35, 45, 0.85);
            --bg-section: rgba(40, 45, 60, 0.55);
            --bg-svar: rgba(20, 25, 35, 0.7);
            --bg-input: #1c2028;
            --text-primary: #f0f0f5;
            --text-secondary: #8e8e93;
            --text-heading: #64b5f6;
            --border-color: rgba(255, 255, 255, 0.1);
            --input-border: #3a3a5a;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-page);
            color: var(--text-primary);
            margin: 0;
            padding: 16px;
            -webkit-font-smoothing: antialiased;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: var(--bg-container);
            backdrop-filter: blur(20px);
            padding: 24px;
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }
        .topplinje {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 4px;
        }
        .topprad {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 10px;
        }
        .tilbake-lenke { color: var(--accent); text-decoration: none; font-size: 13px; }
        .tilbake-lenke:hover { text-decoration: underline; }
        .tittelrad { display: flex; align-items: center; gap: 14px; flex: 1; min-width: 0; }
        h1 { font-size: 1.5em; font-weight: 700; margin: 0; letter-spacing: -0.02em; }
        .brukerinfo { font-size: 13px; color: var(--text-secondary); }
        .brukerinfo .upn { font-weight: 500; color: var(--text-primary); }
        .undertittel { color: var(--text-secondary); margin: 4px 0 16px; font-size: 13px; }

        /* --- To-spalters layout --- */
        .to-spalter {
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 20px;
            min-height: 600px;
        }
        .venstre {
            background: var(--bg-section);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 80vh;
            overflow: hidden;
        }
        .venstre-filtre {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }
        .felt-pille {
            display: inline-block;
            padding: 3px 10px;
            font-size: 11px;
            border: 1px solid var(--border-color);
            border-radius: 999px;
            background: var(--bg-input);
            cursor: pointer;
            user-select: none;
        }
        .felt-pille:hover { border-color: var(--accent); }
        .felt-pille.aktiv {
            background: var(--accent-light);
            border-color: var(--accent);
            color: var(--accent);
            font-weight: 600;
        }
        .venstre-liste {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin: -4px;
            padding: 4px;
        }
        .hoyre {
            background: var(--bg-section);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 24px;
            min-height: 300px;
        }

        input[type="text"],
        input[type="number"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 8px 12px;
            font-size: 14px;
            border: 1px solid var(--input-border);
            border-radius: var(--radius-sm);
            background: var(--bg-input);
            color: var(--text-primary);
            font-family: inherit;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-light);
        }
        textarea { min-height: 90px; resize: vertical; }

        .liste-element {
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            background: var(--bg-container);
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: background 0.1s, border-color 0.1s;
        }
        .liste-element:hover { background: var(--accent-light); }
        .liste-element.aktiv { border-color: var(--accent); background: var(--accent-light); }
        .liste-tittel { font-weight: 600; font-size: 13px; margin-bottom: 4px; word-break: break-word; }
        .liste-meta { font-size: 11px; color: var(--text-secondary); display: flex; justify-content: space-between; gap: 8px; align-items: center; }
        .status-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            color: white;
            white-space: nowrap;
        }
        .status-badge.status-1 { background: var(--status-utkast); }
        .status-badge.status-2 { background: var(--status-innsendt); }
        .status-badge.status-3 { background: var(--status-avvist); }
        .status-badge.status-4 { background: var(--status-behandling); }
        .status-badge.status-0 { background: var(--text-secondary); }

        .tom-melding {
            color: var(--text-secondary);
            text-align: center;
            padding: 20px;
            font-size: 13px;
        }
        .info-melding {
            color: var(--text-secondary);
            text-align: center;
            padding: 60px 20px;
            font-size: 15px;
        }
        .feilmelding { color: var(--danger); text-align: center; padding: 20px; }

        /* Detaljpanel */
        .detalj-topplinje {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        .detalj-tittel { font-size: 1.3em; font-weight: 700; margin: 0; letter-spacing: -0.02em; }
        .detalj-meta { display: flex; gap: 16px; flex-wrap: wrap; color: var(--text-secondary); font-size: 12px; margin-bottom: 20px; }
        .detalj-meta strong { color: var(--text-primary); }
        .detalj-knapper { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }

        .seksjon {
            padding: 16px 20px;
            margin-bottom: 14px;
            background: var(--bg-container);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
        }
        .seksjon-tittel {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin: 0 0 12px 0;
        }
        .felt { margin-bottom: 12px; }
        .felt:last-child { margin-bottom: 0; }
        .felt-label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 4px;
        }
        .felt-nummer {
            display: inline-block;
            min-width: 22px;
            color: var(--text-secondary);
            font-weight: 500;
        }
        .oblig-markering { color: var(--danger); margin-left: 4px; }
        .felt-svar {
            padding: 8px 12px;
            background: var(--bg-svar);
            border-left: 3px solid var(--accent);
            border-radius: var(--radius-sm);
            font-size: 14px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .felt-svar.tomt {
            color: var(--text-secondary);
            font-style: italic;
            border-left-color: var(--border-color);
        }
        .felt-svar ul { margin: 4px 0 0 20px; padding: 0; }

        .md-lenke { color: var(--accent); text-decoration: underline; }
        .md-lenke:hover { opacity: 0.8; }

        .informasjon {
            padding: 10px 14px;
            background: var(--accent-light);
            border-left: 3px solid var(--accent);
            border-radius: var(--radius-sm);
            font-size: 13px;
        }

        .flervalg-knapper { display: flex; flex-wrap: wrap; gap: 8px; }
        .flervalg-knapp {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 6px 12px;
            border: 1px solid var(--input-border);
            border-radius: var(--radius-sm);
            background: var(--bg-input);
            cursor: pointer;
            font-size: 13px;
        }
        .flervalg-knapp:hover { background: var(--accent-light); }
        .flervalg-knapp.selected {
            border-color: var(--accent); background: var(--accent-light);
            color: var(--accent); font-weight: 600;
        }
        .flervalg-knapp input { display: none; }
        .skala { display: flex; flex-wrap: wrap; gap: 6px; }
        .skala-valg {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 6px 12px;
            border: 1px solid var(--input-border);
            border-radius: var(--radius-sm);
            background: var(--bg-input);
            cursor: pointer;
            font-size: 13px;
        }

        .knapp {
            display: inline-flex; align-items: center;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 600;
            border: 0;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-family: inherit;
            text-decoration: none;
            gap: 6px;
        }
        .knapp.primær { background: var(--accent); color: white; }
        .knapp.primær:hover { filter: brightness(1.1); }
        .knapp.primær:disabled { opacity: 0.5; cursor: not-allowed; }
        .knapp.sekundær {
            background: transparent; color: var(--accent);
            border: 1px solid var(--accent);
        }
        .knapp.sekundær:hover { background: var(--accent-light); }
        .knapp.danger {
            background: transparent; color: var(--danger);
            border: 1px solid var(--danger);
        }
        .knapp.danger:hover { background: var(--danger-light); }

        /* Bekreft-dialog */
        .modal-bakteppe {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.4);
            display: none;
            align-items: center; justify-content: center;
            z-index: 1000;
        }
        .modal-bakteppe.vis { display: flex; }
        .modal {
            background: var(--bg-container);
            backdrop-filter: blur(20px);
            padding: 24px 28px;
            border-radius: var(--radius-lg);
            max-width: 420px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.2);
            border: 1px solid var(--border-color);
        }
        .modal h3 { margin: 0 0 8px 0; font-size: 1.2em; }
        .modal p { margin: 0 0 20px 0; color: var(--text-secondary); }
        .modal-knapper { display: flex; gap: 10px; justify-content: flex-end; }

        @media (max-width: 800px) {
            .to-spalter { grid-template-columns: 1fr; }
            .venstre { max-height: none; }
            .hoyre.tom { display: none; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="topprad">
            <a href="/velgskjematype.html" class="tilbake-lenke">← Til skjemaoversikten</a>
            <div class="brukerinfo">
                <a id="lenke-datauttrekk" class="tilbake-lenke" style="margin-right: 12px; display: none;" href="#">Datauttrekk →</a>
                <span class="upn" id="upn">…</span>
            </div>
        </div>
        <div class="topplinje">
            <div class="tittelrad"><h1 id="tittel">Register</h1></div>
            <div id="systemmerke-plass"></div>
        </div>
        <p class="undertittel" id="undertittel">Laster…</p>

        <div class="to-spalter">
            <div class="venstre">
                <div class="venstre-filtre">
                    <input type="text" id="sok" placeholder="🔍 Søk innsender eller ID…" oninput="filtrer()">
                    <select id="statusFilter" onchange="filtrer()">
                        <option value="">Alle statuser</option>
                        <option value="1">Utkast</option>
                        <option value="2">Innsendt / under behandling</option>
                        <option value="3">Til revidering</option>
                        <option value="5">Avsluttet</option>
                    </select>
                    <label style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary);">
                        <input type="checkbox" id="mineFilter" onchange="filtrer()">
                        Kun mine aktive
                    </label>
                    <div id="felt-filtre"></div>
                </div>
                <div class="venstre-liste" id="liste">
                    <div class="tom-melding">Laster…</div>
                </div>
            </div>

            <div class="hoyre tom" id="hoyre">
                <div class="info-melding">Velg et skjema fra listen til venstre</div>
            </div>
        </div>
    </div>

    <!-- Bekreft-slett-modal -->
    <div class="modal-bakteppe" id="slettModal">
        <div class="modal">
            <h3>Slett skjema?</h3>
            <p>Denne handlingen kan ikke angres. Skjemaet blir permanent slettet.</p>
            <div class="modal-knapper">
                <button class="knapp sekundær" onclick="lukkSlettModal()">Avbryt</button>
                <button class="knapp danger" onclick="bekreftSlett()" id="slettBekreft">Slett skjemaet</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { api } from './js/api-client.js';
        import { hentInnloggetBruker } from './js/auth.js';
        import { byggEditWidget, byggReadonlyVisning, hentSvarFraDom, svarTekstFor, preSubmitOpplasting, samleSeksjonerFraDom, escapeHtml as escHtml, renderTekstInline } from './js/felt-render.js';
        import { evaluerVilkar } from './js/vilkar.js';

        const params = new URLSearchParams(window.location.search);
        const skjematypeId = params.get('skjematype_id');
        // ?status=N pre-selekterer statusfilteret. Brukes bl.a. av arkiv-lenken
        // (?status=5 = Avsluttet).
        const statusParam = params.get('status');

        const STATUS_TEKST = { 0: '–', 1: 'Utkast', 2: 'Innsendt', 3: 'Avvist', 4: 'Under behandling', 5: 'Avsluttet' };
        const state = {
            skjematype: null,
            alle: [],
            filtrert: [],
            valgtId: null,
            valgtSkjema: null,
            redigerer: false
        };

        async function init() {
            const bruker = await hentInnloggetBruker();
            if (!bruker) {
                window.location.href = '/.auth/login/aad?post_login_redirect_uri=' + encodeURIComponent(window.location.pathname + window.location.search);
                return;
            }
            document.getElementById('upn').textContent = bruker.userDetails;
            if (!skjematypeId) {
                visListeMelding('Mangler skjematype_id i URL.');
                return;
            }

            // Pre-selekter status-filter fra URL (før første render)
            if (statusParam) {
                const sf = document.getElementById('statusFilter');
                if (sf) sf.value = statusParam;
            }

            try {
                state.skjematype = await api.get(`/api/skjematyper/${encodeURIComponent(skjematypeId)}`);
                const navn = state.skjematype.Skjema_navn || 'Skjematype ' + skjematypeId;
                // Egen tittel når vi kommer via arkiv-lenken
                const prefix = statusParam === '5' ? 'Arkiv' : 'Register';
                document.getElementById('tittel').textContent = `${prefix} — ${navn}`;
                document.title = document.getElementById('tittel').textContent;
                const lenke = document.getElementById('lenke-datauttrekk');
                if (lenke) {
                    lenke.href = `/datauttrekk.html?skjematype_id=${encodeURIComponent(skjematypeId)}`;
                    lenke.style.display = '';
                }
                // bygFeltFiltre() kalles etter state.alle er hentet — trenger data for å utlede verdier
            } catch (_) { /* ikke kritisk */ }

            try {
                const [alle, minB] = await Promise.all([
                    api.get(`/api/skjema-liste/${encodeURIComponent(skjematypeId)}`),
                    api.get('/api/mine-behandlinger').catch(() => ({}))
                ]);
                state.alle = alle;
                state.mineIder = new Set((minB[skjematypeId] || []).map(b => b.Skjema_id));
                document.getElementById('undertittel').textContent =
                    `${state.alle.length} skjema${state.alle.length === 1 ? '' : 'er'} totalt.`;
                bygFeltFiltre();
                filtrer();
            } catch (e) {
                visListeMelding('Kunne ikke hente skjemaer: ' + e.message);
            }
        }

        function visListeMelding(tekst) {
            document.getElementById('liste').innerHTML = `<div class="tom-melding">${escHtml(tekst)}</div>`;
        }

        // Filtrerbare felter fra skjematypen — populeres via bygFeltFiltre()
        state.filtrerbare = [];      // [{Navn, Seksjon, Felt, Verdier}]
        state.valgteFeltVerdier = {}; // { "sek-felt": Set(verdier) }

        function samleFeltForekommendeVerdier(sekNr, feltNrPadded) {
            const sett = new Set();
            for (const s of (state.alle || [])) {
                const svar = hentSvarFraSkjema(s, sekNr, feltNrPadded);
                for (const v of svar) if (v != null && v !== '') sett.add(String(v));
            }
            return [...sett].sort((a, b) => a.localeCompare(b, 'nb'));
        }

        function bygFeltFiltre() {
            const def = state.skjematype;
            state.filtrerbare = [];
            const container = document.getElementById('felt-filtre');
            container.innerHTML = '';
            if (!def) return;

            for (const s of (def.Seksjoner || [])) {
                const sekNr = s.Seksjon_nummer;
                for (const f of (s.Felter || [])) {
                    if (!(f.Filtrerbar || f.Filtrerbar_i_register)) continue;
                    if (f.Type === 'Informasjon') continue;
                    const feltNrPadded = String(f.Nummer).padStart(2, '0');
                    state.filtrerbare.push({
                        Navn: f.Tekst?.Verdi || `${sekNr}-${feltNrPadded}`,
                        Seksjon: sekNr,
                        Felt: feltNrPadded
                    });
                }
            }
            if (state.filtrerbare.length === 0) return;

            container.innerHTML = state.filtrerbare.map(f => {
                const nokkel = `${f.Seksjon}-${f.Felt}`;
                const forekommende = samleFeltForekommendeVerdier(f.Seksjon, f.Felt);
                if (forekommende.length === 0) return '';
                const options = forekommende.map(v => `<option value="${escapeAttr(v)}">${escHtml(v)}</option>`).join('');
                return `<div style="margin-top: 6px;">
                    <label style="font-size: 11px; font-weight: 600; color: var(--text-secondary); display: block; margin-bottom: 2px;">${escHtml(f.Navn)}</label>
                    <select data-nokkel="${nokkel}" onchange="onFeltFilterEndret(this)" style="width: 100%; padding: 5px 8px; font-size: 12px;">
                        <option value="">— alle —</option>
                        ${options}
                    </select>
                </div>`;
            }).join('');
        }

        window.onFeltFilterEndret = (sel) => {
            const nokkel = sel.dataset.nokkel;
            const verdi = sel.value;
            if (!verdi) delete state.valgteFeltVerdier[nokkel];
            else state.valgteFeltVerdier[nokkel] = new Set([verdi]);
            filtrer();
        };

        function hentSvarFraSkjema(s, sek, felt) {
            const feltNrPadded = String(felt).padStart(2, '0');
            const sekNr = String(sek);
            const nokkel = `${sekNr}-${feltNrPadded}`;
            // Bruk FilterSvar-map fra liste-endepunktet (populert kun for Filtrerbar-felter)
            if (s.FilterSvar && Array.isArray(s.FilterSvar[nokkel])) {
                return s.FilterSvar[nokkel].map(String);
            }
            // Fallback: fullt format hvis skjema ble hentet ellers
            if (Array.isArray(s.Seksjoner)) {
                for (const sekObj of s.Seksjoner) {
                    if (String(sekObj.Seksjon_nummer || sekObj.Nummer || '') !== sekNr) continue;
                    for (const f of (sekObj.Felter || [])) {
                        if (String(f.Nummer).padStart(2, '0') !== feltNrPadded) continue;
                        return Array.isArray(f.Svar) ? f.Svar.map(String) : [];
                    }
                }
            }
            return [];
        }

        window.filtrer = () => {
            const sok = document.getElementById('sok').value.trim().toLowerCase();
            const status = document.getElementById('statusFilter').value;
            const kunMineAktive = document.getElementById('mineFilter')?.checked;
            state.filtrert = state.alle.filter(s => {
                if (status !== '' && String(s.Skjema_status || 0) !== status) return false;
                if (sok) {
                    const t = ((s.Innsender_Epost || '') + ' ' + (s.Skjema_id || '')).toLowerCase();
                    if (!t.includes(sok)) return false;
                }
                if (kunMineAktive) {
                    if (!state.mineIder || !state.mineIder.has(s.Skjema_id)) return false;
                }
                // Felt-filtre
                for (const [nokkel, valg] of Object.entries(state.valgteFeltVerdier)) {
                    const [sek, felt] = nokkel.split('-');
                    const svar = hentSvarFraSkjema(s, sek, felt);
                    if (valg && valg.fritekst) {
                        // Fritekst-match: minst ett svar må inneholde søket
                        if (!svar.some(v => String(v).toLowerCase().includes(valg.fritekst))) return false;
                    } else if (valg instanceof Set && valg.size > 0) {
                        // Verdi-match: minst én valgt verdi må matche ett svar
                        if (![...valg].some(v => svar.includes(v))) return false;
                    }
                }
                return true;
            });
            renderListe();
        };

        function renderListe() {
            const el = document.getElementById('liste');
            if (state.filtrert.length === 0) {
                el.innerHTML = '<div class="tom-melding">Ingen treff</div>';
                return;
            }
            el.innerHTML = state.filtrert.map(s => {
                const status = s.Skjema_status ?? 0;
                const dato = formaterDato(s.Sist_endret);
                const aktiv = state.valgtId === s.Skjema_id ? ' aktiv' : '';
                return `
                    <div class="liste-element${aktiv}" onclick="velgSkjema('${escapeAttr(s.Skjema_id)}')">
                        <div class="liste-tittel">#${escHtml(s.Skjema_id)} — ${escHtml(s.Innsender_Epost || '–')}</div>
                        <div class="liste-meta">
                            <span>${escHtml(dato)}</span>
                            <span class="status-badge status-${status}">${escHtml(STATUS_TEKST[status] || '?')}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.velgSkjema = async (skjemaId) => {
            state.valgtId = skjemaId;
            state.redigerer = false;
            renderListe();
            const hoyre = document.getElementById('hoyre');
            hoyre.classList.remove('tom');
            hoyre.innerHTML = '<div class="info-melding">Henter…</div>';
            try {
                state.valgtSkjema = await api.get(`/api/skjemaer/${encodeURIComponent(skjematypeId)}/${encodeURIComponent(skjemaId)}`);
                renderDetalj();
            } catch (e) {
                hoyre.innerHTML = `<div class="feilmelding">Kunne ikke hente skjema: ${escHtml(e.message)}</div>`;
            }
        };

        function renderDetalj() {
            const s = state.valgtSkjema;
            const hoyre = document.getElementById('hoyre');
            const status = s.Skjema_status ?? 0;

            // Bygg svar-lookup fra skjemaet
            const svarMap = new Map();
            const tekstMap = new Map();
            for (const seksjon of (s.Seksjoner || [])) {
                for (const felt of (seksjon.Felter || [])) {
                    const n = `${seksjon.Nummer}-${felt.Nummer}`;
                    svarMap.set(n, felt.Svar || []);
                    // Lagret visningstekst — klassenavn og personnavn i stedet for koder
                    if (Array.isArray(felt.SvarTekst)) tekstMap.set(n, felt.SvarTekst);
                }
            }

            // Bygg detaljpanel som DOM (så modul-widgets kan appendChild med event-listeners)
            hoyre.innerHTML = '';
            const topplinje = document.createElement('div');
            topplinje.className = 'detalj-topplinje';
            topplinje.innerHTML = `
                <h2 class="detalj-tittel">#${escHtml(s.Skjema_id)}</h2>
                <span class="status-badge status-${status}">${escHtml(STATUS_TEKST[status] || '?')}</span>
            `;
            hoyre.appendChild(topplinje);

            const metaEl = document.createElement('div');
            metaEl.className = 'detalj-meta';
            metaEl.innerHTML = `
                <div><strong>Innsender:</strong> ${escHtml(s.Innsender_Epost || '–')}</div>
                ${s.Sist_endret ? `<div><strong>Sist endret:</strong> ${escHtml(formaterDato(s.Sist_endret))}</div>` : ''}
            `;
            hoyre.appendChild(metaEl);

            const knapperEl = document.createElement('div');
            knapperEl.className = 'detalj-knapper';
            const raaLenke = `<a class="knapp sekundær" href="/api/skjemaer/${encodeURIComponent(skjematypeId)}/${encodeURIComponent(state.valgtId)}" target="_blank" title="Åpne rå JSON i ny fane">Rå JSON</a>`;
            const harBehandling = Array.isArray(s.Behandling) && s.Behandling.length > 0;
            const behandleLenke = harBehandling
                ? `<a class="knapp primær" href="/evaluering.html?skjematype_id=${encodeURIComponent(skjematypeId)}&skjema_id=${encodeURIComponent(state.valgtId)}">Behandle</a>`
                : '';
            knapperEl.innerHTML = state.redigerer
                ? `<button class="knapp primær" onclick="lagreEndringer()">Lagre endringer</button>
                   <button class="knapp sekundær" onclick="avbrytRedigering()">Avbryt</button>`
                : `${behandleLenke}
                   <button class="knapp sekundær" onclick="lastNedPdfDetalj()">📄 PDF</button>
                   <button class="knapp sekundær" onclick="startRedigering()">Rediger</button>
                   <button class="knapp danger" onclick="aapneSlettModal()">Slett</button>
                   ${raaLenke}`;
            hoyre.appendChild(knapperEl);

            // Bygg seksjoner-med-svar for vilkårs-evaluering (basert på lagrede svar)
            const seksjonerMedSvar = (state.skjematype.Seksjoner || []).map(sek => ({
                Seksjon_nummer: sek.Seksjon_nummer,
                Nummer: sek.Seksjon_nummer,
                Felter: (sek.Felter || []).map(f => ({
                    Id: f.Id, Nummer: f.Nummer, Type: f.Type,
                    Svar: svarMap.get(`${sek.Seksjon_nummer}-${f.Nummer}`) || []
                }))
            }));

            // Vis behandlingsstatus hvis skjema har Behandling-array
            if (Array.isArray(s.Behandling) && s.Behandling.length > 0) {
                hoyre.appendChild(byggBehandlingBoks(s.Behandling));
            }

            // Vis dialog hvis det finnes
            if (Array.isArray(s.Dialog) && s.Dialog.length > 0) {
                hoyre.appendChild(byggDialogBoks(s.Dialog));
            }

            for (const seksjon of (state.skjematype.Seksjoner || [])) {
                if (seksjon.Vises && !evaluerVilkar(seksjon.Vises, seksjonerMedSvar)) continue;

                const sDiv = document.createElement('div');
                sDiv.className = 'seksjon';
                sDiv.dataset.seksjonNummer = seksjon.Seksjon_nummer;
                if (seksjon.Seksjon_overskrift) {
                    const h = document.createElement('h3');
                    h.className = 'seksjon-tittel';
                    h.textContent = seksjon.Seksjon_overskrift;
                    sDiv.appendChild(h);
                }
                let visningsNr = 0;
                for (const felt of (seksjon.Felter || [])) {
                    if (felt.Vises && !evaluerVilkar(felt.Vises, seksjonerMedSvar)) continue;
                    if (felt.Type !== 'Informasjon') visningsNr++;
                    const n = `${seksjon.Seksjon_nummer}-${felt.Nummer}`;
                    sDiv.appendChild(byggFeltRad(felt, seksjon.Seksjon_nummer, visningsNr,
                        svarMap.get(n) || [], state.redigerer, tekstMap.get(n) || null));
                }
                hoyre.appendChild(sDiv);
            }

            // I redigeringsmodus: re-evaluer Vises ved endringer (samme som index.html)
            if (state.redigerer) {
                setTimeout(() => {
                    hoyre.addEventListener('input', oppdaterVisesReg);
                    hoyre.addEventListener('change', oppdaterVisesReg);
                }, 0);
            }
        }

        function oppdaterVisesReg() {
            if (!state.skjematype?.Seksjoner) return;
            // Bruk edit-mode feltId-prefix
            const seksjonerMedSvar = (state.skjematype.Seksjoner || []).map(sek => ({
                Seksjon_nummer: sek.Seksjon_nummer,
                Nummer: sek.Seksjon_nummer,
                Felter: (sek.Felter || []).map(f => {
                    const feltId = `edit-${sek.Seksjon_nummer}-${f.Nummer}`;
                    const svar = f.Type === 'Informasjon' ? [] : hentSvarFraDom(feltId, f.Type);
                    return { Id: f.Id, Nummer: f.Nummer, Type: f.Type, Svar: svar };
                })
            }));
            for (const seksjon of state.skjematype.Seksjoner) {
                if (seksjon.Vises) {
                    const el = document.querySelector(`#hoyre .seksjon[data-seksjon-nummer="${seksjon.Seksjon_nummer}"]`);
                    if (el) el.style.display = evaluerVilkar(seksjon.Vises, seksjonerMedSvar) ? '' : 'none';
                }
                for (const felt of (seksjon.Felter || [])) {
                    if (!felt.Vises) continue;
                    const wrapper = document.querySelector(`#hoyre .opplasting-wrapper[data-felt-id="edit-${seksjon.Seksjon_nummer}-${felt.Nummer}"], #hoyre [id="edit-${seksjon.Seksjon_nummer}-${felt.Nummer}"]`);
                    const el = wrapper?.closest('.felt');
                    if (el) el.style.display = evaluerVilkar(felt.Vises, seksjonerMedSvar) ? '' : 'none';
                }
            }
        }

        function byggBehandlingBoks(behandling) {
            const div = document.createElement('div');
            div.className = 'seksjon';
            const h = document.createElement('h3');
            h.className = 'seksjon-tittel';
            h.textContent = 'Behandling';
            div.appendChild(h);
            for (const steg of behandling) {
                const rad = document.createElement('div');
                rad.style.cssText = 'padding: 8px 12px; margin: 6px 0; background: var(--bg-svar); border-left: 3px solid var(--border-color); border-radius: 6px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px;';
                const status = tolkBehStatus(steg);
                rad.style.borderLeftColor = status.farge;
                rad.innerHTML = `
                    <span style="background: ${status.farge}; color: white; border-radius: 999px; width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700;">${steg.Steg}</span>
                    <span style="font-weight: 600; flex: 1;">${escHtml(steg.Stegnavn || `Steg ${steg.Steg}`)}</span>
                    <span style="color: ${status.farge}; font-weight: 600;">${escHtml(status.tekst)}</span>
                    ${(steg.Personer || []).length > 0 ? `<div style="width: 100%; font-size: 11px; color: var(--text-secondary);">Behandlere: ${escHtml(steg.Personer.join(', '))}</div>` : ''}
                `;
                div.appendChild(rad);
            }
            return div;
        }

        function byggDialogBoks(dialog) {
            const div = document.createElement('div');
            div.className = 'seksjon';
            const h = document.createElement('h3');
            h.className = 'seksjon-tittel';
            h.textContent = 'Dialog';
            div.appendChild(h);
            for (const i of dialog) {
                const el = document.createElement('div');
                const erIntern = i.Type === 'intern';
                el.style.cssText = `padding: 10px 12px; margin: 6px 0; background: var(--bg-svar); border-left: 3px solid ${erIntern ? '#af52de' : 'var(--accent)'}; border-radius: 6px; font-size: 13px;`;
                el.innerHTML = `
                    <div style="color: var(--text-secondary); font-size: 11px; margin-bottom: 4px;">
                        <span style="display: inline-block; padding: 1px 6px; border-radius: 999px; font-size: 10px; font-weight: 600; text-transform: uppercase; color: white; background: ${erIntern ? '#af52de' : 'var(--accent)'};">${erIntern ? 'Intern' : 'Til innsender'}</span>
                        ${escHtml(i.Avsender || '')} · ${escHtml(formaterDato(i.Dato))}
                    </div>
                    <div style="white-space: pre-wrap; word-wrap: break-word;">${escHtml(i.Tekst || '')}</div>
                `;
                div.appendChild(el);
            }
            return div;
        }

        function tolkBehStatus(steg) {
            const b = Number(steg.Beslutning || 0);
            if (b === 0) return { tekst: 'Venter', farge: '#ff9500' };
            if (b === 5) return { tekst: 'Hoppet over', farge: '#8e8e93' };
            const valg = (steg.Beslutningsvalg || []).find(v => Number(v.Nummer) === b);
            const tekst = valg?.Tekst || `Beslutning ${b}`;
            const t = tekst.toLowerCase();
            if (t.includes('avslå') || t.includes('avvis')) return { tekst, farge: '#ff3b30' };
            if (t.includes('ompuss') || t.includes('revid')) return { tekst, farge: '#af52de' };
            return { tekst, farge: '#34c759' };
        }

        function byggFeltRad(felt, seksjonNr, visningsNr, svar, redigerer, svarTekst = null) {
            const div = document.createElement('div');
            div.className = 'felt';
            if (felt.Type !== 'Informasjon') {
                const label = document.createElement('label');
                label.className = 'felt-label';
                const oblig = felt.Obligatorisk ? '<span class="oblig-markering">*</span>' : '';
                label.innerHTML = `<span class="felt-nummer">${visningsNr}.</span> ${renderTekstInline(felt.Tekst)}${oblig}`;
                div.appendChild(label);
                if (felt.Undertittel?.Verdi) {
                    const u = document.createElement('div');
                    u.style.cssText = 'font-size: 13px; color: var(--text-secondary); margin: 2px 0 6px;';
                    u.innerHTML = renderTekstInline(felt.Undertittel);
                    div.appendChild(u);
                }
            }
            if (redigerer) {
                const feltId = `edit-${seksjonNr}-${felt.Nummer}`;
                if (felt.Type !== 'Informasjon') {
                    const l = div.querySelector('.felt-label');
                    if (l) l.htmlFor = feltId;
                }
                div.appendChild(byggEditWidget(felt, feltId, svar));
            } else {
                div.appendChild(byggReadonlyVisning(felt, svar, { skjematypeId, skjemaId: state.valgtId }, svarTekst));
            }
            return div;
        }

        // ---- Rediger + lagre ----
        window.startRedigering = () => {
            state.redigerer = true;
            renderDetalj();
        };

        window.lastNedPdfDetalj = async () => {
            if (!state.valgtId) return;
            try {
                const res = await api.post(
                    `/api/skjemaer/${encodeURIComponent(skjematypeId)}/${encodeURIComponent(state.valgtId)}/pdf`,
                    { format: 'base64' }
                );
                const bin = atob(res.innhold);
                const bytes = new Uint8Array(bin.length);
                for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                const blob = new Blob([bytes], { type: res.contentType || 'application/pdf' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = res.filnavn;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 5000);
            } catch (e) {
                alert('Kunne ikke laste ned PDF: ' + e.message);
            }
        };
        window.avbrytRedigering = () => {
            state.redigerer = false;
            renderDetalj();
        };
        window.lagreEndringer = async () => {
            // Steg 1: opplast nye vedlegg + slett merkede for hvert Opplasting-felt
            try {
                for (const seksjon of (state.skjematype.Seksjoner || [])) {
                    for (const felt of (seksjon.Felter || [])) {
                        if (felt.Type !== 'Opplasting') continue;
                        // Finn feltet i DOM — vi bruker query på wrapper direkte
                        const wrapper = document.querySelector(`.opplasting-wrapper[data-felt-id="edit-${seksjon.Seksjon_nummer}-${felt.Nummer}"]`);
                        if (wrapper) {
                            const feltEl = wrapper.closest('.felt');
                            if (feltEl) await preSubmitOpplasting(feltEl, skjematypeId, state.valgtId);
                        }
                    }
                }
            } catch (e) {
                alert('Feil ved opplasting: ' + e.message);
                return;
            }

            const nyeSeksjoner = [];
            for (const seksjon of (state.skjematype.Seksjoner || [])) {
                const seksjonUt = {
                    Nummer: seksjon.Seksjon_nummer,
                    Overskrift: seksjon.Seksjon_overskrift || '',
                    Felter: []
                };
                for (const felt of (seksjon.Felter || [])) {
                    if (felt.Type === 'Informasjon') continue;
                    const feltId = `edit-${seksjon.Seksjon_nummer}-${felt.Nummer}`;
                    const svarVerdi = hentSvarFraDom(feltId, felt.Type);
                    const feltUt = {
                        Id: felt.Id,
                        Nummer: felt.Nummer,
                        Type: felt.Type,
                        Svar: svarVerdi
                    };
                    const tekster = svarTekstFor(felt, svarVerdi);
                    if (tekster) feltUt.SvarTekst = tekster;
                    seksjonUt.Felter.push(feltUt);
                }
                nyeSeksjoner.push(seksjonUt);
            }
            const body = {
                ...state.valgtSkjema,
                Skjema_id: state.valgtId,
                Skjematype_id: skjematypeId,
                Seksjoner: nyeSeksjoner
            };
            try {
                await api.post('/api/skjemaer', body);
                // Refresh skjemaet
                state.valgtSkjema = await api.get(`/api/skjemaer/${encodeURIComponent(skjematypeId)}/${encodeURIComponent(state.valgtId)}`);
                state.redigerer = false;
                renderDetalj();
                // Refresh listen (dato/status kan ha endret seg)
                state.alle = await api.get(`/api/skjema-liste/${encodeURIComponent(skjematypeId)}`);
                renderListe();
            } catch (e) {
                alert('Kunne ikke lagre: ' + e.message);
            }
        };

        // ---- Slett ----
        window.aapneSlettModal = () => {
            document.getElementById('slettModal').classList.add('vis');
        };
        window.lukkSlettModal = () => {
            document.getElementById('slettModal').classList.remove('vis');
        };
        window.bekreftSlett = async () => {
            const btn = document.getElementById('slettBekreft');
            btn.disabled = true;
            btn.textContent = 'Sletter…';
            try {
                await api.del(`/api/skjemaer/${encodeURIComponent(skjematypeId)}/${encodeURIComponent(state.valgtId)}`);
                lukkSlettModal();
                // Fjern fra liste og nullstill detaljvisning
                state.alle = state.alle.filter(s => s.Skjema_id !== state.valgtId);
                state.valgtId = null;
                state.valgtSkjema = null;
                document.getElementById('undertittel').textContent =
                    `${state.alle.length} skjema${state.alle.length === 1 ? '' : 'er'} totalt.`;
                filtrer();
                const hoyre = document.getElementById('hoyre');
                hoyre.classList.add('tom');
                hoyre.innerHTML = '<div class="info-melding">Velg et skjema fra listen til venstre</div>';
            } catch (e) {
                alert('Kunne ikke slette: ' + e.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Slett skjemaet';
            }
        };

        function formaterDato(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            if (isNaN(d)) return iso;
            const pad = n => String(n).padStart(2, '0');
            return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }
        function escapeAttr(s) {
            return String(s ?? '').replace(/"/g, '&quot;').replace(/'/g, "\\'");
        }

        init();
    </script>
    <script type="module" src="/js/systemtopp.js"></script>
</body>
</html>
