<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Behandle skjema</title>
    <script>
        (function() {
            const t = localStorage.getItem('theme');
            if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        })();
    </script>
    <style>
        :root {
            --bg-page: #e8edf2;
            --bg-container: rgba(255, 255, 255, 0.85);
            --bg-section: rgba(255, 255, 255, 0.55);
            --bg-svar: rgba(255, 255, 255, 0.7);
            --text-primary: #1c1c1e;
            --text-secondary: #6e6e73;
            --text-heading: #0a84ff;
            --border-color: rgba(0, 0, 0, 0.1);
            --shadow: 0 4px 30px rgba(0, 0, 0, 0.06);
            --accent: #0a84ff;
            --accent-light: rgba(10, 132, 255, 0.12);
            --success: #34c759;
            --danger: #ff3b30;
            --warning: #ff9500;
            --purple: #af52de;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 18px;
            --radius-xl: 24px;
        }
        [data-theme="dark"] {
            --bg-page: #0d1117;
            --bg-container: rgba(30, 35, 45, 0.85);
            --bg-section: rgba(40, 45, 60, 0.55);
            --bg-svar: rgba(20, 25, 35, 0.7);
            --text-primary: #f0f0f5;
            --text-secondary: #8e8e93;
            --text-heading: #64b5f6;
            --border-color: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-page);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--bg-container);
            backdrop-filter: blur(20px);
            padding: 28px;
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }
        .tilbake { color: var(--accent); text-decoration: none; font-size: 13px; display: inline-block; margin-bottom: 8px; }
        .topplinje { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
        h1 { font-size: 1.5em; font-weight: 700; margin: 0; letter-spacing: -0.02em; }
        .brukerinfo { font-size: 13px; color: var(--text-secondary); }
        .brukerinfo .upn { font-weight: 500; color: var(--text-primary); }
        .meta { display: flex; gap: 20px; flex-wrap: wrap; color: var(--text-secondary); font-size: 13px; margin: 8px 0 20px; }
        .meta strong { color: var(--text-primary); }

        .behandle-boks {
            padding: 20px 24px;
            margin: 20px 0;
            background: linear-gradient(135deg, rgba(10, 132, 255, 0.1), rgba(10, 132, 255, 0.04));
            border: 2px solid var(--accent);
            border-radius: var(--radius-lg);
        }
        .behandle-tittel { font-size: 16px; font-weight: 700; color: var(--accent); margin: 0 0 6px 0; }
        .behandle-forklaring { font-size: 13px; color: var(--text-secondary); margin: 0 0 12px 0; }
        .beslutning-knapper { display: flex; gap: 10px; flex-wrap: wrap; }
        .beslutning-knapp {
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            border: 2px solid var(--accent);
            background: white;
            color: var(--accent);
            border-radius: var(--radius-md);
            cursor: pointer;
            font-family: inherit;
            transition: filter 0.15s, background 0.15s;
        }
        .beslutning-knapp:hover { background: var(--accent-light); }
        .beslutning-knapp:disabled { opacity: 0.5; cursor: not-allowed; }
        .beslutning-knapp.avvis { border-color: var(--danger); color: var(--danger); }
        .beslutning-knapp.avvis:hover { background: rgba(255, 59, 48, 0.1); }

        .seksjon {
            padding: 16px 20px;
            margin-bottom: 14px;
            background: var(--bg-section);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
        }
        .seksjon-tittel {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin: 0 0 12px 0;
        }
        .felt { margin-bottom: 12px; }
        .felt-label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 4px; }
        .felt-nummer { display: inline-block; min-width: 22px; color: var(--text-secondary); font-weight: 500; }
        .felt-svar {
            padding: 8px 12px;
            background: var(--bg-svar);
            border-left: 3px solid var(--accent);
            border-radius: var(--radius-sm);
            font-size: 14px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .felt-svar.tomt { color: var(--text-secondary); font-style: italic; border-left-color: var(--border-color); }
        .felt-svar ul { margin: 4px 0 0 20px; padding: 0; }
        .md-lenke { color: var(--accent); text-decoration: underline; }
        .md-lenke:hover { opacity: 0.8; }

        .informasjon {
            padding: 10px 14px;
            background: var(--accent-light);
            border-left: 3px solid var(--accent);
            border-radius: var(--radius-sm);
            font-size: 13px;
        }

        .steg-oversikt {
            padding: 12px 16px;
            margin-bottom: 20px;
            background: var(--bg-section);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
        }
        .steg-oversikt h3 {
            font-size: 12px; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.05em; color: var(--text-secondary); margin: 0 0 8px 0;
        }
        .steg-rad {
            padding: 8px 12px; margin: 4px 0; background: var(--bg-svar);
            border-left: 3px solid var(--border-color); border-radius: 6px;
            display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px;
        }

        .laster, .feilmelding { text-align: center; padding: 40px; color: var(--text-secondary); }
        .feilmelding { color: var(--danger); }

        .dialog-boks {
            padding: 16px 18px;
            margin: 20px 0;
            background: var(--bg-section);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
        }
        .dialog-tittel {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin: 0 0 10px 0;
        }
        .dialog-liste {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
        }
        .dialog-innlegg {
            padding: 10px 12px;
            background: var(--bg-svar);
            border-radius: 8px;
            border-left: 3px solid var(--accent);
            font-size: 13px;
        }
        .dialog-innlegg.intern { border-left-color: var(--purple); background: rgba(175, 82, 222, 0.06); }
        .dialog-innlegg .meta { color: var(--text-secondary); font-size: 11px; margin-bottom: 4px; }
        .dialog-innlegg .badge {
            display: inline-block; padding: 1px 6px; border-radius: 999px;
            font-size: 10px; font-weight: 600; text-transform: uppercase;
            color: white; margin-right: 4px;
        }
        .dialog-innlegg.intern .badge { background: var(--purple); }
        .dialog-innlegg.ekstern .badge { background: var(--accent); }
        .dialog-innlegg .tekst { white-space: pre-wrap; word-wrap: break-word; }

        .dialog-input textarea {
            width: 100%;
            padding: 8px 12px;
            font-size: 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: white;
            color: var(--text-primary);
            font-family: inherit;
            min-height: 60px;
            resize: vertical;
        }
        .dialog-input .knapper {
            display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; align-items: center;
        }
        .dialog-input select, .dialog-input input[type="email"] {
            padding: 6px 10px; font-size: 13px; border: 1px solid var(--border-color);
            border-radius: 6px; background: white; color: var(--text-primary); font-family: inherit;
        }
        .knapp {
            padding: 8px 16px; font-size: 13px; font-weight: 600;
            border: 0; border-radius: 8px; cursor: pointer; font-family: inherit;
        }
        .knapp.primær { background: var(--accent); color: white; }
        .knapp.sekundær { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
        .knapp.sekundær:hover { background: var(--accent-light); }
        /* ===== Modal ===== */
        .modal-bakgrunn {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.45);
            display: flex; align-items: center; justify-content: center;
            z-index: 9999;
            padding: 20px;
            animation: modalFade 0.15s ease-out;
        }
        @keyframes modalFade { from { opacity: 0; } to { opacity: 1; } }
        .modal-boks {
            background: var(--bg-container);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 24px 28px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 12px 40px rgba(0,0,0,0.25);
            animation: modalPop 0.15s ease-out;
        }
        @keyframes modalPop { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal-tittel { margin: 0 0 12px 0; font-size: 17px; font-weight: 600; }
        .modal-tekst { margin: 0 0 20px 0; color: var(--text-secondary); line-height: 1.5; }
        .modal-knapper { display: flex; gap: 10px; justify-content: flex-end; }
        .modal-knapp {
            padding: 8px 20px;
            border-radius: 8px;
            border: 1px solid var(--input-border);
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
        }
        .modal-knapp.primær { background: var(--accent); color: white; border-color: var(--accent); }
        .modal-knapp.primær:hover { filter: brightness(1.1); }
        .modal-knapp.danger { background: var(--danger); color: white; border-color: var(--danger); }
        .modal-knapp:hover { background: var(--accent-light); }
    </style>
</head>
<body>
    <div class="container">
        <a href="/velgskjematype.html" class="tilbake">← Til skjemaoversikten</a>
        <div class="topplinje">
            <h1 id="tittel">Behandle skjema</h1>
            <div class="brukerinfo">
                <button id="pdf-knapp" class="modal-knapp" style="margin-right: 12px; display: none;" onclick="lastNedPdf()">📄 Last ned PDF</button>
                <span class="upn" id="upn">…</span>
            </div>
        </div>
        <div class="meta" id="meta"></div>
        <div id="innhold" class="laster">Laster skjema…</div>
    </div>

    <script type="module">
        import { api } from './js/api-client.js';
        import { hentInnloggetBruker } from './js/auth.js';
        import { byggReadonlyVisning, escapeHtml } from './js/felt-render.js';
        import { evaluerVilkar } from './js/vilkar.js';

        const params = new URLSearchParams(window.location.search);
        const skjematypeId = params.get('skjematype_id');
        const skjemaId = params.get('skjema_id');

        let bruker = null;
        let skjematype = null;
        let skjema = null;

        async function init() {
            bruker = await hentInnloggetBruker();
            if (!bruker) {
                window.location.href = '/.auth/login/aad?post_login_redirect_uri=' + encodeURIComponent(window.location.pathname + window.location.search);
                return;
            }
            document.getElementById('upn').textContent = bruker.userDetails;

            if (!skjematypeId || !skjemaId) {
                visFeil('Mangler skjematype_id eller skjema_id i URL.');
                return;
            }

            try {
                [skjematype, skjema] = await Promise.all([
                    api.get(`/api/skjematyper/${encodeURIComponent(skjematypeId)}`),
                    api.get(`/api/skjemaer/${encodeURIComponent(skjematypeId)}/${encodeURIComponent(skjemaId)}`)
                ]);
                rendrer();
            } catch (e) {
                visFeil('Kunne ikke hente skjemaet: ' + e.message);
            }
        }

        function visFeil(t) {
            document.getElementById('innhold').className = 'feilmelding';
            document.getElementById('innhold').textContent = t;
        }

        function rendrer() {
            document.getElementById('tittel').textContent = `Behandle: ${skjematype.Skjema_navn || 'Skjema'}`;
            document.title = document.getElementById('tittel').textContent;
            const pdfKnapp = document.getElementById('pdf-knapp');
            if (pdfKnapp) pdfKnapp.style.display = '';

            const status = skjema.Skjema_status ?? 0;
            const statusTekst = status === 5 ? 'Avsluttet' : (status === 2 ? 'Under behandling' : 'Innsendt');
            document.getElementById('meta').innerHTML = `
                <div><strong>Skjema-ID:</strong> ${escapeHtml(skjema.Skjema_id)}</div>
                <div><strong>Innsender:</strong> ${escapeHtml(skjema.Innsender_Epost || '–')}</div>
                <div><strong>Sist endret:</strong> ${escapeHtml(formaterDato(skjema.Sist_endret))}</div>
                <div><strong>Status:</strong> ${escapeHtml(statusTekst)}</div>
            `;

            const innhold = document.getElementById('innhold');
            innhold.className = '';
            innhold.innerHTML = '';

            // 1) Aktive steg der bruker er behandler — vis behandle-boks øverst
            const aktiveMineSteg = beregnMineAktive();
            for (const steg of aktiveMineSteg) {
                innhold.appendChild(byggBehandleBoks(steg));
            }
            if (aktiveMineSteg.length === 0 && !alleFerdig()) {
                const info = document.createElement('div');
                info.className = 'steg-oversikt';
                info.innerHTML = '<h3>Ingen aktive steg for deg</h3><p style="margin: 0; font-size: 13px; color: var(--text-secondary);">Skjemaet venter på behandling fra andre. Se stegoversikten under.</p>';
                innhold.appendChild(info);
            }
            if (alleFerdig()) {
                const info = document.createElement('div');
                info.className = 'behandle-boks';
                info.style.background = 'linear-gradient(135deg, rgba(52, 199, 89, 0.15), rgba(52, 199, 89, 0.05))';
                info.style.borderColor = 'var(--success)';
                info.innerHTML = '<div class="behandle-tittel" style="color: var(--success);">✓ Alle behandlingssteg er ferdig</div><div class="behandle-forklaring">Skjemaet er ferdigbehandlet og arkivert.</div>';
                innhold.appendChild(info);
            }

            // 2) Full stegoversikt
            if (Array.isArray(skjema.Behandling) && skjema.Behandling.length > 0) {
                innhold.appendChild(byggStegOversikt());
            }

            // Dialog-panel
            innhold.appendChild(byggDialogPanel());

            // 3) Skjemaet read-only
            const svarMap = new Map();
            for (const seksjon of (skjema.Seksjoner || [])) {
                for (const felt of (seksjon.Felter || [])) {
                    svarMap.set(`${seksjon.Nummer}-${felt.Nummer}`, felt.Svar || []);
                }
            }
            const seksjonerMedSvar = (skjematype.Seksjoner || []).map(sek => ({
                Seksjon_nummer: sek.Seksjon_nummer, Nummer: sek.Seksjon_nummer,
                Felter: (sek.Felter || []).map(f => ({
                    Id: f.Id, Nummer: f.Nummer, Type: f.Type,
                    Svar: svarMap.get(`${sek.Seksjon_nummer}-${f.Nummer}`) || []
                }))
            }));
            for (const seksjon of (skjematype.Seksjoner || [])) {
                if (seksjon.Vises && !evaluerVilkar(seksjon.Vises, seksjonerMedSvar)) continue;
                const div = document.createElement('div');
                div.className = 'seksjon';
                if (seksjon.Seksjon_overskrift) {
                    const h = document.createElement('h2');
                    h.className = 'seksjon-tittel';
                    h.textContent = seksjon.Seksjon_overskrift;
                    div.appendChild(h);
                }
                let visningsNr = 0;
                for (const felt of (seksjon.Felter || [])) {
                    if (felt.Vises && !evaluerVilkar(felt.Vises, seksjonerMedSvar)) continue;
                    if (felt.Type !== 'Informasjon') visningsNr++;
                    const svar = svarMap.get(`${seksjon.Seksjon_nummer}-${felt.Nummer}`) || [];
                    div.appendChild(byggFelt(felt, visningsNr, svar));
                }
                innhold.appendChild(div);
            }
        }

        function beregnMineAktive() {
            const aktive = beregnAktive();
            const upnLower = bruker.userDetails.toLowerCase();
            // Backend beriker skjemaet med _mineStegNumre (dekker Personer + Roller).
            // Fall tilbake til Personer-sjekk hvis feltet mangler (bakoverkompatibelt).
            if (Array.isArray(skjema?._mineStegNumre)) {
                const mineSet = new Set(skjema._mineStegNumre.map(Number));
                return aktive.filter(s => mineSet.has(Number(s.Steg)));
            }
            return aktive.filter(s => (s.Personer || []).map(p => p.toLowerCase()).includes(upnLower));
        }

        function beregnAktive() {
            const behandling = skjema.Behandling || [];
            return behandling.filter(steg => {
                if (Number(steg.Beslutning || 0) !== 0) return false; // ferdig
                if (steg.AvhengigAv) {
                    const avh = behandling.find(s => Number(s.Steg) === Number(steg.AvhengigAv));
                    if (!avh || Number(avh.Beslutning || 0) === 0) return false;
                }
                if (steg.Vilkår && !evaluerVilkar(steg.Vilkår, skjema.Seksjoner, behandling)) return false;
                return true;
            });
        }

        function alleFerdig() {
            const behandling = skjema.Behandling || [];
            if (behandling.length === 0) return false;
            return behandling.every(s => Number(s.Beslutning || 0) !== 0);
        }

        function byggDialogPanel() {
            const div = document.createElement('div');
            div.className = 'dialog-boks';
            const h = document.createElement('h3');
            h.className = 'dialog-tittel';
            h.textContent = 'Dialog';
            div.appendChild(h);

            const liste = document.createElement('div');
            liste.className = 'dialog-liste';
            const innlegg = skjema.Dialog || [];
            if (innlegg.length === 0) {
                liste.innerHTML = '<div style="color: var(--text-secondary); font-size: 13px; font-style: italic;">Ingen innlegg ennå.</div>';
            } else {
                for (const i of innlegg) {
                    const ie = document.createElement('div');
                    ie.className = 'dialog-innlegg ' + (i.Type === 'intern' ? 'intern' : 'ekstern');
                    ie.innerHTML = `
                        <div class="meta">
                            <span class="badge">${i.Type === 'intern' ? 'Intern' : 'Til innsender'}</span>
                            ${escapeHtml(i.Avsender || '')} · ${escapeHtml(formaterDato(i.Dato))}
                        </div>
                        <div class="tekst">${escapeHtml(i.Tekst || '')}</div>
                    `;
                    liste.appendChild(ie);
                }
            }
            div.appendChild(liste);

            // Skjemakontroll for nytt innlegg
            const input = document.createElement('div');
            input.className = 'dialog-input';
            input.innerHTML = `
                <textarea placeholder="Skriv et innlegg…" id="dialog-tekst"></textarea>
                <div class="knapper">
                    <select id="dialog-type">
                        <option value="intern">Intern (til andre behandlere)</option>
                        <option value="ekstern">Til innsender</option>
                    </select>
                    <button class="knapp primær" onclick="sendDialog()">Legg til innlegg</button>
                </div>
            `;
            div.appendChild(input);

            // Videresending — kun hvis bruker har aktive steg
            if (beregnMineAktive().length > 0) {
                const vd = document.createElement('div');
                vd.style.cssText = 'margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border-color);';
                const aktive = beregnMineAktive();
                const options = aktive.map(s => `<option value="${s.Steg}">Steg ${s.Steg}: ${escapeHtml(s.Stegnavn || '')}</option>`).join('');
                vd.innerHTML = `
                    <h3 class="dialog-tittel">Videresend</h3>
                    <div class="dialog-input">
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px;">
                            <select id="vs-steg">${options}</select>
                            <input type="email" id="vs-upn" placeholder="ny.behandler@epost.no">
                        </div>
                        <textarea id="vs-notat" placeholder="Notat (valgfritt) — legges som intern dialog"></textarea>
                        <div class="knapper">
                            <button class="knapp sekundær" onclick="videresend()">Videresend</button>
                        </div>
                    </div>
                `;
                div.appendChild(vd);
            }

            return div;
        }

        window.sendDialog = async () => {
            const tekst = document.getElementById('dialog-tekst').value.trim();
            const type = document.getElementById('dialog-type').value;
            if (!tekst) { alert('Skriv noe tekst først'); return; }
            try {
                await api.post(`/api/skjemaer/${encodeURIComponent(skjematypeId)}/${encodeURIComponent(skjemaId)}/dialog`, { type, tekst });
                skjema = await api.get(`/api/skjemaer/${encodeURIComponent(skjematypeId)}/${encodeURIComponent(skjemaId)}`);
                rendrer();
            } catch (e) {
                alert('Kunne ikke legge til: ' + e.message);
            }
        };
        window.videresend = async () => {
            const steg = Number(document.getElementById('vs-steg').value);
            const tilUpn = document.getElementById('vs-upn').value.trim();
            const notat = document.getElementById('vs-notat').value.trim();
            if (!tilUpn) { alert('Skriv en e-postadresse'); return; }
            const ok = await bekreftModal({
                tittel: 'Videresend steg',
                tekst: `Videresend steg ${steg} til ${tilUpn}? Du beholdes fortsatt som behandler.`,
                bekreftTekst: 'Videresend'
            });
            if (!ok) return;
            try {
                await api.post(`/api/skjemaer/${encodeURIComponent(skjematypeId)}/${encodeURIComponent(skjemaId)}/videresend`, { steg, tilUpn, notat });
                skjema = await api.get(`/api/skjemaer/${encodeURIComponent(skjematypeId)}/${encodeURIComponent(skjemaId)}`);
                rendrer();
            } catch (e) {
                alert('Kunne ikke videresende: ' + e.message);
            }
        };

        function byggBehandleBoks(steg) {
            const div = document.createElement('div');
            div.className = 'behandle-boks';
            div.dataset.stegNr = steg.Steg;

            const tittel = document.createElement('div');
            tittel.className = 'behandle-tittel';
            tittel.textContent = `Steg ${steg.Steg}: ${steg.Stegnavn || '(uten navn)'}`;
            div.appendChild(tittel);

            const info = document.createElement('div');
            info.className = 'behandle-forklaring';
            info.textContent = 'Velg beslutning:';
            div.appendChild(info);

            const knapper = document.createElement('div');
            knapper.className = 'beslutning-knapper';
            for (const valg of (steg.Beslutningsvalg || [])) {
                const knapp = document.createElement('button');
                knapp.type = 'button';
                knapp.className = 'beslutning-knapp';
                const t = (valg.Tekst || '').toLowerCase();
                if (t.includes('avslå') || t.includes('avvis')) knapp.classList.add('avvis');
                knapp.textContent = valg.Tekst || `Valg ${valg.Nummer}`;
                knapp.addEventListener('click', () => taBeslutning(steg.Steg, valg.Nummer, valg.Tekst));
                knapper.appendChild(knapp);
            }
            div.appendChild(knapper);
            return div;
        }

        window.lastNedPdf = async () => {
            const knapp = document.getElementById('pdf-knapp');
            const originalTekst = knapp.textContent;
            knapp.disabled = true;
            knapp.textContent = 'Genererer…';
            try {
                const res = await api.post(
                    `/api/skjemaer/${encodeURIComponent(skjematypeId)}/${encodeURIComponent(skjemaId)}/pdf`,
                    { format: 'base64' }
                );
                const bin = atob(res.innhold);
                const bytes = new Uint8Array(bin.length);
                for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                const blob = new Blob([bytes], { type: res.contentType || 'application/pdf' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = res.filnavn;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 5000);
            } catch (e) {
                alert('Kunne ikke laste ned PDF: ' + e.message);
            } finally {
                knapp.disabled = false;
                knapp.textContent = originalTekst;
            }
        };

        function bekreftModal({ tittel, tekst, bekreftTekst = 'Bekreft', bekreftStil = 'primær' }) {
            return new Promise(resolve => {
                const bakgrunn = document.createElement('div');
                bakgrunn.className = 'modal-bakgrunn';
                const boks = document.createElement('div');
                boks.className = 'modal-boks';
                boks.innerHTML = `
                    <h3 class="modal-tittel"></h3>
                    <p class="modal-tekst"></p>
                    <div class="modal-knapper">
                        <button class="modal-knapp" data-svar="avbryt">Avbryt</button>
                        <button class="modal-knapp ${bekreftStil}" data-svar="bekreft"></button>
                    </div>`;
                boks.querySelector('.modal-tittel').textContent = tittel;
                boks.querySelector('.modal-tekst').textContent = tekst;
                boks.querySelector('[data-svar="bekreft"]').textContent = bekreftTekst;
                bakgrunn.appendChild(boks);
                document.body.appendChild(bakgrunn);

                const lukk = (svar) => { document.body.removeChild(bakgrunn); resolve(svar === 'bekreft'); };
                boks.querySelectorAll('button[data-svar]').forEach(b => {
                    b.addEventListener('click', () => lukk(b.dataset.svar));
                });
                bakgrunn.addEventListener('click', (e) => { if (e.target === bakgrunn) lukk('avbryt'); });
                document.addEventListener('keydown', function esc(e) {
                    if (e.key === 'Escape') { lukk('avbryt'); document.removeEventListener('keydown', esc); }
                    if (e.key === 'Enter') { lukk('bekreft'); document.removeEventListener('keydown', esc); }
                });
                setTimeout(() => boks.querySelector('[data-svar="bekreft"]').focus(), 50);
            });
        }

        async function taBeslutning(stegNr, beslutningNr, tekst) {
            const ok = await bekreftModal({
                tittel: 'Bekreft beslutning',
                tekst: `Registrer "${tekst}" på steg ${stegNr}?`,
                bekreftTekst: tekst
            });
            if (!ok) return;
            // Disable alle knapper for å hindre dobbelt-klikk
            document.querySelectorAll('.beslutning-knapp').forEach(k => k.disabled = true);
            try {
                await api.post(`/api/skjemaer/${encodeURIComponent(skjematypeId)}/${encodeURIComponent(skjemaId)}/beslutning`,
                    { steg: stegNr, beslutning: beslutningNr });
                // Refresh
                skjema = await api.get(`/api/skjemaer/${encodeURIComponent(skjematypeId)}/${encodeURIComponent(skjemaId)}`);
                rendrer();
            } catch (e) {
                alert('Kunne ikke lagre beslutning: ' + e.message);
                document.querySelectorAll('.beslutning-knapp').forEach(k => k.disabled = false);
            }
        }

        function byggStegOversikt() {
            const div = document.createElement('div');
            div.className = 'steg-oversikt';
            const h = document.createElement('h3');
            h.textContent = 'Alle behandlingssteg';
            div.appendChild(h);
            const aktive = new Set(beregnAktive().map(s => s.Steg));
            for (const steg of skjema.Behandling) {
                const rad = document.createElement('div');
                rad.className = 'steg-rad';
                const status = tolkStatus(steg, aktive.has(steg.Steg));
                rad.style.borderLeftColor = status.farge;
                rad.innerHTML = `
                    <span style="background: ${status.farge}; color: white; border-radius: 999px; width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700;">${steg.Steg}</span>
                    <span style="font-weight: 600; flex: 1;">${escapeHtml(steg.Stegnavn || `Steg ${steg.Steg}`)}</span>
                    <span style="color: ${status.farge}; font-weight: 600;">${escapeHtml(status.tekst)}</span>
                    ${steg.BehandletAv ? `<div style="width: 100%; font-size: 11px; color: var(--text-secondary);">Behandlet av ${escapeHtml(steg.BehandletAv)} ${escapeHtml(formaterDato(steg.BehandletDato))}</div>` : ''}
                `;
                div.appendChild(rad);
            }
            return div;
        }

        function tolkStatus(steg, erAktiv) {
            const b = Number(steg.Beslutning || 0);
            if (b === 0) return { tekst: erAktiv ? 'Aktivt — venter behandling' : 'Venter', farge: erAktiv ? '#0a84ff' : '#ff9500' };
            if (b === 5) return { tekst: 'Hoppet over', farge: '#8e8e93' };
            const valg = (steg.Beslutningsvalg || []).find(v => Number(v.Nummer) === b);
            const tekst = valg?.Tekst || `Beslutning ${b}`;
            const t = tekst.toLowerCase();
            if (t.includes('avslå') || t.includes('avvis')) return { tekst, farge: '#ff3b30' };
            if (t.includes('ompuss')) return { tekst, farge: '#af52de' };
            return { tekst, farge: '#34c759' };
        }

        function byggFelt(felt, visningsNr, svar) {
            const div = document.createElement('div');
            div.className = 'felt';
            if (felt.Type !== 'Informasjon') {
                const label = document.createElement('label');
                label.className = 'felt-label';
                label.innerHTML = `<span class="felt-nummer">${visningsNr}.</span> ${escapeHtml(felt.Tekst?.Verdi || '')}`;
                div.appendChild(label);
                if (felt.Undertittel?.Verdi) {
                    const u = document.createElement('div');
                    u.style.cssText = 'font-size: 13px; color: var(--text-secondary); margin: 2px 0 6px;';
                    u.textContent = felt.Undertittel.Verdi;
                    div.appendChild(u);
                }
            }
            div.appendChild(byggReadonlyVisning(felt, svar, { skjematypeId, skjemaId }));
            return div;
        }

        function formaterDato(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            if (isNaN(d)) return iso;
            const pad = n => String(n).padStart(2, '0');
            return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }

        init();
    </script>
</body>
</html>
