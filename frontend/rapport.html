<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rapport</title>
    <script>
        (function() {
            const t = localStorage.getItem('theme');
            if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        })();
    </script>
    <style>
        :root {
            --bg-page: #e8edf2;
            --bg-container: rgba(255, 255, 255, 0.72);
            --bg-section: rgba(255, 255, 255, 0.55);
            --bg-input: rgba(255, 255, 255, 0.7);
            --text-primary: #1c1c1e;
            --text-secondary: #6e6e73;
            --border-color: rgba(0, 0, 0, 0.08);
            --shadow: 0 4px 30px rgba(0, 0, 0, 0.06);
            --accent: #0a84ff;
            --accent-light: rgba(10, 132, 255, 0.12);
            --gruppe-header: rgba(10, 132, 255, 0.08);
            --glass-blur: blur(20px);
        }
        [data-theme="dark"] {
            --bg-page: #0d1117;
            --bg-container: rgba(30, 35, 45, 0.72);
            --bg-section: rgba(40, 45, 60, 0.55);
            --bg-input: rgba(50, 55, 70, 0.6);
            --text-primary: #f0f0f5;
            --text-secondary: #8e8e93;
            --border-color: rgba(255, 255, 255, 0.08);
            --gruppe-header: rgba(10, 132, 255, 0.14);
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-primary);
            margin: 0; padding: 24px;
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
        }
        .container {
            max-width: 1200px; margin: 0 auto;
            background: var(--bg-container);
            backdrop-filter: var(--glass-blur);
            padding: 28px 32px; border-radius: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }
        .theme-toggle {
            position: fixed; top: 16px; right: 20px;
            background: var(--bg-container); border: 1px solid var(--border-color);
            border-radius: 50%; width: 40px; height: 40px;
            cursor: pointer; font-size: 18px;
            display: flex; align-items: center; justify-content: center;
        }
        .topp {
            display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 14px; margin-bottom: 14px;
        }
        .topprad {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 10px;
            /* Uten wrap kan ikke raden brytes, og en lang UPN presser seg ut
               av containeren i stedet for ned på egen linje. */
            flex-wrap: wrap;
        }
        .tilbake-lenke { color: var(--accent); text-decoration: none; font-size: 13px; }
        .tilbake-lenke:hover { text-decoration: underline; }
        .tittelrad { display: flex; align-items: center; gap: 14px; flex: 1; min-width: 0; }
        h1 { font-size: 1.6em; margin: 0 0 4px; font-weight: 700; }
        .beskrivelse { color: var(--text-secondary); font-size: 14px; margin: 4px 0 0; }
        .meta-info { color: var(--text-secondary); font-size: 12px; margin-top: 4px; }
        .toppknapper { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

        .knapp {
            display: inline-flex; align-items: center; gap: 6px;
            border: 0; border-radius: 10px;
            padding: 8px 14px; font-size: 13px; font-weight: 600;
            cursor: pointer; text-decoration: none;
            font-family: inherit;
        }
        .knapp.primær { background: var(--accent); color: white; }
        .knapp.primær:hover { filter: brightness(1.1); }
        .knapp.sekundær { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
        .knapp.sekundær:hover { background: var(--accent-light); }

        .filter-panel {
            background: var(--bg-section); border: 1px solid var(--border-color);
            border-radius: 14px; padding: 16px 18px; margin-bottom: 16px;
        }
        .filter-panel h3 { margin: 0 0 10px; font-size: 14px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; }
        .filter-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 12px;
        }
        .filter-felt label {
            display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 4px;
        }
        .filter-felt input {
            width: 100%; padding: 7px 10px; border: 1px solid var(--border-color);
            border-radius: 8px; background: var(--bg-input); color: var(--text-primary);
            font-family: inherit; font-size: 13px;
        }
        .filter-felt input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }

        .status-melding { padding: 14px; text-align: center; color: var(--text-secondary); font-size: 14px; }
        .status-melding.feil { color: #d9534f; }

        .resultat-tabell-omslutt {
            overflow-x: auto; border: 1px solid var(--border-color);
            border-radius: 12px; margin-top: 10px;
            background: var(--bg-section);
        }
        table.rapport {
            width: 100%; border-collapse: collapse; font-size: 13px;
            font-variant-numeric: tabular-nums;
        }
        table.rapport th, table.rapport td {
            padding: 8px 12px; text-align: left;
            border-bottom: 1px solid var(--border-color);
            vertical-align: top;
        }
        table.rapport thead th {
            background: var(--bg-container); font-weight: 600;
            font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em;
            color: var(--text-secondary); position: sticky; top: 0;
            /* Overskriftene brytes helst ved de myke bindestrekene forfatteren
               har satt (understrek i kolonnenavnet). `anywhere` ville delt midt
               i ordet uansett og gjort delepunktene virkningsløse — det var
               nettopp de ulogiske delingene. `break-word` deler bare når ordet
               ellers ikke får plass. */
            white-space: normal; overflow-wrap: break-word; hyphens: manual;
        }
        table.rapport tbody tr:last-child td { border-bottom: 0; }
        table.rapport td.tall, table.rapport th.tall { text-align: right; }

        .gruppe { margin-bottom: 12px; border: 1px solid var(--border-color); border-radius: 12px; background: var(--bg-section); overflow: hidden; }
        .gruppe-header {
            padding: 10px 14px;
            background: var(--gruppe-header);
            display: flex; justify-content: space-between; align-items: baseline;
            cursor: pointer; user-select: none;
        }
        .gruppe-header .navn { font-weight: 600; }
        .gruppe-header .agg { font-size: 12.5px; color: var(--text-secondary); display: flex; gap: 14px; flex-wrap: wrap; }
        .gruppe-header .agg strong { color: var(--text-primary); }
        .gruppe-innhold.kollapset { display: none; }
        .gruppe-innhold table.rapport thead th { background: transparent; }

        .totaler {
            padding: 12px 16px; margin-top: 14px;
            background: var(--bg-section); border: 1px solid var(--border-color);
            border-radius: 12px;
            display: flex; gap: 20px; flex-wrap: wrap; font-size: 13px;
        }
        .totaler strong { color: var(--text-primary); }

        .resultat-verktoy {
            display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
            margin: 0 0 8px; font-size: 13px;
        }
        .knapp.mini { padding: 4px 10px; font-size: 12px; }
        .valgt-teller { color: var(--text-secondary); font-size: 12px; }
        .retningsvalg { margin-left: auto; color: var(--text-secondary); font-size: 12px; display: flex; align-items: center; gap: 6px; }
        .retningsvalg select {
            padding: 4px 8px; border: 1px solid var(--border-color); border-radius: 8px;
            background: var(--bg-input); color: var(--text-primary); font-family: inherit; font-size: 12px;
        }
        table.rapport th.velgkol, table.rapport td.velgkol {
            width: 1%; padding-right: 0; text-align: center; color: var(--text-secondary);
        }
        /* En utelatt rad skal være lett å se, men fortsatt lesbar — den skal
           kunne hentes tilbake, og da må man kunne se hva man henter. */
        table.rapport tr.utelatt td { opacity: 0.4; text-decoration: line-through; }
        table.rapport tr.utelatt td.velgkol { opacity: 1; text-decoration: none; }
        .gruppe.gruppe-tom { opacity: 0.45; }

        /* Lange verdier skal brytes, ikke skyve tabellen utenfor arket.
           «SÆRLIG KATEGORI PERSONOPPLYSNING» er én celle, ikke én linje.
           Overskriftene er unntaket og styres der de ellers settes. */
        table.rapport td { overflow-wrap: anywhere; }

        /* Første kolonne bærer gjerne nøkkelbegrepet. Den skal slippe å bli
           delt i tre når de andre kolonnene tar plassen. */
        table.rapport th.nokkelkol, table.rapport td.nokkelkol { min-width: 11em; }

        /* Print-optimering — PDF via nettleserens Skriv ut */
        @media print {
            body { background: white; color: black; padding: 12mm; }
            .theme-toggle, .toppknapper, .filter-panel, .knapp { display: none !important; }
            .container {
                max-width: 100%; padding: 0; background: transparent; box-shadow: none;
                border: 0; backdrop-filter: none;
            }
            .topp { border-bottom: 2px solid #000; }
            h1 { color: black; }
            .beskrivelse, .meta-info { color: #333; }
            .resultat-tabell-omslutt, .gruppe, .totaler {
                border: 1px solid #999 !important; background: white !important;
                page-break-inside: avoid;
            }
            table.rapport thead th {
                background: #eee !important; color: black !important;
                border-bottom: 1px solid #666;
            }
            table.rapport tbody tr { page-break-inside: avoid; }
            .gruppe-innhold.kollapset { display: block !important; }
            .gruppe-header { background: #f4f4f4 !important; }
            .resultat-verktoy { display: none !important; }
            /* Avkryssingen er et valg om hva som skal på papiret. Både
               kolonnen og de fravalgte radene hører hjemme på skjermen, ikke
               i utskriften. */
            table.rapport th.velgkol, table.rapport td.velgkol { display: none !important; }
            table.rapport tr.utelatt { display: none !important; }
            /* En gruppe der alt er krysset bort har ingenting å vise, og en
               overskrift uten innhold under seg er verre enn ingen gruppe. */
            .gruppe.gruppe-tom { display: none !important; }
            /* Mange kolonner på et ark: mindre skrift og luft, og celler som
               bryter. Uten dette falt de siste kolonnene utenfor papiret —
               samme sted de ble borte på skjermen. */
            table.rapport { font-size: 10px; }
            table.rapport th, table.rapport td { padding: 4px 6px; }
            @page { margin: 12mm; }
        }
        /* `hidden` er bare en UA-regel (`display: none`), og enhver author-regel
           med `display` slår den. `.knapp` setter `display: inline-block`, så
           uten denne linja ville et skjult element stått framme — og både
           markupen og koden som skjuler det ville sett riktig ut. */
        [hidden] { display: none !important; }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn">🌙</button>

    <div class="container">
        <div class="topprad">
            <a class="tilbake-lenke" href="/velgrapporttype.html">← Til rapportoversikten</a>
            <div class="toppknapper">
                <a class="knapp sekundær" id="rediger-lenke" style="display:none;">Rediger</a>
                <button class="knapp sekundær" onclick="window.print()" id="skriv-ut-knapp" style="display:none;">Skriv ut / PDF</button>
                <button class="knapp primær" onclick="kjor()" id="kjor-knapp" style="display:none;">Kjør rapport</button>
            </div>
        </div>
        <div class="topp">
            <div style="flex:1; min-width:0;">
                <h1 id="tittel">Rapport</h1>
                <div class="beskrivelse" id="beskrivelse"></div>
                <div class="meta-info" id="meta-info"></div>
            </div>
            <div id="systemmerke-plass"></div>
        </div>

        <div id="filter-panel" class="filter-panel" style="display:none;">
            <h3>Filtre</h3>
            <div class="filter-grid" id="filter-grid"></div>
        </div>

        <div id="resultat-verktoy" class="resultat-verktoy" hidden>
            <button class="knapp sekundær mini" onclick="settAlleRader(true)">✓ Vis alle</button>
            <button class="knapp sekundær mini" onclick="settAlleRader(false)">✗ Skjul alle</button>
            <span id="valgt-teller" class="valgt-teller"></span>
            <label class="retningsvalg">Utskrift:
                <select id="utskriftsretning" onchange="settUtskriftsretning(this.value)">
                    <option value="landscape">Liggende</option>
                    <option value="portrait">Stående</option>
                </select>
            </label>
        </div>

        <div id="status" class="status-melding">Laster…</div>
        <div id="resultat"></div>
        <div id="totaler-boks" class="totaler" style="display:none;"></div>
    </div>

    <script type="module">
        import { api } from './js/api-client.js';
        import { hentInnloggetBruker } from './js/auth.js';
        import { statusTekstFraKode } from './js/skjemastatus.js';
        import { parseMarkdown } from './js/felt-render.js';

        const params = new URLSearchParams(location.search);
        const rapporttypeId = params.get('rapporttype_id') || '';

        let rapporttype = null;

        window.toggleTheme = () => {
            const root = document.documentElement;
            const ny = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            root.setAttribute('data-theme', ny);
            localStorage.setItem('theme', ny);
            document.getElementById('theme-btn').textContent = ny === 'dark' ? '☀️' : '🌙';
        };
        document.getElementById('theme-btn').textContent =
            document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';



        function visStatus(tekst, klasse) {
            const el = document.getElementById('status');
            el.textContent = tekst;
            el.className = 'status-melding' + (klasse ? ' ' + klasse : '');
            el.style.display = tekst ? 'block' : 'none';
        }

        function formaterDato(v) {
            if (!v) return '';
            const d = new Date(v);
            if (isNaN(d)) return String(v);
            const pad = n => String(n).padStart(2, '0');
            return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }
        function formaterNummer(v) {
            if (v === null || v === undefined || v === '') return '';
            const n = Number(String(v).replace(',', '.'));
            if (isNaN(n)) return String(v);
            return n.toLocaleString('nb-NO', { maximumFractionDigits: 2 });
        }
        function formaterVerdi(v, kol) {
            if (v === null || v === undefined) return '';
            if (Array.isArray(v)) return v.map(x => formaterVerdi(x, { ...kol, format: kol.format === 'dato' ? 'dato' : null })).join(', ');
            if (kol?.format === 'dato') return formaterDato(v);
            if (kol?.format === 'status') return statusTekstFraKode(v);
            if (kol?.format === 'nummer') return formaterNummer(v);
            return String(v);
        }
        function erTallKolonne(kol) { return kol?.format === 'nummer'; }

        /**
         * Kolonneoverskriften, med delepunktene forfatteren har bestemt.
         *
         * Lange kolonnenavn ble delt der det tilfeldigvis var plass —
         * «SÆRLIG KATEGORI PERSONOPP-LYSNING». Nå styrer den som lager
         * rapporten hvor det kan brytes:
         *
         *   _  myk bindestrek — brytes HER ved behov, og vises bare da
         *   -  vanlig bindestrek — står alltid, og kan brytes etter
         *
         * Understreken forsvinner altså fra visningen; den er en instruksjon,
         * ikke et tegn. Teksten escapes før tegnet settes inn, så et
         * kolonnenavn ikke kan bære markup.
         */
        const MYK_BINDESTREK = '\u00AD';
        function kolonneNavnHtml(navn) {
            return escapeHtml(navn).replace(/_/g, MYK_BINDESTREK);
        }

        function escapeHtml(s) {
            return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function byggFilterPanel() {
            const grid = document.getElementById('filter-grid');
            const filtre = rapporttype.Brukerfiltre || [];
            if (filtre.length === 0) {
                document.getElementById('filter-panel').style.display = 'none';
                return;
            }
            document.getElementById('filter-panel').style.display = '';
            grid.innerHTML = filtre.map(f => {
                const forhaandsverdi = params.get(`bf_${f.id}`) || '';
                // «inneholder» er et søk, ikke et filter man fyller ut og
                // bekrefter. Da skal det oppføre seg som en søkelinje.
                const sok = erSokefilter(f);
                return `
                <div class="filter-felt">
                    <label for="bf-${escapeHtml(f.id)}">${escapeHtml(f.navn)}${sok ? ' <span style="opacity:.6">— søker mens du skriver</span>' : ''}</label>
                    <input type="${sok ? 'search' : 'text'}" id="bf-${escapeHtml(f.id)}" data-filter-id="${escapeHtml(f.id)}"
                        ${sok ? 'data-sok="1"' : ''}
                        placeholder="${escapeHtml(sok ? 'Søk…' : hintTekst(f))}" value="${escapeHtml(forhaandsverdi)}">
                </div>
            `;}).join('');

            // Hvert tastetrykk kjører rapporten på nytt — men ikke før det har
            // vært stille en kort stund. Filtreringen skjer på serveren, i den
            // samme motoren som alt annet; en kopi av «inneholder» i
            // nettleseren ville vært en regel til som kunne svare annerledes.
            for (const el of grid.querySelectorAll('input[data-sok]')) {
                el.addEventListener('input', () => {
                    clearTimeout(sokTimer);
                    sokTimer = setTimeout(() => { if (harKjort) kjor({ stille: true }); }, 300);
                });
            }
        }

        let sokTimer = null;
        let harKjort = false;

        const RETNING_LS = 'rapport-utskriftsretning';

        /**
         * Papirretningen for utskrift og PDF.
         *
         * `@page { size: ... }` kan ikke settes med inline style — den må
         * stå i et stilark. Derfor skrives regelen inn i et eget
         * `<style>`-element i stedet for på et element.
         *
         * Liggende er standard, for en rapport er bredere enn den er høy. Men
         * en rapport med fire kolonner ser rar ut liggende, og da skal man
         * kunne velge.
         */
        window.settUtskriftsretning = (retning) => {
            const gyldig = retning === 'portrait' ? 'portrait' : 'landscape';
            let stil = document.getElementById('utskrift-retning');
            if (!stil) {
                stil = document.createElement('style');
                stil.id = 'utskrift-retning';
                document.head.appendChild(stil);
            }
            stil.textContent = `@media print { @page { size: A4 ${gyldig}; } }`;
            try { localStorage.setItem(RETNING_LS, gyldig); } catch { /* privat modus */ }
        };

        function gjenopprettUtskriftsretning() {
            let lagret = 'landscape';
            try { lagret = localStorage.getItem(RETNING_LS) || 'landscape'; } catch { /* privat modus */ }
            const velger = document.getElementById('utskriftsretning');
            if (velger) velger.value = lagret;
            settUtskriftsretning(lagret);
        }

        /**
         * Er dette filteret et søk?
         *
         * «inneholder» på et tekstfelt er det eneste tilfellet der man skriver
         * et fragment og vil se treffene vokse fram. De andre operatorene
         * («er lik», «mellom», datoer) gir ikke mening halvveis inntastet, og
         * ville kjørt rapporten på hvert tegn uten at noe nyttig skjedde.
         */
        function erSokefilter(f) {
            return f?.operator === 'contains';
        }
        function hintTekst(f) {
            const op = f.operator;
            if (op === 'in' || op === 'notIn') return 'A, B, C';
            if (op === 'between') return 'fra-verdi (dato: idag-7)';
            if (['eq','neq','gt','gte','lt','lte'].includes(op)) return 'verdi (dato: idag, idag+7)';
            return '';
        }

        function lesBrukerVerdier() {
            const ut = {};
            for (const el of document.querySelectorAll('[data-filter-id]')) {
                const id = el.dataset.filterId;
                const v = el.value.trim();
                if (v) ut[id] = v;
            }
            return ut;
        }

        function radHtml(rad, kolonner) {
            // Avkrysset = tas med. Fjerner man krysset, dempes raden på
            // skjermen og faller bort i utskriften — den forsvinner IKKE fra
            // visningen, for da ville den ikke kunne hentes tilbake.
            return `<tr>
                <td class="velgkol"><input type="checkbox" checked onchange="radValgt(this)" title="Ta med i utskrift"></td>
                ${kolonner.map((k, i) => {
                    const klasser = [erTallKolonne(k) ? 'tall' : '', i === 0 ? 'nokkelkol' : ''].filter(Boolean);
                    return `<td${klasser.length ? ` class="${klasser.join(' ')}"` : ''}>${escapeHtml(formaterVerdi(rad.verdier[k.id], k))}</td>`;
                }).join('')}</tr>`;
        }

        window.radValgt = (boks) => {
            boks.closest('tr')?.classList.toggle('utelatt', !boks.checked);
            oppdaterTommeGrupper();
            oppdaterValgtTeller();
        };

        /**
         * En gruppe uten valgte rader skal ikke stå i utskriften.
         *
         * På skjermen dempes den i stedet for å forsvinne — samme begrunnelse
         * som for radene: en gruppe man ikke ser, kan man ikke hente tilbake.
         */
        function oppdaterTommeGrupper() {
            for (const gruppe of document.querySelectorAll('#resultat .gruppe')) {
                const valgte = gruppe.querySelectorAll('input[type="checkbox"]:checked').length;
                gruppe.classList.toggle('gruppe-tom', valgte === 0);
            }
        }

        /**
         * Vis alle / Skjul alle for radene i hele rapporten.
         *
         * Gjelder på tvers av grupper. Den som trykker «Skjul alle» vil ha et
         * blankt ark å krysse av i, ikke én gruppe om gangen.
         */
        window.settAlleRader = (på) => {
            for (const boks of document.querySelectorAll('#resultat input[type="checkbox"]')) {
                boks.checked = på;
                boks.closest('tr')?.classList.toggle('utelatt', !på);
            }
            oppdaterTommeGrupper();
            oppdaterValgtTeller();
        };

        function oppdaterValgtTeller() {
            const alle = document.querySelectorAll('#resultat input[type="checkbox"]');
            const valgte = document.querySelectorAll('#resultat input[type="checkbox"]:checked');
            const el = document.getElementById('valgt-teller');
            if (!el) return;
            // Teksten sier noe bare når den sier noe annet enn «alt».
            el.textContent = alle.length === valgte.length
                ? ''
                : `${valgte.length} av ${alle.length} rader tas med i utskriften`;
        }

        function tabellHtml(rader, kolonner) {
            return `
                <div class="resultat-tabell-omslutt">
                    <table class="rapport">
                        <thead>
                            <tr>
                                <th class="velgkol" title="Ta med i utskrift">✓</th>
                                ${kolonner.map((k, i) => {
                                    const klasser = [erTallKolonne(k) ? 'tall' : '', i === 0 ? 'nokkelkol' : ''].filter(Boolean);
                                    return `<th${klasser.length ? ` class="${klasser.join(' ')}"` : ''}>${kolonneNavnHtml(k.navn)}</th>`;
                                }).join('')}</tr>
                        </thead>
                        <tbody>
                            ${rader.length === 0
                                ? `<tr><td colspan="${kolonner.length + 1}" style="text-align:center;color:var(--text-secondary);padding:20px;">Ingen data</td></tr>`
                                : rader.map(r => radHtml(r, kolonner)).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function grupperHtml(grupper, kolonner, gruppeKolNavn) {
            return grupper.map((g, i) => {
                const aggChips = Object.entries(g.aggregater || {}).map(([n, v]) => {
                    const formatert = typeof v === 'number' ? formaterNummer(v) : (v ?? '');
                    return `<span><strong>${escapeHtml(n)}:</strong> ${escapeHtml(formatert)}</span>`;
                }).join('');
                return `
                    <div class="gruppe">
                        <div class="gruppe-header" onclick="toggleGruppe(${i})">
                            <div class="navn">${escapeHtml(gruppeKolNavn || 'Gruppe')}: ${escapeHtml(g.nokkel)} <span style="color:var(--text-secondary);font-weight:400;">(${g.antall})</span></div>
                            <div class="agg">${aggChips}</div>
                        </div>
                        <div class="gruppe-innhold" data-gruppe-id="${i}">
                            ${tabellHtml(g.rader, kolonner)}
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.toggleGruppe = (i) => {
            const el = document.querySelector(`[data-gruppe-id="${i}"]`);
            if (el) el.classList.toggle('kollapset');
        };

        function render(resultat) {
            const res = document.getElementById('resultat');
            const kolonner = resultat.kolonner || [];
            const gruppeKol = kolonner.find(k => k.id === resultat.meta.gruppertPaa);
            const gruppeKolNavn = gruppeKol?.navn || resultat.meta.gruppertPaa;

            if (resultat.grupper && resultat.grupper.length > 0) {
                res.innerHTML = grupperHtml(resultat.grupper, kolonner, gruppeKolNavn);
            } else {
                res.innerHTML = tabellHtml(resultat.rader, kolonner);
            }

            // Totaler
            const totBox = document.getElementById('totaler-boks');
            const totaler = resultat.totaler || {};
            const totEntries = Object.entries(totaler);
            if (totEntries.length > 0) {
                totBox.innerHTML = `<strong>Totalt:</strong> ${totEntries.map(([n, v]) => {
                    const formatert = typeof v === 'number' ? formaterNummer(v) : (v ?? '');
                    return `${escapeHtml(n)}: ${escapeHtml(formatert)}`;
                }).join(' · ')} <span style="color:var(--text-secondary); margin-left:auto;">${resultat.meta.antallEtterFilter}/${resultat.meta.antallSkjemaer} skjemaer</span>`;
                totBox.style.display = '';
            } else {
                totBox.innerHTML = `<span style="color:var(--text-secondary);">${resultat.meta.antallEtterFilter} av ${resultat.meta.antallSkjemaer} skjemaer</span>`;
                totBox.style.display = '';
            }

            document.getElementById('meta-info').textContent =
                `Kjørt ${formaterDato(resultat.meta.kjørtDato)} · kilde: ${resultat.rapport?.Kildeskjematype_navn || ''}`;
            document.getElementById('skriv-ut-knapp').style.display = '';
            // Verktøylinja gir bare mening når det står noe å krysse av.
            document.getElementById('resultat-verktoy').hidden = false;
            oppdaterValgtTeller();
        }

        /**
         * `stille` brukes av søkefeltene: da blankes ikke resultatet ut mellom
         * tastetrykkene. Et bord som blinker bort og tilbake for hvert tegn er
         * verre å lese enn et som står et halvsekund for lenge.
         */
        window.kjor = async (opts = {}) => {
            if (!opts.stille) {
                visStatus('Kjører rapport…');
                document.getElementById('resultat').innerHTML = '';
                document.getElementById('totaler-boks').style.display = 'none';
            }
            try {
                const brukerVerdier = lesBrukerVerdier();
                const res = await api.post('/api/rapport/kjor', { Rapporttype_id: rapporttypeId, brukerVerdier });
                visStatus('');
                harKjort = true;
                render(res);
            } catch (e) {
                visStatus('Kunne ikke kjøre: ' + e.message, 'feil');
            }
        };

        async function init() {
            const bruker = await hentInnloggetBruker();
            if (!bruker) {
                window.location.href = '/.auth/login/aad?post_login_redirect_uri=' + encodeURIComponent(window.location.pathname + window.location.search);
                return;
            }
            if (!rapporttypeId) {
                visStatus('Mangler rapporttype_id i URL', 'feil');
                return;
            }
            try {
                rapporttype = await api.get(`/api/rapporttyper/${encodeURIComponent(rapporttypeId)}`);
                document.getElementById('tittel').textContent = rapporttype.Rapport_navn || 'Rapport';
                document.title = `${rapporttype.Rapport_navn || 'Rapport'} — Rapport`;
                // Markdown, ikke ren tekst: beskrivelsen kan ha lenker og
                // bilder. `parseMarkdown` escaper teksten først og slipper bare
                // http(s)- og relative adresser gjennom.
                document.getElementById('beskrivelse').innerHTML = parseMarkdown(rapporttype.Beskrivelse || '');

                // Rediger-knapp — vises hvis bruker er eier (sjekkes via whoami + finn eier)
                try {
                    const meg = await api.get('/api/whoami');
                    const upn = (meg?.userDetails || '').toLowerCase();
                    const eiere = (rapporttype.Eiere?.Personer || []).map(p => String(p).toLowerCase());
                    if (meg?.erAdmin || eiere.includes(upn)) {
                        const lenke = document.getElementById('rediger-lenke');
                        lenke.href = `/rapporteditor.html?rapporttype_id=${encodeURIComponent(rapporttypeId)}`;
                        lenke.style.display = '';
                    }
                } catch (_) { /* ikke kritisk */ }

                byggFilterPanel();
                gjenopprettUtskriftsretning();
                document.getElementById('kjor-knapp').style.display = '';

                // Auto-kjør hvis kjør=1 i URL (typisk fra bokmerket lenke)
                const skalAutoKjore = params.get('kjør') === '1' || params.get('kjor') === '1';
                if (skalAutoKjore) {
                    visStatus('Kjører rapport med forhåndssatte filtre…');
                    kjor();
                } else {
                    visStatus('Klar. Klikk «Kjør rapport» for å hente data.');
                }
            } catch (e) {
                visStatus('Kunne ikke laste rapporttype: ' + e.message, 'feil');
            }
        }

        init();
    </script>
    <script type="module" src="/js/systemtopp.js"></script>
    <script type="module" src="/js/faner.js"></script>
</body>
</html>
