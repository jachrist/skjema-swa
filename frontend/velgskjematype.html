<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velg skjema</title>
    <script>
        (function() {
            const t = localStorage.getItem('theme');
            if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        })();
    </script>
    <style>
        :root {
            --bg-page: #e8edf2;
            --bg-container: rgba(255, 255, 255, 0.72);
            --bg-section: rgba(255, 255, 255, 0.55);
            --bg-input: rgba(255, 255, 255, 0.7);
            --text-primary: #1c1c1e;
            --text-secondary: #6e6e73;
            --text-heading: #0a84ff;
            --border-color: rgba(0, 0, 0, 0.08);
            --shadow: 0 4px 30px rgba(0, 0, 0, 0.06);
            --shadow-sm: 0 1px 6px rgba(0, 0, 0, 0.04);
            --accent: #0a84ff;
            --accent-light: rgba(10, 132, 255, 0.12);
            --accent-medium: rgba(10, 132, 255, 0.18);
            --glass-blur: blur(20px);
            --radius-sm: 10px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --radius-xl: 24px;
            --forklaring-bg: rgba(10, 132, 255, 0.08);
            --forklaring-border: #0a84ff;
            --badge-utvikling: #ff9500;
            --badge-test: #af52de;
            --badge-produksjon: #34c759;
            --badge-mal: #8e8e93;
        }

        [data-theme="dark"] {
            --bg-page: #0d1117;
            --bg-container: rgba(30, 35, 45, 0.72);
            --bg-section: rgba(40, 45, 60, 0.55);
            --bg-input: rgba(50, 55, 70, 0.6);
            --text-primary: #f0f0f5;
            --text-secondary: #8e8e93;
            --text-heading: #64b5f6;
            --border-color: rgba(255, 255, 255, 0.08);
            --shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
            --shadow-sm: 0 1px 6px rgba(0, 0, 0, 0.15);
            --accent-light: rgba(10, 132, 255, 0.2);
            --accent-medium: rgba(10, 132, 255, 0.25);
            --forklaring-bg: rgba(10, 132, 255, 0.1);
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-primary);
            margin: 0;
            padding: 24px;
            line-height: 1.6;
            transition: background-color 0.4s, color 0.4s;
            -webkit-font-smoothing: antialiased;
        }

        .theme-toggle {
            position: fixed;
            top: 16px;
            right: 20px;
            z-index: 10000;
            background: var(--bg-container);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: var(--shadow);
            transition: transform 0.2s;
        }
        .theme-toggle:hover { transform: scale(1.08); }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--bg-container);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            padding: 36px;
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        .topp {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 8px;
        }
        .topprad {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 10px;
            /* Uten wrap kan ikke raden brytes, og en lang UPN presser seg ut
               av containeren i stedet for ned på egen linje. */
            flex-wrap: wrap;
        }
        .tilbake-lenke { color: var(--accent); text-decoration: none; font-size: 13px; }
        .tilbake-lenke:hover { text-decoration: underline; }
        .tittelrad { display: flex; align-items: center; gap: 14px; flex: 1; min-width: 0; }

        h1 {
            color: var(--text-primary);
            font-weight: 700;
            font-size: 1.8em;
            letter-spacing: -0.02em;
            margin: 0;
            flex: 1;
        }

        .brukerinfo {
            /* min-width: 0 — et flex-element krymper ellers aldri under
               innholdsbredden, og en UPN er ett langt ord. */
            min-width: 0; overflow-wrap: anywhere;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .brukerinfo .upn { font-weight: 500; color: var(--text-primary); }

        .link-knapp {
            background: none;
            border: 0;
            color: var(--accent);
            font-size: 13px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: background 0.15s;
        }
        .link-knapp:hover { background: var(--accent-light); }

        .undertittel {
            color: var(--text-secondary);
            font-size: 14px;
            margin: 16px 0 20px;
        }

        .fase-filter-rad {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            font-size: 14px;
            color: var(--text-secondary);
            flex-wrap: wrap;
        }
        .fase-toggle {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            font-size: 13px;
            border: 1px solid var(--border-color);
            border-radius: 999px;
            background: var(--bg-input);
            color: var(--text-primary);
            cursor: pointer;
            user-select: none;
            transition: background 0.15s, border-color 0.15s;
        }
        .fase-toggle input[type="checkbox"] { margin: 0; cursor: pointer; }
        /* Eierbryteren filtrerer på noe annet enn fasene. Uten et skille leses
           alle fire som ett sett avkrysningsbokser med samme betydning. */
        .filter-skille {
            width: 1px; align-self: stretch; min-height: 20px;
            background: var(--border-color); margin: 0 4px;
        }
        .fase-toggle:hover { border-color: var(--accent); }
        .fase-toggle.aktiv {
            background: var(--accent-light);
            border-color: var(--accent);
            color: var(--accent);
            font-weight: 600;
        }

        .sokefelt-rad {
            position: relative;
            margin-bottom: 18px;
        }
        .sokefelt {
            width: 100%;
            padding: 12px 40px 12px 40px;
            font-size: 15px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            background: var(--bg-input);
            color: var(--text-primary);
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .sokefelt:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-light);
        }
        .sokefelt-ikon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            pointer-events: none;
        }

        .status-melding {
            padding: 14px 18px;
            border-radius: var(--radius-md);
            background: var(--bg-section);
            color: var(--text-secondary);
            text-align: center;
            font-size: 14px;
        }
        .status-melding.feil { color: #d9534f; background: rgba(217, 83, 79, 0.1); }

        .skjematype-liste {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .skjematype-kort {
            background: var(--bg-section);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 18px 20px;
            box-shadow: var(--shadow-sm);
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .skjematype-kort:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow);
        }

        .kort-tittelrad {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 6px;
            cursor: pointer;
            user-select: none;
        }
        .kort-tittelrad:hover .kort-tittel { color: var(--accent); }
        .kort-tittel {
            font-size: 17px;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0;
            display: flex;
            align-items: baseline;
            gap: 6px;
        }
        .kort-kollaps-pil {
            display: inline-block;
            font-size: 12px;
            color: var(--text-secondary);
            transition: transform 0.15s;
        }
        /* ID-en står foran tittelen fordi den er det folk refererer til seg
           imellom. Fast bredde ville sprikt for tresifrede id-er, så den får
           i stedet en ramme som holder den visuelt adskilt fra navnet. */
        .kort-id {
            flex: none;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            background: var(--bg-page, rgba(127, 127, 127, 0.12));
            border: 1px solid var(--border-color);
            border-radius: 5px;
            padding: 1px 6px;
        }
        .skjematype-kort.kollapset .kort-kollaps-pil { transform: rotate(-90deg); }
        .skjematype-kort.kollapset .kort-innhold { display: none; }

        .fase-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            color: white;
            white-space: nowrap;
        }
        .fase-badge.produksjon { background: var(--badge-produksjon); }
        .fase-badge.utvikling  { background: var(--badge-utvikling); }
        .fase-badge.test       { background: var(--badge-test); }
        .fase-badge.mal        { background: var(--badge-mal); }

        .forklaring {
            background: var(--forklaring-bg);
            border-left: 3px solid var(--forklaring-border);
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 14px;
            margin: 8px 0 14px;
        }

        .knapperad {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .knapp {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: 0;
            border-radius: var(--radius-sm);
            padding: 9px 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: filter 0.15s, background 0.15s;
        }
        .knapp.primær {
            background: var(--accent);
            color: white;
        }
        .knapp.primær:hover { filter: brightness(1.1); }
        .knapp.sekundær {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
        }
        .knapp.sekundær:hover { background: var(--accent-light); }

        .ingen-treff {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }
        /* `hidden` er bare en UA-regel (`display: none`), og enhver author-regel
           med `display` slår den. `.knapp` setter `display: inline-block`, så
           uten denne linja ville et skjult element stått framme — og både
           markupen og koden som skjuler det ville sett riktig ut. */
        [hidden] { display: none !important; }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn">🌙</button>

    <div class="container">
        <div class="topprad">
            <span></span>
            <div class="brukerinfo">
                <span class="upn" id="upn">…</span>
                <button class="link-knapp" onclick="logUt()">Logg ut</button>
            </div>
        </div>
        <div class="topp">
            <div class="tittelrad"><h1>Velg skjema</h1></div>
            <div id="systemmerke-plass"></div>
        </div>

        <p class="undertittel">Skjematyper du har tilgang til.</p>

        <div id="fase-filter-rad" class="fase-filter-rad" style="display: none;">
            <span>Vis:</span>
            <label class="fase-toggle aktiv" data-fase="Produksjon" id="fase-toggle-Produksjon" style="display: none;">
                <input type="checkbox" value="Produksjon" checked onchange="onFaseEndret()"> Produksjon
            </label>
            <label class="fase-toggle" data-fase="Utvikling" id="fase-toggle-Utvikling" style="display: none;">
                <input type="checkbox" value="Utvikling" onchange="onFaseEndret()"> Utvikling
            </label>
            <span class="filter-skille" id="eier-skille" style="display: none;"></span>
            <label class="fase-toggle" id="eier-toggle" style="display: none;"
                title="Skjul skjematyper du bare er publikum på">
                <input type="checkbox" onchange="onEierEndret()"> Bare der jeg er eier
            </label>
        </div>

        <div class="sokefelt-rad">
            <span class="sokefelt-ikon">🔍</span>
            <input type="text" class="sokefelt" id="sok" placeholder="Søk etter skjematype…" oninput="filtrer()">
        </div>

        <div style="margin-bottom: 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
            <button class="knapp sekundær" style="padding: 4px 12px; font-size: 12px;" onclick="apneAlleKort()">▾ Vis alle</button>
            <button class="knapp sekundær" style="padding: 4px 12px; font-size: 12px;" onclick="skjulAlleKort()">▸ Skjul alle</button>
            <a id="knapp-ny-skjematype" class="knapp primær" style="display: none; padding: 4px 12px; font-size: 12px; text-decoration: none;" href="/editor.html">+ Ny skjematype</a>
            <a id="knapp-rapporter" class="knapp sekundær" style="display: none; padding: 4px 12px; font-size: 12px; text-decoration: none;" href="/velgrapporttype.html" title="Gå til rapportene">📊 Rapporter</a>
            <a id="knapp-admin-panel" class="knapp sekundær" style="display: none; padding: 4px 12px; font-size: 12px; text-decoration: none; margin-left: auto;" href="/admin.html">🔧 Admin-panel</a>
        </div>

        <div id="status" class="status-melding">Laster…</div>
        <div id="liste" class="skjematype-liste"></div>
    </div>

    <script type="module">
        import { CONFIG } from './js/config.js';
        import { api } from './js/api-client.js';
        import { hentInnloggetBruker, logUt as authLogUt } from './js/auth.js';

        let alle = [];
        // Rapporter er låst til admin/Skjemaskaper — settes fra /api/whoami før lista rendres.
        let kanLageRapport = false;
        let erAdminBruker = false;

        // Nullpunktstatus for gevinstoppfølging. Ett kall dekker hele lista, i
        // stedet for én tabellskanning per skjematype. Merkingen er en
        // påminnelse til eiere og admin — den skal ikke vises for andre, og
        // den skal aldri hindre at oversikten kommer opp.
        let nullpunkt = { konfigurert: false, dekkede: [] };

        function manglerNullpunkt(t) {
            if (!nullpunkt.konfigurert) return false;
            if (!(t.ErEier || erAdminBruker)) return false;
            // Bare skjematyper som faktisk er i produksjon. Under utvikling er
            // et manglende nullpunkt helt normalt, og å merke dem ville gjort
            // merket til bakgrunnsstøy — og dermed verdiløst der det teller.
            if ((t.Fase || 'Produksjon') !== 'Produksjon') return false;
            // Baseline-skjemaet trenger ikke sitt eget nullpunkt.
            if (String(t.Skjematype_id) === String(nullpunkt.baselineTypeId)) return false;
            return !nullpunkt.dekkede.includes(String(t.Skjematype_id));
        }

        window.toggleTheme = () => {
            const root = document.documentElement;
            const ny = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            root.setAttribute('data-theme', ny);
            localStorage.setItem('theme', ny);
            document.getElementById('theme-btn').textContent = ny === 'dark' ? '☀️' : '🌙';
        };
        document.getElementById('theme-btn').textContent =
            document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';

        window.logUt = () => authLogUt('/');

        async function init() {
            const bruker = await hentInnloggetBruker();
            if (!bruker) {
                window.location.href = '/.auth/login/aad?post_login_redirect_uri=' + encodeURIComponent(window.location.pathname);
                return;
            }
            document.getElementById('upn').textContent = bruker.userDetails;
            document.title = `Velg skjema — ${CONFIG.APP_TITTEL || ''}`;

            // Hent admin-status + skjemaskaper-tilgang via /api/whoami
            try {
                const meg = await api.get('/api/whoami');
                if (meg.erAdmin) {
                    erAdminBruker = true;
                    document.getElementById('knapp-admin-panel').style.display = 'inline-flex';
                }
                // «Ny skjematype» og «Ny rapport» krever rollen Skjemaskaper —
                // det å lage noe nytt er en kvalifikasjon.
                if (meg.kanOppretteSkjematype) {
                    kanLageRapport = true;
                    document.getElementById('knapp-ny-skjematype').style.display = 'inline-flex';
                }
                // Selve rapportoversikten er åpen for alle innloggede. Lista
                // filtrerer på eier og publikum, og viser rapporter under
                // utvikling bare til eierne — så knappen skjuler ingenting.
                document.getElementById('knapp-rapporter').style.display = 'inline-flex';
            } catch (_) { /* ikke kritisk */ }

            // Nullpunktstatus hentes bare for dem merkingen gjelder, og aldri
            // slik at et treigt eller feilende kall holder lista tilbake.
            if (erAdminBruker || kanLageRapport) {
                api.get('/api/gevinst/nullpunkt-status')
                    .then(res => { nullpunkt = res || nullpunkt; filtrer(); })
                    .catch(() => { /* merking er en påminnelse, ikke kritisk */ });
            }

            await lastListe();
        }

        let mellomlagredeMap = {};
        let behandlingerMap = {};

        async function lastListe() {
            visStatus('Laster…');
            try {
                // Vis skjematypene så snart de er hentet — ikke vent på tilleggs-info
                alle = await api.get('/api/skjematyper');
                oppdaterFaseFilter();
                filtrer();
                // Hent tilleggs-info i bakgrunnen og re-render når klart
                api.get('/api/mine-mellomlagrede').catch(() => ({})).then(m => {
                    mellomlagredeMap = m || {};
                    filtrer();
                });
                api.get('/api/mine-behandlinger').catch(() => ({})).then(async b => {
                    behandlingerMap = b || {};
                    // Inkluder skjematyper hvor bruker er behandler men ikke publikum/eier —
                    // disse mangler i alle-listen fordi mineSkjematyper kun sjekker de to.
                    const kjente = new Set(alle.map(t => String(t.Skjematype_id)));
                    const manglende = Object.keys(behandlingerMap).filter(id => !kjente.has(String(id)));
                    if (manglende.length > 0) {
                        const nye = await Promise.all(manglende.map(id =>
                            api.get(`/api/skjematyper/${encodeURIComponent(id)}`).catch(() => null)
                        ));
                        for (const st of nye) {
                            if (!st) continue;
                            // Mapper skjematype-JSON til kort-format (samme struktur som mineSkjematyper returnerer)
                            const data = st;
                            alle.push({
                                Skjematype_id: data.Skjematype_id,
                                Skjema_navn: data.Skjema_navn || '',
                                Skjema_forklaring: data.Skjemaforklaring
                                    ? { Verdi: data.Skjemaforklaring.Innhold || '', Format: data.Skjemaforklaring.Format || 'Tekst' }
                                    : null,
                                Logo_url: data.Logo_url || '',
                                Fase: data.Fase || 'Produksjon',
                                ErEier: false,
                                // Lagt til fordi bruker er BEHANDLER. Da er hen
                                // verken eier eller publikum.
                                ErOppfortSomEier: false,
                                KanFylle: false,
                                ErIPeriode: true,
                                Tilgjengelighetsperioder: data.Tilgjengelighetsperioder || [],
                                AlleTilgang: data.Publikum?.AlleTilgang === true,
                                ErKunBehandler: true // markør — brukes for å skjule Rediger osv.
                            });
                        }
                    }
                    filtrer();
                });
            } catch (e) {
                visStatus('Kunne ikke hente skjematyper: ' + e.message, 'feil');
            }
        }

        function oppdaterFaseFilter() {
            // Vis kun toggler for faser bruker faktisk har skjematyper i.
            const faserSomFinnes = new Set(alle.map(t => t.Fase || 'Produksjon'));
            const harFlereFaser = faserSomFinnes.size > 1 || faserSomFinnes.has('Utvikling');

            // Eierbryteren vises bare til den som faktisk eier noe. For alle
            // andre ville den bare kunnet tømme lista, og en bryter som bare
            // har én nyttig stilling er en bryter folk prøver én gang.
            //
            // `ErOppfortSomEier`, ikke `ErEier`: den siste er true for admin på
            // alt, og bryteren ville vært uten virkning for nettopp den som har
            // flest kort å se gjennom.
            const eierNoe = alle.some(t => t.ErOppfortSomEier === true);
            const eierToggle = document.getElementById('eier-toggle');
            const eierSkille = document.getElementById('eier-skille');
            if (eierToggle) eierToggle.style.display = eierNoe ? '' : 'none';
            if (eierSkille) eierSkille.style.display = eierNoe && harFlereFaser ? '' : 'none';

            // Raden skjules bare når den ville vært tom.
            if (!harFlereFaser && !eierNoe) {
                document.getElementById('fase-filter-rad').style.display = 'none';
                return;
            }
            document.getElementById('fase-filter-rad').style.display = '';
            ['Produksjon', 'Utvikling'].forEach(fase => {
                const t = document.getElementById(`fase-toggle-${fase}`);
                if (t) t.style.display = harFlereFaser && faserSomFinnes.has(fase) ? '' : 'none';
            });
            gjenopprettEierValg(eierNoe);
            // Gjenopprett lagret valg — men bare for faser som faktisk finnes
            try {
                const raw = localStorage.getItem(FASER_LS_NOKKEL);
                if (raw) {
                    const lagret = JSON.parse(raw);
                    if (Array.isArray(lagret)) {
                        const gyldige = lagret.filter(f => faserSomFinnes.has(f));
                        if (gyldige.length > 0) {
                            ['Produksjon', 'Utvikling'].forEach(fase => {
                                const cb = document.querySelector(`#fase-toggle-${fase} input[type="checkbox"]`);
                                if (cb) cb.checked = gyldige.includes(fase);
                            });
                        }
                    }
                }
            } catch { /* Safari private mode etc. */ }
            // Synk visuell aktiv-tilstand
            document.querySelectorAll('.fase-toggle').forEach(t => {
                const cb = t.querySelector('input[type="checkbox"]');
                t.classList.toggle('aktiv', cb && cb.checked);
            });
        }

        function visStatus(tekst, klasse) {
            const el = document.getElementById('status');
            el.textContent = tekst;
            el.className = 'status-melding' + (klasse ? ' ' + klasse : '');
            el.style.display = tekst ? 'block' : 'none';
        }

        const FASER_LS_NOKKEL = 'velgskjema-faser';
        const KUN_EIER_LS_NOKKEL = 'velgskjema-kun-eier';

        /**
         * Er bryteren på?
         *
         * Leses fra avkrysningsboksen, ikke fra en variabel ved siden av —
         * da kan de to ikke bli uenige. Er bryteren skjult (brukeren eier
         * ingenting), er svaret nei uansett hva som måtte ligge lagret: ellers
         * ville en gammel verdi i localStorage gitt en tom liste uten noe
         * synlig å slå av.
         */
        function kunEierValgt() {
            const toggle = document.getElementById('eier-toggle');
            if (!toggle || toggle.style.display === 'none') return false;
            const cb = toggle.querySelector('input[type="checkbox"]');
            return !!(cb && cb.checked);
        }

        function gjenopprettEierValg(eierNoe) {
            const toggle = document.getElementById('eier-toggle');
            if (!toggle) return;
            const cb = toggle.querySelector('input[type="checkbox"]');
            if (!cb) return;
            let lagret = false;
            try { lagret = localStorage.getItem(KUN_EIER_LS_NOKKEL) === 'ja'; } catch { /* privat modus */ }
            cb.checked = eierNoe && lagret;
            toggle.classList.toggle('aktiv', cb.checked);
        }

        window.onEierEndret = () => {
            const toggle = document.getElementById('eier-toggle');
            const cb = toggle?.querySelector('input[type="checkbox"]');
            toggle?.classList.toggle('aktiv', !!cb?.checked);
            try { localStorage.setItem(KUN_EIER_LS_NOKKEL, cb?.checked ? 'ja' : 'nei'); } catch { /* privat modus */ }
            filtrer();
        };

        function lesValgteFaser() {
            const valgte = [...document.querySelectorAll('#fase-filter-rad input[type="checkbox"]:checked')].map(cb => cb.value);
            // Ingen valgt → default Produksjon så lista ikke blir tom
            return valgte.length > 0 ? valgte : ['Produksjon'];
        }

        window.onFaseEndret = () => {
            // Synk visuell aktiv-tilstand på togglene
            document.querySelectorAll('.fase-toggle').forEach(t => {
                const cb = t.querySelector('input[type="checkbox"]');
                t.classList.toggle('aktiv', cb && cb.checked);
            });
            // Lagre i localStorage
            try {
                const valgte = [...document.querySelectorAll('#fase-filter-rad input[type="checkbox"]:checked')].map(cb => cb.value);
                localStorage.setItem(FASER_LS_NOKKEL, JSON.stringify(valgte));
            } catch { /* Safari private mode etc. */ }
            filtrer();
        };

        /**
         * Skal dette kortet vises?
         *
         * Skilt ut fra `filtrer()` for å kunne prøves uten DOM — samme grunn
         * som `bannerTekst` i admin.html. Tre uavhengige kriterier, og det er
         * nettopp sammenstillingen av dem som er verdt å teste: et søk som
         * treffer skal ikke overstyre eierbryteren.
         *
         * `ErOppfortSomEier`, ikke `ErEier`: den siste er true for admin på alt
         * (den styrer knappene på kortet), og bryteren ville vært uten virkning
         * for den som har flest kort å se gjennom.
         */
        function skalVises(t, { faser, kunEier, ord }) {
            if (!faser.includes(t.Fase || 'Produksjon')) return false;
            if (kunEier && t.ErOppfortSomEier !== true) return false;
            if (ord.length === 0) return true;
            // Hvert ord må treffe noe, så «evaluering 14» finner skjema 14
            // og ikke alle som har ordet «evaluering» i seg.
            const navn = (t.Skjema_navn || '').toLowerCase();
            const forklaring = (t.Skjema_forklaring?.Verdi || '').toLowerCase();
            const id = String(t.Skjematype_id || '');
            return ord.every(o =>
                navn.includes(o)
                || forklaring.includes(o)
                // ID-en matches fra starten, ikke som delstreng: søk på «14»
                // skal ikke dra med seg 114 og 214.
                || id.startsWith(o)
            );
        }

        window.filtrer = () => {
            const q = document.getElementById('sok').value.trim().toLowerCase();
            const kriterier = {
                faser: lesValgteFaser(),
                kunEier: kunEierValgt(),
                ord: q.split(/\s+/).filter(Boolean)
            };
            render(alle.filter(t => skalVises(t, kriterier)));
        };

        function render(liste) {
            const container = document.getElementById('liste');
            if (!liste || liste.length === 0) {
                container.innerHTML = '<div class="ingen-treff">Ingen skjematyper å vise.</div>';
                visStatus('', '');
                return;
            }
            visStatus('', '');
            container.innerHTML = liste.map(t => kortHtml(t)).join('');
        }

        function kortHtml(t) {
            const fase = (t.Fase || 'Produksjon').toLowerCase();
            const forklaringHtml = t.Skjema_forklaring?.Format === 'Markdown'
                ? parseMdSimpel(t.Skjema_forklaring.Verdi || '')
                : escapeHtml(t.Skjema_forklaring?.Verdi || '');
            const forklaring = t.Skjema_forklaring?.Verdi
                ? `<div class="forklaring">${forklaringHtml}</div>`
                : '';
            const utenforPeriode = (t.KanFylle === false && t.ErIPeriode === false);
            const periodeAdvarsel = utenforPeriode && !t.ErEier
                ? '<div style="margin-top: 8px; padding: 8px 12px; background: rgba(255,149,0,0.1); border-radius: 6px; font-size: 13px; color: #cc7a00;">Utenfor tilgjengelighetsperioden — kan ikke fylles ut nå.</div>'
                : '';
            const knapper = [];
            if (t.KanFylle) {
                knapper.push(`<a class="knapp primær" href="/index.html?skjematype_id=${encodeURIComponent(t.Skjematype_id)}">Fyll ut nytt</a>`);
            }
            if (t.ErEier) {
                knapper.push(`<a class="knapp sekundær" href="/register.html?skjematype_id=${encodeURIComponent(t.Skjematype_id)}">Register</a>`);
                knapper.push(`<a class="knapp sekundær" href="/register.html?skjematype_id=${encodeURIComponent(t.Skjematype_id)}&status=5">Arkiv</a>`);
                knapper.push(`<a class="knapp sekundær" href="/datauttrekk.html?skjematype_id=${encodeURIComponent(t.Skjematype_id)}">Datauttrekk</a>`);
                knapper.push(`<a class="knapp sekundær" href="/editor.html?skjematype_id=${encodeURIComponent(t.Skjematype_id)}">Rediger</a>`);
                if (kanLageRapport) {
                    // «Rapporter», ikke «Ny rapport»: den som har laget én
                    // rapport på skjematypen vil som regel åpne den igjen, ikke
                    // lage en til. Finnes ingen, sender rapportsiden deg rett
                    // videre til en ny.
                    knapper.push(`<a class="knapp sekundær" href="/velgrapporttype.html?skjematype_id=${encodeURIComponent(t.Skjematype_id)}" title="Rapporter med denne skjematypen som kilde">📊 Rapporter</a>`);
                }
            }
            const knapperadHtml = knapper.length
                ? `<div class="knapperad">${knapper.join('')}</div>`
                : '<div class="knapperad"><em style="color: var(--text-secondary); font-size: 13px;">Ingen tilgjengelige handlinger</em></div>';

            // Behandlinger for meg på denne skjematypen (kan gjelde alle brukere som er behandler)
            let behandlingHtml = '';
            const mineBeh = behandlingerMap[t.Skjematype_id] || [];
            if (mineBeh.length > 0) {
                behandlingHtml = `
                    <div style="margin-top: 10px; padding: 10px 12px; background: rgba(10, 132, 255, 0.08); border-left: 3px solid var(--accent); border-radius: 6px; font-size: 13px;">
                        <div style="font-weight: 600; margin-bottom: 6px;">Til behandling (${mineBeh.length}):</div>
                        ${mineBeh.map(b => {
                            const dato = formaterDato(b.Sist_endret);
                            const stegTekst = (b.Aktive_steg || []).map(s => `steg ${s.Steg}: ${s.Stegnavn}`).join(', ');
                            return `<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 4px 0;">
                                <span style="color: var(--text-secondary);">#${escapeHtml(b.Skjema_id)} · ${escapeHtml(stegTekst)} · ${escapeHtml(dato)}</span>
                                <a class="knapp primær" style="padding: 4px 10px; font-size: 12px;" href="/evaluering.html?skjematype_id=${encodeURIComponent(t.Skjematype_id)}&skjema_id=${encodeURIComponent(b.Skjema_id)}">Behandle</a>
                            </div>`;
                        }).join('')}
                    </div>
                `;
            }

            // Mellomlagrede utkast + til revidering — kun hvis bruker kan fylle ut
            let mellomlagretHtml = '';
            if (t.KanFylle) {
                const mineAlle = mellomlagredeMap[t.Skjematype_id] || [];
                const mellom = mineAlle.filter(m => (m.Skjema_status || 1) === 1);
                const revidering = mineAlle.filter(m => (m.Skjema_status || 0) === 3);

                if (revidering.length > 0) {
                    mellomlagretHtml += `
                        <div style="margin-top: 10px; padding: 10px 12px; background: rgba(175, 82, 222, 0.1); border-left: 3px solid #af52de; border-radius: 6px; font-size: 13px;">
                            <div style="font-weight: 600; margin-bottom: 6px; color: #af52de;">Til revidering (${revidering.length}):</div>
                            ${revidering.map(m => {
                                const dato = formaterDato(m.Sist_endret);
                                return `<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 4px 0;">
                                    <span style="color: var(--text-secondary);">#${escapeHtml(m.Skjema_id)} · ${escapeHtml(dato)}</span>
                                    <a class="knapp primær" style="padding: 4px 10px; font-size: 12px;" href="/index.html?skjematype_id=${encodeURIComponent(t.Skjematype_id)}&skjema_id=${encodeURIComponent(m.Skjema_id)}">Revider</a>
                                </div>`;
                            }).join('')}
                        </div>
                    `;
                }
                if (mellom.length > 0) {
                    mellomlagretHtml += `
                        <div style="margin-top: 10px; padding: 10px 12px; background: rgba(255, 149, 0, 0.08); border-left: 3px solid var(--badge-utvikling, #ff9500); border-radius: 6px; font-size: 13px;">
                            <div style="font-weight: 600; margin-bottom: 6px;">Påbegynte utkast (${mellom.length}):</div>
                            ${mellom.map(m => {
                                const dato = formaterDato(m.Sist_endret);
                                return `<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 4px 0;">
                                    <span style="color: var(--text-secondary);">#${escapeHtml(m.Skjema_id)} · endret ${escapeHtml(dato)}</span>
                                    <a class="knapp sekundær" style="padding: 4px 10px; font-size: 12px;" href="/index.html?skjematype_id=${encodeURIComponent(t.Skjematype_id)}&skjema_id=${encodeURIComponent(m.Skjema_id)}">Fortsett</a>
                                </div>`;
                            }).join('')}
                        </div>
                    `;
                }
            }

            const kollapsetKlasse = erKollapset(t.Skjematype_id) ? ' kollapset' : '';
            const antBeh = (behandlingerMap[t.Skjematype_id] || []).length;
            const behBadge = antBeh > 0
                ? `<span class="fase-badge" style="background: #ff3b30;" title="${antBeh} skjema venter på deg som behandler">🔔 ${antBeh}</span>`
                : '';
            return `
                <div class="skjematype-kort${kollapsetKlasse}" data-skjematype-id="${escapeAttr(String(t.Skjematype_id))}">
                    <div class="kort-tittelrad" onclick="toggleKort('${escapeAttr(String(t.Skjematype_id))}')">
                        <h2 class="kort-tittel">
                            <span class="kort-kollaps-pil">▼</span>
                            <span class="kort-id" title="Skjematype-ID">${escapeHtml(String(t.Skjematype_id))}</span>
                            ${escapeHtml(t.Skjema_navn || '(uten navn)')}
                        </h2>
                        <div style="display: flex; gap: 6px; align-items: center; flex-wrap: wrap;">
                            ${behBadge}
                            ${manglerNullpunkt(t) ? `<span class="fase-badge" style="background: #ff9500;"
                                title="Nullpunktdefinisjon (baseline) for gevinstoppfølging er ikke registrert for denne skjematypen. Vises bare for eiere og admin.">📉 Mangler nullpunkt</span>` : ''}
                            ${t.AlleTilgang ? '<span class="fase-badge" style="background: #34c759;" title="Alle innloggede kan fylle ut">Åpen for alle</span>' : ''}
                            <span class="fase-badge ${fase}">${escapeHtml(t.Fase || 'Produksjon')}</span>
                        </div>
                    </div>
                    <div class="kort-innhold">
                        ${forklaring}
                        ${periodeAdvarsel}
                        ${knapperadHtml}
                        ${behandlingHtml}
                        ${mellomlagretHtml}
                    </div>
                </div>
            `;
        }

        // ---- Kollaps-state per skjematype i localStorage ----
        const KOLLAPS_NOKKEL = 'velgskjematype.kollapset';
        function lesKollapsSett() {
            try { return new Set(JSON.parse(localStorage.getItem(KOLLAPS_NOKKEL) || '[]')); }
            catch (_) { return new Set(); }
        }
        function skrivKollapsSett(sett) {
            try { localStorage.setItem(KOLLAPS_NOKKEL, JSON.stringify([...sett])); } catch (_) {}
        }
        function erKollapset(id) { return lesKollapsSett().has(String(id)); }
        window.toggleKort = (id) => {
            const el = document.querySelector(`.skjematype-kort[data-skjematype-id="${id}"]`);
            if (!el) return;
            const sett = lesKollapsSett();
            if (el.classList.toggle('kollapset')) sett.add(String(id));
            else sett.delete(String(id));
            skrivKollapsSett(sett);
        };
        window.apneAlleKort = () => {
            document.querySelectorAll('.skjematype-kort').forEach(el => el.classList.remove('kollapset'));
            skrivKollapsSett(new Set());
        };
        window.skjulAlleKort = () => {
            const sett = new Set();
            document.querySelectorAll('.skjematype-kort').forEach(el => {
                el.classList.add('kollapset');
                const id = el.dataset.skjematypeId;
                if (id) sett.add(id);
            });
            skrivKollapsSett(sett);
        };
        function escapeAttr(s) {
            return String(s ?? '').replace(/"/g, '&quot;').replace(/'/g, "\\'");
        }

        function formaterDato(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            if (isNaN(d)) return iso;
            const pad = n => String(n).padStart(2, '0');
            return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}. ${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }

        function escapeHtml(s) {
            return String(s ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        // Minimal Markdown for kortvisning — bare bold/italic/lenker
        function parseMdSimpel(t) {
            let s = escapeHtml(t);
            s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            s = s.replace(/\*(.+?)\*/g, '<em>$1</em>');
            s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
            s = s.replace(/\n/g, '<br>');
            return s;
        }

        init();
    </script>
    <script type="module" src="/js/systemtopp.js"></script>
    <script type="module" src="/js/faner.js"></script>
</body>
</html>
