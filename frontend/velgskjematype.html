<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velg skjema</title>
    <script>
        (function() {
            const t = localStorage.getItem('theme');
            if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        })();
    </script>
    <style>
        :root {
            --bg-page: #e8edf2;
            --bg-container: rgba(255, 255, 255, 0.72);
            --bg-section: rgba(255, 255, 255, 0.55);
            --bg-input: rgba(255, 255, 255, 0.7);
            --text-primary: #1c1c1e;
            --text-secondary: #6e6e73;
            --text-heading: #0a84ff;
            --border-color: rgba(0, 0, 0, 0.08);
            --shadow: 0 4px 30px rgba(0, 0, 0, 0.06);
            --shadow-sm: 0 1px 6px rgba(0, 0, 0, 0.04);
            --accent: #0a84ff;
            --accent-light: rgba(10, 132, 255, 0.12);
            --accent-medium: rgba(10, 132, 255, 0.18);
            --glass-blur: blur(20px);
            --radius-sm: 10px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --radius-xl: 24px;
            --forklaring-bg: rgba(10, 132, 255, 0.08);
            --forklaring-border: #0a84ff;
            --badge-utvikling: #ff9500;
            --badge-test: #af52de;
            --badge-produksjon: #34c759;
            --badge-mal: #8e8e93;
        }

        [data-theme="dark"] {
            --bg-page: #0d1117;
            --bg-container: rgba(30, 35, 45, 0.72);
            --bg-section: rgba(40, 45, 60, 0.55);
            --bg-input: rgba(50, 55, 70, 0.6);
            --text-primary: #f0f0f5;
            --text-secondary: #8e8e93;
            --text-heading: #64b5f6;
            --border-color: rgba(255, 255, 255, 0.08);
            --shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
            --shadow-sm: 0 1px 6px rgba(0, 0, 0, 0.15);
            --accent-light: rgba(10, 132, 255, 0.2);
            --accent-medium: rgba(10, 132, 255, 0.25);
            --forklaring-bg: rgba(10, 132, 255, 0.1);
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-primary);
            margin: 0;
            padding: 24px;
            line-height: 1.6;
            transition: background-color 0.4s, color 0.4s;
            -webkit-font-smoothing: antialiased;
        }

        .theme-toggle {
            position: fixed;
            top: 16px;
            right: 20px;
            z-index: 10000;
            background: var(--bg-container);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: var(--shadow);
            transition: transform 0.2s;
        }
        .theme-toggle:hover { transform: scale(1.08); }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--bg-container);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            padding: 36px;
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        .topp {
            display: flex;
            align-items: center;
            gap: 16px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 8px;
        }

        h1 {
            color: var(--text-primary);
            font-weight: 700;
            font-size: 1.8em;
            letter-spacing: -0.02em;
            margin: 0;
            flex: 1;
        }

        .brukerinfo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .brukerinfo .upn { font-weight: 500; color: var(--text-primary); }

        .link-knapp {
            background: none;
            border: 0;
            color: var(--accent);
            font-size: 13px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: background 0.15s;
        }
        .link-knapp:hover { background: var(--accent-light); }

        .undertittel {
            color: var(--text-secondary);
            font-size: 14px;
            margin: 16px 0 20px;
        }

        .sokefelt-rad {
            position: relative;
            margin-bottom: 18px;
        }
        .sokefelt {
            width: 100%;
            padding: 12px 40px 12px 40px;
            font-size: 15px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            background: var(--bg-input);
            color: var(--text-primary);
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .sokefelt:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-light);
        }
        .sokefelt-ikon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            pointer-events: none;
        }

        .status-melding {
            padding: 14px 18px;
            border-radius: var(--radius-md);
            background: var(--bg-section);
            color: var(--text-secondary);
            text-align: center;
            font-size: 14px;
        }
        .status-melding.feil { color: #d9534f; background: rgba(217, 83, 79, 0.1); }

        .skjematype-liste {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .skjematype-kort {
            background: var(--bg-section);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 18px 20px;
            box-shadow: var(--shadow-sm);
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .skjematype-kort:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow);
        }

        .kort-tittelrad {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 6px;
        }
        .kort-tittel {
            font-size: 17px;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0;
        }

        .fase-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            color: white;
            white-space: nowrap;
        }
        .fase-badge.produksjon { background: var(--badge-produksjon); }
        .fase-badge.utvikling  { background: var(--badge-utvikling); }
        .fase-badge.test       { background: var(--badge-test); }
        .fase-badge.mal        { background: var(--badge-mal); }

        .forklaring {
            background: var(--forklaring-bg);
            border-left: 3px solid var(--forklaring-border);
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 14px;
            margin: 8px 0 14px;
        }

        .knapperad {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .knapp {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: 0;
            border-radius: var(--radius-sm);
            padding: 9px 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: filter 0.15s, background 0.15s;
        }
        .knapp.primær {
            background: var(--accent);
            color: white;
        }
        .knapp.primær:hover { filter: brightness(1.1); }
        .knapp.sekundær {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
        }
        .knapp.sekundær:hover { background: var(--accent-light); }

        .ingen-treff {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn">🌙</button>

    <div class="container">
        <div class="topp">
            <h1>Velg skjema</h1>
            <div class="brukerinfo">
                <span class="upn" id="upn">…</span>
                <button class="link-knapp" onclick="logUt()">Logg ut</button>
            </div>
        </div>

        <p class="undertittel">Skjematyper du har tilgang til.</p>

        <div class="sokefelt-rad">
            <span class="sokefelt-ikon">🔍</span>
            <input type="text" class="sokefelt" id="sok" placeholder="Søk etter skjematype…" oninput="filtrer()">
        </div>

        <div id="admin-verktoy" style="display: none; margin-bottom: 18px; padding: 12px 16px; background: var(--forklaring-bg); border-radius: var(--radius-md); font-size: 13px; display: none; flex-wrap: wrap; gap: 10px; align-items: center;">
            <strong style="color: var(--text-heading);">Admin:</strong>
            <a class="knapp primær" style="padding: 6px 14px; font-size: 13px; text-decoration: none;" href="/editor.html">+ Ny skjematype</a>
            <button class="knapp sekundær" style="padding: 6px 12px; font-size: 13px;" onclick="seed()">Seed eksempler</button>
            <button class="knapp sekundær" style="padding: 6px 12px; font-size: 13px;" onclick="seedPostnumre()">Seed postnumre</button>
            <span id="admin-status" style="color: var(--text-secondary);"></span>
        </div>

        <div id="status" class="status-melding">Laster…</div>
        <div id="liste" class="skjematype-liste"></div>
    </div>

    <script type="module">
        import { CONFIG } from './js/config.js';
        import { api } from './js/api-client.js';
        import { hentInnloggetBruker, logUt as authLogUt } from './js/auth.js';

        let alle = [];

        window.toggleTheme = () => {
            const root = document.documentElement;
            const ny = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            root.setAttribute('data-theme', ny);
            localStorage.setItem('theme', ny);
            document.getElementById('theme-btn').textContent = ny === 'dark' ? '☀️' : '🌙';
        };
        document.getElementById('theme-btn').textContent =
            document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';

        window.logUt = () => authLogUt('/');

        async function init() {
            const bruker = await hentInnloggetBruker();
            if (!bruker) {
                window.location.href = '/.auth/login/aad?post_login_redirect_uri=' + encodeURIComponent(window.location.pathname);
                return;
            }
            document.getElementById('upn').textContent = bruker.userDetails;
            document.title = `Velg skjema — ${CONFIG.APP_TITTEL || ''}`;

            // Hent admin-status via /api/whoami (basert på ADMIN_UPNS-env-var i backend)
            try {
                const meg = await api.get('/api/whoami');
                if (meg.erAdmin) {
                    document.getElementById('admin-verktoy').style.display = 'block';
                }
            } catch (_) { /* ikke kritisk */ }

            await lastListe();
        }

        async function lastListe() {
            visStatus('Laster…');
            try {
                alle = await api.get('/api/skjematyper');
                render(alle);
            } catch (e) {
                visStatus('Kunne ikke hente skjematyper: ' + e.message, 'feil');
            }
        }

        window.seedPostnumre = async () => {
            const statusEl = document.getElementById('admin-status');
            statusEl.textContent = 'Seeder postnumre…';
            statusEl.style.color = 'var(--text-secondary)';
            try {
                const svar = await api.post('/api/postnumre/seed', {});
                statusEl.textContent = `${svar.antall} postnumre lagt inn`;
                statusEl.style.color = 'var(--badge-produksjon)';
            } catch (e) {
                statusEl.textContent = 'Feil: ' + e.message;
                statusEl.style.color = '#d9534f';
            }
        };

        window.seed = async () => {
            const statusEl = document.getElementById('admin-status');
            statusEl.textContent = 'Seeder…';
            statusEl.style.color = 'var(--text-secondary)';
            try {
                const svar = await api.post('/api/seed-eksempel', {});
                statusEl.textContent = `Seeding OK — ${svar.antall} skjematyper (id ${svar.ider.join(', ')})`;
                statusEl.style.color = 'var(--badge-produksjon)';
                await lastListe();
            } catch (e) {
                statusEl.textContent = 'Seed feilet: ' + e.message;
                statusEl.style.color = '#d9534f';
            }
        };

        function visStatus(tekst, klasse) {
            const el = document.getElementById('status');
            el.textContent = tekst;
            el.className = 'status-melding' + (klasse ? ' ' + klasse : '');
            el.style.display = tekst ? 'block' : 'none';
        }

        window.filtrer = () => {
            const q = document.getElementById('sok').value.trim().toLowerCase();
            const filtrert = q === ''
                ? alle
                : alle.filter(t =>
                    (t.Skjema_navn || '').toLowerCase().includes(q)
                    || (t.Skjema_forklaring?.Verdi || '').toLowerCase().includes(q)
                );
            render(filtrert);
        };

        function render(liste) {
            const container = document.getElementById('liste');
            if (!liste || liste.length === 0) {
                container.innerHTML = '<div class="ingen-treff">Ingen skjematyper å vise.</div>';
                visStatus('', '');
                return;
            }
            visStatus('', '');
            container.innerHTML = liste.map(t => kortHtml(t)).join('');
        }

        function kortHtml(t) {
            const fase = (t.Fase || 'Produksjon').toLowerCase();
            const forklaring = t.Skjema_forklaring?.Verdi
                ? `<div class="forklaring">${escapeHtml(t.Skjema_forklaring.Verdi)}</div>`
                : '';
            const knapper = [];
            if (t.KanFylle) {
                knapper.push(`<a class="knapp primær" href="/index.html?skjematype_id=${encodeURIComponent(t.Skjematype_id)}">Fyll ut nytt</a>`);
            }
            if (t.ErEier) {
                knapper.push(`<a class="knapp sekundær" href="/register.html?skjematype_id=${encodeURIComponent(t.Skjematype_id)}">Register</a>`);
                knapper.push(`<a class="knapp sekundær" href="/editor.html?skjematype_id=${encodeURIComponent(t.Skjematype_id)}">Rediger</a>`);
            }
            const knapperadHtml = knapper.length
                ? `<div class="knapperad">${knapper.join('')}</div>`
                : '<div class="knapperad"><em style="color: var(--text-secondary); font-size: 13px;">Ingen tilgjengelige handlinger</em></div>';

            return `
                <div class="skjematype-kort">
                    <div class="kort-tittelrad">
                        <h2 class="kort-tittel">${escapeHtml(t.Skjema_navn || '(uten navn)')}</h2>
                        <span class="fase-badge ${fase}">${escapeHtml(t.Fase || 'Produksjon')}</span>
                    </div>
                    ${forklaring}
                    ${knapperadHtml}
                </div>
            `;
        }

        function escapeHtml(s) {
            return String(s ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        init();
    </script>
</body>
</html>
