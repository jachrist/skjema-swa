<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skjema</title>
    <script>
        (function() {
            const t = localStorage.getItem('theme');
            if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        })();
    </script>
    <style>
        :root {
            --bg-page: #e8edf2;
            --bg-container: rgba(255, 255, 255, 0.85);
            --bg-section: rgba(255, 255, 255, 0.55);
            --bg-input: white;
            --text-primary: #1c1c1e;
            --text-secondary: #6e6e73;
            --text-heading: #0a84ff;
            --border-color: rgba(0, 0, 0, 0.1);
            --input-border: #d1d1d6;
            --shadow: 0 4px 30px rgba(0, 0, 0, 0.06);
            --shadow-sm: 0 1px 6px rgba(0, 0, 0, 0.04);
            --accent: #0a84ff;
            --accent-light: rgba(10, 132, 255, 0.12);
            --glass-blur: blur(20px);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 18px;
            --radius-xl: 24px;
            --oblig: #ff3b30;
            --success: #34c759;
            --error: #ff3b30;
        }
        [data-theme="dark"] {
            --bg-page: #0d1117;
            --bg-container: rgba(30, 35, 45, 0.85);
            --bg-section: rgba(40, 45, 60, 0.55);
            --bg-input: #1c2028;
            --text-primary: #f0f0f5;
            --text-secondary: #8e8e93;
            --text-heading: #64b5f6;
            --border-color: rgba(255, 255, 255, 0.1);
            --input-border: #3a3a5a;
            --shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
        }

        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-page);
            color: var(--text-primary);
            margin: 0;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--bg-container);
            backdrop-filter: var(--glass-blur);
            padding: 32px;
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        .topplinje {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        h1 {
            font-size: 1.7em;
            font-weight: 700;
            margin: 0;
            letter-spacing: -0.02em;
        }
        .brukerinfo {
            font-size: 13px;
            color: var(--text-secondary);
        }
        .brukerinfo .upn { font-weight: 500; color: var(--text-primary); }

        .status-melding {
            padding: 14px 18px;
            border-radius: var(--radius-md);
            margin: 20px 0;
            text-align: center;
        }
        .status-melding.info { background: var(--accent-light); color: var(--text-heading); }
        .status-melding.feil { background: rgba(255, 59, 48, 0.1); color: var(--error); }
        .md-lenke { color: var(--accent); text-decoration: underline; }
        .md-lenke:hover { opacity: 0.8; }

        .seksjon {
            margin-top: 24px;
            padding: 20px 24px;
            background: var(--bg-section);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
        }
        .seksjon-tittel {
            font-size: 15px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin: 0 0 16px 0;
        }

        .felt {
            margin-bottom: 18px;
        }
        .felt-label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 6px;
            color: var(--text-primary);
        }
        .felt-nummer {
            display: inline-block;
            min-width: 24px;
            color: var(--text-secondary);
            font-weight: 500;
        }
        .oblig-markering {
            color: var(--oblig);
            margin-left: 4px;
        }
        .felt-undertittel {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="number"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 10px 12px;
            font-size: 15px;
            border: 1px solid var(--input-border);
            border-radius: var(--radius-sm);
            background: var(--bg-input);
            color: var(--text-primary);
            font-family: inherit;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-light);
        }
        textarea { min-height: 100px; resize: vertical; }

        .flervalg-knapper {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .flervalg-knapp {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border: 1px solid var(--input-border);
            border-radius: var(--radius-sm);
            background: var(--bg-input);
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
            font-size: 14px;
        }
        .flervalg-knapp:hover { background: var(--accent-light); }
        .flervalg-knapp.selected {
            border-color: var(--accent);
            background: var(--accent-light);
            color: var(--accent);
            font-weight: 600;
        }
        .flervalg-knapp input { display: none; }

        .skala {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: flex-start;
        }
        .skala-valg {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 12px;
            min-width: 56px;
            border: 1px solid var(--input-border);
            border-radius: var(--radius-sm);
            background: var(--bg-input);
            cursor: pointer;
            font-size: 14px;
            text-align: center;
        }
        .skala-valg:hover { background: var(--accent-light); }
        .skala-valg:has(input:checked) {
            border-color: var(--accent);
            background: var(--accent-light);
            color: var(--accent);
            font-weight: 600;
        }
        .skala-valg input { margin: 0; }
        .skala-nummer { font-weight: 600; font-size: 15px; }
        .skala-tekst { font-size: 12px; color: var(--text-secondary); line-height: 1.2; }
        .skala-valg:has(input:checked) .skala-tekst { color: var(--accent); }

        .informasjon {
            padding: 12px 16px;
            background: var(--accent-light);
            border-left: 3px solid var(--accent);
            border-radius: var(--radius-sm);
            font-size: 14px;
        }

        .felt-feilmelding {
            color: var(--error);
            font-size: 13px;
            margin-top: 4px;
            display: none;
        }
        .felt.har-feil .felt-feilmelding { display: block; }
        .felt.har-feil input,
        .felt.har-feil select,
        .felt.har-feil textarea {
            border-color: var(--error);
        }
        .felt.skjult, .seksjon.skjult { display: none !important; }

        .knapperad {
            margin-top: 32px;
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }
        .knapp {
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 600;
            border: 0;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-family: inherit;
            transition: filter 0.15s, background 0.15s;
        }
        .knapp.primær { background: var(--accent); color: white; }
        .knapp.primær:hover { filter: brightness(1.1); }
        .knapp.primær:disabled { opacity: 0.5; cursor: not-allowed; }
        .knapp.sekundær {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
        }
        .knapp.sekundær:hover { background: var(--accent-light); }

        .laster {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="topplinje">
            <div style="display: flex; align-items: center; gap: 14px; flex: 1;">
                <!-- Venstre for tittelen står systemmerket (js/systemtopp.js) — den plassen
                     er reservert for graderingsmerkingen og kan ikke overstyres per skjema. -->
                <h1 id="tittel" style="flex: 1;">Laster skjema…</h1>
                <img id="logo" alt="" style="display: none; max-height: 50px; max-width: 140px; object-fit: contain;">
            </div>
            <div class="brukerinfo"><span class="upn" id="upn">…</span></div>
        </div>
        <div id="forklaring"></div>
        <div id="innhold" class="laster">Henter skjemadefinisjon…</div>
    </div>

    <script type="module">
        import { CONFIG } from './js/config.js';
        import { api } from './js/api-client.js';
        import { hentInnloggetBruker } from './js/auth.js';
        import { byggEditWidget, hentSvarFraDom, svarTekstFor, valider, escapeHtml, preSubmitOpplasting, samleSeksjonerFraDom, renderTekst, renderTekstInline } from './js/felt-render.js';
        import { evaluerVilkar } from './js/vilkar.js';
        import { apneOtpModal } from './js/otp-widget.js';

        let skjematype = null;
        let skjemaId = null; // pre-generert (nytt) eller eksisterende (fortsett mellomlagret)
        let eksisterendeSkjema = null; // hvis vi henter fra fortsett
        let otpMottaker = null; // e-post eller mobilnr (for ekstern-modus)
        let otpKanal = null; // 'epost' | 'sms'
        let utsendingModus = false;
        let previewModus = false;
        let utsendingPrefilledKeys = new Set(); // "sek-felt-padded" → låst felt
        const params = new URLSearchParams(window.location.search);
        let skjematypeId = params.get('skjematype_id');
        const skjemaIdParam = params.get('skjema_id'); // satt hvis "Fortsett"
        const eksternModus = params.get('ekstern') === '1';
        const utsendingToken = params.get('utsending');
        const previewParam = params.get('preview') === '1';

        async function init() {
            if (previewParam) {
                initPreview();
                return;
            }
            if (utsendingToken) {
                await initUtsending();
                return;
            }
            if (!skjematypeId) {
                visFeil('Mangler skjematype_id i URL. Åpne skjemaet fra "Velg skjema"-siden.');
                return;
            }

            if (eksternModus) {
                await initEkstern();
                return;
            }

            const bruker = await hentInnloggetBruker();
            if (!bruker) {
                window.location.href = '/.auth/login/aad?post_login_redirect_uri=' + encodeURIComponent(window.location.pathname + window.location.search);
                return;
            }
            document.getElementById('upn').textContent = bruker.userDetails;

            try {
                skjematype = await api.get(`/api/skjematyper/${encodeURIComponent(skjematypeId)}`);
                await forbereedSkjemaId();
                rendrer();
            } catch (e) {
                visFeil('Kunne ikke laste skjemadefinisjon: ' + e.message);
            }
        }

        async function initEkstern() {
            // Anonymt: hent publikum-visning av skjematypen (fungerer bare hvis EksternTilgang=true)
            try {
                skjematype = await api.get(`/api/skjematyper/${encodeURIComponent(skjematypeId)}/publikum`);
            } catch (e) {
                visFeil('Denne skjematypen er ikke tilgjengelig for ekstern innsender.');
                return;
            }
            // Kjør OTP-widget for å verifisere kontakt
            const res = await apneOtpModal({
                tittel: `Verifiser deg for "${skjematype.Skjema_navn || 'skjema'}"`,
                tekst: 'Skriv inn mobilnummer eller e-post — vi sender en 6-sifret kode du bekrefter.',
                kanaler: ['sms', 'epost']
            });
            if (!res) {
                visFeil('Verifisering avbrutt. Åpne lenka på nytt for å prøve igjen.');
                return;
            }
            api.settHeader('x-otp-token', res.verifikasjonstoken);
            otpMottaker = res.mottaker;
            otpKanal = res.kanal;
            document.getElementById('upn').textContent = otpMottaker + ' (ekstern)';

            try {
                await forbereedSkjemaId();
                rendrer();
            } catch (e) {
                visFeil('Kunne ikke laste skjema: ' + e.message);
            }
        }

        // Preview-modus: bruker har åpnet index.html?preview=1 fra editor.
        // Skjematypen leses fra sessionStorage i stedet for fra API. Ingen
        // innsending — 'Send inn'-knappen viser en varsel-melding.
        function initPreview() {
            previewModus = true;
            // localStorage — deles på tvers av faner. Sjekk tidsstempel så vi
            // ikke bruker stale data hvis noe rart har skjedd.
            const rå = localStorage.getItem('skjematype-preview');
            const tid = Number(localStorage.getItem('skjematype-preview-tid') || 0);
            const alderMin = tid ? (Date.now() - tid) / 60000 : 999;
            if (!rå) {
                visFeil('Ingen forhåndsvisnings-data. Åpne fra editoren igjen.');
                return;
            }
            if (alderMin > 60) {
                visFeil('Forhåndsvisnings-data er over 1 time gammel. Åpne fra editoren igjen.');
                return;
            }
            try {
                skjematype = JSON.parse(rå);
            } catch (e) {
                visFeil('Kunne ikke lese forhåndsvisnings-data: ' + e.message);
                return;
            }
            document.getElementById('upn').textContent = '(forhåndsvisning — ikke innsendbar)';
            document.title = `Forhåndsvisning — ${skjematype?.Skjema_navn || ''}`;
            rendrer();
            // Overstyr knapper og handlere så bruker ikke kan sende inn
            setTimeout(() => {
                const submit = document.getElementById('submit-knapp');
                if (submit) {
                    submit.textContent = 'Forhåndsvisning — kan ikke sende inn';
                    submit.disabled = true;
                    submit.style.opacity = '0.6';
                    submit.style.cursor = 'not-allowed';
                }
                const lagre = document.getElementById('lagre-knapp');
                if (lagre) lagre.style.display = 'none';
                // Legg til en tydelig banner
                const banner = document.createElement('div');
                banner.className = 'status-melding info';
                banner.style.cssText += 'margin-bottom: 12px; font-weight: 600;';
                banner.textContent = '👁 Forhåndsvisning fra editor — endringer er ikke lagret ennå.';
                const innhold = document.getElementById('innhold');
                if (innhold && innhold.parentNode) {
                    innhold.parentNode.insertBefore(banner, innhold);
                }
            }, 50);
        }

        async function initUtsending() {
            utsendingModus = true;
            // Slå av "Lagre for senere" (utsending går rett til innsending) — vi
            // skjuler knappen etter render.
            try {
                const v = await api.get(`/api/utsending/valider?t=${encodeURIComponent(utsendingToken)}`);
                if (v.alleredeBesvart) {
                    document.getElementById('innhold').className = 'status-melding info';
                    document.getElementById('innhold').innerHTML =
                        `Denne lenken er allerede besvart. Skjema-ID: <code>${escapeHtml(v.svarSkjemaId || '')}</code>. ` +
                        `Kontakt utsteder hvis du trenger å endre svaret.`;
                    return;
                }
                skjematypeId = v.skjematypeId;
                skjematype = v.skjematype;
                if (!skjematype) {
                    visFeil('Kunne ikke laste skjemadefinisjon for utsendingen.');
                    return;
                }
                api.settHeader('x-utsending-token', utsendingToken);
                document.getElementById('upn').textContent = `${v.mottaker} (via lenke)`;

                // Prefilled kan treffe to slags felt:
                //  1) Input-felt (Tekst, Skala, Flervalg osv.) — legges i pseudo-
                //     eksisterendeSkjema så svarMap plukker det opp, og feltet
                //     låses i lasUtsendingFelter.
                //  2) Informasjon-felt — ingen input; vi overstyrer Tekst.Verdi
                //     direkte i skjematypen så info-boksen viser dynamisk tekst
                //     med sin normale styling. Format bevares (Tekst/Markdown).
                if (v.prefilled && typeof v.prefilled === 'object') {
                    const seks = new Map();
                    for (const [nokkel, sva] of Object.entries(v.prefilled)) {
                        const m = /^(\d+)-(\d+)$/.exec(nokkel);
                        if (!m) continue;
                        const sekNr = Number(m[1]);
                        const feltNr = padFelt(m[2]);
                        // Slå opp feltet i skjematypen for å avgjøre type
                        let feltDef = null;
                        for (const s of (skjematype.Seksjoner || [])) {
                            if (Number(s.Seksjon_nummer) !== sekNr) continue;
                            for (const f of (s.Felter || [])) {
                                if (padFelt(f.Nummer) === feltNr) { feltDef = f; break; }
                            }
                        }
                        if (feltDef && feltDef.Type === 'Informasjon') {
                            const verdi = Array.isArray(sva) ? sva.join('\n') : String(sva ?? '');
                            feltDef.Tekst = { Verdi: verdi, Format: feltDef.Tekst?.Format || 'Tekst' };
                            continue;
                        }
                        utsendingPrefilledKeys.add(`${sekNr}-${feltNr}`);
                        if (!seks.has(sekNr)) seks.set(sekNr, []);
                        seks.get(sekNr).push({ Nummer: feltNr, Svar: Array.isArray(sva) ? sva : [sva] });
                    }
                    eksisterendeSkjema = { Seksjoner: [...seks.entries()].map(([Nummer, Felter]) => ({ Nummer, Felter })) };
                }

                await forbereedSkjemaId();
                rendrer();
                lasUtsendingFelter();
            } catch (e) {
                visFeil('Ugyldig eller utløpt lenke: ' + e.message);
            }
        }

        // Etter render: lås prefilled felter (disable input og markér visuelt).
        function lasUtsendingFelter() {
            for (const nokkel of utsendingPrefilledKeys) {
                const [sek, felt] = nokkel.split('-'); // felt er allerede padded
                // felt.Nummer i DOM kan være "1" eller "01" avhengig av skjematype-def
                const feltEl = document.querySelector(`.seksjon[data-seksjon-nummer="${sek}"] .felt[data-felt-nummer="${felt}"]`)
                    || document.querySelector(`.seksjon[data-seksjon-nummer="${sek}"] .felt[data-felt-nummer="${String(Number(felt))}"]`);
                if (!feltEl) continue;
                const inputs = feltEl.querySelectorAll('input, select, textarea');
                if (inputs.length === 0) continue; // Informasjon-felt e.l. har ingen input — hopp over
                for (const el of inputs) {
                    el.disabled = true;
                    el.readOnly = true;
                }
                feltEl.style.opacity = '0.85';
                const merke = document.createElement('div');
                merke.style.cssText = 'font-size: 12px; color: var(--text-secondary); margin-top: 4px;';
                merke.textContent = '🔒 Forhåndsutfylt — kan ikke endres';
                feltEl.appendChild(merke);
            }
            // Skjul "Lagre for senere" — utsending er én-og-gjort
            const lagre = document.getElementById('lagre-knapp');
            if (lagre) lagre.style.display = 'none';
        }

        async function forbereedSkjemaId() {
            if (skjemaIdParam) {
                skjemaId = skjemaIdParam;
                eksisterendeSkjema = await api.get(`/api/skjemaer/${encodeURIComponent(skjematypeId)}/${encodeURIComponent(skjemaIdParam)}`);
            } else {
                try {
                    const idRes = await api.get(`/api/ny-skjema-id/${encodeURIComponent(skjematypeId)}`);
                    skjemaId = idRes.Skjema_id;
                } catch (e) {
                    console.warn('ny-skjema-id feilet:', e.message);
                }
            }
        }

        function visFeil(tekst) {
            document.getElementById('innhold').className = 'status-melding feil';
            document.getElementById('innhold').textContent = tekst;
        }

        // Normaliser feltnummer til padded to-sifret streng ("1" → "01", "01" → "01")
        function padFelt(n) { return String(Number(n) || 0).padStart(2, '0'); }

        // Bygg lookup fra eksisterende svar (ved fortsett): "sek-felt" -> array.
        // Nøkkelen er alltid padded feltnummer så oppslag er trygt uansett kilde-format.
        function bySvarMap() {
            const map = new Map();
            if (!eksisterendeSkjema?.Seksjoner) return map;
            for (const seksjon of eksisterendeSkjema.Seksjoner) {
                for (const felt of (seksjon.Felter || [])) {
                    const key = `${seksjon.Nummer}-${padFelt(felt.Nummer)}`;
                    map.set(key, felt.Svar || []);
                }
            }
            return map;
        }
        let svarMap = new Map();

        function rendrer() {
            svarMap = bySvarMap();
            document.getElementById('tittel').textContent = skjematype.Skjema_navn || 'Skjema';
            document.title = skjematype.Skjema_navn || 'Skjema';
            const logoEl = document.getElementById('logo');
            if (logoEl && skjematype.Logo_url) {
                logoEl.src = skjematype.Logo_url;
                logoEl.style.display = '';
            }

            if (skjematype.Skjemaforklaring?.Innhold) {
                document.getElementById('forklaring').innerHTML =
                    `<div class="status-melding info">${renderTekst(skjematype.Skjemaforklaring)}</div>`;
            }

            const innhold = document.getElementById('innhold');
            innhold.className = '';
            innhold.innerHTML = '';

            const form = document.createElement('form');
            form.id = 'skjema-form';
            form.onsubmit = (e) => { e.preventDefault(); submitSkjema(); };

            for (const seksjon of (skjematype.Seksjoner || [])) {
                form.appendChild(byggSeksjon(seksjon));
            }

            const knapperad = document.createElement('div');
            knapperad.className = 'knapperad';
            knapperad.innerHTML = `
                <a class="knapp sekundær" href="/velgskjematype.html">Avbryt</a>
                <button type="button" class="knapp sekundær" id="lagre-knapp" onclick="lagreForSenere()">Lagre for senere</button>
                <button type="submit" class="knapp primær" id="submit-knapp">Send inn</button>
            `;
            form.appendChild(knapperad);

            innhold.appendChild(form);

            // Lytt på alle endringer for å re-evaluere Vises/ObligatoriskHvis
            form.addEventListener('input', oppdaterVises);
            form.addEventListener('change', oppdaterVises);
            // Første evaluering (i tilfelle skjemaet har prefilled svar fra "Fortsett")
            oppdaterVises();
            // Re-fetch FasteData for felt med feltreferanser når referert felt endres
            form.addEventListener('change', reFetchFasteData);
            // Kjør én gang initielt om noen prefilled verdier finnes
            reFetchFasteData();
        }

        // Sporer siste feltverdier vi brukte for oppslag, så vi ikke re-fetches unødvendig
        const _oppslagSisteSvar = new Map();

        async function reFetchFasteData() {
            if (previewModus) return; // sessionStorage-preview har ikke skjematypeId å slå opp på
            if (!skjematype?.Seksjoner || !skjematypeId) return;
            const seksjonerMedSvar = samleSeksjonerFraDom(skjematype.Seksjoner);
            // Bygg { "sek-felt": [svar] }-map for alle utfylte felt
            const feltSvar = {};
            for (const s of seksjonerMedSvar) {
                for (const f of (s.Felter || [])) {
                    if (Array.isArray(f.Svar) && f.Svar.length > 0 && f.Svar[0] !== '') {
                        feltSvar[`${s.Seksjon_nummer}-${String(f.Nummer).padStart(2, '0')}`] = f.Svar;
                        feltSvar[`${s.Seksjon_nummer}-${Number(String(f.Nummer))}`] = f.Svar; // unpadded fallback
                        if (f.Id) feltSvar[f.Id] = f.Svar;
                    }
                }
            }
            for (const seksjon of skjematype.Seksjoner) {
                for (const felt of (seksjon.Felter || [])) {
                    if (!felt.FasteData) continue;
                    const refs = fangeFeltref(felt.FasteData);
                    if (refs.length === 0) continue; // ingen dynamikk
                    // Hash på referert svar for å avgjøre om vi må re-fetche
                    const hash = refs.map(r => JSON.stringify(feltSvar[r] || null)).join('|');
                    const nokkel = `${seksjon.Seksjon_nummer}-${felt.Nummer}`;
                    if (_oppslagSisteSvar.get(nokkel) === hash) continue;
                    _oppslagSisteSvar.set(nokkel, hash);
                    try {
                        const res = await api.post('/api/oppslag', {
                            skjematypeId,
                            seksjon: Number(seksjon.Seksjon_nummer),
                            felt: String(felt.Nummer),
                            feltSvar
                        });
                        felt.Valg = res.Valg || [];
                        // Re-render feltet (kun det, ikke hele skjema)
                        reRenderEttFelt(seksjon, felt);
                    } catch (e) {
                        console.warn(`oppslag for felt ${nokkel} feilet:`, e.message);
                    }
                }
            }
        }

        function fangeFeltref(fasteData) {
            const referert = new Set();
            const skann = (v) => {
                if (typeof v !== 'string') return;
                // Feltref kan skrives med krøllparenteser ({1-01}) — kompakt legacy-notasjon
                const t = v.trim();
                const b = t.startsWith('{') && t.endsWith('}') ? t.slice(1, -1).trim() : t;
                if (/^\d+-\d+$/.test(b)) {
                    const m = b.match(/^(\d+)-(\d+)$/);
                    referert.add(`${Number(m[1])}-${Number(m[2])}`);
                    referert.add(`${Number(m[1])}-${String(m[2]).padStart(2, '0')}`);
                }
            };
            if (typeof fasteData === 'string') {
                // pipe-format "Datakilde|Kolonne|Op|Verdi"
                const deler = fasteData.split('|');
                if (deler[3]) skann(deler[3].trim());
            } else if (fasteData?.EllerAv) {
                for (const g of fasteData.EllerAv) {
                    for (const b of (g.OgAv || [])) skann(b.Verdi);
                }
            }
            return [...referert];
        }

        function reRenderEttFelt(seksjon, felt) {
            const feltEl = document.querySelector(`.seksjon[data-seksjon-nummer="${seksjon.Seksjon_nummer}"] .felt[data-felt-nummer="${felt.Nummer}"]`);
            if (!feltEl) return;
            const gammelSvar = hentSvarFraDom(`felt-${seksjon.Seksjon_nummer}-${felt.Nummer}`, felt.Type);
            const nyRad = byggFelt(felt, seksjon.Seksjon_nummer, Number(feltEl.querySelector('.felt-nummer')?.textContent) || 0);
            // Bevar tidligere svar der mulig — hvis svar-verdi fortsatt finnes i nye Valg
            feltEl.replaceWith(nyRad);
        }

        function oppdaterVises() {
            if (!skjematype?.Seksjoner) return;
            const seksjonerMedSvar = samleSeksjonerFraDom(skjematype.Seksjoner);

            for (const seksjon of skjematype.Seksjoner) {
                // Seksjons-Vises
                if (seksjon.Vises) {
                    const seksjonEl = document.querySelector(`.seksjon[data-seksjon-nummer="${seksjon.Seksjon_nummer}"]`);
                    if (seksjonEl) {
                        const skalVises = evaluerVilkar(seksjon.Vises, seksjonerMedSvar);
                        seksjonEl.classList.toggle('skjult', !skalVises);
                    }
                }
                // Felt-Vises
                for (const felt of (seksjon.Felter || [])) {
                    if (!felt.Vises) continue;
                    const feltEl = document.querySelector(`.seksjon[data-seksjon-nummer="${seksjon.Seksjon_nummer}"] .felt[data-felt-nummer="${felt.Nummer}"]`);
                    if (feltEl) {
                        feltEl.classList.toggle('skjult', !evaluerVilkar(felt.Vises, seksjonerMedSvar));
                    }
                }
                // ObligatoriskHvis — toggler visning av *-markeringen
                for (const felt of (seksjon.Felter || [])) {
                    if (!felt.ObligatoriskHvis) continue;
                    const markering = document.querySelector(`.seksjon[data-seksjon-nummer="${seksjon.Seksjon_nummer}"] .felt[data-felt-nummer="${felt.Nummer}"] .oblig-markering`);
                    if (markering) {
                        markering.style.display = evaluerVilkar(felt.ObligatoriskHvis, seksjonerMedSvar) ? '' : 'none';
                    }
                }
            }
        }

        // Sjekk om et felt er "obligatorisk NÅ" (fast + betinget)
        function erObligatoriskNa(felt, seksjonerMedSvar) {
            if (felt.Obligatorisk) return true;
            if (felt.ObligatoriskHvis) return evaluerVilkar(felt.ObligatoriskHvis, seksjonerMedSvar);
            return false;
        }

        function byggSeksjon(seksjon) {
            const div = document.createElement('div');
            div.className = 'seksjon';
            div.dataset.seksjonNummer = seksjon.Seksjon_nummer;
            if (seksjon.Seksjon_overskrift) {
                const h = document.createElement('h2');
                h.className = 'seksjon-tittel';
                h.textContent = seksjon.Seksjon_overskrift;
                div.appendChild(h);
            }
            let visningsNr = 0;
            for (const felt of (seksjon.Felter || [])) {
                if (felt.Type !== 'Informasjon') visningsNr++;
                div.appendChild(byggFelt(felt, seksjon.Seksjon_nummer, visningsNr));
            }
            return div;
        }

        function byggFelt(felt, seksjonNr, visningsNr) {
            const div = document.createElement('div');
            div.className = 'felt';
            div.dataset.feltNummer = felt.Nummer;
            const feltId = `felt-${seksjonNr}-${felt.Nummer}`;

            if (felt.Type !== 'Informasjon') {
                const label = document.createElement('label');
                label.className = 'felt-label';
                label.htmlFor = feltId;
                const oblig = felt.Obligatorisk ? '<span class="oblig-markering">*</span>' : '';
                label.innerHTML = `<span class="felt-nummer">${visningsNr}.</span> ${renderTekstInline(felt.Tekst)}${oblig}`;
                div.appendChild(label);

                if (felt.Undertittel?.Verdi) {
                    const u = document.createElement('div');
                    u.className = 'felt-undertittel';
                    u.innerHTML = renderTekstInline(felt.Undertittel);
                    div.appendChild(u);
                }
            }

            const initialSvar = svarMap.get(`${seksjonNr}-${padFelt(felt.Nummer)}`) || [];
            div.appendChild(byggEditWidget(felt, feltId, initialSvar));

            const feil = document.createElement('div');
            feil.className = 'felt-feilmelding';
            feil.textContent = '';
            div.appendChild(feil);

            return div;
        }

        function samleSvar() {
            // Bruk aktuell visnings-state til å tømme skjulte felter
            const seksjonerMedSvar = samleSeksjonerFraDom(skjematype.Seksjoner);
            const svar = { Seksjoner: [] };
            for (const seksjon of (skjematype.Seksjoner || [])) {
                const seksjonSkjult = seksjon.Vises && !evaluerVilkar(seksjon.Vises, seksjonerMedSvar);
                const seksjonUt = {
                    Nummer: seksjon.Seksjon_nummer,
                    Overskrift: seksjon.Seksjon_overskrift || '',
                    Felter: []
                };
                for (const felt of (seksjon.Felter || [])) {
                    if (felt.Type === 'Informasjon') continue;
                    const feltSkjult = seksjonSkjult || (felt.Vises && !evaluerVilkar(felt.Vises, seksjonerMedSvar));
                    const feltId = `felt-${seksjon.Seksjon_nummer}-${felt.Nummer}`;
                    // Skjulte felter får tomt svar — brukeren skal ikke bli bundet av gamle verdier
                    // som ikke lenger er relevante for hoved-flyten.
                    const svarVerdi = feltSkjult ? [] : hentSvarFraDom(feltId, felt.Type);
                    const feltUt = {
                        Id: felt.Id,
                        Nummer: felt.Nummer,
                        Type: felt.Type,
                        Svar: svarVerdi
                    };
                    // Ta vare på det som sto i nedtrekket. Verdien er en kode
                    // (FS-nøkkel, UPN), og valglista kan være borte eller endret
                    // når skjemaet leses igjen — arkivet skal vise det som ble valgt.
                    const tekster = svarTekstFor(felt, svarVerdi);
                    if (tekster) feltUt.SvarTekst = tekster;
                    seksjonUt.Felter.push(feltUt);
                }
                svar.Seksjoner.push(seksjonUt);
            }
            return svar;
        }

        function validerAlle() {
            const seksjonerMedSvar = samleSeksjonerFraDom(skjematype.Seksjoner);
            let alleOk = true;
            let førsteFeilFelt = null;
            for (const seksjon of (skjematype.Seksjoner || [])) {
                const seksjonSkjult = seksjon.Vises && !evaluerVilkar(seksjon.Vises, seksjonerMedSvar);
                if (seksjonSkjult) continue; // ingen validering av skjulte seksjoner
                for (const felt of (seksjon.Felter || [])) {
                    if (felt.Type === 'Informasjon') continue;
                    const feltSkjult = felt.Vises && !evaluerVilkar(felt.Vises, seksjonerMedSvar);
                    if (feltSkjult) continue;

                    const feltId = `felt-${seksjon.Seksjon_nummer}-${felt.Nummer}`;
                    const verdi = hentSvarFraDom(feltId, felt.Type);
                    const feltEl = document.querySelector(`.seksjon[data-seksjon-nummer="${seksjon.Seksjon_nummer}"] .felt[data-felt-nummer="${felt.Nummer}"]`);
                    const feilEl = feltEl?.querySelector('.felt-feilmelding');

                    // Bygg midlertidig felt-objekt med aktuell Obligatorisk-status
                    const effektivFelt = { ...felt, Obligatorisk: erObligatoriskNa(felt, seksjonerMedSvar) };
                    const res = valider(effektivFelt, verdi);
                    if (!res.ok) {
                        feltEl?.classList.add('har-feil');
                        if (feilEl) feilEl.textContent = res.feilmelding || 'Ugyldig verdi';
                        alleOk = false;
                        if (!førsteFeilFelt) førsteFeilFelt = feltEl;
                    } else {
                        feltEl?.classList.remove('har-feil');
                        if (feilEl) feilEl.textContent = '';
                    }
                }
            }
            if (førsteFeilFelt) førsteFeilFelt.scrollIntoView({ behavior: 'smooth', block: 'center' });
            return alleOk;
        }

        async function lagreForSenere() {
            // Ingen validering — bruker skal kunne pause midt i utfylling
            const lagreKnapp = document.getElementById('lagre-knapp');
            const submitKnapp = document.getElementById('submit-knapp');
            lagreKnapp.disabled = true;
            submitKnapp.disabled = true;
            lagreKnapp.textContent = 'Laster opp vedlegg…';

            if (skjemaId) {
                try {
                    for (const seksjon of (skjematype.Seksjoner || [])) {
                        for (const felt of (seksjon.Felter || [])) {
                            if (felt.Type !== 'Opplasting') continue;
                            const feltEl = document.querySelector(`.seksjon[data-seksjon-nummer="${seksjon.Seksjon_nummer}"] .felt[data-felt-nummer="${felt.Nummer}"]`);
                            if (feltEl) await preSubmitOpplasting(feltEl, skjematypeId, skjemaId);
                        }
                    }
                } catch (e) {
                    lagreKnapp.disabled = false;
                    submitKnapp.disabled = false;
                    lagreKnapp.textContent = 'Lagre for senere';
                    alert('Feil ved opplasting: ' + e.message);
                    return;
                }
            }

            lagreKnapp.textContent = 'Lagrer…';
            const svar = samleSvar();
            const body = {
                Skjematype_id: skjematypeId,
                Skjema_navn: skjematype.Skjema_navn,
                Seksjoner: svar.Seksjoner,
                Skjema_status: 1 // mellomlagret
            };
            if (skjemaId) body.Skjema_id = skjemaId;

            try {
                const resp = await api.post('/api/skjemaer', body);
                // Bli på siden — bekreft med melding og legg til lenke tilbake
                lagreKnapp.disabled = false;
                submitKnapp.disabled = false;
                lagreKnapp.textContent = '✓ Lagret';
                setTimeout(() => { lagreKnapp.textContent = 'Lagre for senere'; }, 2500);
                // Oppdater URL med skjema_id så refresh gjenopptar
                if (resp.Skjema_id && !skjemaIdParam) {
                    const nyUrl = `/index.html?skjematype_id=${encodeURIComponent(skjematypeId)}&skjema_id=${encodeURIComponent(resp.Skjema_id)}`;
                    window.history.replaceState({}, '', nyUrl);
                }
            } catch (e) {
                lagreKnapp.disabled = false;
                submitKnapp.disabled = false;
                lagreKnapp.textContent = 'Lagre for senere';
                alert('Kunne ikke lagre: ' + e.message);
            }
        }
        window.lagreForSenere = lagreForSenere;

        async function submitSkjema() {
            if (!validerAlle()) {
                return;
            }

            const submitKnapp = document.getElementById('submit-knapp');
            submitKnapp.disabled = true;
            submitKnapp.textContent = 'Laster opp vedlegg…';

            // Steg 1: opplast vedlegg for hvert Opplasting-felt (krever skjemaId)
            if (skjemaId) {
                try {
                    for (const seksjon of (skjematype.Seksjoner || [])) {
                        for (const felt of (seksjon.Felter || [])) {
                            if (felt.Type !== 'Opplasting') continue;
                            const feltEl = document.querySelector(`.seksjon[data-seksjon-nummer="${seksjon.Seksjon_nummer}"] .felt[data-felt-nummer="${felt.Nummer}"]`);
                            if (feltEl) {
                                await preSubmitOpplasting(feltEl, skjematypeId, skjemaId);
                            }
                        }
                    }
                } catch (e) {
                    submitKnapp.disabled = false;
                    submitKnapp.textContent = 'Send inn';
                    alert('Feil ved opplasting: ' + e.message);
                    return;
                }
            }
            submitKnapp.textContent = 'Sender…';

            const svar = samleSvar();
            const body = {
                Skjematype_id: skjematypeId,
                Skjema_navn: skjematype.Skjema_navn,
                Seksjoner: svar.Seksjoner,
                Skjema_status: 2 // 2=innsendt
            };
            if (skjemaId) body.Skjema_id = skjemaId; // bruk pre-generert id så vedleggene binder til rett skjema

            try {
                const resp = await api.post('/api/skjemaer', body);
                if (utsendingModus) {
                    // Utsending-mottakere er ikke SWA-innlogget, så kvittering.html
                    // vil kreve login. Vis inline takk-melding i stedet.
                    document.getElementById('innhold').className = 'status-melding info';
                    document.getElementById('innhold').innerHTML =
                        `<div style="text-align: center;">
                            <div style="font-size: 48px;">✓</div>
                            <h2 style="margin: 10px 0;">Takk for svaret!</h2>
                            <p>Skjema-ID: <code>${escapeHtml(resp.Skjema_id || '')}</code></p>
                            <p style="color: var(--text-secondary); font-size: 14px;">Du kan lukke dette vinduet.</p>
                        </div>`;
                    document.getElementById('forklaring').innerHTML = '';
                } else {
                    window.location.href = `/kvittering.html?skjematype_id=${encodeURIComponent(skjematypeId)}&skjema_id=${encodeURIComponent(resp.Skjema_id)}`;
                }
            } catch (e) {
                submitKnapp.disabled = false;
                submitKnapp.textContent = 'Send inn';
                alert('Innsending feilet: ' + e.message);
            }
        }

        init();
    </script>
    <script type="module" src="/js/systemtopp.js"></script>
