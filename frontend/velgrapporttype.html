<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velg rapport</title>
    <script>
        (function() {
            const t = localStorage.getItem('theme');
            if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        })();
    </script>
    <style>
        :root {
            --bg-page: #e8edf2;
            --bg-container: rgba(255, 255, 255, 0.72);
            --bg-section: rgba(255, 255, 255, 0.55);
            --bg-input: rgba(255, 255, 255, 0.7);
            --text-primary: #1c1c1e;
            --text-secondary: #6e6e73;
            --border-color: rgba(0, 0, 0, 0.08);
            --shadow: 0 4px 30px rgba(0, 0, 0, 0.06);
            --shadow-sm: 0 1px 6px rgba(0, 0, 0, 0.04);
            --accent: #0a84ff;
            --accent-light: rgba(10, 132, 255, 0.12);
            --glass-blur: blur(20px);
            --radius-sm: 10px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --radius-xl: 24px;
            --badge-utvikling: #ff9500;
            --badge-produksjon: #34c759;
        }
        [data-theme="dark"] {
            --bg-page: #0d1117;
            --bg-container: rgba(30, 35, 45, 0.72);
            --bg-section: rgba(40, 45, 60, 0.55);
            --bg-input: rgba(50, 55, 70, 0.6);
            --text-primary: #f0f0f5;
            --text-secondary: #8e8e93;
            --border-color: rgba(255, 255, 255, 0.08);
            --shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
            --accent-light: rgba(10, 132, 255, 0.2);
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-primary);
            margin: 0; padding: 24px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }
        .theme-toggle {
            position: fixed; top: 16px; right: 20px;
            background: var(--bg-container); border: 1px solid var(--border-color);
            border-radius: 50%; width: 40px; height: 40px;
            cursor: pointer; font-size: 18px;
            display: flex; align-items: center; justify-content: center;
        }
        .container {
            max-width: 800px; margin: 0 auto;
            background: var(--bg-container);
            backdrop-filter: var(--glass-blur);
            padding: 36px; border-radius: var(--radius-xl);
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }
        .topp {
            display: flex; align-items: center; gap: 16px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px; margin-bottom: 8px;
        }
        h1 { font-size: 1.8em; margin: 0; flex: 1; font-weight: 700; letter-spacing: -0.02em; }
        .brukerinfo { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--text-secondary); }
        .brukerinfo .upn { font-weight: 500; color: var(--text-primary); }
        .link-knapp {
            background: none; border: 0; color: var(--accent);
            font-size: 13px; cursor: pointer; padding: 4px 8px; border-radius: 6px;
        }
        .link-knapp:hover { background: var(--accent-light); }
        .undertittel { color: var(--text-secondary); font-size: 14px; margin: 16px 0 20px; }

        .sokefelt-rad { position: relative; margin-bottom: 18px; }
        .sokefelt {
            width: 100%; padding: 12px 40px;
            font-size: 15px; border: 1px solid var(--border-color);
            border-radius: var(--radius-md); background: var(--bg-input);
            color: var(--text-primary);
        }
        .sokefelt:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }
        .sokefelt-ikon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); pointer-events: none; }

        .status-melding {
            padding: 14px; border-radius: var(--radius-md);
            background: var(--bg-section); color: var(--text-secondary);
            text-align: center; font-size: 14px;
        }
        .status-melding.feil { color: #d9534f; background: rgba(217, 83, 79, 0.1); }

        .rapport-liste { display: flex; flex-direction: column; gap: 14px; }
        .rapport-kort {
            background: var(--bg-section); border: 1px solid var(--border-color);
            border-radius: var(--radius-lg); padding: 18px 20px;
            box-shadow: var(--shadow-sm); transition: transform 0.15s, box-shadow 0.15s;
        }
        .rapport-kort:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
        .kort-tittelrad {
            display: flex; align-items: baseline; justify-content: space-between;
            gap: 12px; margin-bottom: 6px;
        }
        .kort-tittel { font-size: 17px; font-weight: 600; margin: 0; }
        .fase-badge {
            display: inline-block; padding: 2px 10px; border-radius: 999px;
            font-size: 11px; font-weight: 600; text-transform: uppercase; color: white;
        }
        .fase-badge.produksjon { background: var(--badge-produksjon); }
        .fase-badge.utvikling  { background: var(--badge-utvikling); }
        .beskrivelse {
            color: var(--text-secondary); font-size: 13.5px;
            margin: 4px 0 12px;
        }
        .kort-meta { color: var(--text-secondary); font-size: 12px; margin-bottom: 10px; }

        .knapperad { display: flex; gap: 10px; flex-wrap: wrap; }
        .knapp {
            display: inline-flex; align-items: center; gap: 6px;
            border: 0; border-radius: var(--radius-sm);
            padding: 9px 16px; font-size: 14px; font-weight: 600;
            cursor: pointer; text-decoration: none;
        }
        .knapp.primær { background: var(--accent); color: white; }
        .knapp.primær:hover { filter: brightness(1.1); }
        .knapp.sekundær { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
        .knapp.sekundær:hover { background: var(--accent-light); }
        .ingen-treff { text-align: center; padding: 40px 20px; color: var(--text-secondary); }

        .info-boks {
            padding: 10px 14px; margin-bottom: 12px;
            background: rgba(10, 132, 255, 0.08);
            border-left: 3px solid var(--accent);
            border-radius: 6px;
            font-size: 13px; color: var(--text-primary);
        }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn">🌙</button>

    <div class="container">
        <div class="topp">
            <h1>Velg rapport</h1>
            <div class="brukerinfo">
                <span class="upn" id="upn">…</span>
                <button class="link-knapp" onclick="logUt()">Logg ut</button>
                <a class="link-knapp" href="/velgskjematype.html">Skjemaer →</a>
            </div>
        </div>

        <p class="undertittel">Rapporttyper du har tilgang til.</p>

        <div class="info-boks">
            <strong>Utviklingsversjon.</strong> Rapporter er en ny funksjon som testes.
            Kun rapporttyper i fasen «Produksjon» vises for vanlige brukere. Gi tilbakemelding på hva som mangler.
        </div>

        <div class="sokefelt-rad">
            <span class="sokefelt-ikon">🔍</span>
            <input type="text" class="sokefelt" id="sok" placeholder="Søk etter rapport…" oninput="filtrer()">
        </div>

        <div style="margin-bottom: 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
            <a id="knapp-ny-rapporttype" class="knapp primær" style="display: none; padding: 4px 12px; font-size: 12px;" href="/rapporteditor.html">+ Ny rapporttype</a>
            <a class="knapp sekundær" style="padding: 4px 12px; font-size: 12px; text-decoration: none;" href="/velgskjematype.html" title="Tilbake til skjemaene">← Skjemaer</a>
        </div>

        <div id="status" class="status-melding">Laster…</div>
        <div id="liste" class="rapport-liste"></div>
    </div>

    <script type="module">
        import { CONFIG } from './js/config.js';
        import { api } from './js/api-client.js';
        import { hentInnloggetBruker, logUt as authLogUt } from './js/auth.js';

        let alle = [];

        window.toggleTheme = () => {
            const root = document.documentElement;
            const ny = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            root.setAttribute('data-theme', ny);
            localStorage.setItem('theme', ny);
            document.getElementById('theme-btn').textContent = ny === 'dark' ? '☀️' : '🌙';
        };
        document.getElementById('theme-btn').textContent =
            document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';
        window.logUt = () => authLogUt('/');

        function visStatus(tekst, klasse) {
            const el = document.getElementById('status');
            el.textContent = tekst;
            el.className = 'status-melding' + (klasse ? ' ' + klasse : '');
            el.style.display = tekst ? 'block' : 'none';
        }

        function escapeHtml(s) {
            return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function kortHtml(t) {
            const fase = (t.Fase || 'Produksjon').toLowerCase();
            const knapper = [];
            if (t.KanKjore) knapper.push(`<a class="knapp primær" href="/rapport.html?rapporttype_id=${encodeURIComponent(t.Rapporttype_id)}">Kjør rapport</a>`);
            if (t.ErEier) knapper.push(`<a class="knapp sekundær" href="/rapporteditor.html?rapporttype_id=${encodeURIComponent(t.Rapporttype_id)}">Rediger</a>`);
            const knapperadHtml = knapper.length
                ? `<div class="knapperad">${knapper.join('')}</div>`
                : '<div class="knapperad"><em style="color: var(--text-secondary); font-size: 13px;">Ingen tilgjengelige handlinger</em></div>';

            return `
                <div class="rapport-kort">
                    <div class="kort-tittelrad">
                        <h2 class="kort-tittel">${escapeHtml(t.Rapport_navn || '(uten navn)')}
                            <small style="font-weight: 400; color: var(--text-secondary); font-size: 0.65em;">ID ${escapeHtml(String(t.Rapporttype_id))}</small>
                        </h2>
                        <div style="display: flex; gap: 6px; align-items: center;">
                            ${t.AlleTilgang ? '<span class="fase-badge" style="background: #34c759;" title="Alle innloggede">Åpen for alle</span>' : ''}
                            <span class="fase-badge ${fase}">${escapeHtml(t.Fase || 'Produksjon')}</span>
                        </div>
                    </div>
                    ${t.Beskrivelse ? `<div class="beskrivelse">${escapeHtml(t.Beskrivelse)}</div>` : ''}
                    <div class="kort-meta">Kilde: skjematype ${escapeHtml(String(t.Kildeskjematype_id || '?'))}</div>
                    ${knapperadHtml}
                </div>
            `;
        }

        function render(liste) {
            const container = document.getElementById('liste');
            if (!liste || liste.length === 0) {
                container.innerHTML = '<div class="ingen-treff">Ingen rapporttyper å vise.</div>';
                visStatus('', '');
                return;
            }
            visStatus('', '');
            container.innerHTML = liste.map(t => kortHtml(t)).join('');
        }

        window.filtrer = () => {
            const q = document.getElementById('sok').value.trim().toLowerCase();
            const filtrert = alle.filter(t => {
                if (q === '') return true;
                return (t.Rapport_navn || '').toLowerCase().includes(q)
                    || (t.Beskrivelse || '').toLowerCase().includes(q);
            });
            render(filtrert);
        };

        async function init() {
            const bruker = await hentInnloggetBruker();
            if (!bruker) {
                window.location.href = '/.auth/login/aad?post_login_redirect_uri=' + encodeURIComponent(window.location.pathname);
                return;
            }
            document.getElementById('upn').textContent = bruker.userDetails;
            document.title = `Velg rapport — ${CONFIG.APP_TITTEL || ''}`;

            try {
                const meg = await api.get('/api/whoami');
                if (meg.erAdmin || meg.kanOppretteSkjematype) {
                    document.getElementById('knapp-ny-rapporttype').style.display = 'inline-flex';
                }
            } catch (_) { /* ikke kritisk */ }

            try {
                alle = await api.get('/api/rapporttyper');
                filtrer();
            } catch (e) {
                if (e.status === 403) {
                    visStatus('Rapporter er foreløpig forbeholdt brukere med rollen "Skjemaskaper". Ta kontakt med systemansvarlig hvis du trenger tilgang.', 'feil');
                } else {
                    visStatus('Kunne ikke hente rapporttyper: ' + e.message, 'feil');
                }
            }
        }

        init();
    </script>
    <script type="module" src="/js/systemtopp.js"></script>
</body>
</html>
