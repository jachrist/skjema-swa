<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rolle-administrasjon</title>
    <script>
        (function() {
            const t = localStorage.getItem('theme');
            if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        })();
    </script>
    <style>
        :root {
            --bg-page: #e8edf2;
            --bg-container: rgba(255, 255, 255, 0.85);
            --bg-section: rgba(255, 255, 255, 0.55);
            --bg-input: white;
            --text-primary: #1c1c1e;
            --text-secondary: #6e6e73;
            --text-heading: #0a84ff;
            --border-color: rgba(0, 0, 0, 0.1);
            --input-border: #d1d1d6;
            --shadow: 0 4px 30px rgba(0, 0, 0, 0.06);
            --accent: #0a84ff;
            --accent-light: rgba(10, 132, 255, 0.12);
            --danger: #ff3b30;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 18px;
            --radius-xl: 24px;
        }
        [data-theme="dark"] {
            --bg-page: #0d1117;
            --bg-container: rgba(30, 35, 45, 0.85);
            --bg-section: rgba(40, 45, 60, 0.55);
            --bg-input: #1c2028;
            --text-primary: #f0f0f5;
            --text-secondary: #8e8e93;
            --text-heading: #64b5f6;
            --border-color: rgba(255, 255, 255, 0.1);
            --input-border: #3a3a5a;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-page); color: var(--text-primary);
            margin: 0; padding: 20px; -webkit-font-smoothing: antialiased;
        }
        .container {
            max-width: 1200px; margin: 0 auto;
            background: var(--bg-container); backdrop-filter: blur(20px);
            padding: 24px; border-radius: var(--radius-xl); box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }
        .tilbake { color: var(--accent); text-decoration: none; font-size: 13px; display: inline-block; margin-bottom: 8px; }
        .topplinje { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
        h1 { font-size: 1.5em; font-weight: 700; margin: 0; }
        .brukerinfo { font-size: 13px; color: var(--text-secondary); }
        .undertittel { color: var(--text-secondary); margin: 4px 0 20px; font-size: 13px; }

        .to-spalter { display: grid; grid-template-columns: 380px 1fr; gap: 20px; min-height: 500px; }
        .venstre, .hoyre {
            background: var(--bg-section); border: 1px solid var(--border-color);
            border-radius: var(--radius-lg); padding: 16px; overflow-y: auto; max-height: 80vh;
        }

        input[type="text"], input[type="email"], select {
            width: 100%; padding: 8px 12px; font-size: 14px;
            border: 1px solid var(--input-border); border-radius: var(--radius-sm);
            background: var(--bg-input); color: var(--text-primary); font-family: inherit;
        }

        .rolle-liste { display: flex; flex-direction: column; gap: 4px; margin-top: 10px; }
        .rolle-element {
            padding: 10px 12px; background: var(--bg-container); border-radius: 8px;
            border: 1px solid var(--border-color); cursor: pointer;
        }
        .rolle-element:hover { background: var(--accent-light); }
        .rolle-element.aktiv { border-color: var(--accent); background: var(--accent-light); }
        .rolle-element .navn { font-weight: 600; font-size: 14px; }
        .rolle-element .omfang { font-size: 12px; color: var(--text-secondary); }
        .rolle-element .antall { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }

        .innehaver-header, .innehaver-rad {
            display: grid; grid-template-columns: 1fr 1fr 90px 70px; gap: 10px;
            padding: 8px 10px; align-items: center; font-size: 13px;
        }
        .innehaver-header { font-weight: 600; color: var(--text-secondary); border-bottom: 1px solid var(--border-color); }
        .innehaver-rad { border-bottom: 1px solid var(--border-color); }
        .innehaver-rad:last-child { border-bottom: 0; }

        .knapp {
            display: inline-flex; align-items: center; padding: 6px 12px;
            font-size: 13px; font-weight: 600; border: 0; border-radius: 6px;
            cursor: pointer; font-family: inherit; text-decoration: none;
        }
        .knapp.primær { background: var(--accent); color: white; }
        .knapp.sekundær { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
        .knapp.danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
        .knapp.mini { padding: 3px 8px; font-size: 12px; }

        .tom-melding, .laster, .feilmelding { text-align: center; padding: 30px; color: var(--text-secondary); font-size: 13px; }
        .feilmelding { color: var(--danger); }

        .ny-boks {
            margin-top: 16px; padding: 14px; background: var(--bg-container);
            border: 1px solid var(--border-color); border-radius: 8px;
        }
        .ny-boks .rad { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; }
        .ny-boks label { font-size: 12px; color: var(--text-secondary); min-width: 90px; }

        @media (max-width: 800px) {
            .to-spalter { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/velgskjematype.html" class="tilbake">← Til skjemaoversikten</a>
        <div class="topplinje">
            <h1>Rolle-administrasjon</h1>
            <div class="brukerinfo"><span id="upn">…</span></div>
        </div>
        <p class="undertittel" id="undertittel">Krever admin-tilgang for endringer.</p>

        <div class="to-spalter">
            <div class="venstre">
                <input type="text" id="sok" placeholder="🔍 Søk rolle eller omfang…" oninput="filtrer()">
                <div class="rolle-liste" id="grupper">
                    <div class="tom-melding">Laster…</div>
                </div>
            </div>
            <div class="hoyre" id="hoyre">
                <div class="tom-melding">Velg en rolle fra listen til venstre for å se innehavere.</div>
            </div>
        </div>
    </div>

    <script type="module">
        import { api } from './js/api-client.js';
        import { hentInnloggetBruker } from './js/auth.js';

        let bruker = null;
        let erAdmin = false;
        let grupper = [];
        let filtrerte = [];
        let valgt = null;

        async function init() {
            bruker = await hentInnloggetBruker();
            if (!bruker) {
                window.location.href = '/.auth/login/aad?post_login_redirect_uri=' + encodeURIComponent(window.location.pathname);
                return;
            }
            document.getElementById('upn').textContent = bruker.userDetails;
            try {
                const w = await api.get('/api/whoami');
                erAdmin = !!w.erAdmin;
                if (!erAdmin) {
                    document.getElementById('undertittel').textContent = 'Kun lese-tilgang (du er ikke admin).';
                }
            } catch (_) { /* ikke kritisk */ }
            await lastGrupper();
        }

        async function lastGrupper() {
            try {
                grupper = await api.get('/api/roller/grupper');
                filtrer();
            } catch (e) {
                document.getElementById('grupper').innerHTML = `<div class="feilmelding">Kunne ikke laste: ${e.message}</div>`;
            }
        }

        window.filtrer = () => {
            const q = document.getElementById('sok').value.trim().toLowerCase();
            filtrerte = q === '' ? grupper : grupper.filter(g =>
                g.Rolle.toLowerCase().includes(q) || (g.Omfang || '').toLowerCase().includes(q)
            );
            renderGrupper();
        };

        function renderGrupper() {
            const el = document.getElementById('grupper');
            if (filtrerte.length === 0) {
                el.innerHTML = '<div class="tom-melding">Ingen roller.</div>';
                return;
            }
            el.innerHTML = filtrerte.map((g, i) => `
                <div class="rolle-element${valgt && valgt.Rolle === g.Rolle && valgt.Omfang === g.Omfang ? ' aktiv' : ''}"
                    onclick="velgGruppe(${i})">
                    <div class="navn">${escHtml(g.Rolle)}</div>
                    ${g.Omfang ? `<div class="omfang">${escHtml(g.Omfang)}</div>` : ''}
                    <div class="antall">${g.Antall} innehaver${g.Antall === 1 ? '' : 'e'}</div>
                </div>
            `).join('');
        }

        window.velgGruppe = async (i) => {
            valgt = filtrerte[i];
            renderGrupper();
            const hoyre = document.getElementById('hoyre');
            hoyre.innerHTML = '<div class="laster">Henter innehavere…</div>';
            try {
                const rolleStreng = valgt.Omfang ? `${valgt.Rolle}(${valgt.Omfang})` : valgt.Rolle;
                const innehavere = await api.get(`/api/roller/innehavere?rolle=${encodeURIComponent(rolleStreng)}`);
                renderInnehavere(innehavere);
            } catch (e) {
                hoyre.innerHTML = `<div class="feilmelding">Kunne ikke hente: ${e.message}</div>`;
            }
        };

        function renderInnehavere(innehavere) {
            const hoyre = document.getElementById('hoyre');
            const nyBoks = erAdmin ? `
                <div class="ny-boks">
                    <div style="font-weight: 600; margin-bottom: 8px;">Legg til ny innehaver</div>
                    <div class="rad"><label>UPN:</label><input type="email" id="ny-upn" placeholder="navn@domene.no"></div>
                    <div class="rad"><label>Fornavn:</label><input type="text" id="ny-fn" placeholder="(valgfritt)"></div>
                    <div class="rad"><label>Etternavn:</label><input type="text" id="ny-en" placeholder="(valgfritt)"></div>
                    <div style="margin-top: 8px;"><button class="knapp primær" onclick="leggTil()">Legg til</button></div>
                </div>
            ` : '';

            const tittel = `<h2 style="margin: 0 0 6px 0; font-size: 1.2em;">${escHtml(valgt.Rolle)}${valgt.Omfang ? ` <span style="color: var(--text-secondary); font-weight: 400;">(${escHtml(valgt.Omfang)})</span>` : ''}</h2>`;
            const under = `<div style="color: var(--text-secondary); font-size: 12px; margin-bottom: 14px;">${innehavere.length} innehaver${innehavere.length === 1 ? '' : 'e'}</div>`;

            const tabell = innehavere.length === 0
                ? '<div class="tom-melding">Ingen innehavere ennå.</div>'
                : `
                    <div class="innehaver-header">
                        <div>Navn</div><div>UPN</div><div>Kilde</div><div></div>
                    </div>
                    ${innehavere.map(i => `
                        <div class="innehaver-rad">
                            <div>${escHtml(`${i.EN || ''}${i.FN ? ', ' + i.FN : ''}`.trim() || '-')}</div>
                            <div style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${escHtml(i.UPN)}</div>
                            <div style="color: var(--text-secondary); font-size: 11px;">${escHtml(i.Kilde || 'manuell')}</div>
                            <div>${erAdmin ? `<button class="knapp mini danger" onclick="fjern('${escAttr(i.UPN)}')">Fjern</button>` : ''}</div>
                        </div>
                    `).join('')}
                `;

            hoyre.innerHTML = tittel + under + tabell + nyBoks;
        }

        window.leggTil = async () => {
            const upn = document.getElementById('ny-upn').value.trim();
            const fn = document.getElementById('ny-fn').value.trim();
            const en = document.getElementById('ny-en').value.trim();
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(upn)) {
                alert('UPN må være en gyldig e-postadresse');
                return;
            }
            try {
                await api.post('/api/roller/leggtil', {
                    Rolle: valgt.Rolle, Omfang: valgt.Omfang || '',
                    UPN: upn, FN: fn, EN: en
                });
                await lastGrupper();
                // Re-velg samme gruppe for å oppdatere høyre panel
                const idx = grupper.findIndex(g => g.Rolle === valgt.Rolle && g.Omfang === valgt.Omfang);
                if (idx >= 0) {
                    valgt = grupper[idx];
                    velgGruppe(filtrerte.findIndex(g => g.Rolle === valgt.Rolle && g.Omfang === valgt.Omfang));
                }
            } catch (e) {
                alert('Kunne ikke legge til: ' + e.message);
            }
        };

        window.fjern = async (upn) => {
            if (!confirm(`Fjern ${upn} fra ${valgt.Rolle}${valgt.Omfang ? '(' + valgt.Omfang + ')' : ''}?`)) return;
            try {
                await api.post('/api/roller/fjern', {
                    Rolle: valgt.Rolle, Omfang: valgt.Omfang || '', UPN: upn
                });
                await lastGrupper();
                const idx = grupper.findIndex(g => g.Rolle === valgt.Rolle && g.Omfang === valgt.Omfang);
                if (idx >= 0) {
                    valgt = grupper[idx];
                    velgGruppe(filtrerte.findIndex(g => g.Rolle === valgt.Rolle && g.Omfang === valgt.Omfang));
                } else {
                    // Rollen har ingen innehavere igjen — reset høyre panel
                    valgt = null;
                    document.getElementById('hoyre').innerHTML = '<div class="tom-melding">Velg en rolle fra listen til venstre.</div>';
                    filtrer();
                }
            } catch (e) {
                alert('Kunne ikke fjerne: ' + e.message);
            }
        };

        function escHtml(s) {
            return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
        function escAttr(s) {
            return String(s ?? '').replace(/"/g, '&quot;').replace(/'/g, "\\'");
        }

        init();
    </script>
</body>
</html>
