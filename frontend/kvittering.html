<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kvittering</title>
    <script>
        (function() {
            const t = localStorage.getItem('theme');
            if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        })();
    </script>
    <style>
        :root {
            --bg-page: #e8edf2;
            --bg-container: rgba(255, 255, 255, 0.85);
            --text-primary: #1c1c1e;
            --text-secondary: #6e6e73;
            --accent: #0a84ff;
            --accent-light: rgba(10, 132, 255, 0.12);
            --success: #34c759;
            --border-color: rgba(0, 0, 0, 0.1);
            --shadow: 0 4px 30px rgba(0, 0, 0, 0.06);
            --radius-md: 12px;
            --radius-xl: 24px;
            /* Brukes av samtale-blokken under. Samme verdier som visning.html,
               så widgeten ser lik ut der innsenderen møter den. */
            --bg-section: rgba(255, 255, 255, 0.55);
            --bg-svar: rgba(255, 255, 255, 0.7);
            --danger: #ff3b30;
            --radius-lg: 18px;
            --radius-sm: 8px;
        }
        [data-theme="dark"] {
            --bg-page: #0d1117;
            --bg-container: rgba(30, 35, 45, 0.85);
            --text-primary: #f0f0f5;
            --text-secondary: #8e8e93;
            --border-color: rgba(255, 255, 255, 0.1);
                    --bg-section: rgba(40, 45, 60, 0.55);
            --bg-svar: rgba(20, 25, 35, 0.7);
            --danger: #ff3b30;
}
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-page);
            color: var(--text-primary);
            margin: 0;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
        }
        .container {
            max-width: 640px;
            margin: 60px auto;
            background: var(--bg-container);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            text-align: center;
        }
        .ikon {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: var(--success);
            color: white;
            font-size: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }
        h1 { font-size: 1.8em; margin: 0 0 8px 0; letter-spacing: -0.02em; }
        .undertittel { color: var(--text-secondary); margin: 0 0 24px 0; }
        .kvittering-info {
            background: var(--accent-light);
            padding: 16px 20px;
            border-radius: var(--radius-md);
            font-size: 14px;
            text-align: left;
            margin: 20px 0;
        }
        .kvittering-info strong { color: var(--accent); }
        /* `hidden` er bare en UA-regel (`display: none`), og enhver
           author-regel med `display` slår den. `.knapperad` under setter
           `display: flex`, og da hadde attributtet ingen virkning — knappen
           sto framme uansett hva JS-en bestemte. */
        [hidden] { display: none !important; }
        .knapperad {
            margin-top: 24px;
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .knapp {
            display: inline-block;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 600;
            border: 0;
            border-radius: var(--radius-md);
            cursor: pointer;
            text-decoration: none;
        }
        .knapp.primær { background: var(--accent); color: white; }
        .knapp.primær:hover { filter: brightness(1.1); }
        .knapp.sekundær {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
        }
        .knapp.sekundær:hover { background: var(--accent-light); }
        .topprad {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 10px;
            /* Uten wrap kan ikke raden brytes, og en lang UPN presser seg ut
               av containeren i stedet for ned på egen linje. */
            flex-wrap: wrap;
        }
        /* ---- Samtale (gruppechat) ---- */
        .samtale {
            background: var(--bg-container);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 16px 20px;
            margin-top: 14px;
        }
        .samtale-topp { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 10px; }
        .samtale-tittel { font-size: 16px; font-weight: 700; color: var(--accent); margin: 0 0 4px 0; }
        .samtale-demp { font-size: 12px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }
        .samtale-lukket { font-size: 12px; color: var(--text-secondary); margin: 4px 0 10px 0; }
        .samtale-liste {
            max-height: 420px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 10px 0;
        }
        .samtale-tom { font-size: 13px; color: var(--text-secondary); margin: 6px 0; }
        .samtale-innlegg {
            background: var(--bg-section);
            border-radius: var(--radius-md);
            padding: 8px 12px;
            /* En lang UPN eller en URL uten mellomrom skal ikke presse boksen
               ut av containeren — samme feil som i .brukerinfo. */
            overflow-wrap: anywhere;
        }
        .samtale-innlegg.meg { background: var(--accent-light); }
        .samtale-hode { display: flex; flex-wrap: wrap; gap: 8px; font-size: 11px; color: var(--text-secondary); margin-bottom: 3px; }
        .samtale-avsender { font-weight: 600; }
        .samtale-tekst { font-size: 13px; white-space: pre-wrap; }
        /* Skrivefeltet er en egen boks med ramme og tone.
           Uten en tydelig avgrensning fløt det sammen med innleggene over, og
           det var ikke åpenbart hvor man skulle skrive. */
        .samtale-skriv {
            margin-top: 12px;
            padding: 12px 14px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            background: var(--bg-section);
        }
        .samtale-info { font-size: 11px; color: var(--text-secondary); margin: 0 0 8px 0; }
        .samtale-felt {
            width: 100%;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 13px;
            padding: 8px 10px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            /* Lysere enn boksen rundt, så feltet leses som et felt. */
            background: var(--bg-svar);
            color: var(--text-primary);
            resize: vertical;
        }
        .samtale-felt:focus { outline: none; border-color: var(--accent); }
        .samtale-knapperad { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 10px; margin-top: 8px; }
        .samtale-status { font-size: 12px; color: var(--text-secondary); margin-right: auto; }
        .samtale-status.feil { color: var(--danger); }
        .samtale-send {
            padding: 8px 18px;
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            border: 2px solid var(--accent);
            border-radius: var(--radius-md);
            background: var(--accent);
            color: white;
            cursor: pointer;
        }
        .samtale-send:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="container">
        <div class="topprad">
            <span></span>
            <div id="systemmerke-plass"></div>
        </div>
        <div class="ikon">✓</div>
        <h1>Skjema er sendt inn</h1>
        <p class="undertittel">Takk for innsendingen.</p>
        <div class="kvittering-info">
            <div>Skjema-ID: <strong id="skjema-id">…</strong></div>
            <div style="margin-top: 8px;">Skjematype: <strong id="skjematype-id">…</strong></div>
        </div>
        <div class="knapperad">
            <a class="knapp primær" href="/velgskjematype.html" data-oversiktslenke>Til skjemaoversikten</a>
            <a class="knapp sekundær" href="#" id="se-skjemaet">Se skjemaet</a>
            <a class="knapp sekundær" href="#" id="nytt-lignende">Fyll ut nytt</a>
        </div>
        <div id="samtale" style="text-align: left;"></div>
    </div>

    <script type="module">
        const params = new URLSearchParams(window.location.search);
        const skjemaId = params.get('skjema_id') || '(mangler)';
        const skjematypeId = params.get('skjematype_id') || '(mangler)';
        document.getElementById('skjema-id').textContent = skjemaId;
        document.getElementById('skjematype-id').textContent = skjematypeId;
        document.getElementById('nytt-lignende').href =
            `/index.html?skjematype_id=${encodeURIComponent(skjematypeId)}`;
        const visningsUrl =
            `/visning.html?skjematype_id=${encodeURIComponent(skjematypeId)}&skjema_id=${encodeURIComponent(skjemaId)}`;
        document.getElementById('se-skjemaet').href = visningsUrl;

        /**
         * Samtalen, på kvitteringen.
         *
         * Den ligger her og ikke bak en knapp, av to grunner. Varselet
         * innsenderen får når en behandler starter en samtale, lenker hit — og
         * en side som bare sier «du har en melding et annet sted» er en omvei.
         * Og knappen den erstattet lovet å stille et spørsmål, noe
         * skjematypen ikke alltid tillater.
         *
         * Widgeten avgjør selv om den skal vises: den spør API-et, som svarer
         * ut fra skjematypens innstilling, rollen og hvor mange innlegg som
         * finnes. Er samtalen av, eller er den tom og innsenderen ikke kan
         * starte den, tegner den ingenting. Regelen bor i
         * `lib/samtale-tilgang.js`, og en kopi her ville før eller siden sagt
         * noe annet enn originalen.
         */
        (async () => {
            const { api } = await import('./js/api-client.js');
            const { styrOversiktslenker } = await import('./js/auth.js');
            // Lenken til skjemaoversikten er bare for admin, skjemaskapere
            // og eiere. Serveren avgjør, ikke denne siden.
            styrOversiktslenker(api);

            // Samtalen trenger begge ID-ene; oversiktslenken gjør ikke det.
            if (skjemaId === '(mangler)' || skjematypeId === '(mangler)') return;

            try {
                const { byggSamtale } = await import('./js/samtale.js');
                const widget = byggSamtale(document.getElementById('samtale'), {
                    api, skjematypeId, skjemaId,
                    infotekst: 'Alle som behandler saken ser det du skriver her. '
                        + 'Samtalen arkiveres sammen med saken. Ikke skriv sensitive personopplysninger.'
                });
                widget.start();
                // Uten stopp lever pollingen videre når fanen forlates.
                window.addEventListener('pagehide', () => widget.stopp());
            } catch (_) {
                // Samtalen er av (404), brukeren er ekstern uten token (401),
                // eller API-et er nede. Ingen av delene er noe kvitteringen
                // skal si fra om.
            }
        })();
    </script>
    <script type="module" src="/js/systemtopp.js"></script>
</body>
</html>
