<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skjema-visning</title>
    <script>
        (function() {
            const t = localStorage.getItem('theme');
            if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        })();
    </script>
    <style>
        :root {
            --bg-page: #e8edf2;
            --bg-container: rgba(255, 255, 255, 0.85);
            --bg-section: rgba(255, 255, 255, 0.55);
            --bg-svar: rgba(255, 255, 255, 0.7);
            --text-primary: #1c1c1e;
            --text-secondary: #6e6e73;
            --danger: #ff3b30;
            --text-heading: #0a84ff;
            --border-color: rgba(0, 0, 0, 0.1);
            --shadow: 0 4px 30px rgba(0, 0, 0, 0.06);
            --accent: #0a84ff;
            --accent-light: rgba(10, 132, 255, 0.12);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 18px;
            --radius-xl: 24px;
            --status-utkast: #ff9500;
            --status-innsendt: #34c759;
            --status-avvist: #ff3b30;
        }
        [data-theme="dark"] {
            --bg-page: #0d1117;
            --bg-container: rgba(30, 35, 45, 0.85);
            --bg-section: rgba(40, 45, 60, 0.55);
            --bg-svar: rgba(20, 25, 35, 0.7);
            --text-primary: #f0f0f5;
            --text-secondary: #8e8e93;
            --danger: #ff3b30;
            --text-heading: #64b5f6;
            --border-color: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-page);
            color: var(--text-primary);
            margin: 0;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--bg-container);
            backdrop-filter: blur(20px);
            padding: 32px;
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        .topplinje {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 4px;
        }
        .topprad {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 10px;
            /* Uten wrap kan ikke raden brytes, og en lang UPN presser seg ut
               av containeren i stedet for ned på egen linje. */
            flex-wrap: wrap;
        }
        .tilbake-lenke { color: var(--accent); text-decoration: none; font-size: 13px; }
        .tilbake-lenke:hover { text-decoration: underline; }
        .tittelrad { display: flex; align-items: center; gap: 14px; flex: 1; min-width: 0; }
        h1 { font-size: 1.7em; font-weight: 700; margin: 0; letter-spacing: -0.02em; }

        .meta-rad {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            color: var(--text-secondary);
            font-size: 13px;
            margin-bottom: 24px;
        }
        .meta-rad strong { color: var(--text-primary); }

        .status-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            color: white;
        }
        .status-badge.status-1 { background: var(--status-utkast); }
        .status-badge.status-2 { background: var(--status-innsendt); }
        .status-badge.status-3 { background: var(--status-avvist); }

        .seksjon {
            margin-top: 20px;
            padding: 18px 22px;
            background: var(--bg-section);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
        }
        .seksjon-tittel {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin: 0 0 14px 0;
        }
        .felt { margin-bottom: 14px; }
        .felt:last-child { margin-bottom: 0; }
        .felt-label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 4px;
            color: var(--text-primary);
        }
        .felt-nummer {
            display: inline-block;
            min-width: 22px;
            color: var(--text-secondary);
            font-weight: 500;
        }
        .felt-svar {
            padding: 8px 12px;
            background: var(--bg-svar);
            border-left: 3px solid var(--accent);
            border-radius: var(--radius-sm);
            font-size: 15px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .felt-svar.tomt {
            color: var(--text-secondary);
            font-style: italic;
            border-left-color: var(--border-color);
        }
        .felt-svar ul { margin: 4px 0 0 20px; padding: 0; }

        .md-lenke { color: var(--accent); text-decoration: underline; }
        .md-lenke:hover { opacity: 0.8; }

        .informasjon {
            /* Arves av h1-h3 inni. En overskrift uten mellomrom brøt
               ellers ut av boksen i mobilbredde. */
            overflow-wrap: anywhere;
            padding: 10px 14px;
            background: var(--accent-light);
            border-left: 3px solid var(--accent);
            border-radius: var(--radius-sm);
            font-size: 14px;
            color: var(--text-primary);
        }

        .laster, .feil {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }
        .feil { color: #ff3b30; }

        .knapperad {
            margin-top: 24px;
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }
        .knapp {
            display: inline-block;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            border: 0;
            border-radius: var(--radius-md);
            cursor: pointer;
            text-decoration: none;
        }
        .knapp.sekundær {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
        }
        .knapp.sekundær:hover { background: var(--accent-light); }
        /* `hidden` er bare en UA-regel (`display: none`), og enhver
           author-regel med `display` slår den. Uten denne linja er et skjult
           element ett `display: flex` unna å stå framme — og det ser riktig ut
           både i markupen og i koden som skjuler det. */
        [hidden] { display: none !important; }
        /* ---- Samtale (gruppechat) ---- */
        .samtale {
            background: var(--bg-container);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 16px 20px;
            margin-top: 14px;
        }
        .samtale-topp { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 10px; }
        .samtale-tittel { font-size: 16px; font-weight: 700; color: var(--accent); margin: 0 0 4px 0; }
        .samtale-demp { font-size: 12px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }
        .samtale-lukket { font-size: 12px; color: var(--text-secondary); margin: 4px 0 10px 0; }
        .samtale-liste {
            max-height: 420px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 10px 0;
        }
        .samtale-tom { font-size: 13px; color: var(--text-secondary); margin: 6px 0; }
        .samtale-innlegg {
            background: var(--bg-section);
            border-radius: var(--radius-md);
            padding: 8px 12px;
            /* En lang UPN eller en URL uten mellomrom skal ikke presse boksen
               ut av containeren — samme feil som i .brukerinfo. */
            overflow-wrap: anywhere;
        }
        .samtale-innlegg.meg { background: var(--accent-light); }
        .samtale-hode { display: flex; flex-wrap: wrap; gap: 8px; font-size: 11px; color: var(--text-secondary); margin-bottom: 3px; }
        .samtale-avsender { font-weight: 600; }
        .samtale-tekst { font-size: 13px; white-space: pre-wrap; }
        /* Skrivefeltet er en egen boks med ramme og tone.
           Uten en tydelig avgrensning fløt det sammen med innleggene over, og
           det var ikke åpenbart hvor man skulle skrive. */
        .samtale-skriv {
            margin-top: 12px;
            padding: 12px 14px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            background: var(--bg-section);
        }
        .samtale-info { font-size: 11px; color: var(--text-secondary); margin: 0 0 8px 0; }
        .samtale-felt {
            width: 100%;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 13px;
            padding: 8px 10px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            /* Lysere enn boksen rundt, så feltet leses som et felt. */
            background: var(--bg-svar);
            color: var(--text-primary);
            resize: vertical;
        }
        .samtale-felt:focus { outline: none; border-color: var(--accent); }
        .samtale-knapperad { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 10px; margin-top: 8px; }
        .samtale-status { font-size: 12px; color: var(--text-secondary); margin-right: auto; }
        .samtale-status.feil { color: var(--danger); }
        .samtale-send {
            padding: 8px 18px;
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            border: 2px solid var(--accent);
            border-radius: var(--radius-md);
            background: var(--accent);
            color: white;
            cursor: pointer;
        }
        .samtale-send:disabled { opacity: 0.5; cursor: not-allowed; }

    </style>
</head>
<body>
    <div class="container">
        <div class="topprad">
            <a href="#" class="tilbake-lenke" id="tilbake">← Tilbake</a>
            <span></span>
        </div>
        <div class="topplinje">
            <div class="tittelrad"><h1 id="tittel">Laster…</h1></div>
            <div id="systemmerke-plass"></div>
        </div>
        <div class="meta-rad" id="meta"></div>

        <div id="innhold" class="laster">Henter skjema…</div>

        <div class="knapperad" id="knapperad" style="display: none;">
            <a href="/velgskjematype.html" class="knapp sekundær" data-oversiktslenke>Til skjemaoversikten</a>
            <button class="knapp sekundær" id="last-ned-pdf" type="button">📄 Last ned som PDF</button>
        </div>
    </div>

    <script type="module">
        import { api } from './js/api-client.js';
        import { hentInnloggetBruker, styrOversiktslenker } from './js/auth.js';
        import { byggReadonlyVisning, escapeHtml, renderTekstInline, byggSvarOppslag } from './js/felt-render.js';
        import { evaluerVilkar } from './js/vilkar.js';
        import { byggSamtale } from './js/samtale.js';
        import { kommentarerFor } from './js/behandling-kommentar.js';

        // Lenken til skjemaoversikten er bare for admin, skjemaskapere og
        // eiere. Serveren avgjør (`serSkjemaoversikt`), ikke denne siden.
        styrOversiktslenker(api);

        const params = new URLSearchParams(window.location.search);
        const skjematypeId = params.get('skjematype_id');
        const skjemaId = params.get('skjema_id');

        const STATUS_TEKST = { 0: '–', 1: 'Utkast', 2: 'Innsendt', 3: 'Avvist' };

        // Modulnivå: samtalepanelet trenger den som `megId` for å merke egne
        // innlegg, og det bygges etter at init er ferdig.
        let bruker = null;

        async function init() {
            bruker = await hentInnloggetBruker();
            if (!bruker) {
                window.location.href = '/.auth/login/aad?post_login_redirect_uri=' + encodeURIComponent(window.location.pathname + window.location.search);
                return;
            }

            if (!skjematypeId || !skjemaId) {
                visFeil('Mangler skjematype_id eller skjema_id i URL.');
                return;
            }

            // Sett smart tilbake-lenke: hvis vi kom fra register, gå dit; ellers til oversikt
            //
            // Lenken får href-en sin HER, etter at modulen kjørte. Den ble
            // derfor ikke merket av `data-oversiktslenke` i markupen, og sto
            // igjen som «Til skjemaoversikten» for innsendere som ikke skal se
            // den — mens knappen nederst på siden var riktig skjult.
            //
            // Merkingen settes nå i den grenen som faktisk peker dit, og
            // regelen kjøres på nytt etterpå.
            const ref = document.referrer;
            const tilbakeEl = document.getElementById('tilbake');
            if (ref && ref.includes('/register.html')) {
                tilbakeEl.href = `/register.html?skjematype_id=${encodeURIComponent(skjematypeId)}`;
                tilbakeEl.textContent = '← Til register';
                tilbakeEl.removeAttribute('data-oversiktslenke');
            } else {
                tilbakeEl.href = '/velgskjematype.html';
                tilbakeEl.textContent = '← Til skjemaoversikten';
                tilbakeEl.setAttribute('data-oversiktslenke', '');
            }
            styrOversiktslenker(api);

            try {
                const [skjematype, skjema] = await Promise.all([
                    // skjema_id er med fordi behandleren ikke noedvendigvis er publikum
                    // paa skjematypen - se erBehandlerPaaSkjema i skjematyper.js.
                    api.get(`/api/skjematyper/${encodeURIComponent(skjematypeId)}?skjema_id=${encodeURIComponent(skjemaId)}`),
                    api.get(`/api/skjemaer/${encodeURIComponent(skjematypeId)}/${encodeURIComponent(skjemaId)}`)
                ]);
                rendrer(skjematype, skjema);
            } catch (e) {
                visFeil('Kunne ikke hente skjemaet: ' + e.message);
            }
        }

        function visFeil(tekst) {
            document.getElementById('innhold').className = 'feil';
            document.getElementById('innhold').textContent = tekst;
        }

        function rendrer(skjematype, skjema) {
            document.getElementById('tittel').textContent = skjematype.Skjema_navn || 'Skjema';
            document.title = `${skjematype.Skjema_navn || 'Skjema'} — ${skjema.Skjema_id}`;

            const meta = document.getElementById('meta');
            const status = skjema.Skjema_status ?? 0;
            const dato = formaterDato(skjema.Sist_endret || skjema.Opprettet);
            meta.innerHTML = `
                <div><strong>Skjema-ID:</strong> ${escapeHtml(skjema.Skjema_id)}</div>
                <div><strong>Innsender:</strong> ${escapeHtml(skjema.Innsender_Epost || '–')}</div>
                ${dato ? `<div><strong>Sist endret:</strong> ${escapeHtml(dato)}</div>` : ''}
                <div><strong>Status:</strong> <span class="status-badge status-${status}">${escapeHtml(STATUS_TEKST[status] || '?')}</span></div>
            `;

            // Bygg lookup: skjema.Seksjoner har svar; skjematype.Seksjoner har definisjonen
            // Id først, posisjon som fallback. Lagret visningstekst —
            // klassenavn og personnavn i stedet for koder — følger med.
            const oppslag = byggSvarOppslag(skjema.Seksjoner, skjematype.Seksjoner);

            const innhold = document.getElementById('innhold');
            innhold.className = '';
            innhold.innerHTML = '';

            // Bygg seksjoner-struktur for vilkårs-evaluering (basert på faktiske svar)
            const seksjonerMedSvar = (skjematype.Seksjoner || []).map(sek => ({
                Seksjon_nummer: sek.Seksjon_nummer,
                Nummer: sek.Seksjon_nummer,
                Felter: (sek.Felter || []).map(f => ({
                    Id: f.Id,
                    Nummer: f.Nummer,
                    Type: f.Type,
                    Svar: oppslag.svar(sek, f)
                }))
            }));

            // Vis behandlingsstatus hvis skjema har Behandling-array
            if (Array.isArray(skjema.Behandling) && skjema.Behandling.length > 0) {
                innhold.appendChild(byggBehandlingVisning(skjema.Behandling));
            }

            // Samtalen. Widgeten avgjør selv om den skal vises — den spør
            // API-et, som svarer ut fra skjematypens innstilling, rollen og
            // hvor mange innlegg som finnes.
            innhold.appendChild(byggSamtalePanel(skjema));

            // Vis dialog (backend filtrerer bort interne innlegg for innsender)
            if (Array.isArray(skjema.Dialog) && skjema.Dialog.length > 0) {
                innhold.appendChild(byggDialogVisning(skjema.Dialog));
            }

            for (const seksjon of (skjematype.Seksjoner || [])) {
                // Hopp over seksjoner som ikke skal vises
                if (seksjon.Vises && !evaluerVilkar(seksjon.Vises, seksjonerMedSvar)) continue;

                const div = document.createElement('div');
                div.className = 'seksjon';
                if (seksjon.Seksjon_overskrift) {
                    const h = document.createElement('h2');
                    h.className = 'seksjon-tittel';
                    h.textContent = seksjon.Seksjon_overskrift;
                    div.appendChild(h);
                }
                let visningsNr = 0;
                for (const felt of (seksjon.Felter || [])) {
                    // Hopp over felt som ikke skal vises
                    if (felt.Vises && !evaluerVilkar(felt.Vises, seksjonerMedSvar)) continue;
                    if (felt.Type !== 'Informasjon') visningsNr++;
                    div.appendChild(byggFelt(felt, visningsNr, oppslag.svar(seksjon, felt),
                        skjema.Skjematype_id, skjema.Skjema_id, oppslag.tekst(seksjon, felt)));
                }
                innhold.appendChild(div);
            }

            document.getElementById('knapperad').style.display = 'flex';
        }

        /**
         * Last ned skjemaet som PDF.
         *
         * Serveren returnerer base64 i JSON i stedet for en binær strøm — da
         * går kallet gjennom den vanlige api-klienten, med samme
         * autentisering og feilhåndtering som alt annet.
         */
        document.getElementById('last-ned-pdf').addEventListener('click', async (e) => {
            const knapp = e.currentTarget;
            const opprinnelig = knapp.textContent;
            knapp.disabled = true;
            knapp.textContent = 'Lager PDF…';
            try {
                const res = await api.post(
                    `/api/skjemaer/${encodeURIComponent(skjematypeId)}/${encodeURIComponent(skjemaId)}/pdf`,
                    { format: 'base64' }
                );
                const bin = atob(res.innhold);
                const bytes = new Uint8Array(bin.length);
                for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                const url = URL.createObjectURL(new Blob([bytes], { type: res.contentType || 'application/pdf' }));
                const a = document.createElement('a');
                a.href = url;
                a.download = res.filnavn || 'skjema.pdf';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                // Nettleseren trenger objektet til nedlastingen er startet.
                setTimeout(() => URL.revokeObjectURL(url), 5000);
            } catch (feil) {
                alert('Kunne ikke lage PDF: ' + feil.message);
            } finally {
                knapp.disabled = false;
                knapp.textContent = opprinnelig;
            }
        });

        function byggBehandlingVisning(behandling) {
            const div = document.createElement('div');
            div.className = 'seksjon';
            const h = document.createElement('h2');
            h.className = 'seksjon-tittel';
            h.textContent = 'Behandling';
            div.appendChild(h);

            for (const steg of behandling) {
                const rad = document.createElement('div');
                rad.style.cssText = 'padding: 10px 12px; margin: 6px 0; background: var(--bg-svar); border-left: 3px solid var(--border-color); border-radius: 8px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;';
                const status = tolkStatus(steg);
                rad.style.borderLeftColor = status.farge;

                const nrEl = document.createElement('span');
                nrEl.style.cssText = 'background: ' + status.farge + '; color: white; border-radius: 999px; width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700;';
                nrEl.textContent = steg.Steg;
                rad.appendChild(nrEl);

                const navnEl = document.createElement('span');
                navnEl.style.cssText = 'font-weight: 600; flex: 1;';
                navnEl.textContent = steg.Stegnavn || `Steg ${steg.Steg}`;
                rad.appendChild(navnEl);

                const statusEl = document.createElement('span');
                statusEl.style.cssText = 'color: ' + status.farge + '; font-weight: 600; font-size: 13px;';
                statusEl.textContent = status.tekst;
                rad.appendChild(statusEl);

                if ((steg.Personer || []).length > 0) {
                    const beh = document.createElement('div');
                    beh.style.cssText = 'width: 100%; font-size: 12px; color: var(--text-secondary); margin-top: 4px;';
                    beh.textContent = 'Behandlere: ' + steg.Personer.join(', ');
                    rad.appendChild(beh);
                }

                // Behandlerens begrunnelse. Innsenderen så den ikke noe sted
                // før 19.09.2026 — bare i e-posten, og bare hvis malen
                // tilfeldigvis brukte $kommentar.
                for (const k of kommentarerFor(steg)) {
                    const kom = document.createElement('div');
                    kom.style.cssText = 'width: 100%; font-size: 11px; color: var(--text-secondary); border-left: 2px solid var(--border-color); padding-left: 8px; margin-top: 4px;';
                    kom.textContent = k.aktor ? `${k.aktor}: ${k.kommentar}` : k.kommentar;
                    rad.appendChild(kom);
                }

                div.appendChild(rad);
            }
            return div;
        }

        /**
         * Samtalepanelet.
         *
         * `rendrer()` kalles én gang her, men pollingen stoppes likevel ved
         * hver oppbygging og på `pagehide`. En timer som overlever siden
         * fortsetter å hente ut hele økten.
         */
        let samtaleWidget = null;

        function byggSamtalePanel(skjema) {
            if (samtaleWidget) { samtaleWidget.stopp(); samtaleWidget = null; }
            const div = document.createElement('div');
            // Kvitteringen lenker hit med #samtale.
            div.id = 'samtale';
            samtaleWidget = byggSamtale(div, {
                api,
                skjematypeId: skjema.Skjematype_id || skjematypeId,
                skjemaId: skjema.Skjema_id || skjemaId,
                megId: bruker?.userDetails || skjema.Innsender_Epost || '',
                infotekst: 'Alle som behandler saken ser det du skriver her. Samtalen arkiveres '
                    + 'sammen med saken. Ikke skriv sensitive personopplysninger.'
            });
            samtaleWidget.start();
            return div;
        }

        window.addEventListener('pagehide', () => { if (samtaleWidget) samtaleWidget.stopp(); });

        function byggDialogVisning(dialog) {
            const div = document.createElement('div');
            div.className = 'seksjon';
            const h = document.createElement('h2');
            h.className = 'seksjon-tittel';
            h.textContent = 'Dialog';
            div.appendChild(h);
            for (const i of dialog) {
                const el = document.createElement('div');
                const erIntern = i.Type === 'intern';
                el.style.cssText = `padding: 10px 14px; margin: 6px 0; background: var(--bg-svar); border-left: 3px solid ${erIntern ? '#af52de' : 'var(--accent)'}; border-radius: 6px; font-size: 14px;`;
                el.innerHTML = `
                    <div style="color: var(--text-secondary); font-size: 12px; margin-bottom: 4px;">
                        <span style="display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 10px; font-weight: 600; text-transform: uppercase; color: white; background: ${erIntern ? '#af52de' : 'var(--accent)'};">${erIntern ? 'Intern' : 'Melding'}</span>
                        ${escapeHtml(i.Avsender || '')} · ${escapeHtml(formaterDato(i.Dato))}
                    </div>
                    <div style="white-space: pre-wrap; word-wrap: break-word;">${escapeHtml(i.Tekst || '')}</div>
                `;
                div.appendChild(el);
            }
            return div;
        }

        function tolkStatus(steg) {
            const b = Number(steg.Beslutning || 0);
            if (b === 0) return { tekst: 'Venter', farge: '#ff9500' };
            if (b === 5) return { tekst: 'Hoppet over', farge: '#8e8e93' };
            const valg = (steg.Beslutningsvalg || []).find(v => Number(v.Nummer) === b);
            const tekst = valg?.Tekst || `Beslutning ${b}`;
            // Enkel heuristikk for fargekoding
            const t = tekst.toLowerCase();
            if (t.includes('avslå') || t.includes('avvis')) return { tekst, farge: '#ff3b30' };
            if (t.includes('ompuss') || t.includes('revid')) return { tekst, farge: '#af52de' };
            return { tekst, farge: '#34c759' };
        }

        function byggFelt(felt, visningsNr, svar, skjematypeId, skjemaId, svarTekst = null) {
            const div = document.createElement('div');
            div.className = 'felt';

            if (felt.Type !== 'Informasjon') {
                const label = document.createElement('label');
                label.className = 'felt-label';
                label.innerHTML = `<span class="felt-nummer">${visningsNr}.</span> ${renderTekstInline(felt.Tekst)}`;
                div.appendChild(label);
                if (felt.Undertittel?.Verdi) {
                    const u = document.createElement('div');
                    u.style.cssText = 'font-size: 13px; color: var(--text-secondary); margin: 2px 0 6px;';
                    u.innerHTML = renderTekstInline(felt.Undertittel);
                    div.appendChild(u);
                }
            }
            div.appendChild(byggReadonlyVisning(felt, svar, { skjematypeId, skjemaId }, svarTekst));
            return div;
        }

        function formaterDato(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            if (isNaN(d)) return iso;
            const pad = n => String(n).padStart(2, '0');
            return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }

        init();
    </script>
    <script type="module" src="/js/systemtopp.js"></script>
    <script type="module" src="/js/faner.js"></script>
</body>
</html>
