<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skjematype-editor</title>
    <script>
        (function() {
            const t = localStorage.getItem('theme');
            if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        })();
    </script>
    <style>
        :root {
            --bg-page: #e8edf2;
            --bg-container: rgba(255, 255, 255, 0.85);
            --bg-section: rgba(255, 255, 255, 0.55);
            --bg-felt: rgba(255, 255, 255, 0.7);
            --bg-input: white;
            --text-primary: #1c1c1e;
            --text-secondary: #6e6e73;
            --text-heading: #0a84ff;
            --border-color: rgba(0, 0, 0, 0.1);
            --input-border: #d1d1d6;
            --shadow: 0 4px 30px rgba(0, 0, 0, 0.06);
            --accent: #0a84ff;
            --accent-light: rgba(10, 132, 255, 0.12);
            --danger: #ff3b30;
            --danger-light: rgba(255, 59, 48, 0.1);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 18px;
            --radius-xl: 24px;
        }
        [data-theme="dark"] {
            --bg-page: #0d1117;
            --bg-container: rgba(30, 35, 45, 0.85);
            --bg-section: rgba(40, 45, 60, 0.55);
            --bg-felt: rgba(20, 25, 35, 0.7);
            --bg-input: #1c2028;
            --text-primary: #f0f0f5;
            --text-secondary: #8e8e93;
            --text-heading: #64b5f6;
            --border-color: rgba(255, 255, 255, 0.1);
            --input-border: #3a3a5a;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-page);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--bg-container);
            backdrop-filter: blur(20px);
            padding: 28px;
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }
        .tilbake { color: var(--accent); text-decoration: none; font-size: 13px; display: inline-block; margin-bottom: 8px; }
        .tilbake:hover { text-decoration: underline; }

        .topplinje {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 4px;
            flex-wrap: wrap;
        }
        h1 { font-size: 1.5em; font-weight: 700; margin: 0; letter-spacing: -0.02em; }
        .brukerinfo { font-size: 13px; color: var(--text-secondary); }
        .brukerinfo .upn { font-weight: 500; color: var(--text-primary); }

        .knappelinje {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 16px 0;
            padding: 12px 16px;
            background: var(--bg-section);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
        }

        .panel {
            padding: 18px 20px;
            margin-bottom: 16px;
            background: var(--bg-section);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
        }
        .panel h2 {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin: 0 0 14px 0;
        }

        .rad { margin-bottom: 12px; }
        .rad:last-child { margin-bottom: 0; }
        label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 4px; }
        label small { font-weight: 400; color: var(--text-secondary); }

        input[type="text"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 8px 12px;
            font-size: 14px;
            border: 1px solid var(--input-border);
            border-radius: var(--radius-sm);
            background: var(--bg-input);
            color: var(--text-primary);
            font-family: inherit;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-light);
        }
        textarea { resize: vertical; min-height: 60px; }

        .to-kol { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .tre-kol { display: grid; grid-template-columns: 80px 1fr 1fr; gap: 12px; align-items: end; }

        .seksjon {
            padding: 16px 18px;
            margin-bottom: 14px;
            background: var(--bg-felt);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
        }
        .seksjon-topp {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 12px;
        }
        .seksjon-topp input { flex: 1; font-weight: 600; }
        .seksjon-nr {
            background: var(--accent);
            color: white;
            border-radius: 999px;
            width: 26px;
            height: 26px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
        }

        .felt {
            padding: 12px 14px;
            margin-bottom: 10px;
            background: var(--bg-container);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
        }
        .felt-topp {
            display: grid;
            grid-template-columns: 70px 1fr 160px auto;
            gap: 10px;
            align-items: center;
            margin-bottom: 8px;
        }
        .felt-nr {
            background: var(--text-secondary);
            color: white;
            border-radius: 999px;
            width: 22px;
            height: 22px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
        }
        .felt-config { padding-left: 6px; border-left: 3px solid var(--accent); margin-top: 8px; padding-top: 4px; padding-bottom: 4px; }

        .valg-liste { display: flex; flex-direction: column; gap: 6px; }
        .valg-rad { display: flex; gap: 6px; align-items: center; }
        .valg-rad input { flex: 1; }

        .checkbox-rad {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 500;
        }
        .checkbox-rad input { width: auto; }

        .knapp {
            display: inline-flex; align-items: center;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 600;
            border: 0;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-family: inherit;
            text-decoration: none;
            gap: 6px;
        }
        .knapp.primær { background: var(--accent); color: white; }
        .knapp.primær:hover { filter: brightness(1.1); }
        .knapp.primær:disabled { opacity: 0.5; cursor: not-allowed; }
        .knapp.sekundær {
            background: transparent; color: var(--accent);
            border: 1px solid var(--accent);
        }
        .knapp.sekundær:hover { background: var(--accent-light); }
        .knapp.danger {
            background: transparent; color: var(--danger);
            border: 1px solid var(--danger);
        }
        .knapp.danger:hover { background: var(--danger-light); }
        .knapp.mini { padding: 4px 10px; font-size: 12px; }

        .laster, .feilmelding { text-align: center; padding: 40px; color: var(--text-secondary); }
        .feilmelding { color: var(--danger); }

        .status-toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--accent);
            color: white;
            padding: 12px 20px;
            border-radius: var(--radius-md);
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            font-weight: 600;
            font-size: 14px;
        }
        .status-toast.vis { opacity: 1; }
        .status-toast.feil { background: var(--danger); }

        .modal-bakteppe {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.4);
            display: none;
            align-items: center; justify-content: center;
            z-index: 1000;
        }
        .modal-bakteppe.vis { display: flex; }
        .modal {
            background: var(--bg-container);
            backdrop-filter: blur(20px);
            padding: 24px 28px;
            border-radius: var(--radius-lg);
            max-width: 420px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.2);
            border: 1px solid var(--border-color);
        }
        .modal h3 { margin: 0 0 8px 0; font-size: 1.2em; }
        .modal p { margin: 0 0 20px 0; color: var(--text-secondary); }
        .modal-knapper { display: flex; gap: 10px; justify-content: flex-end; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/velgskjematype.html" class="tilbake">← Til skjemaoversikten</a>
        <div class="topplinje">
            <h1 id="tittel">Ny skjematype</h1>
            <div class="brukerinfo"><span class="upn" id="upn">…</span></div>
        </div>

        <div id="innhold" class="laster">Laster…</div>
    </div>

    <div class="status-toast" id="toast"></div>

    <div class="modal-bakteppe" id="slettModal">
        <div class="modal">
            <h3>Slett skjematype?</h3>
            <p>Skjematypen slettes permanent. Innsendte skjemaer forblir i registeret men vil ikke kunne åpnes i editor eller registeret uten definisjonen.</p>
            <div class="modal-knapper">
                <button class="knapp sekundær" onclick="lukkSlettModal()">Avbryt</button>
                <button class="knapp danger" onclick="bekreftSlett()" id="slettBekreft">Slett skjematypen</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { api } from './js/api-client.js';
        import { hentInnloggetBruker } from './js/auth.js';
        import { FELTTYPER } from './js/felt-render.js';
        import { byggDNFEditor } from './js/dnf-editor.js';

        // Tilgjengelige datakilder for FasteData i pilot.
        // Kolonner (filter-navn) matcher det oppslag-dispatcheren støtter.
        const DATAKILDER = [
            { navn: 'Postnumre', filtre: ['Kommune', 'Poststed'] },
            { navn: 'Skjematyper', filtre: ['Fase'] },
            { navn: 'Roller', filtre: ['Omfang'] },
            { navn: 'Personer', filtre: ['Rolle', 'EmneLarere', 'EmneHovedlarere', 'EmneStudenter'] },
            { navn: 'Emner', filtre: ['Termin', 'Campus'] },
            { navn: 'Studenter', filtre: ['Emne'] },
            { navn: 'Studieprogrammer', filtre: [] }
            // Team kommer med Graph API (fase 8)
        ];

        const params = new URLSearchParams(window.location.search);
        const eksisterendeId = params.get('skjematype_id');
        const kopiFraId = params.get('kopi_fra');

        let bruker = null;
        let data = null;

        async function init() {
            bruker = await hentInnloggetBruker();
            if (!bruker) {
                window.location.href = '/.auth/login/aad?post_login_redirect_uri=' + encodeURIComponent(window.location.pathname + window.location.search);
                return;
            }
            document.getElementById('upn').textContent = bruker.userDetails;

            try {
                if (eksisterendeId) {
                    data = await api.get(`/api/skjematyper/${encodeURIComponent(eksisterendeId)}?rå=1`);
                    document.getElementById('tittel').textContent = `Rediger: ${data.Skjema_navn || eksisterendeId}`;
                } else if (kopiFraId) {
                    data = await api.get(`/api/skjematyper/${encodeURIComponent(kopiFraId)}?rå=1`);
                    // Klar for kopi: fjern id, marker som ny fase, endre navn
                    delete data.Skjematype_id;
                    data.Skjema_navn = (data.Skjema_navn || '') + ' (kopi)';
                    data.Fase = 'Utvikling';
                    document.getElementById('tittel').textContent = `Ny skjematype (kopi)`;
                } else {
                    // Helt ny
                    data = tomSkjematype();
                    document.getElementById('tittel').textContent = 'Ny skjematype';
                }
                sikreFeltIder();
                rendrer();
            } catch (e) {
                visFeil('Kunne ikke laste: ' + e.message);
            }
        }

        function tomSkjematype() {
            return {
                Skjema_navn: '',
                Fase: 'Utvikling',
                Skjemaforklaring: { Innhold: '', Format: 'Tekst' },
                Publikum: { Personer: [bruker.userDetails], Roller: [], Team: [] },
                Eiere: { Personer: [bruker.userDetails], Roller: [], Team: [] },
                Seksjoner: []
            };
        }

        function sikreFeltIder() {
            // Ved lasting: gi Id til felter som mangler den (for stabile referanser)
            for (const seksjon of (data.Seksjoner || [])) {
                for (const felt of (seksjon.Felter || [])) {
                    if (felt.Type !== 'Informasjon' && !felt.Id) {
                        felt.Id = nyId();
                    }
                }
            }
        }

        function visFeil(tekst) {
            document.getElementById('innhold').className = 'feilmelding';
            document.getElementById('innhold').textContent = tekst;
        }

        function rendrer() {
            const innhold = document.getElementById('innhold');
            innhold.className = '';

            const kanSlett = !!eksisterendeId;
            const knappeLinje = `
                <div class="knappelinje">
                    <button class="knapp primær" onclick="lagre()">💾 Lagre</button>
                    ${eksisterendeId ? `<a class="knapp sekundær" href="/index.html?skjematype_id=${encodeURIComponent(eksisterendeId)}" target="_blank">👁 Test utfylling</a>` : ''}
                    ${eksisterendeId ? `<button class="knapp sekundær" onclick="kopier()">📋 Kopier</button>` : ''}
                    ${kanSlett ? `<button class="knapp danger" style="margin-left: auto;" onclick="aapneSlettModal()">🗑 Slett</button>` : ''}
                </div>
            `;

            innhold.innerHTML = knappeLinje + `
                <div class="panel">
                    <h2>Grunnleggende</h2>
                    <div class="rad">
                        <label>Skjema-navn <small>(vises i portalen)</small></label>
                        <input type="text" id="f-navn" value="${escapeAttr(data.Skjema_navn || '')}" oninput="setNavn(this.value)">
                    </div>
                    <div class="rad">
                        <label>Fase</label>
                        <select id="f-fase" onchange="setFase(this.value)">
                            <option value="Utvikling" ${data.Fase === 'Utvikling' ? 'selected' : ''}>Utvikling (kun admin)</option>
                            <option value="Test" ${data.Fase === 'Test' ? 'selected' : ''}>Test (skjult for vanlige brukere)</option>
                            <option value="Produksjon" ${data.Fase === 'Produksjon' ? 'selected' : ''}>Produksjon (synlig for alle med tilgang)</option>
                        </select>
                    </div>
                    <div class="rad">
                        <label>Skjemaforklaring
                            <small>(vises som informasjon på utfyllingssiden)</small>
                        </label>
                        <textarea id="f-forklaring" style="min-height: 90px;" oninput="setForklaring(this.value)">${escapeHtml(data.Skjemaforklaring?.Innhold || '')}</textarea>
                        <div style="margin-top: 4px; display: flex; align-items: center; gap: 8px; font-size: 12px;">
                            <span>Format:</span>
                            <label class="checkbox-rad"><input type="radio" name="fklar-format" value="Tekst" ${(data.Skjemaforklaring?.Format || 'Tekst') === 'Tekst' ? 'checked' : ''} onchange="setForklaringFormat('Tekst')"> Ren tekst</label>
                            <label class="checkbox-rad"><input type="radio" name="fklar-format" value="Markdown" ${data.Skjemaforklaring?.Format === 'Markdown' ? 'checked' : ''} onchange="setForklaringFormat('Markdown')"> Markdown</label>
                            <span style="color: var(--text-secondary); font-size: 11px;">**bold**, *italic*, [tekst](url), - lister, # overskrifter</span>
                        </div>
                    </div>
                </div>

                <div class="panel">
                    <h2>Tilgjengelighetsperioder <small style="font-weight: 400; text-transform: none;">— når utfylling er tillatt (utenfor perioden er skjemaet kun synlig for eiere)</small></h2>
                    <div id="perioder-container"></div>
                    <button class="knapp mini sekundær" onclick="leggTilPeriode()" style="margin-top: 6px;">+ Legg til periode</button>
                    <div style="font-size: 12px; color: var(--text-secondary); margin-top: 6px;">Ingen perioder = alltid tilgjengelig.</div>
                </div>

                <div class="panel">
                    <h2>Tilgang</h2>
                    <div class="rad">
                        <label>Publikum <small>(kan fylle ut skjemaet — e-postadresser, kommaseparert)</small></label>
                        <textarea id="f-publikum" oninput="setPublikum(this.value)">${escapeHtml((data.Publikum?.Personer || []).join(', '))}</textarea>
                    </div>
                    <div class="rad">
                        <label>Eiere <small>(kan se register + redigere skjematype — e-postadresser, kommaseparert)</small></label>
                        <textarea id="f-eiere" oninput="setEiere(this.value)">${escapeHtml((data.Eiere?.Personer || []).join(', '))}</textarea>
                    </div>
                </div>

                <div class="panel">
                    <h2>Seksjoner og felter</h2>
                    <div id="seksjoner-container"></div>
                    <button class="knapp sekundær" onclick="leggTilSeksjon()" style="margin-top: 12px;">+ Legg til seksjon</button>
                </div>

                <div class="panel">
                    <h2>Behandlingssteg <small style="font-weight: 400; text-transform: none;">— hvem som behandler skjemaet, i hvilken rekkefølge</small></h2>
                    <div id="behandling-container"></div>
                    <button class="knapp sekundær" onclick="leggTilSteg()" style="margin-top: 12px;">+ Legg til steg</button>
                    <div style="font-size: 12px; color: var(--text-secondary); margin-top: 8px;">
                        Ingen steg = skjemaet trenger ingen behandling etter innsending.
                    </div>
                </div>
            `;

            rendrerSeksjoner();
            rendrerBehandling();
            rendrerPerioder();
        }

        // ==================== BEHANDLINGSSTEG ====================

        function rendrerBehandling() {
            const el = document.getElementById('behandling-container');
            if (!el) return;
            const behandling = data.Behandling || [];
            if (behandling.length === 0) {
                el.innerHTML = '<div style="color: var(--text-secondary); font-size: 13px; font-style: italic;">Ingen behandlingssteg — skjemaet arkiveres direkte etter innsending.</div>';
                return;
            }
            el.innerHTML = '';
            behandling.forEach((steg, i) => el.appendChild(byggStegElement(steg, i, behandling.length)));
            // Bygg DNF-editorer for hvert stegs Vilkår
            behandling.forEach((steg, i) => {
                const slot = document.querySelector(`.dnf-slot[data-slot="steg-vilkar-${i}"]`);
                if (slot) {
                    byggDNFEditor(slot, steg.Vilkår, {
                        modus: 'vilkår',
                        feltOptions: samleReferanserForSteg(i),
                        tittel: 'Steget kjøres kun hvis',
                        onEndring: (ny) => { if (ny) steg.Vilkår = ny; else delete steg.Vilkår; }
                    });
                }
            });
        }

        function samleReferanserForSteg(stegIdx) {
            // Referanser: alle skjema-felter + alle tidligere behandlingssteg
            const refs = samleFelterFør(data.Seksjoner.length - 1, -1);
            const behandling = data.Behandling || [];
            for (let i = 0; i < stegIdx; i++) {
                const s = behandling[i];
                refs.push({ ref: `behandling-${s.Steg}`, tekst: `Steg ${s.Steg}: ${s.Stegnavn || '(uten navn)'}` });
            }
            return refs;
        }

        function byggStegElement(steg, idx, antall) {
            const div = document.createElement('div');
            div.className = 'seksjon';
            div.style.marginBottom = '12px';

            const forrigeSteg = (data.Behandling || []).slice(0, idx);
            const avhengOptions = forrigeSteg.map(s =>
                `<option value="${s.Steg}" ${steg.AvhengigAv === s.Steg ? 'selected' : ''}>Steg ${s.Steg}: ${escapeHtml(s.Stegnavn || '')}</option>`
            ).join('');

            const valgHtml = (steg.Beslutningsvalg || []).map((v, vIdx) => `
                <div class="valg-rad">
                    <input type="number" value="${v.Nummer ?? vIdx + 1}" min="1" style="width: 60px;"
                        oninput="setBeslutningsvalgNr(${idx}, ${vIdx}, this.value)">
                    <input type="text" placeholder="Tekst (Godkjent, Avslått, ...)" value="${escapeAttr(v.Tekst || '')}"
                        oninput="setBeslutningsvalgTekst(${idx}, ${vIdx}, this.value)">
                    <select onchange="setBeslutningsvalgHandling(${idx}, ${vIdx}, this.value)" style="width: 140px;" title="Spesialhandling">
                        <option value="" ${!v.Handling ? 'selected' : ''}>Vanlig</option>
                        <option value="ompuss" ${v.Handling === 'ompuss' ? 'selected' : ''}>Ompuss (retur)</option>
                    </select>
                    <button class="knapp mini danger" onclick="fjernBeslutningsvalg(${idx}, ${vIdx})">✕</button>
                </div>
            `).join('');

            div.innerHTML = `
                <div class="seksjon-topp">
                    <span class="seksjon-nr">${steg.Steg}</span>
                    <input type="text" placeholder="Steg-navn (Godkjenning, Verifisering, ...)"
                        value="${escapeAttr(steg.Stegnavn || '')}"
                        oninput="setStegNavn(${idx}, this.value)">
                    <button class="knapp mini sekundær" onclick="flyttSteg(${idx}, -1)" ${idx === 0 ? 'disabled' : ''}>↑</button>
                    <button class="knapp mini sekundær" onclick="flyttSteg(${idx}, 1)" ${idx === antall - 1 ? 'disabled' : ''}>↓</button>
                    <button class="knapp mini danger" onclick="slettSteg(${idx})">Slett steg</button>
                </div>

                <div class="rad">
                    <label>Behandlere <small>(e-postadresser, kommaseparert)</small></label>
                    <textarea style="min-height: 50px;" oninput="setStegPersoner(${idx}, this.value)">${escapeHtml((steg.Personer || []).join(', '))}</textarea>
                </div>

                <div class="rad">
                    <label>Beslutningsvalg <small>(hva behandleren kan velge)</small></label>
                    <div class="valg-liste">${valgHtml || '<div style="color: var(--text-secondary); font-size: 12px; font-style: italic;">Ingen valg — legg til under.</div>'}</div>
                    <button class="knapp mini sekundær" onclick="leggTilBeslutningsvalg(${idx})" style="margin-top: 6px;">+ Legg til valg</button>
                </div>

                ${forrigeSteg.length > 0 ? `
                    <div class="rad">
                        <label>Avhengig av <small>(kjøres først etter dette steget er ferdig — valgfritt)</small></label>
                        <select onchange="setStegAvhengig(${idx}, this.value)">
                            <option value="">(ingen — kjøres parallelt med tidligere steg)</option>
                            ${avhengOptions}
                        </select>
                    </div>
                ` : ''}

                <div class="dnf-slot" data-slot="steg-vilkar-${idx}"></div>
            `;
            return div;
        }

        window.leggTilSteg = () => {
            if (!data.Behandling) data.Behandling = [];
            const nesteNr = (data.Behandling.length > 0 ? Math.max(...data.Behandling.map(s => s.Steg)) : 0) + 1;
            data.Behandling.push({
                Steg: nesteNr,
                Stegnavn: '',
                Personer: [],
                Roller: [],
                Team: [],
                Beslutningsvalg: [
                    { Nummer: 1, Tekst: 'Godkjent' },
                    { Nummer: 2, Tekst: 'Avslått' }
                ]
            });
            rendrerBehandling();
        };
        window.slettSteg = (idx) => {
            if (!confirm('Slett dette behandlingssteget?')) return;
            data.Behandling.splice(idx, 1);
            renummererBehandling();
            rendrerBehandling();
        };
        window.flyttSteg = (idx, retning) => {
            const til = idx + retning;
            if (til < 0 || til >= data.Behandling.length) return;
            const [s] = data.Behandling.splice(idx, 1);
            data.Behandling.splice(til, 0, s);
            renummererBehandling();
            rendrerBehandling();
        };
        function renummererBehandling() {
            (data.Behandling || []).forEach((s, i) => {
                const gammel = s.Steg;
                s.Steg = i + 1;
                // Oppdater AvhengigAv-referanser i andre steg som pekte på gammel Steg
                if (gammel !== s.Steg) {
                    (data.Behandling || []).forEach(annen => {
                        if (annen.AvhengigAv === gammel) annen.AvhengigAv = s.Steg;
                    });
                }
            });
        }
        window.setStegNavn = (idx, v) => { data.Behandling[idx].Stegnavn = v; };
        window.setStegPersoner = (idx, v) => {
            data.Behandling[idx].Personer = v.split(/[,;\n]/).map(s => s.trim()).filter(Boolean);
        };
        window.setStegAvhengig = (idx, v) => {
            if (v === '') delete data.Behandling[idx].AvhengigAv;
            else data.Behandling[idx].AvhengigAv = Number(v);
        };
        window.setBeslutningsvalgNr = (sIdx, vIdx, v) => {
            data.Behandling[sIdx].Beslutningsvalg[vIdx].Nummer = Number(v) || vIdx + 1;
        };
        window.setBeslutningsvalgTekst = (sIdx, vIdx, v) => {
            data.Behandling[sIdx].Beslutningsvalg[vIdx].Tekst = v;
        };
        window.setBeslutningsvalgHandling = (sIdx, vIdx, v) => {
            if (v) data.Behandling[sIdx].Beslutningsvalg[vIdx].Handling = v;
            else delete data.Behandling[sIdx].Beslutningsvalg[vIdx].Handling;
        };
        window.leggTilBeslutningsvalg = (sIdx) => {
            const steg = data.Behandling[sIdx];
            if (!steg.Beslutningsvalg) steg.Beslutningsvalg = [];
            const nesteNr = (steg.Beslutningsvalg.length > 0 ? Math.max(...steg.Beslutningsvalg.map(v => v.Nummer || 0)) : 0) + 1;
            steg.Beslutningsvalg.push({ Nummer: nesteNr, Tekst: '' });
            rendrerBehandling();
        };
        window.fjernBeslutningsvalg = (sIdx, vIdx) => {
            data.Behandling[sIdx].Beslutningsvalg.splice(vIdx, 1);
            rendrerBehandling();
        };

        // ==================== PERIODER ====================

        function rendrerPerioder() {
            const el = document.getElementById('perioder-container');
            if (!el) return;
            const perioder = data.Tilgjengelighetsperioder || [];
            if (perioder.length === 0) {
                el.innerHTML = '<div style="color: var(--text-secondary); font-size: 13px; font-style: italic;">Ingen perioder — skjematypen er alltid tilgjengelig.</div>';
                return;
            }
            el.innerHTML = perioder.map((p, i) => `
                <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px;">
                    <input type="date" value="${escapeAttr(p.Fra || '')}" oninput="setPeriode(${i}, 'Fra', this.value)" style="max-width: 160px;">
                    <span>–</span>
                    <input type="date" value="${escapeAttr(p.Til || '')}" oninput="setPeriode(${i}, 'Til', this.value)" style="max-width: 160px;">
                    <button class="knapp mini danger" onclick="fjernPeriode(${i})">Fjern</button>
                </div>
            `).join('');
        }

        window.leggTilPeriode = () => {
            if (!data.Tilgjengelighetsperioder) data.Tilgjengelighetsperioder = [];
            data.Tilgjengelighetsperioder.push({ Fra: '', Til: '' });
            rendrerPerioder();
        };
        window.setPeriode = (i, felt, verdi) => {
            if (!data.Tilgjengelighetsperioder) return;
            data.Tilgjengelighetsperioder[i][felt] = verdi;
        };
        window.fjernPeriode = (i) => {
            data.Tilgjengelighetsperioder.splice(i, 1);
            rendrerPerioder();
        };
        window.setForklaringFormat = (f) => {
            if (!data.Skjemaforklaring) data.Skjemaforklaring = { Innhold: '' };
            data.Skjemaforklaring.Format = f;
        };

        function rendrerSeksjoner() {
            const container = document.getElementById('seksjoner-container');
            if (!data.Seksjoner || data.Seksjoner.length === 0) {
                container.innerHTML = '<div class="laster">Ingen seksjoner. Legg til en for å komme i gang.</div>';
                return;
            }
            container.innerHTML = data.Seksjoner.map((s, i) => byggSeksjonHtml(s, i)).join('');
            // Rebind alle event-handlere via delegation
            container.querySelectorAll('[data-action]').forEach(el => {
                const act = el.dataset.action;
                const sIdx = parseInt(el.dataset.seksjon, 10);
                const fIdx = el.dataset.felt !== undefined ? parseInt(el.dataset.felt, 10) : null;
                const vIdx = el.dataset.valg !== undefined ? parseInt(el.dataset.valg, 10) : null;
                el.addEventListener('click', () => håndterAksjon(act, sIdx, fIdx, vIdx));
            });
            // Populer DNF-editorer i sine slots
            byggAlleDNFEditorer();
        }

        function samleFelterFør(sIdx, fIdx) {
            // Samler felter tilgjengelig som referanse: alle i tidligere seksjoner
            // + tidligere felter i samme seksjon. Info/Opplasting hoppes over.
            const felter = [];
            for (let s = 0; s <= sIdx; s++) {
                const seksjon = data.Seksjoner[s];
                if (!seksjon) continue;
                for (let f = 0; f < (seksjon.Felter || []).length; f++) {
                    if (s === sIdx && fIdx >= 0 && f >= fIdx) break;
                    const felt = seksjon.Felter[f];
                    if (felt.Type === 'Informasjon' || felt.Type === 'Opplasting') continue;
                    const ref = felt.Id || `${seksjon.Seksjon_nummer}-${felt.Nummer}`;
                    const tekst = felt.Tekst?.Verdi || '(uten tekst)';
                    felter.push({ ref, tekst: `S${seksjon.Seksjon_nummer}-F${felt.Nummer}: ${tekst.substring(0, 40)}` });
                }
            }
            return felter;
        }

        function byggAlleDNFEditorer() {
            (data.Seksjoner || []).forEach((seksjon, sIdx) => {
                // Seksjon-Vises (referanser fra tidligere seksjoner)
                const sSlot = document.querySelector(`.dnf-slot[data-slot="ses-vises-${sIdx}"]`);
                if (sSlot) {
                    byggDNFEditor(sSlot, seksjon.Vises, {
                        modus: 'vilkår',
                        feltOptions: samleFelterFør(sIdx - 1, -1),
                        tittel: 'Seksjon vises kun hvis',
                        onEndring: (ny) => { if (ny) seksjon.Vises = ny; else delete seksjon.Vises; }
                    });
                }
                (seksjon.Felter || []).forEach((felt, fIdx) => {
                    if (felt.Type === 'Informasjon') return;

                    const vSlot = document.querySelector(`.dnf-slot[data-slot="felt-vises-${sIdx}-${fIdx}"]`);
                    if (vSlot) {
                        byggDNFEditor(vSlot, felt.Vises, {
                            modus: 'vilkår',
                            feltOptions: samleFelterFør(sIdx, fIdx),
                            tittel: 'Felt vises kun hvis',
                            onEndring: (ny) => { if (ny) felt.Vises = ny; else delete felt.Vises; }
                        });
                    }
                    const oSlot = document.querySelector(`.dnf-slot[data-slot="felt-oblig-${sIdx}-${fIdx}"]`);
                    if (oSlot) {
                        byggDNFEditor(oSlot, felt.ObligatoriskHvis, {
                            modus: 'vilkår',
                            feltOptions: samleFelterFør(sIdx, fIdx),
                            tittel: 'Obligatorisk hvis',
                            onEndring: (ny) => { if (ny) felt.ObligatoriskHvis = ny; else delete felt.ObligatoriskHvis; }
                        });
                    }
                    if (kanHaFasteData(felt.Type)) {
                        const fdSlot = document.querySelector(`.dnf-slot[data-slot="felt-fastedata-${sIdx}-${fIdx}"]`);
                        if (fdSlot) {
                            byggDNFEditor(fdSlot, felt.FasteData && typeof felt.FasteData === 'object' ? felt.FasteData : null, {
                                modus: 'faste-data',
                                datakilder: DATAKILDER,
                                tittel: 'Hent Valg-liste fra datakilde',
                                onEndring: (ny) => { if (ny) felt.FasteData = ny; else delete felt.FasteData; }
                            });
                        }
                    }
                });
            });
        }

        function byggSeksjonHtml(seksjon, sIdx) {
            const feltHtml = (seksjon.Felter || []).map((f, fIdx) => byggFeltHtml(f, sIdx, fIdx, seksjon.Felter.length)).join('');
            return `
                <div class="seksjon">
                    <div class="seksjon-topp">
                        <span class="seksjon-nr">${sIdx + 1}</span>
                        <input type="text" placeholder="Overskrift…"
                            value="${escapeAttr(seksjon.Seksjon_overskrift || '')}"
                            oninput="setSeksjonOverskrift(${sIdx}, this.value)">
                        <button class="knapp mini sekundær" data-action="flytt-seksjon-opp" data-seksjon="${sIdx}" ${sIdx === 0 ? 'disabled' : ''}>↑</button>
                        <button class="knapp mini sekundær" data-action="flytt-seksjon-ned" data-seksjon="${sIdx}" ${sIdx === data.Seksjoner.length - 1 ? 'disabled' : ''}>↓</button>
                        <button class="knapp mini danger" data-action="slett-seksjon" data-seksjon="${sIdx}">Slett seksjon</button>
                    </div>
                    <div class="dnf-slot" data-slot="ses-vises-${sIdx}" style="margin-bottom: 8px;"></div>
                    ${feltHtml || '<div style="color: var(--text-secondary); font-size: 13px; padding: 8px;">Ingen felter i denne seksjonen.</div>'}
                    <div style="margin-top: 10px;">
                        <button class="knapp mini sekundær" data-action="legg-til-felt" data-seksjon="${sIdx}">+ Legg til felt</button>
                    </div>
                </div>
            `;
        }

        function byggFeltHtml(felt, sIdx, fIdx, antall) {
            const typeOpts = FELTTYPER.map(t =>
                `<option value="${t}" ${felt.Type === t ? 'selected' : ''}>${t}</option>`
            ).join('');

            const config = byggFeltConfigHtml(felt, sIdx, fIdx);

            return `
                <div class="felt">
                    <div class="felt-topp">
                        <div style="display: flex; gap: 4px; align-items: center;">
                            <span class="felt-nr">${felt.Nummer || (fIdx + 1)}</span>
                        </div>
                        <input type="text" placeholder="Spørsmål / label…"
                            value="${escapeAttr(felt.Tekst?.Verdi || '')}"
                            oninput="setFeltTekst(${sIdx}, ${fIdx}, this.value)">
                        <select onchange="setFeltType(${sIdx}, ${fIdx}, this.value)">
                            ${typeOpts}
                        </select>
                        <div style="display: flex; gap: 4px;">
                            <button class="knapp mini sekundær" data-action="flytt-felt-opp" data-seksjon="${sIdx}" data-felt="${fIdx}" ${fIdx === 0 ? 'disabled' : ''}>↑</button>
                            <button class="knapp mini sekundær" data-action="flytt-felt-ned" data-seksjon="${sIdx}" data-felt="${fIdx}" ${fIdx === antall - 1 ? 'disabled' : ''}>↓</button>
                            <button class="knapp mini sekundær" data-action="kopier-felt" data-seksjon="${sIdx}" data-felt="${fIdx}" title="Kopier felt">⧉</button>
                            <button class="knapp mini danger" data-action="slett-felt" data-seksjon="${sIdx}" data-felt="${fIdx}">✕</button>
                        </div>
                    </div>
                    <div class="felt-config">${config}</div>
                    ${felt.Type !== 'Informasjon' ? `<div class="dnf-slot" data-slot="felt-vises-${sIdx}-${fIdx}" style="margin-top: 8px;"></div>` : ''}
                    ${felt.Type !== 'Informasjon' ? `<div class="dnf-slot" data-slot="felt-oblig-${sIdx}-${fIdx}" style="margin-top: 8px;"></div>` : ''}
                    ${kanHaFasteData(felt.Type) ? `<div class="dnf-slot" data-slot="felt-fastedata-${sIdx}-${fIdx}" style="margin-top: 8px;"></div>` : ''}
                </div>
            `;
        }

        function kanHaFasteData(type) {
            return type === 'Flervalg-dropdown' || type === 'Flervalg-knapper' || type === 'Skala';
        }

        function byggFeltConfigHtml(felt, sIdx, fIdx) {
            const undertittel = felt.Type === 'Informasjon' ? '' : `
                <div class="rad">
                    <label>Undertittel <small>(vises under spørsmålet — valgfritt)</small></label>
                    <input type="text" value="${escapeAttr(felt.Undertittel?.Verdi || '')}"
                        placeholder="Hjelpetekst / presisering"
                        oninput="setUndertittel(${sIdx}, ${fIdx}, this.value)">
                </div>
            `;

            const oblig = felt.Type === 'Informasjon' ? '' : `
                <label class="checkbox-rad" style="margin-top: 6px;">
                    <input type="checkbox" ${felt.Obligatorisk ? 'checked' : ''}
                        onchange="setFeltObligatorisk(${sIdx}, ${fIdx}, this.checked)">
                    Obligatorisk
                </label>
                <label class="checkbox-rad" style="margin-top: 4px;">
                    <input type="checkbox" ${felt.Filtrerbar_i_register ? 'checked' : ''}
                        onchange="setFeltProp(${sIdx}, ${fIdx}, 'Filtrerbar_i_register', this.checked)">
                    Filtrerbar i register/datauttrekk
                </label>
            `;

            let typeConfig = '';
            switch (felt.Type) {
                case 'Tekst':
                    typeConfig = `
                        <label class="checkbox-rad">
                            <input type="checkbox" ${felt.Flerlinje ? 'checked' : ''}
                                onchange="setFeltProp(${sIdx}, ${fIdx}, 'Flerlinje', this.checked)">
                            Flerlinje
                        </label>
                    `;
                    break;
                case 'Tall':
                    typeConfig = `
                        <div class="to-kol">
                            <div>
                                <label>Min-verdi</label>
                                <input type="number" value="${felt.Min_verdi ?? ''}"
                                    oninput="setFeltProp(${sIdx}, ${fIdx}, 'Min_verdi', this.value === '' ? null : Number(this.value))">
                            </div>
                            <div>
                                <label>Maks-verdi</label>
                                <input type="number" value="${felt.Max_verdi ?? ''}"
                                    oninput="setFeltProp(${sIdx}, ${fIdx}, 'Max_verdi', this.value === '' ? null : Number(this.value))">
                            </div>
                        </div>
                    `;
                    break;
                case 'Skala':
                case 'Flervalg-knapper':
                case 'Flervalg-dropdown': {
                    const valg = felt.Valg || [];
                    const skalaHar = felt.Type === 'Skala';
                    const maksInput = felt.Type === 'Flervalg-knapper' ? `
                        <div style="margin-top: 8px;">
                            <label>Maks antall valg</label>
                            <input type="number" min="1" value="${felt.Max_valg || 1}"
                                oninput="setFeltProp(${sIdx}, ${fIdx}, 'Max_valg', Number(this.value) || 1)"
                                style="width: 80px;">
                        </div>
                    ` : '';
                    typeConfig = `
                        <label>Alternativer</label>
                        <div class="valg-liste">
                            ${valg.map((v, vIdx) => `
                                <div class="valg-rad">
                                    ${skalaHar ? `<input type="number" value="${v.Valg_nr ?? vIdx + 1}" style="width: 60px;"
                                        oninput="setValgNr(${sIdx}, ${fIdx}, ${vIdx}, this.value)">` : ''}
                                    <input type="text" placeholder="Tekst" value="${escapeAttr(v.Tekst || '')}"
                                        oninput="setValgTekst(${sIdx}, ${fIdx}, ${vIdx}, this.value)">
                                    <button class="knapp mini danger" data-action="slett-valg" data-seksjon="${sIdx}" data-felt="${fIdx}" data-valg="${vIdx}">✕</button>
                                </div>
                            `).join('')}
                        </div>
                        <button class="knapp mini sekundær" data-action="legg-til-valg" data-seksjon="${sIdx}" data-felt="${fIdx}" style="margin-top: 6px;">+ Legg til alternativ</button>
                        ${maksInput}
                    `;
                    break;
                }
                case 'Informasjon':
                    typeConfig = `<div style="color: var(--text-secondary); font-size: 12px;">Vises som informasjonstekst — ingen inntasting.</div>`;
                    break;
                case 'Dato':
                    typeConfig = '';
                    break;
            }

            return undertittel + oblig + (typeConfig ? '<div style="margin-top: 8px;">' + typeConfig + '</div>' : '');
        }

        window.setUndertittel = (sIdx, fIdx, v) => {
            const felt = data.Seksjoner[sIdx].Felter[fIdx];
            if (!felt.Undertittel) felt.Undertittel = { Format: 'Tekst' };
            felt.Undertittel.Verdi = v;
        };

        function håndterAksjon(action, sIdx, fIdx, vIdx) {
            switch (action) {
                case 'flytt-seksjon-opp': flyttSeksjon(sIdx, -1); break;
                case 'flytt-seksjon-ned': flyttSeksjon(sIdx, 1); break;
                case 'slett-seksjon':
                    if (confirm('Slett hele seksjonen?')) slettSeksjon(sIdx);
                    break;
                case 'legg-til-felt': leggTilFelt(sIdx); break;
                case 'flytt-felt-opp': flyttFelt(sIdx, fIdx, -1); break;
                case 'flytt-felt-ned': flyttFelt(sIdx, fIdx, 1); break;
                case 'kopier-felt': kopierFelt(sIdx, fIdx); break;
                case 'slett-felt':
                    if (confirm('Slett feltet?')) slettFelt(sIdx, fIdx);
                    break;
                case 'legg-til-valg': leggTilValg(sIdx, fIdx); break;
                case 'slett-valg': slettValg(sIdx, fIdx, vIdx); break;
            }
        }

        // ---- Metadata-settere ----
        window.setNavn = v => { data.Skjema_navn = v; };
        window.setFase = v => { data.Fase = v; };
        window.setForklaring = v => {
            if (!data.Skjemaforklaring) data.Skjemaforklaring = { Format: 'Tekst' };
            data.Skjemaforklaring.Innhold = v;
        };
        window.setPublikum = v => {
            if (!data.Publikum) data.Publikum = { Roller: [], Team: [] };
            data.Publikum.Personer = v.split(/[,;\n]/).map(s => s.trim()).filter(Boolean);
        };
        window.setEiere = v => {
            if (!data.Eiere) data.Eiere = { Roller: [], Team: [] };
            data.Eiere.Personer = v.split(/[,;\n]/).map(s => s.trim()).filter(Boolean);
        };

        // ---- Seksjon ----
        window.leggTilSeksjon = () => {
            const nr = (data.Seksjoner?.length || 0) + 1;
            if (!data.Seksjoner) data.Seksjoner = [];
            data.Seksjoner.push({ Seksjon_nummer: nr, Seksjon_overskrift: '', Felter: [] });
            rendrerSeksjoner();
        };
        window.setSeksjonOverskrift = (sIdx, v) => {
            data.Seksjoner[sIdx].Seksjon_overskrift = v;
        };
        function slettSeksjon(sIdx) {
            data.Seksjoner.splice(sIdx, 1);
            renummererSeksjoner();
            rendrerSeksjoner();
        }
        function flyttSeksjon(sIdx, retning) {
            const til = sIdx + retning;
            if (til < 0 || til >= data.Seksjoner.length) return;
            const [s] = data.Seksjoner.splice(sIdx, 1);
            data.Seksjoner.splice(til, 0, s);
            renummererSeksjoner();
            rendrerSeksjoner();
        }
        function renummererSeksjoner() {
            data.Seksjoner.forEach((s, i) => { s.Seksjon_nummer = i + 1; });
        }

        // ---- Felt ----
        function nyId() {
            return crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
        }

        function leggTilFelt(sIdx) {
            const seksjon = data.Seksjoner[sIdx];
            const nr = String((seksjon.Felter?.length || 0) + 1).padStart(2, '0');
            if (!seksjon.Felter) seksjon.Felter = [];
            seksjon.Felter.push({
                Id: nyId(),
                Nummer: nr,
                Type: 'Tekst',
                Tekst: { Verdi: '', Format: 'Tekst' },
                Obligatorisk: false
            });
            rendrerSeksjoner();
        }
        window.setFeltTekst = (sIdx, fIdx, v) => {
            const felt = data.Seksjoner[sIdx].Felter[fIdx];
            if (!felt.Tekst) felt.Tekst = { Format: 'Tekst' };
            felt.Tekst.Verdi = v;
        };
        window.setFeltType = (sIdx, fIdx, v) => {
            const felt = data.Seksjoner[sIdx].Felter[fIdx];
            felt.Type = v;
            // Legg default Valg for typer som trenger det
            if (['Skala', 'Flervalg-knapper', 'Flervalg-dropdown'].includes(v) && !felt.Valg?.length) {
                felt.Valg = v === 'Skala'
                    ? [{ Valg_nr: 1, Tekst: 'Lav' }, { Valg_nr: 2, Tekst: 'Middels' }, { Valg_nr: 3, Tekst: 'Høy' }]
                    : [{ Tekst: 'Alternativ 1' }, { Tekst: 'Alternativ 2' }];
            }
            rendrerSeksjoner();
        };
        window.setFeltObligatorisk = (sIdx, fIdx, v) => {
            data.Seksjoner[sIdx].Felter[fIdx].Obligatorisk = v;
        };
        window.setFeltProp = (sIdx, fIdx, prop, v) => {
            data.Seksjoner[sIdx].Felter[fIdx][prop] = v;
        };
        function slettFelt(sIdx, fIdx) {
            data.Seksjoner[sIdx].Felter.splice(fIdx, 1);
            renummererFelter(sIdx);
            rendrerSeksjoner();
        }
        function flyttFelt(sIdx, fIdx, retning) {
            const felter = data.Seksjoner[sIdx].Felter;
            const til = fIdx + retning;
            if (til < 0 || til >= felter.length) return;
            const [f] = felter.splice(fIdx, 1);
            felter.splice(til, 0, f);
            renummererFelter(sIdx);
            rendrerSeksjoner();
        }

        function kopierFelt(sIdx, fIdx) {
            const felter = data.Seksjoner[sIdx].Felter;
            const original = felter[fIdx];
            const kopi = JSON.parse(JSON.stringify(original));
            kopi.Id = nyId(); // ny stabile referanse-id
            const opprinneligTekst = kopi.Tekst?.Verdi || '';
            if (kopi.Tekst) kopi.Tekst.Verdi = opprinneligTekst + ' (kopi)';
            felter.splice(fIdx + 1, 0, kopi);
            renummererFelter(sIdx);
            rendrerSeksjoner();
        }
        function renummererFelter(sIdx) {
            data.Seksjoner[sIdx].Felter.forEach((f, i) => {
                f.Nummer = String(i + 1).padStart(2, '0');
            });
        }

        // ---- Valg ----
        function leggTilValg(sIdx, fIdx) {
            const felt = data.Seksjoner[sIdx].Felter[fIdx];
            if (!felt.Valg) felt.Valg = [];
            if (felt.Type === 'Skala') {
                felt.Valg.push({ Valg_nr: felt.Valg.length + 1, Tekst: '' });
            } else {
                felt.Valg.push({ Tekst: '' });
            }
            rendrerSeksjoner();
        }
        window.setValgTekst = (sIdx, fIdx, vIdx, v) => {
            data.Seksjoner[sIdx].Felter[fIdx].Valg[vIdx].Tekst = v;
        };
        window.setValgNr = (sIdx, fIdx, vIdx, v) => {
            data.Seksjoner[sIdx].Felter[fIdx].Valg[vIdx].Valg_nr = Number(v) || 0;
        };
        function slettValg(sIdx, fIdx, vIdx) {
            data.Seksjoner[sIdx].Felter[fIdx].Valg.splice(vIdx, 1);
            rendrerSeksjoner();
        }

        // ---- Lagre / Slett / Kopier ----
        window.lagre = async () => {
            if (!data.Skjema_navn?.trim()) {
                toast('Skjema-navn er påkrevd', 'feil');
                return;
            }
            try {
                const svar = await api.post('/api/skjematyper', data);
                data.Skjematype_id = svar.Skjematype_id;
                toast('Lagret ✓');
                // Hvis dette var ny, oppdater URL slik at ytterligere lagringer blir oppdatering
                if (svar.erNy) {
                    const nyUrl = `/editor.html?skjematype_id=${encodeURIComponent(svar.Skjematype_id)}`;
                    window.history.replaceState({}, '', nyUrl);
                    // Re-rendrer med knappelinje som viser Test/Kopier/Slett
                    location.reload();
                }
            } catch (e) {
                toast('Kunne ikke lagre: ' + e.message, 'feil');
            }
        };
        window.kopier = () => {
            window.location.href = `/editor.html?kopi_fra=${encodeURIComponent(eksisterendeId)}`;
        };
        window.aapneSlettModal = () => {
            document.getElementById('slettModal').classList.add('vis');
        };
        window.lukkSlettModal = () => {
            document.getElementById('slettModal').classList.remove('vis');
        };
        window.bekreftSlett = async () => {
            const btn = document.getElementById('slettBekreft');
            btn.disabled = true;
            btn.textContent = 'Sletter…';
            try {
                await api.del(`/api/skjematyper/${encodeURIComponent(eksisterendeId)}`);
                window.location.href = '/velgskjematype.html';
            } catch (e) {
                btn.disabled = false;
                btn.textContent = 'Slett skjematypen';
                toast('Kunne ikke slette: ' + e.message, 'feil');
            }
        };

        function toast(tekst, type) {
            const el = document.getElementById('toast');
            el.textContent = tekst;
            el.className = 'status-toast vis' + (type === 'feil' ? ' feil' : '');
            setTimeout(() => el.classList.remove('vis'), 2500);
        }

        function escapeHtml(s) {
            return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
        function escapeAttr(s) {
            return String(s ?? '').replace(/"/g, '&quot;').replace(/'/g, "\\'");
        }

        init();
    </script>
</body>
</html>
