<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skjematype-editor</title>
    <script>
        (function() {
            const t = localStorage.getItem('theme');
            if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        })();
    </script>
    <style>
        :root {
            --bg-page: #e8edf2;
            --bg-container: rgba(255, 255, 255, 0.85);
            --bg-section: rgba(255, 255, 255, 0.55);
            --bg-felt: rgba(255, 255, 255, 0.7);
            --bg-input: white;
            --text-primary: #1c1c1e;
            --text-secondary: #6e6e73;
            --text-heading: #0a84ff;
            --border-color: rgba(0, 0, 0, 0.1);
            --input-border: #d1d1d6;
            --shadow: 0 4px 30px rgba(0, 0, 0, 0.06);
            --accent: #0a84ff;
            --accent-light: rgba(10, 132, 255, 0.12);
            --danger: #ff3b30;
            --danger-light: rgba(255, 59, 48, 0.1);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 18px;
            --radius-xl: 24px;
        }
        [data-theme="dark"] {
            --bg-page: #0d1117;
            --bg-container: rgba(30, 35, 45, 0.85);
            --bg-section: rgba(40, 45, 60, 0.55);
            --bg-felt: rgba(20, 25, 35, 0.7);
            --bg-input: #1c2028;
            --text-primary: #f0f0f5;
            --text-secondary: #8e8e93;
            --text-heading: #64b5f6;
            --border-color: rgba(255, 255, 255, 0.1);
            --input-border: #3a3a5a;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-page);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--bg-container);
            backdrop-filter: blur(20px);
            padding: 28px;
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }
        .tilbake { color: var(--accent); text-decoration: none; font-size: 13px; display: inline-block; margin-bottom: 8px; }
        .tilbake:hover { text-decoration: underline; }

        .topplinje {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 4px;
            flex-wrap: wrap;
        }
        h1 { font-size: 1.5em; font-weight: 700; margin: 0; letter-spacing: -0.02em; }
        .brukerinfo { font-size: 13px; color: var(--text-secondary); }
        .brukerinfo .upn { font-weight: 500; color: var(--text-primary); }

        .knappelinje {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 16px 0;
            padding: 12px 16px;
            background: var(--bg-section);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
        }

        .panel {
            padding: 18px 20px;
            margin-bottom: 16px;
            background: var(--bg-section);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
        }
        .panel h2 {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin: 0 0 14px 0;
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .panel h2:hover { color: var(--text-primary); }
        .kollaps-pil {
            display: inline-block;
            font-size: 10px;
            transition: transform 0.15s ease;
            color: var(--text-secondary);
            width: 12px;
        }
        .panel.kollapset .kollaps-pil,
        .seksjon.kollapset .kollaps-pil,
        .felt.kollapset .kollaps-pil { transform: rotate(-90deg); }
        .panel.kollapset > *:not(h2) { display: none !important; }
        .panel.kollapset { padding-bottom: 10px; }
        .panel.kollapset h2 { margin-bottom: 0; }

        .kollaps-verktoy {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
            justify-content: flex-end;
        }
        .kollaps-verktoy .knapp.mini { padding: 4px 10px; font-size: 12px; }

        .seksjon.kollapset .seksjon-innhold { display: none !important; }
        .seksjon-innhold { margin-top: 10px; }
        .seksjon-kollaps-btn, .felt-kollaps-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 14px;
            padding: 2px 6px;
            border-radius: 4px;
            transition: transform 0.15s ease;
        }
        .seksjon-kollaps-btn:hover, .felt-kollaps-btn:hover {
            background: var(--accent-light);
            color: var(--accent);
        }
        .seksjon.kollapset .seksjon-kollaps-btn,
        .felt.kollapset .felt-kollaps-btn { transform: rotate(-90deg); }

        .felt.kollapset .felt-config,
        .felt.kollapset > .dnf-slot { display: none !important; }
        .felt.kollapset { padding-bottom: 12px; }

        .rad { margin-bottom: 12px; }
        .rad:last-child { margin-bottom: 0; }
        label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 4px; }
        label small { font-weight: 400; color: var(--text-secondary); }

        input[type="text"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 8px 12px;
            font-size: 14px;
            border: 1px solid var(--input-border);
            border-radius: var(--radius-sm);
            background: var(--bg-input);
            color: var(--text-primary);
            font-family: inherit;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-light);
        }
        textarea { resize: vertical; min-height: 60px; }

        .to-kol { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .tre-kol { display: grid; grid-template-columns: 80px 1fr 1fr; gap: 12px; align-items: end; }

        .seksjon {
            padding: 16px 18px;
            margin-bottom: 14px;
            background: var(--bg-felt);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
        }
        .seksjon-topp {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 12px;
        }
        .seksjon-topp input { flex: 1; font-weight: 600; }
        .seksjon-nr {
            background: var(--accent);
            color: white;
            border-radius: 999px;
            width: 26px;
            height: 26px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
        }

        .felt {
            padding: 12px 14px;
            margin-bottom: 10px;
            background: var(--bg-container);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
        }
        .felt-topp {
            display: grid;
            grid-template-columns: 70px 1fr 160px auto;
            gap: 10px;
            align-items: center;
            margin-bottom: 8px;
        }
        .felt-nr {
            background: var(--text-secondary);
            color: white;
            border-radius: 999px;
            width: 22px;
            height: 22px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
        }
        .felt-config { padding-left: 6px; border-left: 3px solid var(--accent); margin-top: 8px; padding-top: 4px; padding-bottom: 4px; }

        .valg-liste { display: flex; flex-direction: column; gap: 6px; }
        .valg-rad { display: flex; gap: 6px; align-items: center; }
        .valg-rad input { flex: 1; }

        .checkbox-rad {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 500;
        }
        .checkbox-rad input { width: auto; }

        .knapp {
            display: inline-flex; align-items: center;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 600;
            border: 0;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-family: inherit;
            text-decoration: none;
            gap: 6px;
        }
        .knapp.primær { background: var(--accent); color: white; }
        .knapp.primær:hover { filter: brightness(1.1); }
        .knapp.primær:disabled { opacity: 0.5; cursor: not-allowed; }
        .knapp.sekundær {
            background: transparent; color: var(--accent);
            border: 1px solid var(--accent);
        }
        .knapp.sekundær:hover { background: var(--accent-light); }
        .knapp.danger {
            background: transparent; color: var(--danger);
            border: 1px solid var(--danger);
        }
        .knapp.danger:hover { background: var(--danger-light); }
        .knapp.mini { padding: 4px 10px; font-size: 12px; }

        .laster, .feilmelding { text-align: center; padding: 40px; color: var(--text-secondary); }
        .feilmelding { color: var(--danger); }

        .status-toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--accent);
            color: white;
            padding: 12px 20px;
            border-radius: var(--radius-md);
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            font-weight: 600;
            font-size: 14px;
        }
        .status-toast.vis { opacity: 1; }
        .status-toast.feil { background: var(--danger); }

        .modal-bakteppe {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.4);
            display: none;
            align-items: center; justify-content: center;
            z-index: 1000;
        }
        .modal-bakteppe.vis { display: flex; }
        .modal {
            background: var(--bg-container);
            backdrop-filter: blur(20px);
            padding: 24px 28px;
            border-radius: var(--radius-lg);
            max-width: 420px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.2);
            border: 1px solid var(--border-color);
        }
        .modal h3 { margin: 0 0 8px 0; font-size: 1.2em; }
        .modal p { margin: 0 0 20px 0; color: var(--text-secondary); }
        .modal-knapper { display: flex; gap: 10px; justify-content: flex-end; }
        /* ===== Modal-knapp (delt) ===== */
        .modal-knapp {
            padding: 8px 20px;
            border-radius: 8px;
            border: 1px solid var(--input-border);
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
        }
        .modal-knapp.primær { background: var(--accent); color: white; border-color: var(--accent); }
        .modal-knapp.primær:hover { filter: brightness(1.1); }
        .modal-knapp:hover { background: var(--accent-light); }

        /* ===== Melding-editor-modal ===== */
        .meldingsmodal-bakgrunn {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.45);
            display: flex; align-items: center; justify-content: center;
            z-index: 9999; padding: 20px;
        }
        .meldingsmodal-boks {
            background: var(--bg-container);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 20px 24px;
            width: 100%;
            max-width: 720px;
            max-height: 92vh;
            overflow-y: auto;
            box-shadow: 0 12px 40px rgba(0,0,0,0.25);
        }
        .meldingsmodal-topp {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px;
        }
        .meldingsmodal-tittel { margin: 0; font-size: 17px; font-weight: 600; }
        .meldingsmodal-lukk {
            background: transparent; border: none; font-size: 20px; cursor: pointer;
            color: var(--text-secondary); padding: 0 6px;
        }
        .meldingsmodal-label { display: block; font-size: 12px; font-weight: 600; margin: 8px 0 4px; }
        .meldingsmodal-label small { font-weight: 400; color: var(--text-secondary); margin-left: 6px; }
        .meldingsmodal-emne {
            width: 100%; padding: 8px 10px; font-size: 14px;
            border: 1px solid var(--input-border); border-radius: 6px;
            background: var(--bg-input); color: var(--text-primary);
        }
        .meldingsmodal-toolbar {
            display: flex; gap: 4px; padding: 4px; background: rgba(0,0,0,0.03);
            border: 1px solid var(--input-border); border-bottom: none;
            border-radius: 6px 6px 0 0;
        }
        .meldingsmodal-toolbar button {
            padding: 4px 10px; font-size: 13px; border: 1px solid transparent;
            background: transparent; cursor: pointer; border-radius: 4px; min-width: 30px;
        }
        .meldingsmodal-toolbar button:hover { background: var(--accent-light); border-color: var(--accent); }
        .meldingsmodal-sep {
            display: inline-block; width: 1px; background: var(--border-color); margin: 2px 4px;
        }
        .meldingsmodal-body, .meldingsmodal-html {
            width: 100%; min-height: 180px;
            padding: 10px 12px; font-size: 14px; line-height: 1.5;
            border: 1px solid var(--input-border); border-radius: 0 0 6px 6px;
            background: var(--bg-input); color: var(--text-primary);
            box-sizing: border-box;
        }
        .meldingsmodal-html { font-family: 'SF Mono', Menlo, monospace; font-size: 12px; }
        .meldingsmodal-body:focus, .meldingsmodal-html:focus, .meldingsmodal-emne:focus {
            outline: none; border-color: var(--accent);
        }
        .meldingsmodal-chips { display: flex; flex-wrap: wrap; gap: 4px; }
        .meldingsmodal-chip {
            padding: 3px 10px; font-size: 12px; font-family: 'SF Mono', Menlo, monospace;
            border: 1px solid var(--accent); background: var(--accent-light);
            color: var(--accent); border-radius: 999px; cursor: pointer;
        }
        .meldingsmodal-chip:hover { background: var(--accent); color: white; }
        .meldingsmodal-feltdropdown {
            width: 100%; padding: 6px 10px; font-size: 13px;
            border: 1px solid var(--input-border); border-radius: 6px;
            background: var(--bg-input); color: var(--text-primary);
        }
        .meldingsmodal-knapper {
            display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px;
        }

        /* ===== Varsling-checkbokser ===== */
        .varsling-kanaler {
            display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px;
        }
        .varsling-kanal {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 4px 10px; font-size: 12px;
            border: 1px solid var(--border-color); border-radius: 999px;
            background: var(--bg-input); cursor: pointer;
        }
        .varsling-kanal.aktiv { background: var(--accent-light); border-color: var(--accent); color: var(--accent); font-weight: 600; }
        .varsling-kanal input[type="checkbox"] { margin: 0; }
        .varsling-kanal input:disabled + span { color: var(--text-secondary); }
        .varsling-kanal.disabled { opacity: 0.55; cursor: not-allowed; }

        .flyt-boks {
            padding: 10px 12px;
            border: 1px dashed var(--accent);
            border-radius: 8px;
            background: rgba(10, 132, 255, 0.04);
        }
        .flyt-boks input, .flyt-boks textarea { font-family: 'SF Mono', Menlo, monospace; font-size: 12px; }
        .steg-vanlig.dempet {
            opacity: 0.4;
            pointer-events: none;
            filter: grayscale(0.5);
        }

        .melding-oppsummering {
            display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
            padding: 6px 10px; margin-top: 6px;
            border: 1px dashed var(--border-color); border-radius: 6px;
            background: rgba(0,0,0,0.02); font-size: 12px;
        }
        .melding-oppsummering .emne-forhandsvis {
            flex: 1; min-width: 0; color: var(--text-secondary);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .melding-oppsummering .emne-forhandsvis.standard { font-style: italic; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/velgskjematype.html" class="tilbake">← Til skjemaoversikten</a>
        <div class="topplinje">
            <h1 id="tittel">Ny skjematype</h1>
            <div class="brukerinfo"><span class="upn" id="upn">…</span></div>
        </div>

        <div id="innhold" class="laster">Laster…</div>
    </div>

    <div class="status-toast" id="toast"></div>

    <div class="modal-bakteppe" id="slettModal">
        <div class="modal">
            <h3>Slett skjematype?</h3>
            <p>Skjematypen slettes permanent. Innsendte skjemaer forblir i registeret men vil ikke kunne åpnes i editor eller registeret uten definisjonen.</p>
            <div class="modal-knapper">
                <button class="knapp sekundær" onclick="lukkSlettModal()">Avbryt</button>
                <button class="knapp danger" onclick="bekreftSlett()" id="slettBekreft">Slett skjematypen</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { api } from './js/api-client.js';
        import { hentInnloggetBruker } from './js/auth.js';
        import { FELTTYPER, renderTekst } from './js/felt-render.js';
        import { byggDNFEditor } from './js/dnf-editor.js';
        import { byggTilgangEditor, hentRolleGrupper, hentTeamNavn, invaliderRolleCache } from './js/tilgang-editor.js';
        import { apneMeldingModal, samleFeltreferanser } from './js/melding-editor.js';

        let rolleGrupper = []; // populeres i init()
        let teamNavn = [];     // populeres i init()

        // Tilgjengelige datakilder for FasteData i pilot.
        // Kolonner (filter-navn) matcher det oppslag-dispatcheren støtter.
        // Beskrivelser vises som tooltip (title) i editorens FasteData-bygger,
        // og filter-beskrivelse settes som placeholder på verdi-input.
        const DATAKILDER = [
            {
                navn: 'Postnumre',
                beskrivelse: 'Norske postnumre (importert fra Bring 2×/år)',
                filtre: [
                    { navn: 'Kommune', beskrivelse: 'Postnumre i én kommune. Verdi: kommunenavn (f.eks. "Oslo").' },
                    { navn: 'Poststed', beskrivelse: 'Postnumre i ett poststed. Verdi: poststedsnavn (f.eks. "OSLO").' }
                ]
            },
            {
                navn: 'Skjematyper',
                beskrivelse: 'Skjematyper i systemet',
                filtre: [
                    { navn: 'Fase', beskrivelse: 'Begrens til én fase. Verdi: "Utvikling", "Test" eller "Produksjon".' }
                ]
            },
            {
                navn: 'Roller',
                beskrivelse: 'Distinkte (Rolle, Omfang)-par — for valg av rolle (ikke innehaver)',
                filtre: [
                    { navn: 'Omfang', beskrivelse: 'Roller med spesifikt omfang. Verdi: omfang-tekst (f.eks. "MILM2301").' }
                ]
            },
            {
                navn: 'Personer',
                beskrivelse: 'Personer — henter fra rolleinnehavere eller emne-tilknytninger',
                filtre: [
                    { navn: 'Rolle', beskrivelse: 'Innehavere av en rolle. Verdi: "Rolle(Omfang)" eller "Rolle".' },
                    { navn: 'EmneLarere', beskrivelse: 'Lærere for et emne (fra FS). Verdi: emnekode (f.eks. "CBU2501" eller "CBU2501-1").' },
                    { navn: 'EmneHovedlarere', beskrivelse: 'Hovedlærere for et emne (fra FS). Verdi: emnekode.' },
                    { navn: 'EmneStudenter', beskrivelse: 'Studenter på et emne (fra FS). Verdi: emnekode.' }
                ]
            },
            {
                navn: 'Emner',
                beskrivelse: 'Alle emner ved FHS (fra FS, oppdatert daglig)',
                filtre: [
                    { navn: 'Termin', beskrivelse: 'Begrens til én termin. Verdi: kort-form (f.eks. "26V" eller "26H").' },
                    { navn: 'Campus', beskrivelse: 'Begrens til ett campus. Verdi: campus-kode (f.eks. "SKSK").' }
                ]
            },
            {
                navn: 'Studenter',
                beskrivelse: 'Studenter (fra FS)',
                filtre: [
                    { navn: 'Emne', beskrivelse: 'Studenter på et emne. Verdi: "{Termin}|{EK}-{VK}" eller "{EK}-{VK}" (f.eks. "26V|MILM2301-1").' }
                ]
            },
            {
                navn: 'Studieprogrammer',
                beskrivelse: 'Distinkte studieprogrammer (utledet fra Emner)',
                filtre: []
            }
            // Team kommer med Graph API (fase 8)
        ];

        const params = new URLSearchParams(window.location.search);
        const eksisterendeId = params.get('skjematype_id');
        const kopiFraId = params.get('kopi_fra');

        let bruker = null;
        let data = null;

        async function init() {
            bruker = await hentInnloggetBruker();
            if (!bruker) {
                window.location.href = '/.auth/login/aad?post_login_redirect_uri=' + encodeURIComponent(window.location.pathname + window.location.search);
                return;
            }
            document.getElementById('upn').textContent = bruker.userDetails;

            // Hent rolle-grupper og team-navn før første render — dropdown i
            // tilgang-editor må ha data tilgjengelig når den bygges.
            [rolleGrupper, teamNavn] = await Promise.all([
                hentRolleGrupper(api).then(g => g || []),
                hentTeamNavn(api).then(t => t || [])
            ]);

            try {
                if (eksisterendeId) {
                    data = await api.get(`/api/skjematyper/${encodeURIComponent(eksisterendeId)}?rå=1`);
                    document.getElementById('tittel').textContent = `Rediger: ${data.Skjema_navn || eksisterendeId} (ID ${eksisterendeId})`;
                } else if (kopiFraId) {
                    data = await api.get(`/api/skjematyper/${encodeURIComponent(kopiFraId)}?rå=1`);
                    // Klar for kopi: fjern id, marker som ny fase, endre navn
                    delete data.Skjematype_id;
                    data.Skjema_navn = (data.Skjema_navn || '') + ' (kopi)';
                    data.Fase = 'Utvikling';
                    document.getElementById('tittel').textContent = `Ny skjematype (kopi)`;
                } else {
                    // Helt ny
                    data = tomSkjematype();
                    document.getElementById('tittel').textContent = 'Ny skjematype';
                }
                sikreFeltIder();
                rendrer();
            } catch (e) {
                visFeil('Kunne ikke laste: ' + e.message);
            }
        }

        function tomSkjematype() {

        function rendrerTilgang() {
            const pubEl = document.getElementById('publikum-editor');
            if (pubEl) {
                byggTilgangEditor(pubEl, data.Publikum, {
                    rolleGrupper, teamNavn, api,
                    visAlleTilgang: true,
                    onEndring: (ny) => { data.Publikum = ny; }
                });
            }
            const eiEl = document.getElementById('eiere-editor');
            if (eiEl) {
                byggTilgangEditor(eiEl, data.Eiere, {
                    rolleGrupper, teamNavn, api,
                    onEndring: (ny) => { data.Eiere = ny; }
                });
            }
        }

        // ==================== KOLLAPS ====================
        // Paneler: globalt (samme for alle skjematyper)
        // Seksjoner + felter: per skjematype (bruker skjematypeId eller "ny")
        const PANEL_IDER = ['grunnleggende', 'tilgjengelighet', 'tilgang', 'sharepoint', 'seksjoner', 'behandling'];
        const NOKKEL_PANELER = 'editor-paneler-kollapset';
        function nokkelSeksjoner() { return `editor-seksjoner-kollapset-${eksisterendeId || 'ny'}`; }
        function nokkelFelter() { return `editor-felter-kollapset-${eksisterendeId || 'ny'}`; }

        function lesSet(nokkel) {
            try { return new Set(JSON.parse(localStorage.getItem(nokkel) || '[]')); }
            catch { return new Set(); }
        }
        function skrivSet(nokkel, set) {
            try { localStorage.setItem(nokkel, JSON.stringify([...set])); } catch {}
        }

        window.togglePanel = (id) => {
            const set = lesSet(NOKKEL_PANELER);
            if (set.has(id)) set.delete(id); else set.add(id);
            skrivSet(NOKKEL_PANELER, set);
            const el = document.querySelector(`.panel[data-panel-id="${id}"]`);
            if (el) el.classList.toggle('kollapset');
        };
        window.toggleSeksjon = (nr) => {
            const set = lesSet(nokkelSeksjoner());
            const n = Number(nr);
            if (set.has(n)) set.delete(n); else set.add(n);
            skrivSet(nokkelSeksjoner(), set);
            const el = document.querySelector(`.seksjon[data-seksjon-nr="${n}"]`);
            if (el) el.classList.toggle('kollapset');
        };
        window.toggleFelt = (nokkel) => {
            const set = lesSet(nokkelFelter());
            if (set.has(nokkel)) set.delete(nokkel); else set.add(nokkel);
            skrivSet(nokkelFelter(), set);
            const el = document.querySelector(`.felt[data-felt-nokkel="${nokkel}"]`);
            if (el) el.classList.toggle('kollapset');
        };
        window.kollapsAlleSeksjoner = () => {
            const nrer = (data.Seksjoner || []).map((_, i) => i + 1);
            skrivSet(nokkelSeksjoner(), new Set(nrer));
            document.querySelectorAll('.seksjon').forEach(el => el.classList.add('kollapset'));
        };
        window.ekspanderAlleSeksjoner = () => {
            skrivSet(nokkelSeksjoner(), new Set());
            document.querySelectorAll('.seksjon').forEach(el => el.classList.remove('kollapset'));
        };
        window.kollapsAlt = () => {
            skrivSet(NOKKEL_PANELER, new Set(PANEL_IDER));
            document.querySelectorAll('.panel[data-panel-id]').forEach(el => el.classList.add('kollapset'));
            kollapsAlleSeksjoner();
        };
        window.ekspanderAlt = () => {
            skrivSet(NOKKEL_PANELER, new Set());
            document.querySelectorAll('.panel[data-panel-id]').forEach(el => el.classList.remove('kollapset'));
            ekspanderAlleSeksjoner();
        };
        function appliserKollapsState() {
            const paneler = lesSet(NOKKEL_PANELER);
            document.querySelectorAll('.panel[data-panel-id]').forEach(el => {
                el.classList.toggle('kollapset', paneler.has(el.dataset.panelId));
            });
            const seks = lesSet(nokkelSeksjoner());
            document.querySelectorAll('.seksjon[data-seksjon-nr]').forEach(el => {
                el.classList.toggle('kollapset', seks.has(Number(el.dataset.seksjonNr)));
            });
            const felt = lesSet(nokkelFelter());
            document.querySelectorAll('.felt[data-felt-nokkel]').forEach(el => {
                el.classList.toggle('kollapset', felt.has(el.dataset.feltNokkel));
            });
        }

        // ==================== BEHANDLINGSSTEG ====================

        function rendrerBehandling() {
            const el = document.getElementById('behandling-container');
            if (!el) return;
            const behandling = data.Behandling || [];
            if (behandling.length === 0) {
                el.innerHTML = '<div style="color: var(--text-secondary); font-size: 13px; font-style: italic;">Ingen behandlingssteg — skjemaet arkiveres direkte etter innsending.</div>';
                return;
            }
            el.innerHTML = '';
            behandling.forEach((steg, i) => el.appendChild(byggStegElement(steg, i, behandling.length)));
            // Bygg DNF-editorer for hvert stegs Vilkår + tilgang-editor for behandlere
            behandling.forEach((steg, i) => {
                const slot = document.querySelector(`.dnf-slot[data-slot="steg-vilkar-${i}"]`);
                if (slot) {
                    byggDNFEditor(slot, steg.Vilkår, {
                        modus: 'vilkår',
                        feltOptions: samleReferanserForSteg(i),
                        tittel: 'Steget kjøres kun hvis',
                        onEndring: (ny) => { if (ny) steg.Vilkår = ny; else delete steg.Vilkår; }
                    });
                }
                const tSlot = document.querySelector(`.tilgang-slot[data-slot="steg-tilgang-${i}"]`);
                if (tSlot) {
                    // Steg-tilgang har flat Personer-liste historisk — presenter som {Personer, Roller, Team}
                    const tilgang = {
                        Personer: steg.Personer || [],
                        Roller: steg.Roller || [],
                        Team: steg.Team || []
                    };
                    byggTilgangEditor(tSlot, tilgang, {
                        kompakt: true,
                        rolleGrupper, teamNavn, api,
                        onEndring: (ny) => {
                            steg.Personer = ny.Personer;
                            steg.Roller = ny.Roller;
                            steg.Team = ny.Team;
                        }
                    });
                }
            });
        }

        function samleReferanserForSteg(stegIdx) {
            // Referanser: alle skjema-felter + alle tidligere behandlingssteg
            const refs = samleFelterFør(data.Seksjoner.length - 1, -1);
            const behandling = data.Behandling || [];
            for (let i = 0; i < stegIdx; i++) {
                const s = behandling[i];
                refs.push({ ref: `behandling-${s.Steg}`, tekst: `Steg ${s.Steg}: ${s.Stegnavn || '(uten navn)'}` });
            }
            return refs;
        }

        function byggStegElement(steg, idx, antall) {
            const div = document.createElement('div');
            div.className = 'seksjon';
            div.style.marginBottom = '12px';

            const forrigeSteg = (data.Behandling || []).slice(0, idx);
            const avhengOptions = forrigeSteg.map(s =>
                `<option value="${s.Steg}" ${steg.AvhengigAv === s.Steg ? 'selected' : ''}>Steg ${s.Steg}: ${escapeHtml(s.Stegnavn || '')}</option>`
            ).join('');

            const valgHtml = (steg.Beslutningsvalg || []).map((v, vIdx) => {
                const nr = Number(v.Nummer ?? vIdx + 1);
                const fbTreff = (steg.FraBehandler || []).find(f => Number(f.BeslutningNr) === nr);
                const fbTekst = fbTreff?.Emne ? '✏️ Egen melding' : 'Standardmelding';
                return `
                <div class="valg-rad">
                    <input type="number" value="${v.Nummer ?? vIdx + 1}" min="1" style="width: 60px;"
                        oninput="setBeslutningsvalgNr(${idx}, ${vIdx}, this.value)">
                    <input type="text" placeholder="Tekst (Godkjent, Avslått, ...)" value="${escapeAttr(v.Tekst || '')}"
                        oninput="setBeslutningsvalgTekst(${idx}, ${vIdx}, this.value)">
                    <select onchange="setBeslutningsvalgHandling(${idx}, ${vIdx}, this.value)" style="width: 130px;" title="Spesialhandling">
                        <option value="" ${!v.Handling ? 'selected' : ''}>Vanlig</option>
                        <option value="ompuss" ${v.Handling === 'ompuss' ? 'selected' : ''}>Ompuss (retur)</option>
                    </select>
                    <button class="knapp mini sekundær" onclick="apneFraBehandlerEditor(${idx}, ${nr})" title="Redigér tilbakemelding til innsender for denne beslutningen">${fbTekst}</button>

            const flytAktiv = !!(steg.Flyt_url || '').trim();
            const flytHtml = `

                        value="${escapeAttr(steg.Flyt_url || '')}"
                        oninput="setStegFlytUrl(${idx}, this.value)">
                    <label style="margin-top: 6px;">Notat om flytens parametere <small>(kun for admin — sendes ikke)</small></label>

            const varsling = Array.isArray(steg.Varsling) ? steg.Varsling : ['epost'];

            const varslingHtml = `
                <div class="rad">
                    <label>Varsling <small>(kanaler ved aktivering av steget)</small></label>
                    <div class="varsling-kanaler">

                        </label>
                        <label class="varsling-kanal ${varsling.includes('teams') ? 'aktiv' : ''}" title="Direktemelding til hver behandler via Teams">
                            <input type="checkbox" ${varsling.includes('teams') ? 'checked' : ''}
                                onchange="setVarslingKanal(${idx}, 'teams', this.checked)"> <span>Teams-melding</span>
                        </label>
                        <label class="varsling-kanal ${varsling.includes('planner') ? 'aktiv' : ''}" title="Oppretter Planner-oppgave for hver behandler">
                            <input type="checkbox" ${varsling.includes('planner') ? 'checked' : ''}
                                onchange="setVarslingKanal(${idx}, 'planner', this.checked)"> <span>Planner-oppgave</span>
                        </label>
                        <label class="varsling-kanal ${varsling.includes('teamskanal') ? 'aktiv' : ''}" title="Post i konfigurert Teams-kanal">
                            <input type="checkbox" ${varsling.includes('teamskanal') ? 'checked' : ''}
                                onchange="setVarslingKanal(${idx}, 'teamskanal', this.checked)"> <span>Teams-kanal</span>

                    </div>
                    <div style="margin-top: 6px;">
                        <button class="knapp mini sekundær" onclick="apneTilBehandlerEditor(${idx})">${tbTekst} — til behandler</button>
                    </div>
                </div>
            `;

            div.innerHTML = `
                <div class="seksjon-topp">
                    <span class="seksjon-nr">${steg.Steg}</span>
                    <input type="text" placeholder="Steg-navn (Godkjenning, Verifisering, ...)"
                        value="${escapeAttr(steg.Stegnavn || '')}"
                        oninput="setStegNavn(${idx}, this.value)">
                    <button class="knapp mini sekundær" onclick="flyttSteg(${idx}, -1)" ${idx === 0 ? 'disabled' : ''}>↑</button>
                    <button class="knapp mini sekundær" onclick="flyttSteg(${idx}, 1)" ${idx === antall - 1 ? 'disabled' : ''}>↓</button>
                    <button class="knapp mini danger" onclick="slettSteg(${idx})">Slett steg</button>
                </div>

                ${flytHtml}

                <div class="steg-vanlig ${flytAktiv ? 'dempet' : ''}" ${flytAktiv ? 'title="Skjult fordi ekstern flyt er aktiv"' : ''}>
                    <div class="rad">
                        <label>Behandlere</label>
                        <div class="tilgang-slot" data-slot="steg-tilgang-${idx}"></div>
                    </div>

                    <div class="rad">
                        <label>Krav ved flere behandlere</label>
                        <div style="display: flex; gap: 12px; font-size: 12px; align-items: center; flex-wrap: wrap;">
                            <label class="checkbox-rad"><input type="radio" name="beslutning-modus-${idx}" value="forste"
                                ${steg.Beslutning_alle === true ? '' : 'checked'}
                                onchange="setBeslutningAlle(${idx}, false)"> Første behandler avgjør</label>
                            <label class="checkbox-rad"><input type="radio" name="beslutning-modus-${idx}" value="alle"
                                ${steg.Beslutning_alle === true ? 'checked' : ''}
                                onchange="setBeslutningAlle(${idx}, true)"> Alle må avgjøre</label>
                            <span style="color: var(--text-secondary); font-size: 11px;">
                                Ved "alle": teller kun konkrete Personer. Ompuss trigger umiddelbart.
                            </span>
                        </div>
                    </div>

                    <div class="rad">
                        <label>Beslutningsvalg <small>(hva behandleren kan velge — melding-knapp per valg gir egen tilbakemelding til innsender)</small></label>
                        <div class="valg-liste">${valgHtml || '<div style="color: var(--text-secondary); font-size: 12px; font-style: italic;">Ingen valg — legg til under.</div>'}</div>
                        <button class="knapp mini sekundær" onclick="leggTilBeslutningsvalg(${idx})" style="margin-top: 6px;">+ Legg til valg</button>
                    </div>

                    ${varslingHtml}
                </div>

                ${forrigeSteg.length > 0 ? `
                    <div class="rad">
                        <label>Avhengig av <small>(kjøres først etter dette steget er ferdig — valgfritt)</small></label>
                        <select onchange="setStegAvhengig(${idx}, this.value)">
