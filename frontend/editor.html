                        </select>
                    </div>
                ` : ''}

                <div class="dnf-slot" data-slot="steg-vilkar-${idx}"></div>
            `;
            return div;
        }

        window.leggTilSteg = () => {
            if (!data.Behandling) data.Behandling = [];
            const nesteNr = (data.Behandling.length > 0 ? Math.max(...data.Behandling.map(s => s.Steg)) : 0) + 1;
            data.Behandling.push({
                Steg: nesteNr,
                Stegnavn: '',
                Personer: [],
                Roller: [],
                Team: [],
                Beslutningsvalg: [
                    { Nummer: 1, Tekst: 'Godkjent' },
                    { Nummer: 2, Tekst: 'Avslått' }
                ]
            });
            rendrerBehandling();
        };
        window.slettSteg = (idx) => {
            if (!confirm('Slett dette behandlingssteget?')) return;
            data.Behandling.splice(idx, 1);
            renummererBehandling();
            rendrerBehandling();
        };
        window.flyttSteg = (idx, retning) => {
            const til = idx + retning;
            if (til < 0 || til >= data.Behandling.length) return;
            const [s] = data.Behandling.splice(idx, 1);
            data.Behandling.splice(til, 0, s);
            renummererBehandling();
            rendrerBehandling();
        };
        function renummererBehandling() {
            (data.Behandling || []).forEach((s, i) => {
                const gammel = s.Steg;
                s.Steg = i + 1;
                // Oppdater AvhengigAv-referanser i andre steg som pekte på gammel Steg
                if (gammel !== s.Steg) {
                    (data.Behandling || []).forEach(annen => {
                        if (annen.AvhengigAv === gammel) annen.AvhengigAv = s.Steg;
                    });
                }
            });
        }
        window.setStegNavn = (idx, v) => { data.Behandling[idx].Stegnavn = v; };
        window.setBeslutningAlle = (idx, alle) => {
            data.Behandling[idx].Beslutning_alle = alle === true;
        };
        // Behandlere håndteres av tilgang-editor (i rendrerBehandling)

        window.setStegFlytUrl = (idx, v) => {
            data.Behandling[idx].Flyt_url = String(v || '').trim();
            rendrerBehandling();
        };
        window.setStegFlytParametere = (idx, v) => {
            data.Behandling[idx].Flyt_parametere = String(v || '');
        };

        window.setVarslingKanal = (stegIdx, kanal, aktivert) => {
            const steg = data.Behandling[stegIdx];
            if (!steg) return;
            const naa = new Set(Array.isArray(steg.Varsling) ? steg.Varsling : ['epost']);
            if (aktivert) naa.add(kanal); else naa.delete(kanal);
            steg.Varsling = [...naa];
            rendrerBehandling();
        };

        window.apneTilBehandlerEditor = async (stegIdx) => {
            const steg = data.Behandling[stegIdx];
            if (!steg) return;
            const mal = steg.TilBehandler || {};
            const ny = await apneMeldingModal({ Emne: mal.Emne || '', Tekst: mal.Tekst || '' }, {
                tittel: `Melding til behandler — steg ${steg.Steg}: ${steg.Stegnavn || ''}`,
                forslag: {
                    Emne: 'Skjema til behandling: "$skjemanavn"',
                    Tekst: '<p>Hei,</p>\n<p>Du har fått et skjema til behandling: "<b>$skjemanavn</b>" ($skjema_id) — steg: $stegnavn.</p>\n<p><a href="$lenke">Åpne skjemaet</a></p>'
                },
                feltreferanser: samleFeltreferanser(data)
            });
            if (ny === null) return;
            if (!ny.Emne && !ny.Tekst) {
                delete steg.TilBehandler; // bruk standard
            } else {
                steg.TilBehandler = { Emne: ny.Emne, Tekst: ny.Tekst, Format: ny.Format || 'HTML' };
            }
            rendrerBehandling();
        };

        window.apneFraBehandlerEditor = async (stegIdx, beslutningNr) => {
            const steg = data.Behandling[stegIdx];
            if (!steg) return;
            if (!Array.isArray(steg.FraBehandler)) steg.FraBehandler = [];
            const eksisterende = steg.FraBehandler.find(f => Number(f.BeslutningNr) === Number(beslutningNr)) || {};
            const valg = (steg.Beslutningsvalg || []).find(v => Number(v.Nummer) === Number(beslutningNr));
            const valgtekst = valg?.Tekst || `Valg ${beslutningNr}`;
            const ny = await apneMeldingModal({ Emne: eksisterende.Emne || '', Tekst: eksisterende.Tekst || '' }, {
                tittel: `Tilbakemelding til innsender — beslutning: ${valgtekst}`,
                forslag: {
                    Emne: `Skjemaet "$skjemanavn" er behandlet`,
                    Tekst: `<p>Hei,</p>\n<p>Skjemaet "<b>$skjemanavn</b>" ($skjema_id) er behandlet på steg $stegnavn.</p>\n<p>Beslutning: <b>$beslutning</b></p>\n<p><a href="$lenke">Åpne skjemaet</a></p>`
                },
                feltreferanser: samleFeltreferanser(data)
            });
            if (ny === null) return;
            // Fjern eksisterende for denne BeslutningNr
            steg.FraBehandler = steg.FraBehandler.filter(f => Number(f.BeslutningNr) !== Number(beslutningNr));
            // Legg tilbake kun hvis noe er fylt inn
            if (ny.Emne || ny.Tekst) {
                steg.FraBehandler.push({
                    BeslutningNr: Number(beslutningNr),
                    Emne: ny.Emne,
                    Tekst: ny.Tekst,
                    Format: ny.Format || 'HTML'
                });
            }
            rendrerBehandling();
        };

        window.setStegAvhengig = (idx, v) => {
            if (v === '') delete data.Behandling[idx].AvhengigAv;
            else data.Behandling[idx].AvhengigAv = Number(v);
        };
        window.setBeslutningsvalgNr = (sIdx, vIdx, v) => {
            data.Behandling[sIdx].Beslutningsvalg[vIdx].Nummer = Number(v) || vIdx + 1;
        };
        window.setBeslutningsvalgTekst = (sIdx, vIdx, v) => {
            data.Behandling[sIdx].Beslutningsvalg[vIdx].Tekst = v;
        };
        window.setBeslutningsvalgHandling = (sIdx, vIdx, v) => {
            if (v) data.Behandling[sIdx].Beslutningsvalg[vIdx].Handling = v;
            else delete data.Behandling[sIdx].Beslutningsvalg[vIdx].Handling;
        };
        window.leggTilBeslutningsvalg = (sIdx) => {
            const steg = data.Behandling[sIdx];
            if (!steg.Beslutningsvalg) steg.Beslutningsvalg = [];
            const nesteNr = (steg.Beslutningsvalg.length > 0 ? Math.max(...steg.Beslutningsvalg.map(v => v.Nummer || 0)) : 0) + 1;
            steg.Beslutningsvalg.push({ Nummer: nesteNr, Tekst: '' });
            rendrerBehandling();
        };
        window.fjernBeslutningsvalg = (sIdx, vIdx) => {
            data.Behandling[sIdx].Beslutningsvalg.splice(vIdx, 1);
            rendrerBehandling();
        };

        // ==================== PERIODER ====================

        function rendrerPerioder() {
            const el = document.getElementById('perioder-container');
            if (!el) return;
            const perioder = data.Tilgjengelighetsperioder || [];
            if (perioder.length === 0) {
                el.innerHTML = '<div style="color: var(--text-secondary); font-size: 13px; font-style: italic;">Ingen perioder — skjematypen er alltid tilgjengelig.</div>';
                return;
            }
            el.innerHTML = perioder.map((p, i) => `
                <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px;">
                    <input type="date" value="${escapeAttr(p.Fra || '')}" oninput="setPeriode(${i}, 'Fra', this.value)" style="max-width: 160px;">
                    <span>–</span>
                    <input type="date" value="${escapeAttr(p.Til || '')}" oninput="setPeriode(${i}, 'Til', this.value)" style="max-width: 160px;">
                    <button class="knapp mini danger" onclick="fjernPeriode(${i})">Fjern</button>
                </div>
            `).join('');
        }

        window.leggTilPeriode = () => {
            if (!data.Tilgjengelighetsperioder) data.Tilgjengelighetsperioder = [];
            data.Tilgjengelighetsperioder.push({ Fra: '', Til: '' });
            rendrerPerioder();
        };
        window.setPeriode = (i, felt, verdi) => {
            if (!data.Tilgjengelighetsperioder) return;
            data.Tilgjengelighetsperioder[i][felt] = verdi;
        };
        window.fjernPeriode = (i) => {
            data.Tilgjengelighetsperioder.splice(i, 1);
            rendrerPerioder();
        };
        window.setForklaringFormat = (f) => {
            if (!data.Skjemaforklaring) data.Skjemaforklaring = { Innhold: '' };
            data.Skjemaforklaring.Format = f;
        };

        window.setKrypteres = (v) => { data.Krypteres = v || 'Nei'; };
        window.setAnonymiseres = (v) => { data.Anonymiseres = !!v; };
        window.setEksternTilgang = (v) => {
            data.EksternTilgang = !!v;
            const boks = document.getElementById('ekstern-lenke-boks');
            if (boks) boks.style.display = (v && eksisterendeId) ? 'block' : 'none';
        };
        window.kopierEksternLenke = async () => {
            const inp = document.getElementById('ekstern-lenke');
            try { await navigator.clipboard.writeText(inp.value); }
            catch (_) { inp.select(); document.execCommand('copy'); }
        };

        // ==================== VARSLING (fase 6b) ====================
        function oppsummerMelding(mal, standardTekst) {
            const emne = (mal?.Emne || '').trim();
            if (!emne) return { tekst: `Standardmal: "${standardTekst}"`, standard: true };
            return { tekst: `Emne: ${emne}`, standard: false };
        }

        function oppdaterKvitteringOppsummering() {
            const el = document.getElementById('kv-oppsummering');
            if (!el) return;
            const kv = data.Innsenderkvittering || {};
            const rediger = document.getElementById('kv-rediger');
            if (kv.Aktiv === false) {
                el.textContent = 'Ikke aktiv — ingen kvittering sendes.';
                el.classList.add('standard');
                if (rediger) rediger.disabled = true;
                return;
            }
            if (rediger) rediger.disabled = false;
            const o = oppsummerMelding(kv, 'Kvittering: "$skjemanavn" er sendt inn');
            el.innerHTML = '';
            const span = document.createElement('span');
            span.className = 'emne-forhandsvis' + (o.standard ? ' standard' : '');
            span.textContent = o.tekst;
            el.appendChild(span);
        }

        window.setKvitteringAktiv = (v) => {
            if (!data.Innsenderkvittering) data.Innsenderkvittering = {};
            data.Innsenderkvittering.Aktiv = v;
            oppdaterKvitteringOppsummering();
        };

        // ==================== SHAREPOINT ====================
        const SP_PLASSHOLDERE = [
            { navn: '$skjema_id',           tekst: 'Skjema-ID' },
            { navn: '$skjemanavn',          tekst: 'Skjematype-navn' },
            { navn: '$innsender',           tekst: 'Innsender e-post' },
            { navn: '$innsender_navn',      tekst: 'Innsender-navn' },
            { navn: '$tidspunkt_innsendt',  tekst: 'Innsendings-tidspunkt' }
        ];

        window.setSPListeadresse = (v) => { data.SPListeadresse = String(v || '').trim(); oppdaterSPOppsummering(); };
        window.setSPListenavn = (v) => { data.SPListenavn = String(v || '').trim(); oppdaterSPOppsummering(); };
        window.setSPLagreVedlegg = (v) => { data.SPLagreVedlegg = !!v; };

        function oppdaterSPOppsummering() {
            const el = document.getElementById('sp-metadata-oppsummering');
            if (!el) return;
            const meta = Array.isArray(data.SPMetadata) ? data.SPMetadata.filter(m => m.Plassholder && m.SPKolonne) : [];
            el.textContent = meta.length === 0 ? '(ingen metadata konfigurert)' : `${meta.length} mapping${meta.length === 1 ? '' : 'er'}`;
        }

        window.apneSPMetadataEditor = () => {
            const bakgrunn = document.createElement('div');
            bakgrunn.className = 'meldingsmodal-bakgrunn';
            bakgrunn.innerHTML = `
                <div class="meldingsmodal-boks">
                    <div class="meldingsmodal-topp">
                        <h3 class="meldingsmodal-tittel">SharePoint metadata-mapping</h3>
                        <button class="meldingsmodal-lukk" title="Avbryt (Esc)">✕</button>
                    </div>
                    <p style="font-size: 13px; color: var(--text-secondary); margin: 0 0 10px;">
                        Kobler plassholdere til SP-kolonner. Hver rad sender en verdi ved innsending.
                    </p>
                    <table style="width: 100%; border-collapse: collapse; font-size: 13px;">
                        <thead>
                            <tr style="text-align: left; color: var(--text-secondary);">
                                <th style="padding: 4px 6px;">Plassholder</th>
                                <th style="padding: 4px 6px;">SP-kolonne</th>
                                <th style="width: 40px;"></th>
                            </tr>
                        </thead>
                        <tbody id="sp-meta-body"></tbody>
                    </table>
                    <button class="knapp mini sekundær" style="margin-top: 8px;" id="sp-meta-legg-til">+ Legg til rad</button>
                    <div class="meldingsmodal-knapper">
                        <button class="modal-knapp" data-svar="avbryt">Avbryt</button>
                        <button class="modal-knapp primær" data-svar="lagre">Lagre</button>
                    </div>
                </div>
            `;
            document.body.appendChild(bakgrunn);
            const boks = bakgrunn.querySelector('.meldingsmodal-boks');
            const body = boks.querySelector('#sp-meta-body');

            let rader = Array.isArray(data.SPMetadata) ? JSON.parse(JSON.stringify(data.SPMetadata)) : [];

            function render() {
                body.innerHTML = '';
                rader.forEach((r, i) => {
                    const tr = document.createElement('tr');
                    const plassOptions = SP_PLASSHOLDERE.map(p =>
                        `<option value="${p.navn}" ${r.Plassholder === p.navn ? 'selected' : ''}>${p.navn} — ${p.tekst}</option>`
                    ).join('');
                    tr.innerHTML = `
                        <td style="padding: 4px 6px;"><select style="width: 100%;">
                            <option value="">— velg —</option>${plassOptions}
                        </select></td>
                        <td style="padding: 4px 6px;"><input type="text" placeholder="SP-kolonnenavn" value="${escapeAttr(r.SPKolonne || '')}" style="width: 100%;"></td>
                        <td><button class="knapp mini danger">✕</button></td>
                    `;
                    const sel = tr.querySelector('select');
                    const inp = tr.querySelector('input');
                    const fjern = tr.querySelector('button');
                    sel.addEventListener('change', () => { rader[i].Plassholder = sel.value; });
                    inp.addEventListener('input', () => { rader[i].SPKolonne = inp.value; });
                    fjern.addEventListener('click', () => { rader.splice(i, 1); render(); });
                    body.appendChild(tr);
                });
                if (rader.length === 0) {
                    const tr = document.createElement('tr');
                    tr.innerHTML = '<td colspan="3" style="padding: 8px; color: var(--text-secondary); font-style: italic;">(ingen mappings — klikk "Legg til rad")</td>';
                    body.appendChild(tr);
                }
            }
            render();

            boks.querySelector('#sp-meta-legg-til').addEventListener('click', () => {
                rader.push({ Plassholder: '', SPKolonne: '' });
                render();
            });
            const lukk = (svar) => {
                document.body.removeChild(bakgrunn);
                if (svar === 'lagre') {
                    data.SPMetadata = rader.filter(r => r.Plassholder && r.SPKolonne);
                    oppdaterSPOppsummering();
                    rendrerSeksjoner(); // så per-felt SP-kolonne-input vises/skjules
                }
            };
            boks.querySelectorAll('button[data-svar]').forEach(b => {
                b.addEventListener('click', () => lukk(b.dataset.svar));
            });
            boks.querySelector('.meldingsmodal-lukk').addEventListener('click', () => lukk('avbryt'));
            bakgrunn.addEventListener('click', (e) => { if (e.target === bakgrunn) lukk('avbryt'); });
        };

        window.setFeltSPListefelt = (sIdx, fIdx, v) => {
            data.Seksjoner[sIdx].Felter[fIdx].SPListefelt = String(v || '').trim();
        };

        window.apneKvitteringEditor = async () => {
            const kv = data.Innsenderkvittering || {};
            const ny = await apneMeldingModal({ Emne: kv.Emne || '', Tekst: kv.Tekst || '' }, {
                tittel: 'Innsenderkvittering',
                forslag: {
                    Emne: 'Kvittering: "$skjemanavn" er sendt inn',
                    Tekst: '<p>Hei,</p>\n<p>Vi har mottatt skjemaet "<b>$skjemanavn</b>" ($skjema_id).</p>\n<p><a href="$lenke">Åpne skjemaet</a></p>'
                },
                feltreferanser: samleFeltreferanser(data)
            });
            if (ny === null) return; // avbrutt
            if (!data.Innsenderkvittering) data.Innsenderkvittering = { Aktiv: true };
            data.Innsenderkvittering.Emne = ny.Emne;
            data.Innsenderkvittering.Tekst = ny.Tekst;
            data.Innsenderkvittering.Format = ny.Format || 'HTML';
            oppdaterKvitteringOppsummering();
        };

        function rendrerSeksjoner() {
            const container = document.getElementById('seksjoner-container');
            if (!data.Seksjoner || data.Seksjoner.length === 0) {
                container.innerHTML = '<div class="laster">Ingen seksjoner. Legg til en for å komme i gang.</div>';
                return;
            }
            container.innerHTML = data.Seksjoner.map((s, i) => byggSeksjonHtml(s, i)).join('');
            // Rebind alle event-handlere via delegation
            container.querySelectorAll('[data-action]').forEach(el => {
                const act = el.dataset.action;
                const sIdx = parseInt(el.dataset.seksjon, 10);
                const fIdx = el.dataset.felt !== undefined ? parseInt(el.dataset.felt, 10) : null;
                const vIdx = el.dataset.valg !== undefined ? parseInt(el.dataset.valg, 10) : null;
                el.addEventListener('click', () => håndterAksjon(act, sIdx, fIdx, vIdx));
            });
            // Populer DNF-editorer i sine slots
            byggAlleDNFEditorer();
        }

        function samleFelterFør(sIdx, fIdx) {
            // Samler felter tilgjengelig som referanse: alle i tidligere seksjoner
            // + tidligere felter i samme seksjon. Info/Opplasting hoppes over.
            const felter = [];
            for (let s = 0; s <= sIdx; s++) {
                const seksjon = data.Seksjoner[s];
                if (!seksjon) continue;
                for (let f = 0; f < (seksjon.Felter || []).length; f++) {
                    if (s === sIdx && fIdx >= 0 && f >= fIdx) break;
                    const felt = seksjon.Felter[f];
                    if (felt.Type === 'Informasjon' || felt.Type === 'Opplasting') continue;
                    const ref = felt.Id || `${seksjon.Seksjon_nummer}-${felt.Nummer}`;
                    const tekst = felt.Tekst?.Verdi || '(uten tekst)';
                    felter.push({ ref, tekst: `S${seksjon.Seksjon_nummer}-F${felt.Nummer}: ${tekst.substring(0, 40)}` });
                }
            }
            return felter;
        }

        function byggAlleDNFEditorer() {
            (data.Seksjoner || []).forEach((seksjon, sIdx) => {
                // Seksjon-Vises (referanser fra tidligere seksjoner)
                const sSlot = document.querySelector(`.dnf-slot[data-slot="ses-vises-${sIdx}"]`);
                if (sSlot) {
                    byggDNFEditor(sSlot, seksjon.Vises, {
                        modus: 'vilkår',
                        feltOptions: samleFelterFør(sIdx - 1, -1),
                        tittel: 'Seksjon vises kun hvis',
                        onEndring: (ny) => { if (ny) seksjon.Vises = ny; else delete seksjon.Vises; }
                    });
                }
                (seksjon.Felter || []).forEach((felt, fIdx) => {
                    if (felt.Type === 'Informasjon') return;

                    const vSlot = document.querySelector(`.dnf-slot[data-slot="felt-vises-${sIdx}-${fIdx}"]`);
                    if (vSlot) {
                        byggDNFEditor(vSlot, felt.Vises, {
                            modus: 'vilkår',
                            feltOptions: samleFelterFør(sIdx, fIdx),
                            tittel: 'Felt vises kun hvis',
                            onEndring: (ny) => { if (ny) felt.Vises = ny; else delete felt.Vises; }
                        });
                    }
                    const oSlot = document.querySelector(`.dnf-slot[data-slot="felt-oblig-${sIdx}-${fIdx}"]`);
                    if (oSlot) {
                        byggDNFEditor(oSlot, felt.ObligatoriskHvis, {
                            modus: 'vilkår',
                            feltOptions: samleFelterFør(sIdx, fIdx),
                            tittel: 'Obligatorisk hvis',
                            onEndring: (ny) => { if (ny) felt.ObligatoriskHvis = ny; else delete felt.ObligatoriskHvis; }
                        });
                    }
                    if (kanHaFasteData(felt.Type)) {
                        const fdSlot = document.querySelector(`.dnf-slot[data-slot="felt-fastedata-${sIdx}-${fIdx}"]`);
                        if (fdSlot) {
                            byggDNFEditor(fdSlot, felt.FasteData && typeof felt.FasteData === 'object' ? felt.FasteData : null, {
                                modus: 'faste-data',
                                datakilder: DATAKILDER,
                                tittel: 'Hent Valg-liste fra datakilde',
                                onEndring: (ny) => { if (ny) felt.FasteData = ny; else delete felt.FasteData; }
                            });
                        }
                    }
                });
            });
        }

        function byggSeksjonHtml(seksjon, sIdx) {
            const feltHtml = (seksjon.Felter || []).map((f, fIdx) => byggFeltHtml(f, sIdx, fIdx, seksjon.Felter.length)).join('');
            const seksjonNr = sIdx + 1;
            return `
                <div class="seksjon" data-seksjon-nr="${seksjonNr}">
                    <div class="seksjon-topp">
                        <button class="seksjon-kollaps-btn" onclick="toggleSeksjon(${seksjonNr})" title="Kollaps/ekspander seksjon"><span class="kollaps-pil">▼</span></button>
                        <span class="seksjon-nr">${seksjonNr}</span>
                        <input type="text" placeholder="Overskrift…"
                            value="${escapeAttr(seksjon.Seksjon_overskrift || '')}"
                            oninput="setSeksjonOverskrift(${sIdx}, this.value)">
                        <button class="knapp mini sekundær" data-action="flytt-seksjon-opp" data-seksjon="${sIdx}" ${sIdx === 0 ? 'disabled' : ''}>↑</button>
                        <button class="knapp mini sekundær" data-action="flytt-seksjon-ned" data-seksjon="${sIdx}" ${sIdx === data.Seksjoner.length - 1 ? 'disabled' : ''}>↓</button>
                        <button class="knapp mini danger" data-action="slett-seksjon" data-seksjon="${sIdx}">Slett seksjon</button>
                    </div>
                    <div class="seksjon-innhold">
                        <div class="dnf-slot" data-slot="ses-vises-${sIdx}" style="margin-bottom: 8px;"></div>
                        ${feltHtml || '<div style="color: var(--text-secondary); font-size: 13px; padding: 8px;">Ingen felter i denne seksjonen.</div>'}
                        <div style="margin-top: 10px;">
                            <button class="knapp mini sekundær" data-action="legg-til-felt" data-seksjon="${sIdx}">+ Legg til felt</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function byggFeltHtml(felt, sIdx, fIdx, antall) {
            const typeOpts = FELTTYPER.map(t =>
                `<option value="${t}" ${felt.Type === t ? 'selected' : ''}>${t}</option>`
            ).join('');

            const config = byggFeltConfigHtml(felt, sIdx, fIdx);

            const feltNokkel = `${sIdx + 1}-${felt.Nummer || (fIdx + 1)}`;
            return `
                <div class="felt" data-felt-nokkel="${feltNokkel}">
                    <div class="felt-topp">
                        <div style="display: flex; gap: 4px; align-items: center;">
                            <button class="felt-kollaps-btn" onclick="toggleFelt('${feltNokkel}')" title="Kollaps/ekspander felt"><span class="kollaps-pil">▼</span></button>
                            <span class="felt-nr">${felt.Nummer || (fIdx + 1)}</span>
                        </div>
                        <input type="text" placeholder="Spørsmål / label…"
                            value="${escapeAttr(felt.Tekst?.Verdi || '')}"
                            oninput="setFeltTekst(${sIdx}, ${fIdx}, this.value)">
                        <select onchange="setFeltType(${sIdx}, ${fIdx}, this.value)">
                            ${typeOpts}
                        </select>
                        <div style="display: flex; gap: 4px;">
                            <button class="knapp mini sekundær" data-action="flytt-felt-opp" data-seksjon="${sIdx}" data-felt="${fIdx}" ${fIdx === 0 ? 'disabled' : ''}>↑</button>
                            <button class="knapp mini sekundær" data-action="flytt-felt-ned" data-seksjon="${sIdx}" data-felt="${fIdx}" ${fIdx === antall - 1 ? 'disabled' : ''}>↓</button>
                            <button class="knapp mini sekundær" data-action="kopier-felt" data-seksjon="${sIdx}" data-felt="${fIdx}" title="Kopier felt">⧉</button>
                            <button class="knapp mini danger" data-action="slett-felt" data-seksjon="${sIdx}" data-felt="${fIdx}">✕</button>
                        </div>
                    </div>
                    <div class="felt-config">${config}</div>
                    ${felt.Type !== 'Informasjon' ? `<div class="dnf-slot" data-slot="felt-vises-${sIdx}-${fIdx}" style="margin-top: 8px;"></div>` : ''}
                    ${felt.Type !== 'Informasjon' ? `<div class="dnf-slot" data-slot="felt-oblig-${sIdx}-${fIdx}" style="margin-top: 8px;"></div>` : ''}
                    ${kanHaFasteData(felt.Type) ? `<div class="dnf-slot" data-slot="felt-fastedata-${sIdx}-${fIdx}" style="margin-top: 8px;"></div>` : ''}
                    ${data.SPListeadresse && felt.Type !== 'Informasjon' ? `
                        <div class="rad" style="margin-top: 8px;">
                            <label style="font-size: 11px;">SP-kolonne <small>(tom = ikke send til SP)</small></label>
                            <input type="text" placeholder="SP-kolonnenavn" value="${escapeAttr(felt.SPListefelt || '')}"
                                oninput="setFeltSPListefelt(${sIdx}, ${fIdx}, this.value)" style="font-size: 12px;">
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function kanHaFasteData(type) {
            return type === 'Flervalg-dropdown' || type === 'Flervalg-knapper' || type === 'Skala';
        }

        function byggFeltConfigHtml(felt, sIdx, fIdx) {
            const tekstFormat = felt.Tekst?.Format || 'Tekst';
            const undertittelFormat = felt.Undertittel?.Format || 'Tekst';
            const undertittel = felt.Type === 'Informasjon' ? '' : `
                <div class="rad">
                    <label>Spørsmåls-format <small>(gjelder tittelen)</small></label>
                    <div style="display: flex; gap: 12px; font-size: 12px; align-items: center;">
                        <label class="checkbox-rad"><input type="radio" name="tekst-format-${sIdx}-${fIdx}" value="Tekst"
                            ${tekstFormat === 'Tekst' ? 'checked' : ''}
                            onchange="setTekstFormat(${sIdx}, ${fIdx}, 'Tekst')"> Ren tekst</label>
                        <label class="checkbox-rad"><input type="radio" name="tekst-format-${sIdx}-${fIdx}" value="Markdown"
                            ${tekstFormat === 'Markdown' ? 'checked' : ''}
                            onchange="setTekstFormat(${sIdx}, ${fIdx}, 'Markdown')"> Markdown</label>
                        <span style="color: var(--text-secondary); font-size: 11px;">**bold**, *italic*, [tekst](url)</span>
                    </div>
                </div>
                <div class="rad">
                    <label>Undertittel <small>(vises under spørsmålet — valgfritt)</small></label>
                    <input type="text" value="${escapeAttr(felt.Undertittel?.Verdi || '')}"
                        placeholder="Hjelpetekst / presisering"
                        oninput="setUndertittel(${sIdx}, ${fIdx}, this.value)">
                    <div style="display: flex; gap: 12px; font-size: 12px; align-items: center; margin-top: 4px;">
                        <label class="checkbox-rad"><input type="radio" name="und-format-${sIdx}-${fIdx}" value="Tekst"
                            ${undertittelFormat === 'Tekst' ? 'checked' : ''}
                            onchange="setUndertittelFormat(${sIdx}, ${fIdx}, 'Tekst')"> Ren tekst</label>
                        <label class="checkbox-rad"><input type="radio" name="und-format-${sIdx}-${fIdx}" value="Markdown"
                            ${undertittelFormat === 'Markdown' ? 'checked' : ''}
                            onchange="setUndertittelFormat(${sIdx}, ${fIdx}, 'Markdown')"> Markdown</label>
                    </div>
                </div>
            `;

            const oblig = felt.Type === 'Informasjon' ? '' : `
                <label class="checkbox-rad" style="margin-top: 6px;">
                    <input type="checkbox" ${felt.Obligatorisk ? 'checked' : ''}
                        onchange="setFeltObligatorisk(${sIdx}, ${fIdx}, this.checked)">
                    Obligatorisk
                </label>
                <label class="checkbox-rad" style="margin-top: 4px;">
                    <input type="checkbox" ${(felt.Filtrerbar || felt.Filtrerbar_i_register) ? 'checked' : ''}
                        onchange="setFeltProp(${sIdx}, ${fIdx}, 'Filtrerbar', this.checked)">
                    Filtrerbar i register/datauttrekk
                </label>
            `;

            let typeConfig = '';
            switch (felt.Type) {
                case 'Tekst':
                    typeConfig = `
                        <label class="checkbox-rad">
                            <input type="checkbox" ${felt.Flerlinje ? 'checked' : ''}
                                onchange="setFeltProp(${sIdx}, ${fIdx}, 'Flerlinje', this.checked)">
                            Flerlinje
                        </label>
                    `;
                    break;
                case 'Tall':
                    typeConfig = `
                        <div class="to-kol">
                            <div>
                                <label>Min-verdi</label>
                                <input type="number" value="${felt.Min_verdi ?? ''}"
                                    oninput="setFeltProp(${sIdx}, ${fIdx}, 'Min_verdi', this.value === '' ? null : Number(this.value))">
                            </div>
                            <div>
                                <label>Maks-verdi</label>
                                <input type="number" value="${felt.Max_verdi ?? ''}"
                                    oninput="setFeltProp(${sIdx}, ${fIdx}, 'Max_verdi', this.value === '' ? null : Number(this.value))">
                            </div>
                        </div>
                    `;
                    break;
                case 'Skala':
                case 'Flervalg-knapper':
                case 'Flervalg-dropdown': {
                    const valg = felt.Valg || [];
                    const skalaHar = felt.Type === 'Skala';
                    const maksInput = felt.Type === 'Flervalg-knapper' ? `
                        <div style="margin-top: 8px;">
                            <label>Maks antall valg</label>
                            <input type="number" min="1" value="${felt.Max_valg || 1}"
                                oninput="setFeltProp(${sIdx}, ${fIdx}, 'Max_valg', Number(this.value) || 1)"
                                style="width: 80px;">
                        </div>
                    ` : '';
                    typeConfig = `
                        <label>Alternativer</label>
                        <div class="valg-liste">
                            ${valg.map((v, vIdx) => `
                                <div class="valg-rad">
                                    ${skalaHar ? `<input type="number" value="${v.Valg_nr ?? vIdx + 1}" style="width: 60px;"
                                        oninput="setValgNr(${sIdx}, ${fIdx}, ${vIdx}, this.value)">` : ''}
                                    <input type="text" placeholder="Tekst" value="${escapeAttr(v.Tekst || '')}"
                                        oninput="setValgTekst(${sIdx}, ${fIdx}, ${vIdx}, this.value)">
                                    <button class="knapp mini danger" data-action="slett-valg" data-seksjon="${sIdx}" data-felt="${fIdx}" data-valg="${vIdx}">✕</button>
                                </div>
                            `).join('')}
                        </div>
                        <button class="knapp mini sekundær" data-action="legg-til-valg" data-seksjon="${sIdx}" data-felt="${fIdx}" style="margin-top: 6px;">+ Legg til alternativ</button>
                        ${maksInput}
                    `;
                    break;
                }
                case 'Informasjon': {
                    const format = felt.Tekst?.Format || 'Tekst';
                    typeConfig = `
                        <div style="color: var(--text-secondary); font-size: 12px; margin-bottom: 8px;">Vises som informasjonstekst — ingen inntasting.</div>
                        <div style="display: flex; align-items: center; gap: 8px; font-size: 12px;">
                            <span>Format:</span>
                            <label class="checkbox-rad"><input type="radio" name="info-format-${sIdx}-${fIdx}" value="Tekst"
                                ${format === 'Tekst' ? 'checked' : ''}
                                onchange="setInfoFormat(${sIdx}, ${fIdx}, 'Tekst')"> Ren tekst</label>
                            <label class="checkbox-rad"><input type="radio" name="info-format-${sIdx}-${fIdx}" value="Markdown"
                                ${format === 'Markdown' ? 'checked' : ''}
                                onchange="setInfoFormat(${sIdx}, ${fIdx}, 'Markdown')"> Markdown</label>
                            <span style="color: var(--text-secondary); font-size: 11px;">**bold**, *italic*, [tekst](url), - lister, # overskrifter</span>
                        </div>
                    `;
                    break;
                }
                case 'Dato':
                    typeConfig = '';
                    break;
                case 'Opplasting': {
                    const valgte = Array.isArray(felt.Tillatte_filtyper) && felt.Tillatte_filtyper.length > 0
                        ? felt.Tillatte_filtyper
                        : ['Office', 'PDF', 'Bilder'];
                    const check = k => valgte.includes(k) ? 'checked' : '';
                    typeConfig = `
                        <div style="display: flex; gap: 16px; align-items: center; flex-wrap: wrap;">
                            <label>Maks antall filer
                                <input type="number" min="1" value="${Number(felt.Max_valg) || 1}"
                                    oninput="setFeltProp(${sIdx}, ${fIdx}, 'Max_valg', Number(this.value) || 1)"
                                    style="width: 80px; margin-left: 6px;">
                            </label>
                        </div>
                        <div style="margin-top: 8px;">
                            <label style="display: block; margin-bottom: 4px;">Tillatte filtyper</label>
                            <label style="margin-right: 12px;">
                                <input type="checkbox" value="Office" ${check('Office')}
                                    onchange="toggleFiltype(${sIdx}, ${fIdx}, 'Office', this.checked)">
                                Office (.docx/.xlsx/.pptx)
                            </label>
                            <label style="margin-right: 12px;">
                                <input type="checkbox" value="PDF" ${check('PDF')}
                                    onchange="toggleFiltype(${sIdx}, ${fIdx}, 'PDF', this.checked)">
                                PDF
                            </label>
                            <label>
                                <input type="checkbox" value="Bilder" ${check('Bilder')}
                                    onchange="toggleFiltype(${sIdx}, ${fIdx}, 'Bilder', this.checked)">
                                Bilder (jpg/png/gif/…)
                            </label>
                        </div>
                    `;
                    break;
                }
            }

            return undertittel + oblig + (typeConfig ? '<div style="margin-top: 8px;">' + typeConfig + '</div>' : '');
        }

        window.setUndertittel = (sIdx, fIdx, v) => {
            const felt = data.Seksjoner[sIdx].Felter[fIdx];
            if (!felt.Undertittel) felt.Undertittel = { Format: 'Tekst' };
            felt.Undertittel.Verdi = v;
        };

        function håndterAksjon(action, sIdx, fIdx, vIdx) {
            switch (action) {
                case 'flytt-seksjon-opp': flyttSeksjon(sIdx, -1); break;
                case 'flytt-seksjon-ned': flyttSeksjon(sIdx, 1); break;
                case 'slett-seksjon':
                    if (confirm('Slett hele seksjonen?')) slettSeksjon(sIdx);
                    break;
                case 'legg-til-felt': leggTilFelt(sIdx); break;
                case 'flytt-felt-opp': flyttFelt(sIdx, fIdx, -1); break;
                case 'flytt-felt-ned': flyttFelt(sIdx, fIdx, 1); break;
                case 'kopier-felt': kopierFelt(sIdx, fIdx); break;
                case 'slett-felt':
                    if (confirm('Slett feltet?')) slettFelt(sIdx, fIdx);
                    break;
                case 'legg-til-valg': leggTilValg(sIdx, fIdx); break;
                case 'slett-valg': slettValg(sIdx, fIdx, vIdx); break;
            }
        }

        // ---- Metadata-settere ----
        window.setNavn = v => { data.Skjema_navn = v; };
        function oppdaterLogoPreview(previewId, navnId, v) {
            const preview = document.getElementById(previewId);
            if (preview) {
                preview.src = v || '';
                preview.style.display = v ? '' : 'none';
            }
            const navn = document.getElementById(navnId);
            if (navn) navn.textContent = v ? v.split('/').pop() : '(ingen valgt)';
        }
        window.setLogo = v => {
            data.Logo_url = v || '';
            oppdaterLogoPreview('f-logo-preview', 'f-logo-navn', v);
        };
        window.setDIFLogo = v => {
            data.DIFLogo_URL = v || '';
            oppdaterLogoPreview('f-diflogo-preview', 'f-diflogo-navn', v);
        };
        // Åpne modal med logo-grid — feltNavn = 'Logo_url' eller 'DIFLogo_URL'
        window.velgLogoModal = async (feltNavn) => {
            let logoer = [];
            try { logoer = await api.get('/api/logoer'); }
            catch (e) { alert('Kunne ikke laste logoer: ' + e.message); return; }
            const gjeldende = data[feltNavn] || '';
            const setter = feltNavn === 'DIFLogo_URL' ? setDIFLogo : setLogo;
            apneLogoGrid(logoer, gjeldende, (valgt) => setter(valgt));
        };
        function apneLogoGrid(logoer, gjeldende, callback) {
            const bakgrunn = document.createElement('div');
            bakgrunn.className = 'meldingsmodal-bakgrunn';
            const griddHtml = logoer.length === 0
                ? '<div style="text-align: center; color: var(--text-secondary); padding: 30px;">Ingen logoer lastet opp. Se <a href="/admin.html#logoer" target="_blank">Admin-panelet</a>.</div>'
                : logoer.map(l => `
                    <div class="logo-valg" data-url="${escapeAttr(l.url)}" title="${escapeAttr(l.navn)}"
                        style="border: 2px solid ${l.url === gjeldende ? 'var(--accent)' : 'var(--border-color)'};
                               border-radius: 8px; padding: 10px; cursor: pointer; background: var(--bg-container);
                               display: flex; flex-direction: column; gap: 6px; transition: transform 0.1s;">
                        <div style="height: 70px; display: flex; align-items: center; justify-content: center; background: var(--bg-input); border-radius: 4px; padding: 4px;">
                            <img src="${escapeAttr(l.url)}" alt="${escapeAttr(l.navn)}" style="max-width: 100%; max-height: 100%; object-fit: contain;">
                        </div>
                        <div style="font-size: 11px; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${escapeAttr(l.navn)}</div>
                    </div>
                `).join('');
            bakgrunn.innerHTML = `
                <div class="meldingsmodal-boks" style="max-width: 800px;">
                    <h3 style="margin: 0 0 12px 0;">Velg logo</h3>
                    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; max-height: 65vh; overflow-y: auto;">
                        ${griddHtml}
                    </div>
                    <div style="display: flex; justify-content: space-between; margin-top: 16px;">
                        <button class="knapp danger" data-handling="fjern">Fjern logo</button>
                        <button class="knapp sekundær" data-handling="avbryt">Avbryt</button>
                    </div>
                </div>
            `;
            document.body.appendChild(bakgrunn);
            const lukk = () => document.body.removeChild(bakgrunn);
            bakgrunn.addEventListener('click', e => { if (e.target === bakgrunn) lukk(); });
            bakgrunn.querySelector('[data-handling="avbryt"]').addEventListener('click', lukk);
            bakgrunn.querySelector('[data-handling="fjern"]').addEventListener('click', () => { callback(''); lukk(); });
            bakgrunn.querySelectorAll('.logo-valg').forEach(el => {
                el.addEventListener('mouseenter', () => { el.style.transform = 'scale(1.03)'; });
                el.addEventListener('mouseleave', () => { el.style.transform = ''; });
                el.addEventListener('click', () => { callback(el.dataset.url); lukk(); });
            });
            document.addEventListener('keydown', function esc(e) {
                if (e.key === 'Escape') { lukk(); document.removeEventListener('keydown', esc); }
            });
        }
        // ==================== AI-import (analyser bilde/PDF) ====================
        window.apneAiImportModal = () => {
            const bakgrunn = document.createElement('div');
            bakgrunn.className = 'meldingsmodal-bakgrunn';
            bakgrunn.innerHTML = `
                <div class="meldingsmodal-boks" style="max-width: 640px;">
                    <h3 style="margin: 0 0 8px 0;">🤖 Importer papirskjema med AI</h3>
                    <p style="font-size: 13px; color: var(--text-secondary); margin: 0 0 12px 0;">
                        Last opp et bilde eller en PDF av et papirskjema. AI analyserer det og genererer
                        en skjemadefinisjon som erstatter det du har nå.
                    </p>
                    <div id="ai-drop" style="border: 2px dashed var(--input-border); border-radius: 8px; padding: 24px; text-align: center; cursor: pointer; background: var(--bg-input);">
                        <div style="font-size: 32px;">📄</div>
                        <div style="margin-top: 8px; font-size: 14px;">Klikk her eller dra en fil hit</div>
                        <div style="font-size: 12px; color: var(--text-secondary); margin-top: 4px;">JPG, PNG, GIF, WebP eller PDF — maks 20 MB</div>
                        <input type="file" id="ai-input" accept="image/*,application/pdf" style="display: none;">
                        <div id="ai-filnavn" style="font-size: 12px; color: var(--accent); margin-top: 8px;"></div>
                    </div>
                    <div id="ai-status" style="margin-top: 10px; min-height: 20px;"></div>
                    <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px;">
                        <button class="knapp" data-handling="avbryt">Avbryt</button>
                        <button class="knapp primær" id="ai-analyser-btn" disabled>Analyser med AI</button>
                    </div>
                </div>
            `;
            document.body.appendChild(bakgrunn);
            const lukk = () => document.body.removeChild(bakgrunn);
            const dropEl = bakgrunn.querySelector('#ai-drop');
            const inputEl = bakgrunn.querySelector('#ai-input');
            const filnavnEl = bakgrunn.querySelector('#ai-filnavn');
            const statusEl = bakgrunn.querySelector('#ai-status');
            const analyserBtn = bakgrunn.querySelector('#ai-analyser-btn');
            let valgtFil = null;

            const settFil = (f) => {
                if (!f) return;
                valgtFil = f;
                filnavnEl.textContent = `${f.name} (${Math.round(f.size / 1024)} KB)`;
                analyserBtn.disabled = false;
            };
            dropEl.addEventListener('click', () => inputEl.click());
            inputEl.addEventListener('change', () => settFil(inputEl.files[0]));
            dropEl.addEventListener('dragover', e => { e.preventDefault(); dropEl.style.borderColor = 'var(--accent)'; });
            dropEl.addEventListener('dragleave', () => { dropEl.style.borderColor = 'var(--input-border)'; });
            dropEl.addEventListener('drop', e => {
                e.preventDefault(); dropEl.style.borderColor = 'var(--input-border)';
                settFil(e.dataTransfer.files[0]);
            });
            bakgrunn.querySelector('[data-handling="avbryt"]').addEventListener('click', lukk);
            bakgrunn.addEventListener('click', e => { if (e.target === bakgrunn) lukk(); });

            analyserBtn.addEventListener('click', async () => {
                if (!valgtFil) return;
                statusEl.innerHTML = '<div style="font-size: 13px; color: var(--text-secondary);">⏳ Analyserer — kan ta 15-30 sekunder…</div>';
                analyserBtn.disabled = true;
                try {
                    const fd = new FormData();
                    fd.append('fil', valgtFil);
                    const res = await fetch('/api/ai/analyser-skjema', { method: 'POST', body: fd });
                    const svar = await res.json();
                    if (!res.ok || svar.status !== 'ok') {
                        throw new Error(svar.melding || `HTTP ${res.status}`);
                    }
                    const ny = svar.skjema || {};
                    const antSek = ny.Seksjoner?.length || 0;
                    const antFelt = (ny.Seksjoner || []).reduce((s, sek) => s + (sek.Felter?.length || 0), 0);
                    if (!confirm(`AI genererte ${antSek} seksjon${antSek === 1 ? '' : 'er'} og ${antFelt} felt.\n\nDette vil ERSTATTE nåværende seksjons/felt-innhold i editoren (tilgang, behandling, varsling osv. bevares). Fortsette?`)) {
                        statusEl.innerHTML = '<div style="font-size: 13px; color: var(--text-secondary);">Avbrutt av bruker.</div>';
                        analyserBtn.disabled = false;
                        return;
                    }
                    // Bevar tilgangs- og behandlings-metadata
                    if (ny.Skjema_navn) data.Skjema_navn = ny.Skjema_navn;
                    if (ny.Skjemaforklaring) data.Skjemaforklaring = ny.Skjemaforklaring;
                    // Sørg for stabile IDer på nye felt (samme som ved kopi)
                    data.Seksjoner = (ny.Seksjoner || []).map(sek => ({
                        ...sek,
                        Felter: (sek.Felter || []).map(f => ({ ...f, Id: nyFeltId(), Svar: [] }))
                    }));
                    lukk();
                    rendrer();
                    alert(`✓ Importert ${antSek} seksjon${antSek === 1 ? '' : 'er'} og ${antFelt} felt. Husk å lagre.`);
                } catch (e) {
                    statusEl.innerHTML = `<div style="font-size: 13px; color: var(--danger);">Feil: ${escapeHtml(e.message)}</div>`;
                    analyserBtn.disabled = false;
                }
            });
        };

        // Genererer en unik felt-Id (samme mønster som editor bruker ellers)
        function nyFeltId() {
            return 'f-' + Math.random().toString(36).slice(2, 10) + '-' + Date.now().toString(36);
        }

        // Gevinstoppfølging: henter to bokser fra SystemInnstillinger og rendrer
        // Markdown-teksten med $lenke erstattet til en utsending-token-URL.
        // Prefill (invariant): felt 1-01 = gjeldende skjematype-id, 1-02 = navn.
        // Trenger eksisterende skjematype-id for å ha noe kontekst å prefille.
        async function fyllGevinstoppfolging() {
            if (!eksisterendeId) return; // ny (ulagret) skjematype — ingen kontekst å sende
            const typer = [
                { key: 'Gevinstestimat', divId: 'gevinst-estimat' },
                { key: 'Gevinstrapportering', divId: 'gevinst-rapportering' }
            ];
            let noeVist = false;
            const kontekstSkjematypeId = String(eksisterendeId);
            const kontekstNavn = data.Skjema_navn || '';
            for (const t of typer) {
                try {
                    const [tekstRes, idRes] = await Promise.all([
                        api.get(`/api/innstillinger/${t.key}.Tekst`).catch(() => null),
                        api.get(`/api/innstillinger/${t.key}.SkjemaId`).catch(() => null)
                    ]);
                    const tekst = tekstRes?.Verdi || '';
                    const gevinstSkjemaId = idRes?.Verdi || '';
                    if (!tekst) continue;
                    const el = document.getElementById(t.divId);
                    if (!el) continue;
                    let ferdigTekst = tekst;
                    if (gevinstSkjemaId) {
                        try {
                            // Opprett/hent utsending-token for meg selv med prefill av
                            // skjematype-id (1-01) og skjematype-navn (1-02).
                            const res = await api.post('/api/utsending/for-meg', {
                                skjematypeId: gevinstSkjemaId,
                                batchId: `gevinst-${t.key.toLowerCase()}`,
                                prefilled: {
                                    '1-01': [kontekstSkjematypeId],
                                    '1-02': [kontekstNavn]
                                }
                            });
                            ferdigTekst = ferdigTekst.split('$lenke').join(res.url);
                        } catch (e) {
                            console.warn(`gevinstoppfolging: kunne ikke opprette token for ${t.key}:`, e.message);
                            // Fall back til enkel lenke uten prefill
                            const url = `/index.html?skjematype_id=${encodeURIComponent(gevinstSkjemaId)}`;
                            ferdigTekst = ferdigTekst.split('$lenke').join(url);
                        }
                    }
                    el.innerHTML = renderTekst({ Verdi: ferdigTekst, Format: 'Markdown' });
                    el.style.display = '';
                    noeVist = true;
                } catch (e) {
                    console.warn(`gevinstoppfolging ${t.key}:`, e.message);
                }
            }
            const tom = document.getElementById('gevinst-tom');
            if (tom) tom.style.display = noeVist ? 'none' : '';
        }

        window.setFase = v => { data.Fase = v; };
        window.setForklaring = v => {
            if (!data.Skjemaforklaring) data.Skjemaforklaring = { Format: 'Tekst' };
            data.Skjemaforklaring.Innhold = v;
        };
        // Publikum og Eiere håndteres av tilgang-editor (frontend/js/tilgang-editor.js)
        // — mutasjoner skjer via onEndring-callback i rendrerTilgang().

        // ---- Seksjon ----
        window.leggTilSeksjon = () => {
            const nr = (data.Seksjoner?.length || 0) + 1;
            if (!data.Seksjoner) data.Seksjoner = [];
            data.Seksjoner.push({ Seksjon_nummer: nr, Seksjon_overskrift: '', Felter: [] });
            rendrerSeksjoner();
        };
        window.setSeksjonOverskrift = (sIdx, v) => {
            data.Seksjoner[sIdx].Seksjon_overskrift = v;
        };
        function slettSeksjon(sIdx) {
            data.Seksjoner.splice(sIdx, 1);
            renummererSeksjoner();
            rendrerSeksjoner();
        }
        function flyttSeksjon(sIdx, retning) {
            const til = sIdx + retning;
            if (til < 0 || til >= data.Seksjoner.length) return;
            const [s] = data.Seksjoner.splice(sIdx, 1);
            data.Seksjoner.splice(til, 0, s);
            renummererSeksjoner();
            rendrerSeksjoner();
        }
        function renummererSeksjoner() {
            data.Seksjoner.forEach((s, i) => { s.Seksjon_nummer = i + 1; });
        }

        // ---- Felt ----
        function nyId() {
            return crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
        }

        function leggTilFelt(sIdx) {
            const seksjon = data.Seksjoner[sIdx];
            const nr = String((seksjon.Felter?.length || 0) + 1).padStart(2, '0');
            if (!seksjon.Felter) seksjon.Felter = [];
            seksjon.Felter.push({
                Id: nyId(),
                Nummer: nr,
                Type: 'Tekst',
                Tekst: { Verdi: '', Format: 'Tekst' },
                Obligatorisk: false
            });
            rendrerSeksjoner();
        }
        window.setFeltTekst = (sIdx, fIdx, v) => {
            const felt = data.Seksjoner[sIdx].Felter[fIdx];
            if (!felt.Tekst) felt.Tekst = { Format: 'Tekst' };
            felt.Tekst.Verdi = v;
        };
        window.setFeltType = (sIdx, fIdx, v) => {
            const felt = data.Seksjoner[sIdx].Felter[fIdx];
            felt.Type = v;
            // Legg default Valg for typer som trenger det
            if (['Skala', 'Flervalg-knapper', 'Flervalg-dropdown'].includes(v) && !felt.Valg?.length) {
                felt.Valg = v === 'Skala'
                    ? [{ Valg_nr: 1, Tekst: 'Lav' }, { Valg_nr: 2, Tekst: 'Middels' }, { Valg_nr: 3, Tekst: 'Høy' }]
                    : [{ Tekst: 'Alternativ 1' }, { Tekst: 'Alternativ 2' }];
            }
            rendrerSeksjoner();
        };
        window.setFeltObligatorisk = (sIdx, fIdx, v) => {
            data.Seksjoner[sIdx].Felter[fIdx].Obligatorisk = v;
        };
        window.setFeltProp = (sIdx, fIdx, prop, v) => {
            data.Seksjoner[sIdx].Felter[fIdx][prop] = v;
        };
        window.setInfoFormat = (sIdx, fIdx, format) => {
            const felt = data.Seksjoner[sIdx].Felter[fIdx];
            if (!felt.Tekst) felt.Tekst = { Verdi: '' };
            felt.Tekst.Format = format;
        };
        window.setTekstFormat = (sIdx, fIdx, format) => {
            const felt = data.Seksjoner[sIdx].Felter[fIdx];
            if (!felt.Tekst) felt.Tekst = { Verdi: '' };
            felt.Tekst.Format = format;
        };
        window.setUndertittelFormat = (sIdx, fIdx, format) => {
            const felt = data.Seksjoner[sIdx].Felter[fIdx];
            if (!felt.Undertittel) felt.Undertittel = { Verdi: '' };
            felt.Undertittel.Format = format;
        };
        window.toggleFiltype = (sIdx, fIdx, filtype, valgt) => {
            const felt = data.Seksjoner[sIdx].Felter[fIdx];
            let liste = Array.isArray(felt.Tillatte_filtyper) && felt.Tillatte_filtyper.length > 0
                ? [...felt.Tillatte_filtyper]
                : ['Office', 'PDF', 'Bilder'];
            if (valgt && !liste.includes(filtype)) liste.push(filtype);
            if (!valgt) liste = liste.filter(k => k !== filtype);
            felt.Tillatte_filtyper = liste;
        };
        function slettFelt(sIdx, fIdx) {
            data.Seksjoner[sIdx].Felter.splice(fIdx, 1);
            renummererFelter(sIdx);
            rendrerSeksjoner();
        }
        function flyttFelt(sIdx, fIdx, retning) {
            const felter = data.Seksjoner[sIdx].Felter;
            const til = fIdx + retning;
            if (til < 0 || til >= felter.length) return;
            const [f] = felter.splice(fIdx, 1);
            felter.splice(til, 0, f);
            renummererFelter(sIdx);
            rendrerSeksjoner();
        }

        function kopierFelt(sIdx, fIdx) {
            const felter = data.Seksjoner[sIdx].Felter;
            const original = felter[fIdx];
            const kopi = JSON.parse(JSON.stringify(original));
            kopi.Id = nyId(); // ny stabile referanse-id
            const opprinneligTekst = kopi.Tekst?.Verdi || '';
            if (kopi.Tekst) kopi.Tekst.Verdi = opprinneligTekst + ' (kopi)';
            felter.splice(fIdx + 1, 0, kopi);
            renummererFelter(sIdx);
            rendrerSeksjoner();
        }
        function renummererFelter(sIdx) {
            data.Seksjoner[sIdx].Felter.forEach((f, i) => {
                f.Nummer = String(i + 1).padStart(2, '0');
            });
        }

        // ---- Valg ----
        function leggTilValg(sIdx, fIdx) {
            const felt = data.Seksjoner[sIdx].Felter[fIdx];
            if (!felt.Valg) felt.Valg = [];
            if (felt.Type === 'Skala') {
                felt.Valg.push({ Valg_nr: felt.Valg.length + 1, Tekst: '' });
            } else {
                felt.Valg.push({ Tekst: '' });
            }
            rendrerSeksjoner();
        }
        window.setValgTekst = (sIdx, fIdx, vIdx, v) => {
            data.Seksjoner[sIdx].Felter[fIdx].Valg[vIdx].Tekst = v;
        };
        window.setValgNr = (sIdx, fIdx, vIdx, v) => {
            data.Seksjoner[sIdx].Felter[fIdx].Valg[vIdx].Valg_nr = Number(v) || 0;
        };
        function slettValg(sIdx, fIdx, vIdx) {
            data.Seksjoner[sIdx].Felter[fIdx].Valg.splice(vIdx, 1);
            rendrerSeksjoner();
        }

        // ---- Lagre / Slett / Kopier ----
        window.lagre = async () => {
            if (!data.Skjema_navn?.trim()) {
                toast('Skjema-navn er påkrevd', 'feil');
                return;
            }
            try {
                const svar = await api.post('/api/skjematyper', data);
                data.Skjematype_id = svar.Skjematype_id;
                toast('Lagret ✓');
                // Hvis dette var ny, oppdater URL slik at ytterligere lagringer blir oppdatering
                if (svar.erNy) {
                    const nyUrl = `/editor.html?skjematype_id=${encodeURIComponent(svar.Skjematype_id)}`;
                    window.history.replaceState({}, '', nyUrl);
                    // Re-rendrer med knappelinje som viser Test/Kopier/Slett
                    location.reload();
                }
            } catch (e) {
                toast('Kunne ikke lagre: ' + e.message, 'feil');
            }
        };
        window.kopier = () => {
            window.location.href = `/editor.html?kopi_fra=${encodeURIComponent(eksisterendeId)}`;
        };
        window.aapneSlettModal = () => {
            document.getElementById('slettModal').classList.add('vis');
        };
        window.lukkSlettModal = () => {
            document.getElementById('slettModal').classList.remove('vis');
        };
        window.bekreftSlett = async () => {
            const btn = document.getElementById('slettBekreft');
            btn.disabled = true;
            btn.textContent = 'Sletter…';
            try {
                await api.del(`/api/skjematyper/${encodeURIComponent(eksisterendeId)}`);
                window.location.href = '/velgskjematype.html';
            } catch (e) {
                btn.disabled = false;
                btn.textContent = 'Slett skjematypen';
                toast('Kunne ikke slette: ' + e.message, 'feil');
            }
        };

        function toast(tekst, type) {
            const el = document.getElementById('toast');
            el.textContent = tekst;
            el.className = 'status-toast vis' + (type === 'feil' ? ' feil' : '');
            setTimeout(() => el.classList.remove('vis'), 2500);
        }

        function escapeHtml(s) {
            return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
        function escapeAttr(s) {
            return String(s ?? '').replace(/"/g, '&quot;').replace(/'/g, "\\'");
        }

        init();
    </script>
</body>
</html>
