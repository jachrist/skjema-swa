<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrasjon</title>
    <script>
        (function () {
            const t = localStorage.getItem('theme');
            if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        })();
    </script>
    <style>
        :root {
            --bg-page: #e8edf2;
            --bg-container: rgba(255, 255, 255, 0.85);
            --bg-section: rgba(255, 255, 255, 0.55);
            --bg-input: white;
            --text-primary: #1c1c1e;
            --text-secondary: #6e6e73;
            --text-heading: #0a84ff;
            --border-color: rgba(0, 0, 0, 0.1);
            --input-border: #d1d1d6;
            --accent: #0a84ff;
            --accent-light: rgba(10, 132, 255, 0.12);
            --success: #34c759;
            --success-light: rgba(52, 199, 89, 0.15);
            --warning: #ff9500;
            --warning-light: rgba(255, 149, 0, 0.15);
            --danger: #ff3b30;
            --danger-light: rgba(255, 59, 48, 0.12);
            --shadow: 0 4px 30px rgba(0, 0, 0, 0.06);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 18px;
            --radius-xl: 24px;
        }
        [data-theme="dark"] {
            --bg-page: #0d1117;
            --bg-container: rgba(30, 35, 45, 0.85);
            --bg-section: rgba(40, 45, 60, 0.55);
            --bg-input: #1c2028;
            --text-primary: #f0f0f5;
            --text-secondary: #8e8e93;
            --text-heading: #64b5f6;
            --border-color: rgba(255, 255, 255, 0.1);
            --input-border: #3a3a5a;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-page); color: var(--text-primary);
            margin: 0; padding: 20px; -webkit-font-smoothing: antialiased;
        }
        .container {
            max-width: 1400px; margin: 0 auto;
            background: var(--bg-container); backdrop-filter: blur(20px);
            padding: 24px; border-radius: var(--radius-xl); box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }
        .tilbake { color: var(--accent); text-decoration: none; font-size: 13px; display: inline-block; margin-bottom: 8px; }
        .topplinje { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
        h1 { font-size: 1.5em; font-weight: 700; margin: 0; }
        .brukerinfo { font-size: 13px; color: var(--text-secondary); }
        .undertittel { color: var(--text-secondary); margin: 4px 0 20px; font-size: 13px; }

        .layout {
            display: grid; grid-template-columns: 220px 1fr; gap: 20px;
            min-height: 500px;
        }
        .sidebar {
            background: var(--bg-section); border: 1px solid var(--border-color);
            border-radius: var(--radius-lg); padding: 10px;
        }
        .sidebar .fane {
            display: flex; align-items: center; gap: 8px;
            padding: 10px 12px; font-size: 14px; font-weight: 500;
            border-radius: var(--radius-sm); cursor: pointer;
            color: var(--text-primary); text-decoration: none;
            border: 1px solid transparent;
        }
        .sidebar .fane:hover { background: var(--accent-light); }
        .sidebar .fane.aktiv { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }
        .sidebar .fane .badge {
            font-size: 10px; color: var(--warning);
            border: 1px solid var(--warning); border-radius: 4px;
            padding: 1px 5px; margin-left: auto;
        }
        .sidebar .skille { height: 1px; background: var(--border-color); margin: 8px 4px; }

        .innhold {
            background: var(--bg-section); border: 1px solid var(--border-color);
            border-radius: var(--radius-lg); padding: 20px; min-height: 500px;
        }

        .panel { padding: 16px 18px; margin-bottom: 14px; background: var(--bg-container); border: 1px solid var(--border-color); border-radius: var(--radius-md); }
        .panel h2 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-secondary); margin: 0 0 12px 0; }

        input[type="text"], input[type="email"], select {
            width: 100%; padding: 8px 12px; font-size: 14px;
            border: 1px solid var(--input-border); border-radius: var(--radius-sm);
            background: var(--bg-input); color: var(--text-primary); font-family: inherit;
        }
        .rad { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; }
        .rad label { font-size: 12px; color: var(--text-secondary); min-width: 90px; }

        .knapp {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 6px 12px; font-size: 13px; font-weight: 600;
            border: 1px solid var(--accent); background: transparent; color: var(--accent);
            border-radius: 6px; cursor: pointer; font-family: inherit; text-decoration: none;
        }
        .knapp:hover { background: var(--accent-light); }
        .knapp.primær { background: var(--accent); color: white; }
        .knapp.primær:hover { opacity: 0.9; background: var(--accent); }
        .knapp.danger { border-color: var(--danger); color: var(--danger); }
        .knapp.danger:hover { background: var(--danger-light); }
        .knapp.mini { padding: 3px 8px; font-size: 12px; }
        .knapp:disabled { opacity: 0.5; cursor: not-allowed; }
        .knapp-rad { display: flex; gap: 8px; flex-wrap: wrap; }

        .banner {
            padding: 10px 14px; margin-bottom: 12px; border-radius: 8px;
            font-size: 13px; line-height: 1.5;
        }
        .banner.info { background: var(--accent-light); color: var(--accent); }
        .banner.suksess { background: var(--success-light); color: var(--success); }
        .banner.advarsel { background: var(--warning-light); color: var(--warning); }
        .banner.feil { background: var(--danger-light); color: var(--danger); }

        /* Roller-fane */
        .to-spalter { display: grid; grid-template-columns: 340px 1fr; gap: 16px; }
        .kolonne { background: var(--bg-container); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 14px; }
        .rolle-liste { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
        .rolle-element {
            padding: 8px 10px; background: var(--bg-section); border-radius: 6px;
            border: 1px solid var(--border-color); cursor: pointer;
        }
        .rolle-element:hover { background: var(--accent-light); }
        .rolle-element.aktiv { border-color: var(--accent); background: var(--accent-light); }
        .rolle-element .navn { font-weight: 600; font-size: 13px; }
        .rolle-element .omfang { font-size: 11px; color: var(--text-secondary); }
        .rolle-element .antall { font-size: 10px; color: var(--text-secondary); margin-top: 2px; }
        .innehaver-header, .innehaver-rad {
            display: grid; grid-template-columns: 1fr 1fr 90px 70px; gap: 10px;
            padding: 8px 10px; align-items: center; font-size: 13px;
        }
        .innehaver-header { font-weight: 600; color: var(--text-secondary); border-bottom: 1px solid var(--border-color); }
        .innehaver-rad { border-bottom: 1px solid var(--border-color); }
        .innehaver-rad:last-child { border-bottom: 0; }
        .tom-melding, .laster, .feilmelding { text-align: center; padding: 30px; color: var(--text-secondary); font-size: 13px; }
        .feilmelding { color: var(--danger); }

        /* Nøkler-fane */
        .nokkel-vis {
            font-family: 'SF Mono', Menlo, monospace; font-size: 12px;
            padding: 10px 12px; background: var(--bg-input);
            border: 1px solid var(--input-border); border-radius: 6px;
            word-break: break-all;
        }

        @media (max-width: 900px) {
            .layout { grid-template-columns: 1fr; }
            .to-spalter { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/velgskjematype.html" class="tilbake">← Til skjemaoversikten</a>
        <div class="topplinje">
            <h1>Administrasjon</h1>
            <div class="brukerinfo"><span id="upn">…</span></div>
        </div>
        <p class="undertittel">Sentralisert admin-panel. Krever admin-rolle.</p>

        <div class="layout">
            <nav class="sidebar" id="sidebar">
                <a class="fane" data-fane="roller" href="#roller">👥 Roller</a>
                <a class="fane" data-fane="nokler" href="#nokler">🔐 Nøkler</a>
                <div class="skille"></div>
                <a class="fane" data-fane="hendelser" href="#hendelser">📋 Hendelser</a>
                <a class="fane" data-fane="utsendinger" href="#utsendinger">✉️ Utsendinger</a>
                <a class="fane" data-fane="masterdata" href="#masterdata">🗂 Masterdata <span class="badge">Snart</span></a>
                <a class="fane" data-fane="postnumre-fs" href="#postnumre-fs">🌐 Postnumre / FS <span class="badge">Snart</span></a>
                <a class="fane" data-fane="backup" href="#backup">💾 Backup <span class="badge">Snart</span></a>
                <a class="fane" data-fane="logoer" href="#logoer">🖼 Logoer</a>
                <a class="fane" data-fane="system" href="#system">⚙️ System <span class="badge">Snart</span></a>
            </nav>
            <div class="innhold" id="innhold">
                <div class="laster">Laster…</div>
            </div>
        </div>
    </div>

    <script type="module">
        import { api } from './js/api-client.js';
        import { hentInnloggetBruker } from './js/auth.js';

        let bruker = null;
        let erAdmin = false;

        async function init() {
            bruker = await hentInnloggetBruker();
            if (!bruker) {
                window.location.href = '/.auth/login/aad?post_login_redirect_uri=' + encodeURIComponent(window.location.pathname + window.location.hash);
                return;
            }
            document.getElementById('upn').textContent = bruker.userDetails;
            try {
                const w = await api.get('/api/whoami');
                erAdmin = !!w.erAdmin;
            } catch (_) { /* ikke kritisk */ }
            if (!erAdmin) {
                document.getElementById('innhold').innerHTML = '<div class="banner feil">Krever admin-rolle. Kontakt en administrator.</div>';
                return;
            }
            window.addEventListener('hashchange', rutHash);
            rutHash();
        }

        function rutHash() {
            const h = (window.location.hash || '#roller').replace(/^#/, '');
            markerFane(h);
            switch (h) {
                case 'roller':      rendrRoller(); break;
                case 'nokler':      rendrNokler(); break;
                case 'hendelser':   rendrHendelser(); break;
                case 'utsendinger': rendrUtsendinger(); break;
                case 'masterdata':  rendrPlaceholder('Masterdata', 'Faste_data og oppslagslister (Emner, Fakulteter, osv.). Redigerbar tabell.'); break;
                case 'postnumre-fs':rendrPlaceholder('Postnumre / FS', 'Seed postnumre-tabell. Trigg refresh av FS-data (emner, personer).'); break;
                case 'backup':      rendrPlaceholder('Backup', 'Manuell trigger + tidsplan for eksport av skjemaer, skjematyper, roller til blob-container. Nedlastbare øyeblikksbilder.'); break;
                case 'logoer':      rendrLogoer(); break;
                case 'system':      rendrPlaceholder('System', 'Miljø-info, /api/whoami-dump, varsling-diag, seed-eksempler. Kanskje også migrering-verktøy.'); break;
                default: rendrRoller();
            }
        }

        function markerFane(f) {
            for (const el of document.querySelectorAll('.sidebar .fane')) {
                el.classList.toggle('aktiv', el.dataset.fane === f);
            }
        }

        function rendrPlaceholder(navn, beskr) {
            document.getElementById('innhold').innerHTML = `
                <div class="panel">
                    <h2>${escHtml(navn)}</h2>
                    <div style="color: var(--text-secondary); font-size: 14px; line-height: 1.5;">${escHtml(beskr)}</div>
                    <div style="margin-top: 12px; font-size: 12px; color: var(--text-secondary);">
                        <em>Ikke implementert ennå.</em>
                    </div>
                </div>
            `;
        }

        // ==================== ROLLER-FANE ====================
        let rollerState = { grupper: [], filtrerte: [], valgt: null };

        function rendrRoller() {
            document.getElementById('innhold').innerHTML = `
                <div class="to-spalter">
                    <div class="kolonne">
                        <input type="text" id="roller-sok" placeholder="🔍 Søk rolle eller omfang…" oninput="rollerFiltrer()">
                        <div style="margin-top: 8px;">
                            <button class="knapp sekundær mini" onclick="rollerVisNyForm()">+ Ny rolle</button>
                        </div>
                        <div id="roller-ny-form" style="display: none; margin-top: 10px; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-section);">
                            <div style="font-weight: 600; margin-bottom: 6px; font-size: 13px;">Ny rolle</div>
                            <div class="rad"><label>Rolle:</label><input type="text" id="nr-rolle" placeholder="Skjemaskaper"></div>
                            <div class="rad"><label>Omfang:</label><input type="text" id="nr-omfang" placeholder="(valgfritt)"></div>
                            <div style="border-top: 1px solid var(--border-color); margin: 8px 0; padding-top: 8px; font-size: 12px; color: var(--text-secondary);">Første innehaver:</div>
                            <div class="rad"><label>UPN:</label><input type="email" id="nr-upn" placeholder="navn@domene.no"></div>
                            <div class="rad"><label>Fornavn:</label><input type="text" id="nr-fn"></div>
                            <div class="rad"><label>Etternavn:</label><input type="text" id="nr-en"></div>
                            <div class="knapp-rad" style="margin-top: 8px;">
                                <button class="knapp primær mini" onclick="rollerOpprett()">Opprett</button>
                                <button class="knapp mini" onclick="rollerSkjulNyForm()">Avbryt</button>
                            </div>
                        </div>
                        <div class="rolle-liste" id="roller-grupper"><div class="laster">Laster…</div></div>
                    </div>
                    <div class="kolonne" id="roller-hoyre">
                        <div class="tom-melding">Velg en rolle fra listen.</div>
                    </div>
                </div>
            `;
            rollerLast();
        }

        async function rollerLast() {
            try {
                rollerState.grupper = await api.get('/api/roller/grupper');
                rollerFiltrer();
            } catch (e) {
                document.getElementById('roller-grupper').innerHTML = `<div class="feilmelding">${escHtml(e.message)}</div>`;
            }
        }

        window.rollerFiltrer = () => {
            const q = (document.getElementById('roller-sok')?.value || '').trim().toLowerCase();
            rollerState.filtrerte = q === ''
                ? rollerState.grupper
                : rollerState.grupper.filter(g => g.Rolle.toLowerCase().includes(q) || (g.Omfang || '').toLowerCase().includes(q));
            rollerRenderGrupper();
        };

        function rollerRenderGrupper() {
            const el = document.getElementById('roller-grupper');
            if (rollerState.filtrerte.length === 0) {
                el.innerHTML = '<div class="tom-melding">Ingen roller.</div>';
                return;
            }
            el.innerHTML = rollerState.filtrerte.map((g, i) => `
                <div class="rolle-element${rollerState.valgt && rollerState.valgt.Rolle === g.Rolle && rollerState.valgt.Omfang === g.Omfang ? ' aktiv' : ''}"
                    onclick="rollerVelgGruppe(${i})">
                    <div class="navn">${escHtml(g.Rolle)}</div>
                    ${g.Omfang ? `<div class="omfang">${escHtml(g.Omfang)}</div>` : ''}
                    <div class="antall">${g.Antall} innehaver${g.Antall === 1 ? '' : 'e'}</div>
                </div>
            `).join('');
        }

        window.rollerVelgGruppe = async (i) => {
            rollerState.valgt = rollerState.filtrerte[i];
            rollerRenderGrupper();
            const hoyre = document.getElementById('roller-hoyre');
            hoyre.innerHTML = '<div class="laster">Henter innehavere…</div>';
            try {
                const g = rollerState.valgt;
                const rolleStreng = g.Omfang ? `${g.Rolle}(${g.Omfang})` : g.Rolle;
                const innehavere = await api.get(`/api/roller/innehavere?rolle=${encodeURIComponent(rolleStreng)}`);
                rollerRenderInnehavere(innehavere);
            } catch (e) {
                hoyre.innerHTML = `<div class="feilmelding">${escHtml(e.message)}</div>`;
            }
        };

        function rollerRenderInnehavere(innehavere) {
            const g = rollerState.valgt;
            const hoyre = document.getElementById('roller-hoyre');
            const tittel = `<h2 style="margin: 0 0 6px 0; font-size: 1.2em;">${escHtml(g.Rolle)}${g.Omfang ? ` <span style="color: var(--text-secondary); font-weight: 400;">(${escHtml(g.Omfang)})</span>` : ''}</h2>`;
            const under = `<div style="color: var(--text-secondary); font-size: 12px; margin-bottom: 14px;">${innehavere.length} innehaver${innehavere.length === 1 ? '' : 'e'}</div>`;
            const tabell = innehavere.length === 0
                ? '<div class="tom-melding">Ingen innehavere ennå.</div>'
                : `
                    <div class="innehaver-header"><div>Navn</div><div>UPN</div><div>Kilde</div><div></div></div>
                    ${innehavere.map(i => `
                        <div class="innehaver-rad">
                            <div>${escHtml(`${i.EN || ''}${i.FN ? ', ' + i.FN : ''}`.trim() || '-')}</div>
                            <div style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${escHtml(i.UPN)}</div>
                            <div style="color: var(--text-secondary); font-size: 11px;">${escHtml(i.Kilde || 'manuell')}</div>
                            <div><button class="knapp mini danger" onclick="rollerFjern('${escAttr(i.UPN)}')">Fjern</button></div>
                        </div>
                    `).join('')}
                `;
            const nyBoks = `
                <div class="panel" style="margin-top: 16px;">
                    <h2>Legg til ny innehaver</h2>
                    <div class="rad"><label>UPN:</label><input type="email" id="ny-upn" placeholder="navn@domene.no"></div>
                    <div class="rad"><label>Fornavn:</label><input type="text" id="ny-fn"></div>
                    <div class="rad"><label>Etternavn:</label><input type="text" id="ny-en"></div>
                    <div style="margin-top: 8px;"><button class="knapp primær" onclick="rollerLeggTil()">Legg til</button></div>
                </div>
            `;
            hoyre.innerHTML = tittel + under + tabell + nyBoks;
        }

        window.rollerVisNyForm = () => {
            document.getElementById('roller-ny-form').style.display = 'block';
            document.getElementById('nr-rolle').focus();
        };
        window.rollerSkjulNyForm = () => {
            document.getElementById('roller-ny-form').style.display = 'none';
            for (const id of ['nr-rolle', 'nr-omfang', 'nr-upn', 'nr-fn', 'nr-en']) {
                document.getElementById(id).value = '';
            }
        };
        window.rollerOpprett = async () => {
            const rolle = document.getElementById('nr-rolle').value.trim();
            const omfang = document.getElementById('nr-omfang').value.trim();
            const upn = document.getElementById('nr-upn').value.trim();
            const fn = document.getElementById('nr-fn').value.trim();
            const en = document.getElementById('nr-en').value.trim();
            if (!rolle) { alert('Rolle-navn er påkrevd'); return; }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(upn)) { alert('Første innehaver må ha gyldig UPN'); return; }
            try {
                await api.post('/api/roller/leggtil', { Rolle: rolle, Omfang: omfang, UPN: upn, FN: fn, EN: en });
                rollerSkjulNyForm();
                await rollerLast();
                const idx = rollerState.grupper.findIndex(g => g.Rolle === rolle && (g.Omfang || '') === omfang);
                if (idx >= 0) {
                    rollerState.valgt = rollerState.grupper[idx];
                    rollerFiltrer();
                    rollerVelgGruppe(rollerState.filtrerte.findIndex(g => g.Rolle === rolle && (g.Omfang || '') === omfang));
                }
            } catch (e) { alert('Kunne ikke opprette: ' + e.message); }
        };
        window.rollerLeggTil = async () => {
            const g = rollerState.valgt;
            const upn = document.getElementById('ny-upn').value.trim();
            const fn = document.getElementById('ny-fn').value.trim();
            const en = document.getElementById('ny-en').value.trim();
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(upn)) { alert('UPN må være e-postadresse'); return; }
            try {
                await api.post('/api/roller/leggtil', { Rolle: g.Rolle, Omfang: g.Omfang || '', UPN: upn, FN: fn, EN: en });
                await rollerLast();
                const idx = rollerState.grupper.findIndex(x => x.Rolle === g.Rolle && x.Omfang === g.Omfang);
                if (idx >= 0) {
                    rollerState.valgt = rollerState.grupper[idx];
                    rollerVelgGruppe(rollerState.filtrerte.findIndex(x => x.Rolle === g.Rolle && x.Omfang === g.Omfang));
                }
            } catch (e) { alert('Feil: ' + e.message); }
        };
        window.rollerFjern = async (upn) => {
            const g = rollerState.valgt;
            if (!confirm(`Fjern ${upn} fra ${g.Rolle}${g.Omfang ? '(' + g.Omfang + ')' : ''}?`)) return;
            try {
                await api.post('/api/roller/fjern', { Rolle: g.Rolle, Omfang: g.Omfang || '', UPN: upn });
                await rollerLast();
                const idx = rollerState.grupper.findIndex(x => x.Rolle === g.Rolle && x.Omfang === g.Omfang);
                if (idx >= 0) {
                    rollerState.valgt = rollerState.grupper[idx];
                    rollerVelgGruppe(rollerState.filtrerte.findIndex(x => x.Rolle === g.Rolle && x.Omfang === g.Omfang));
                } else {
                    rollerState.valgt = null;
                    document.getElementById('roller-hoyre').innerHTML = '<div class="tom-melding">Velg en rolle fra listen.</div>';
                    rollerFiltrer();
                }
            } catch (e) { alert('Kunne ikke fjerne: ' + e.message); }
        };

        // ==================== NØKLER-FANE ====================
        let noklerState = { valgtId: null, alleTyper: [] };

        function rendrNokler() {
            document.getElementById('innhold').innerHTML = `
                <div class="banner advarsel">
                    <strong>⚠️ Viktig:</strong> Nøkkelen er den ENESTE kopien i systemet. Skriv den ned og lagre trygt.
                    Uten nøkkel kan krypterte skjemaer aldri leses igjen. Bytt nøkkel med varsomhet — feil bytte gjør data uopprettelig.
                </div>
                <div class="panel">
                    <h2>Velg skjematype</h2>
                    <select id="nokler-velger" onchange="noklerOnEndret()">
                        <option value="">Laster…</option>
                    </select>
                </div>
                <div class="panel" id="nokler-status-panel" style="display: none;">
                    <h2>Status</h2>
                    <div id="nokler-status"></div>
                    <div id="nokler-konfig" style="margin-top: 10px; font-size: 13px; color: var(--text-secondary);"></div>
                </div>
                <div class="panel" id="nokler-handling-panel" style="display: none;">
                    <h2>Handlinger</h2>
                    <div id="nokler-ingen" style="display: none;">
                        <p style="font-size: 13px; color: var(--text-secondary); margin: 0 0 10px;">Ingen nøkkel lagret. Generer én — den lages med kryptografisk sikker random.</p>

                    </div>

        async function noklerLast() {
            try {
                noklerState.alleTyper = await api.get('/api/skjematyper');
                const velger = document.getElementById('nokler-velger');
                if (noklerState.alleTyper.length === 0) {
                    velger.innerHTML = '<option value="">(ingen skjematyper)</option>';
                    return;
                }
                velger.innerHTML = '<option value="">— velg skjematype —</option>' +
                    noklerState.alleTyper.map(t => `<option value="${t.Skjematype_id}">${escHtml(t.Skjema_navn)} (ID ${t.Skjematype_id})</option>`).join('');
            } catch (e) {
                noklerMelding('Kunne ikke laste skjematyper: ' + e.message, 'feil');
            }
        }

        window.noklerOnEndret = async () => {
            noklerState.valgtId = document.getElementById('nokler-velger').value;
            document.getElementById('nokler-melding').style.display = 'none';
            document.getElementById('nokler-rekrypt').style.display = 'none';
            if (!noklerState.valgtId) {
                document.getElementById('nokler-status-panel').style.display = 'none';
                document.getElementById('nokler-handling-panel').style.display = 'none';
                return;
            }
            await noklerRefresh();
        };

        async function noklerRefresh() {
            try {
                const [n, def] = await Promise.all([
                    api.get(`/api/nokkel/${encodeURIComponent(noklerState.valgtId)}`),
                    api.get(`/api/skjematyper/${encodeURIComponent(noklerState.valgtId)}?rå=1`)
                ]);
                document.getElementById('nokler-status-panel').style.display = '';
                document.getElementById('nokler-handling-panel').style.display = '';
                const status = document.getElementById('nokler-status');
                if (n.finnes) {
                    status.innerHTML = '<span style="color: var(--success);">✓ Nøkkel er lagret</span>';
                    document.getElementById('nokler-verdi').textContent = n.nokkel;
                    document.getElementById('nokler-ingen').style.display = 'none';
                    document.getElementById('nokler-har').style.display = '';
                } else {
                    status.innerHTML = '<span style="color: var(--text-secondary);">Ingen nøkkel lagret ennå</span>';
                    document.getElementById('nokler-ingen').style.display = '';
                    document.getElementById('nokler-har').style.display = 'none';
                }
                const konfig = document.getElementById('nokler-konfig');
                const kryp = def.Krypteres || 'Nei';
                const anon = def.Anonymiseres ? 'Ja' : 'Nei';
                konfig.innerHTML = `Krypteres: <b>${escHtml(kryp)}</b> &nbsp;·&nbsp; Anonymiseres: <b>${escHtml(anon)}</b>`;
                if (kryp !== 'Nei' && !n.finnes) {
                    konfig.innerHTML += ' <span style="color: var(--warning);">⚠ Kryptering valgt men nøkkel mangler — hoppes over ved siste ferdig-behandling</span>';
                }
            } catch (e) {
                noklerMelding('Kunne ikke hente status: ' + e.message, 'feil');
            }
        }

        window.noklerGenerer = async () => {
            if (!confirm('Generere en NY nøkkel? Må lagres trygt — kan ikke gjenskapes hvis den mistes.')) return;
            try {
                await api.post(`/api/nokkel/${encodeURIComponent(noklerState.valgtId)}/generer`, {});
                noklerMelding('✓ Ny nøkkel generert. Kopier og lagre den trygt nå.', 'suksess');
                await noklerRefresh();
            } catch (e) { noklerMelding('Feil: ' + e.message, 'feil'); }
        };
        window.noklerKopier = async () => {
            try {
                await navigator.clipboard.writeText(document.getElementById('nokler-verdi').textContent);
                noklerMelding('✓ Kopiert', 'suksess');
            } catch (_) { noklerMelding('Klipp manuelt fra feltet', 'info'); }
        };
        window.noklerApneRekrypt = () => {
            document.getElementById('nokler-rekrypt').style.display = '';
            document.getElementById('nokler-bekreft').value = '';
        };
        window.noklerAvbrytRekrypt = () => {
            document.getElementById('nokler-rekrypt').style.display = 'none';
        };
        window.noklerRekrypter = async () => {
            const gammel = document.getElementById('nokler-bekreft').value.trim();
            if (!gammel) { noklerMelding('Bekreft nåværende nøkkel', 'feil'); return; }
            if (!confirm('Bytt nøkkel? Alle eksisterende krypterte skjemaer dekrypteres og re-krypteres. Kan ikke angres.')) return;
            try {
                const res = await api.post(`/api/nokkel/${encodeURIComponent(noklerState.valgtId)}/rekrypter`, { gammelNokkel: gammel });
                noklerMelding(`✓ Rekrypterte ${res.antallRekryptert} skjemaer${res.antallFeilet ? ` (${res.antallFeilet} feilet)` : ''}. Kopier ny nøkkel NÅ.`, 'suksess');
                document.getElementById('nokler-rekrypt').style.display = 'none';
                await noklerRefresh();
            } catch (e) { noklerMelding('Rekryptering feilet: ' + e.message, 'feil'); }
        };
        function noklerMelding(tekst, klasse) {
            const el = document.getElementById('nokler-melding');
            el.className = 'banner ' + klasse;
            el.textContent = tekst;
            el.style.display = '';
        }

        // ==================== HENDELSER-FANE ====================

            'skjema.innsend': 'Skjema innsendt',
            'skjema.beslutning': 'Behandling: beslutning',
            'skjema.slett': 'Skjema slettet',
            'skjematype.opprett': 'Skjematype opprettet',
            'skjematype.oppdater': 'Skjematype oppdatert',
            'skjematype.slett': 'Skjematype slettet',
            'nokkel.generer': 'Nøkkel generert',
            'nokkel.rekrypter': 'Nøkkel byttet (rekryptert)',

        function rendrHendelser() {
            document.getElementById('innhold').innerHTML = `
                <div class="panel">
                    <h2>Filtrer</h2>
                    <div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: end;">
                        <div style="flex: 1; min-width: 140px;">

                    </div>

                    </div>
                </div>
                <div class="panel">
                    <h2>Resultater <span id="h-teller" style="font-weight: 400; color: var(--text-secondary); text-transform: none; letter-spacing: 0; margin-left: 8px;"></span></h2>

                </div>
            `;

        window.hendelserLast = async () => {
            const params = new URLSearchParams();
            const fra = document.getElementById('h-fra')?.value;
            const til = document.getElementById('h-til')?.value;
            const type = document.getElementById('h-type')?.value;
            const aktor = document.getElementById('h-aktor')?.value.trim();
            const objekt = document.getElementById('h-objekt')?.value.trim();
            const antall = document.getElementById('h-antall')?.value;
            if (fra) params.set('fraDato', fra);
            if (til) params.set('tilDato', til + 'T23:59:59Z');
            if (type) params.set('type', type);
            if (aktor) params.set('aktor', aktor);
            if (objekt) params.set('objektId', objekt);
            if (antall) params.set('antall', antall);
            const liste = document.getElementById('h-liste');
            liste.innerHTML = '<div class="laster">Laster…</div>';
            try {
                const data = await api.get('/api/hendelser?' + params.toString());
                document.getElementById('h-teller').textContent = `— ${data.length} hendelse${data.length === 1 ? '' : 'r'}`;
                if (data.length === 0) {
                    liste.innerHTML = '<div class="tom-melding">Ingen hendelser matcher filteret.</div>';
                    return;
                }
                liste.innerHTML = `
                    <div class="innehaver-header" style="grid-template-columns: 145px 180px 200px 1fr; gap: 12px;">
                        <div>Tid</div><div>Type</div><div>Aktør</div><div>Melding</div>
                    </div>
                    ${data.map((h, i) => `
                        <div class="innehaver-rad" style="grid-template-columns: 145px 180px 200px 1fr; gap: 12px; cursor: pointer;" onclick="hendelserToggleDetalj(${i})">
                            <div style="font-family: 'SF Mono', Menlo, monospace; font-size: 12px;">${formatTid(h.Tid)}</div>
                            <div>${escHtml(TYPE_LABELS[h.Type] || h.Type)}</div>
                            <div style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${escHtml(h.Aktor || '-')}</div>
                            <div style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${escHtml(h.Melding || '')}${h.ObjektId ? ` <small style="color: var(--text-secondary);">(${escHtml(h.ObjektId)})</small>` : ''}</div>
                        </div>
                        <div id="h-detalj-${i}" style="display: none; padding: 8px 14px; background: var(--bg-input); font-family: 'SF Mono', Menlo, monospace; font-size: 11px; white-space: pre-wrap; border-radius: 6px; margin: 4px 0;">${escHtml(JSON.stringify(h.Detaljer, null, 2) || '(ingen detaljer)')}</div>
                    `).join('')}
                `;
            } catch (e) {
                liste.innerHTML = `<div class="feilmelding">${escHtml(e.message)}</div>`;
            }
        };

        window.hendelserToggleDetalj = (i) => {
            const el = document.getElementById(`h-detalj-${i}`);
            if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
        };

        function formatTid(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            const pad = n => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
        }

        // ==================== UTSENDINGER-FANE ====================

        function rendrUtsendinger() {
            document.getElementById('innhold').innerHTML = `
                <div class="panel">
                    <h2>Batch-status</h2>
                    <div style="display: flex; gap: 10px; align-items: end;">
                        <div style="flex: 1;">
                            <label style="font-size: 12px; color: var(--text-secondary);">Batch-ID</label>
                            <input type="text" id="u-batch" placeholder="f.eks. test-1786520977">
                        </div>
                        <button class="knapp primær" onclick="utsHentBatch()">Hent</button>
                    </div>
                    <div style="margin-top: 8px; font-size: 12px; color: var(--text-secondary);">
                        Batch-ID er verdien du sendte som <code>batchId</code> ved <code>POST /api/utsending</code>. Kan også være sender-skjema-id.
                    </div>
                </div>
                <div class="panel">
                    <h2>Manuell purring</h2>
                    <div style="display: flex; gap: 10px; align-items: end;">
                        <div style="flex: 1;">
                            <label style="font-size: 12px; color: var(--text-secondary);">Batch-ID (tomt = alle ubesvarte)</label>
                            <input type="text" id="u-purre-batch" placeholder="(valgfritt)">
                        </div>
                        <button class="knapp" onclick="utsPurre()">Trigg purring nå</button>
                    </div>
                    <div style="margin-top: 6px; font-size: 12px; color: var(--text-secondary);">
                        Purring skjer også automatisk daglig via GitHub Actions.
                    </div>
                </div>
                <div id="u-resultat"></div>
            `;
        }

        window.utsHentBatch = async () => {
            const batchId = document.getElementById('u-batch').value.trim();
            const resultat = document.getElementById('u-resultat');
            if (!batchId) { resultat.innerHTML = '<div class="feilmelding">Batch-ID kreves</div>'; return; }
            resultat.innerHTML = '<div class="laster">Henter…</div>';
            try {
                const data = await api.get(`/api/utsending/batch/${encodeURIComponent(batchId)}`);
                if (data.antall === 0) {
                    resultat.innerHTML = '<div class="tom-melding">Ingen utsendinger i denne batchen.</div>';
                    return;
                }
                resultat.innerHTML = `
                    <div class="panel">
                        <h2>Resultat for ${escHtml(batchId)}</h2>
                        <div style="display: flex; gap: 20px; margin-bottom: 12px; font-size: 14px;">
                            <div><strong>${data.antall}</strong> totalt</div>
                            <div style="color: var(--success);"><strong>${data.besvart}</strong> besvart</div>
                            <div style="color: var(--warning);"><strong>${data.ubesvart}</strong> ubesvart</div>
                        </div>
                        <div class="innehaver-header" style="grid-template-columns: 1.5fr 100px 145px 145px 120px; gap: 12px;">
                            <div>Mottaker</div><div>Kanal</div><div>Opprettet</div><div>Besvart</div><div>Sist purret</div>
                        </div>
                        ${data.rader.map(r => `
                            <div class="innehaver-rad" style="grid-template-columns: 1.5fr 100px 145px 145px 120px; gap: 12px;">
                                <div style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${escHtml(r.Mottaker)}</div>
                                <div>${escHtml(r.KanalHint || 'epost')}</div>
                                <div style="font-family: 'SF Mono', Menlo, monospace; font-size: 12px;">${formatDato(r.Opprettet)}</div>
                                <div>${r.SvarSkjemaId
                                    ? `<span style="color: var(--success);">✓</span> <small>${escHtml(r.SvarSkjemaId)}</small>`
                                    : '<span style="color: var(--text-secondary);">—</span>'}</div>
                                <div style="font-family: 'SF Mono', Menlo, monospace; font-size: 12px;">${r.SistPurret ? formatDato(r.SistPurret) : '<span style="color: var(--text-secondary);">aldri</span>'}</div>
                            </div>
                        `).join('')}
                    </div>
                `;
            } catch (e) {
                resultat.innerHTML = `<div class="feilmelding">${escHtml(e.message)}</div>`;
            }
        };

        window.utsPurre = async () => {
            const batchId = document.getElementById('u-purre-batch').value.trim();
            if (!confirm(batchId
                ? `Trigg purring for batch "${batchId}" nå?`
                : 'Trigg purring for ALLE ubesvarte utsendinger (som ikke er purret nylig)?')) return;
            const resultat = document.getElementById('u-resultat');
            resultat.innerHTML = '<div class="laster">Purrer…</div>';
            try {
                const res = await api.post('/api/utsending/purre', batchId ? { batchId } : {});
                resultat.innerHTML = `
                    <div class="banner ${res.feil ? 'advarsel' : 'suksess'}">
                        ✓ Purret ${res.antallPurret} utsending${res.antallPurret === 1 ? '' : 'er'}
                        ${res.melding ? '<br><small>' + escHtml(res.melding) + '</small>' : ''}
                        ${res.feil ? '<br><small>Feil: ' + escHtml(res.feil) + '</small>' : ''}
                    </div>
                `;
            } catch (e) {
                resultat.innerHTML = `<div class="feilmelding">${escHtml(e.message)}</div>`;
            }
        };

        function formatDato(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            const pad = n => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }

        // ==================== LOGOER-FANE ====================

        function rendrLogoer() {
            document.getElementById('innhold').innerHTML = `
                <div class="panel">
                    <h2>Last opp ny logo</h2>
                    <div id="l-drop" style="border: 2px dashed var(--input-border); border-radius: 8px; padding: 24px; text-align: center; cursor: pointer; background: var(--bg-input);">
                        <div style="font-size: 32px;">🖼</div>
                        <div style="margin-top: 8px; font-size: 14px;">Klikk her eller dra en eller flere bildefiler hit</div>
                        <div style="font-size: 12px; color: var(--text-secondary); margin-top: 4px;">PNG, JPG, SVG, GIF, WebP, BMP, ICO — maks 2 MB per fil</div>
                        <input type="file" id="l-input" multiple accept=".png,.jpg,.jpeg,.gif,.webp,.svg,.bmp,.ico" style="display: none;">
                    </div>
                    <div id="l-opp-status" style="margin-top: 10px;"></div>
                </div>
                <div class="panel">
                    <h2>Eksisterende logoer <span id="l-teller" style="font-weight: 400; color: var(--text-secondary); text-transform: none; letter-spacing: 0; margin-left: 8px;"></span></h2>
                    <input type="text" id="l-sok" placeholder="🔍 Søk logo…" oninput="logoFiltrer()" style="margin-bottom: 12px;">
                    <div id="l-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px;">
                        <div class="laster">Laster…</div>
                    </div>
                </div>
            `;
            const drop = document.getElementById('l-drop');
            const input = document.getElementById('l-input');
            drop.addEventListener('click', () => input.click());
            input.addEventListener('change', () => logoOpplast(input.files));
            drop.addEventListener('dragover', e => { e.preventDefault(); drop.style.borderColor = 'var(--accent)'; });
            drop.addEventListener('dragleave', () => { drop.style.borderColor = 'var(--input-border)'; });
            drop.addEventListener('drop', e => {
                e.preventDefault(); drop.style.borderColor = 'var(--input-border)';
                logoOpplast(e.dataTransfer.files);
            });
            logoLast();
        }

        let logoAlle = [];

        async function logoLast() {
            const grid = document.getElementById('l-grid');
            try {
                logoAlle = await api.get('/api/logoer');
                document.getElementById('l-teller').textContent = `— ${logoAlle.length} logo${logoAlle.length === 1 ? '' : 'er'}`;
                logoRender(logoAlle);
            } catch (e) {
                grid.innerHTML = `<div class="feilmelding">${escHtml(e.message)}</div>`;
            }
        }

        window.logoFiltrer = () => {
            const q = document.getElementById('l-sok').value.trim().toLowerCase();
            logoRender(q ? logoAlle.filter(l => l.navn.toLowerCase().includes(q)) : logoAlle);
        };

        function logoRender(liste) {
            const grid = document.getElementById('l-grid');
            if (liste.length === 0) {
                grid.innerHTML = '<div class="tom-melding" style="grid-column: 1/-1;">Ingen logoer.</div>';
                return;
            }
            grid.innerHTML = liste.map(l => `
                <div style="border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; background: var(--bg-container); display: flex; flex-direction: column; gap: 6px;">
                    <div style="height: 80px; display: flex; align-items: center; justify-content: center; background: var(--bg-input); border-radius: 4px; padding: 4px;">
                        <img src="${escAttr(l.url)}" alt="${escAttr(l.navn)}" style="max-width: 100%; max-height: 100%; object-fit: contain;">
                    </div>
                    <div style="font-size: 11px; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="${escAttr(l.navn)}">${escHtml(l.navn)}</div>
                    <div style="display: flex; gap: 4px;">
                        <button class="knapp mini" onclick="logoKopierUrl('${escAttr(l.navn)}')">Kopier URL</button>
                        <button class="knapp mini danger" onclick="logoSlett('${escAttr(l.navn)}')">Slett</button>
                    </div>
                </div>
            `).join('');
        }

        async function logoOpplast(filer) {
            if (!filer || filer.length === 0) return;
            const status = document.getElementById('l-opp-status');
            let opplastet = 0, feilet = 0;
            for (const fil of filer) {
                status.innerHTML = `<div class="banner info">Laster opp ${escHtml(fil.name)}…</div>`;
                const fd = new FormData();
                fd.append('fil', fil);
                try {
                    const res = await fetch('/api/logoer', { method: 'POST', body: fd });
                    if (!res.ok) { feilet++; console.error(await res.text()); }
                    else opplastet++;
                } catch (e) { feilet++; console.error(e); }
            }
            status.innerHTML = `<div class="banner ${feilet ? 'advarsel' : 'suksess'}">✓ ${opplastet} lastet opp${feilet ? `, ${feilet} feilet` : ''}</div>`;
            document.getElementById('l-input').value = '';
            await logoLast();
        }

        window.logoSlett = async (navn) => {
            if (!confirm(`Slette logoen "${navn}"?`)) return;
            try {
                await api.del('/api/logoer/' + encodeURIComponent(navn));
                await logoLast();
            } catch (e) { alert('Kunne ikke slette: ' + e.message); }
        };

        window.logoKopierUrl = async (navn) => {
            const url = window.location.origin + '/api/logo/' + encodeURIComponent(navn);
            try {
                await navigator.clipboard.writeText(url);
                document.getElementById('l-opp-status').innerHTML =
                    `<div class="banner suksess">✓ URL kopiert: <code>${escHtml(url)}</code></div>`;
            } catch (_) {
                prompt('Kopier URL manuelt:', url);
            }
        };

        // ==================== Hjelpere ====================
        function escHtml(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }
        function escAttr(s) {
            return String(s ?? '').replace(/"/g, '&quot;').replace(/'/g, "\\'");
        }

        init();
    </script>
</body>
</html>
