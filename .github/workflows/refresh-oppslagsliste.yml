name: Oppdater oppslagslister

# SWA Managed Functions støtter ikke timer-triggere.
# Denne workflowen kaller /api/oppslaglister/oppdater på schedule i stedet.
# Samme mønster og samme hemmeligheter som refresh-fs.yml.
#
# 05:30 UTC. Etter FS-refreshen (04:00), som tar 2-4 min, og etter
# utsendingen (05:00) — ikke fordi rekkefølgen betyr noe i dag, men fordi to
# jobber i samme minutt gjør det vanskelig å se hvilken som brukte tiden når
# noe blir tregt.
#
# Den lå på 05:00 til 13.10.2026, altså nøyaktig det den begrunnelsen advarte
# mot. Klokka var ikke sjekket før den ble satt.
#
# Hele klokka, så neste jobb ikke havner oppå en annen:
#
#   02:00 søndag   backup
#   04:00          refresh-fs          (2-4 min)
#   04:30          team-synk
#   04:30 15/1,7   refresh-postnumre
#   05:00          send-utsendinger
#   05:30          refresh-oppslagsliste   ← denne
#   06:00          purre-utsendinger
#   07:00          sjekk-nokler

#
# DEV ER IKKE I MATRISEN, og skal ikke inn i den: der kjører jobben på en
# timer-trigger i Function App-en (steg 5, se 8n i
# docs/BESLUTNING-EGEN-FUNCTION-APP.md). Legges dev inn her, kjører den samme
# jobben to ganger.
#
# Klokkeslettet under og `standardSchedule` for jobben i api/src/lib/jobber.js
# skal beskrive SAMME tidspunkt. NCRONTAB har et sekundfelt foran, så
# uttrykkene er ikke identiske — api/test/timer-trigger.test.js leser begge og
# krever at de stemmer. Endres det ene, skal det andre endres samtidig.

on:
  schedule:
    - cron: '30 5 * * *' # 05:30 UTC daglig
  workflow_dispatch:

jobs:
  oppdater:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: pilot
            url_var: SWA_URL
            key_secret: SCHEDULER_KEY
          - env: prod
            url_var: SWA_URL_PROD
            key_secret: SCHEDULER_KEY_PROD
    name: oppdater (${{ matrix.env }})
    steps:
      - name: Kall oppslaglister/oppdater (${{ matrix.env }})
        env:
          SWA_URL: ${{ vars[matrix.url_var] }}
          SCHEDULER_KEY: ${{ secrets[matrix.key_secret] }}
        run: |
          if [ -z "$SWA_URL" ] || [ -z "$SCHEDULER_KEY" ]; then
            echo "::notice::${{ matrix.env }} — ${{ matrix.url_var }} eller ${{ matrix.key_secret }} mangler, hopper over."
            exit 0
          fi
          echo "Kaller $SWA_URL/api/oppslaglister/oppdater (${{ matrix.env }}) …"
          RESP=$(curl -sS -o response.json -w "%{http_code}" -X POST "$SWA_URL/api/oppslaglister/oppdater" \
            -H "x-scheduler-key: $SCHEDULER_KEY" \
            -H "Content-Type: application/json")
          echo "HTTP $RESP"
          cat response.json
          echo ""
          # 207 = noen lister feilet, andre gikk. Jobben skal bli GUL, ikke
          # grønn: en død liste gir et tomt nedtrekk, og det er ikke «ok».
          if [ "$RESP" = "207" ]; then
            echo "::warning::Minst én oppslagsliste feilet — se svaret over."
            exit 0
          fi
          if [ "$RESP" != "200" ]; then exit 1; fi
