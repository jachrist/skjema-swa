name: Deploy prod

# Manuell deploy til prod-tenanten. Kjøres kun etter godkjent test på pilot.
# Krever GitHub Environment "prod" med required reviewer for ekstra sikkerhet.
#
# Forutsetning:
#   1. Prod-tenant SWA er opprettet med env-vars satt i Configuration
#   2. AZURE_STATIC_WEB_APPS_API_TOKEN_PROD er lagt til som repo secret
#   3. config/env.prod.json er fylt ut med prod-verdier
#
# Trigges fra Actions-fanen i GitHub: velg denne workflowen → Run workflow.

on:
  workflow_dispatch:
    inputs:
      bekreft:
        description: "Skriv 'DEPLOY-PROD' for å bekrefte deploy til produksjon"
        required: true
        type: string
      # Et navngitt preview-miljø ligger på SAMME SWA-ressurs som produksjon og
      # arver app settings derfra — også Key Vault-referansen til
      # auth-sertifikatet. Det er derfor en ekte prøve på innloggingen, ikke en
      # tilnærming, og den eneste måten å teste den uten å risikere at ingen
      # kommer inn i produksjon.
      #
      # Miljøet opprettes av denne kjøringen; ingenting settes opp på forhånd.
      # URL: <vertsnavn>-<navn>.<region>.azurestaticapps.net — det vertsnavnet
      # må legges inn som redirect-URI i app-registreringen, ellers avviser
      # Entra innloggingen der (og bare der).
      preview:
        description: "Valgfritt: navn på preview-miljø, f.eks. 'test'. Tomt = produksjon."
        required: false
        type: string

jobs:
  valider:
    runs-on: ubuntu-latest
    steps:
      - name: Sjekk bekreftelse
        run: |
          if [ "${{ inputs.bekreft }}" != "DEPLOY-PROD" ]; then
            echo "::error::Bekreftelse må være 'DEPLOY-PROD'. Fikk: '${{ inputs.bekreft }}'"
            exit 1
          fi
      # Målet skrives i klartekst i kjøringens sammendrag. Bekreftelsesordet er
      # det samme for begge, så det er her man ser hva som faktisk skjer.
      - name: Vis mål
        run: |
          if [ -n "${{ inputs.preview }}" ]; then
            echo "### Mål: preview-miljøet \`${{ inputs.preview }}\` — IKKE produksjon" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Mål: PRODUKSJON" >> $GITHUB_STEP_SUMMARY
          fi

  build_and_deploy_job:
    needs: valider
    runs-on: ubuntu-latest
    name: Build and Deploy to Prod
    environment: prod
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          lfs: false
      - name: Sett opp Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Testene er rene node-skript uten avhengigheter — Azure-SDK-ene lastes
      # lat i storage.js og blob.js. Derfor trengs ingen npm ci her, og steget
      # koster noen få sekunder. Feiler det, stopper deployen.
      - name: Kjør tester
        run: node scripts/kjor-tester.js

      # Eget steg, ikke app_build_command — se forklaringen i deploy-pilot.yml.
      # Oryx hoppet over byggetrinnet fordi frontend/ ikke har en package.json,
      # så kommandoen ble aldri kjørt.
      - name: Bygg konfigurasjon
        run: node scripts/build-config.js prod

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PROD }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "./frontend"
          api_location: "api"
          output_location: ""
          # Ingen app_build_command: konfigurasjonen er alt bygget i steget over.
          skip_app_build: true
          # Tom verdi = produksjonsmiljøet, som før.
          deployment_environment: ${{ inputs.preview }}
