name: Deploy innhold til prøve-SWA (steg 1)

# Legger ut én HTML-fil på prøve-SWA-en fra steg 1, slik at den har en aktiv
# build å rute fra. En SWA uten innhold ruter ingenting — heller ikke til en
# lenket backend, selv om lenkingen står registrert.
#
# Hvorfor en arbeidsflyt og ikke `swa deploy` lokalt: SWA CLI-en feilet på
# Windows 14.10.2026, først ved å traversere hele brukerprofilen på jakt etter
# staticwebapp.config.json, så med «deployment binary exited with code 1» uten
# noen årsak. Actionen her er den samme som deploy-pilot.yml bruker, og den
# virker.
#
# MIDLERTIDIG. Slettes sammen med prøve-SWA-en når steg 1 er besvart.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Sett opp Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Samme regel som de andre deploy-arbeidsflytene: testene først.
      - name: Kjør tester
        run: node scripts/kjor-tester.js

      - name: Build And Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_PROEVE_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "proeve/swa-innhold"
          api_location: ""
          output_location: ""
          skip_app_build: true
          # Eksplisitt, ikke fordi det var årsaken til at første kjøring
          # ikke slo gjennom — det var det ikke. Miljølista viste bare ett
          # miljø, `default`, med status `Uploading`: deployen nådde riktig
          # sted og ble stående uferdig.
          #
          # De blir likevel stående. Semantikken er at
          # `deployment_environment` overstyrer alt, og at en tom verdi
          # sammen med `production_branch` sender andre grener til preview.
          # Settes ingen av dem, avgjør standardoppførselen — og den ville
          # bitt oss den dagen forsøket ble kjørt fra en annen gren.
          #
          # ${{ github.ref_name }} framfor et fast navn, fordi forsøket
          # kjøres fra en arbeidsgren som skifter navn.
          production_branch: ${{ github.ref_name }}
          deployment_environment: ''
