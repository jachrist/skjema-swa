name: Deploy pilot (test/utvikling)

# Automatisk deploy til pilot-tenanten ved push til main.
# Prod-tenanten deployes fra deploy-prod.yml (manuell trigger).
#
# paths-ignore: rene dokumentasjonsendringer (docs/, README, CLAUDE.md, TODO)
# deployes ikke — ingen .md-fil inngår i frontend/ eller api/. Berører en commit
# både kode og dokumentasjon, kjører deployen som normalt.

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    environment: pilot
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          lfs: false
      - name: Sett opp Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      # Testene er rene node-skript uten avhengigheter — Azure-SDK-ene lastes
      # lat i storage.js og blob.js. Derfor trengs ingen npm ci her, og steget
      # koster noen få sekunder. Feiler det, stopper deployen.
      - name: Kjør tester
        run: node scripts/kjor-tester.js
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ASHY_MEADOW_0F2A44503 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "./frontend"
          api_location: "api"
          output_location: ""
          app_build_command: "node ../scripts/build-config.js pilot"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ASHY_MEADOW_0F2A44503 }}
          action: "close"
