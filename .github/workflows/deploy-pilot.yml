name: Deploy pilot (test/utvikling)

# Automatisk deploy til pilot-tenanten ved push til main.
# Prod-tenanten deployes fra deploy-prod.yml (manuell trigger).
#
# paths-ignore: rene dokumentasjonsendringer (docs/, README, CLAUDE.md, TODO)
# deployes ikke — ingen .md-fil inngår i frontend/ eller api/. Berører en commit
# både kode og dokumentasjon, kjører deployen som normalt.

on:
  # Manuell kjøring fra Actions-fanen. Trengs når siste push bare rørte
  # dokumentasjon, eller når en deploy skal kjøres om igjen uten en ny commit
  # — for eksempel etter at en innstilling er endret i Azure.
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'

# Dependabot-utløste kjøringer får ikke repoets secrets — de ligger i et
# eget dependabot-scope. deployment_token blir dermed tomt, og SWA-actionen
# feiler med «deployment_token was not provided». Slike PR-er skal derfor
# ikke deployes; CI-jobben validerer dem i stedet.
jobs:
  build_and_deploy_job:
    if: github.actor != 'dependabot[bot]' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed'))
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    environment: pilot
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          lfs: false
      - name: Sett opp Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Testene er rene node-skript uten avhengigheter — Azure-SDK-ene lastes
      # lat i storage.js og blob.js. Derfor trengs ingen npm ci her, og steget
      # koster noen få sekunder. Feiler det, stopper deployen.
      - name: Kjør tester
        run: node scripts/kjor-tester.js

      # Kjøres som eget steg, ikke via app_build_command.
      #
      # Oryx leter etter en kjent plattform i app_location. frontend/ har ingen
      # package.json, så Oryx svarte «Could not detect the language from repo»,
      # hoppet over hele byggetrinnet — og dermed også vår egen kommando. Den
      # ble aldri kjørt, i noen deploy, i noe miljø.
      #
      # Utslaget var stille: frontend/js/config.js og
      # frontend/staticwebapp.config.json ble liggende slik de sist ble sjekket
      # inn. Pilot serverte derfor MILJO=production, og hele
      # staticwebapp.config.json — ruteregler, headere og auth — var aldri i
      # kraft.
      - name: Bygg konfigurasjon
        run: node scripts/build-config.js pilot

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ASHY_MEADOW_0F2A44503 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "./frontend"
          api_location: "api"
          output_location: ""
          # Ingen app_build_command: konfigurasjonen er alt bygget i steget over.
          skip_app_build: true

  close_pull_request_job:
    if: github.actor != 'dependabot[bot]' && github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ASHY_MEADOW_0F2A44503 }}
          action: "close"
