name: Deploy to Azure Static Web Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Environment styrer required reviewer og hvilke secrets som er tilgjengelig.
    # Push til main → production (med approval). Vi legger til development-flyt
    # senere når vi vil ha auto-deploy for feature-branches.
    environment:
      name: production
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer API-avhengigheter
        run: npm ci
        working-directory: api

      - name: Generer frontend/js/config.js
        run: node scripts/build-config.js production

      - name: Deploy til Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'frontend'
          api_location: 'api'
          output_location: ''
# TODO: bytt fra deployment token til OIDC federated credential når SWA-tenanten
#       er ferdig konfigurert. Se docs/SECURITY.md.
