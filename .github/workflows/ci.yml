name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Installer API-avhengigheter
        run: npm ci
        working-directory: api
      - name: Kjør tester
        run: npm test
        working-directory: api

      # Deploy kjører testene uten npm ci. Denne fanger en test som drar inn
      # en npm-pakke her, i stedet for at utrullingen stopper på det.
      - name: Kjør tester uten node_modules (som deploy)
        run: node scripts/kjor-tester.js --uten-pakker
      # Bygger PILOT, ikke «development». Det fantes ingen deploy-workflow
      # for development — fila var bare input til denne røyktesten, og en
      # miljøfil ingen ruller ut, vedlikeholdes ikke. Nå testes et miljø som
      # faktisk finnes.
      - name: Bygg config for pilot
        run: node scripts/build-config.js pilot

      # Dokumentasjonen bygges HER med --strict, og det er med vilje:
      # en død lenke mellom to dokumenter, eller en fil som ikke står i
      # navigasjonen, skal stoppe en PR — ikke en utrulling. Deploy-jobbene
      # bygger uten --strict, slik at en lenkefeil aldri kan hindre at en
      # rettelse kommer ut.
      #
      # pandoc ligger ikke på runneren. Uten den hopper skriptet over PDF-ene
      # med en advarsel, og da var PDF-veien aldri prøvd før den trengtes.
      - name: Installer pandoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pandoc
      - name: Bygg dokumentasjonen (strict)
        run: scripts/bygg-dokumentasjon.sh --strict
