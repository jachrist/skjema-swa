name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Installer API-avhengigheter
        run: npm ci
        working-directory: api
      - name: Kjør tester
        run: npm test
        working-directory: api
      - name: Bygg config for development
        run: node scripts/build-config.js development
