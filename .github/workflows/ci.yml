name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer API-avhengigheter
        run: npm ci
        working-directory: api
      - name: Kjør tester
        run: npm test
        working-directory: api

      # Deploy kjører testene uten npm ci. Denne fanger en test som drar inn
      # en npm-pakke her, i stedet for at utrullingen stopper på det.
      - name: Kjør tester uten node_modules (som deploy)
        run: node scripts/kjor-tester.js --uten-pakker
      # Bygger PILOT, ikke «development». Det fantes ingen deploy-workflow
      # for development — fila var bare input til denne røyktesten, og en
      # miljøfil ingen ruller ut, vedlikeholdes ikke. Nå testes et miljø som
      # faktisk finnes.
      - name: Bygg config for pilot
        run: node scripts/build-config.js pilot
