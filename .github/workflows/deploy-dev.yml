name: Deploy frontend til dev-SWA

# Steg 0 i docs/BESLUTNING-EGEN-FUNCTION-APP.md — dev-miljøet.
#
# DENNE DEPLOYER BARE FRONTEND. `api_location: ""` er ikke en forglemmelse:
# dev kjører API-et på en lenket Function App, ikke på SWA Managed Functions.
# API-et rulles ut med «Deploy API til Function App», og de to er separate
# jobber som kan bli hengende hver for seg. Derfor bærer /api/ping og
# /js/config.js hver sin commit-SHA — avviker de, vet du hvilken som henger.
#
# KUN manuell kjøring inntil videre. Dev skal ikke deployes av en push til
# main før miljøet står og noen har sett at det virker; en rød jobb ved hver
# push er en jobb folk slutter å lese.
on:
  workflow_dispatch:
    inputs:
      # Hvilken SWA skal den deployes til?
      #
      # Dev-tenanten kan ha mer enn én: gjennomkjøringen av
      # docs/KOKEBOK-PROD-V3.md oppretter en v3-SWA ved siden av den
      # eksisterende, og den har sin EGEN deployment token. Uten dette valget
      # måtte man byttet verdien på den faste hemmeligheten fram og tilbake —
      # og den som glemmer å bytte tilbake, deployer neste rettelse til
      # prøveoppsettet.
      #
      # Navnet på hemmeligheten, ikke verdien. Standarden er den som har vært
      # brukt hele tiden, så en kjøring uten valg oppfører seg som før.
      swa_token_secret:
        description: 'Navnet på hemmeligheten med deployment token'
        required: false
        default: 'AZURE_STATIC_WEB_APPS_API_TOKEN_DEV'

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    environment: dev
    env:
      # Slås opp dynamisk, samme mønster som matrisen i backup.yml.
      SWA_TOKEN: ${{ secrets[inputs.swa_token_secret || 'AZURE_STATIC_WEB_APPS_API_TOKEN_DEV'] }}
    steps:
      # Et navn som ikke finnes blir en TOM streng, ikke en feil. SWA-actionen
      # svarer da med «deployment token is invalid», som ser ut som en utløpt
      # token og sender feilsøkingen mot Azure-portalen. Si det her i stedet.
      - name: Sjekk at tokenet finnes
        run: |
          if [ -z "$SWA_TOKEN" ]; then
            echo "::error::Hemmeligheten «${{ inputs.swa_token_secret }}» finnes ikke, eller er tom."
            echo "Legg den inn under Settings → Secrets → Actions (repo eller miljøet «dev»)."
            exit 1
          fi
          echo "Bruker hemmeligheten «${{ inputs.swa_token_secret }}»."

      - uses: actions/checkout@v7
        with:
          submodules: true
          lfs: false

      - name: Sett opp Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Samme regel som de andre deploy-jobbene: testene først, og de stopper
      # utrullingen hvis de er røde. Ingen npm ci — Azure-SDK-ene lastes lat.
      - name: Kjør tester
        run: node scripts/kjor-tester.js

      # Skriver frontend/js/config.js og frontend/staticwebapp.config.json.
      # Uten dette steget serverer dev pilotens konfigurasjon, inkludert
      # pilotens tenant i openIdIssuer — og innloggingen peker feil sted.
      - name: Bygg konfigurasjon
        run: node scripts/build-config.js dev

      # Dokumentasjonen blir en del av appen som lastes opp: SWA serverer
      # `app_location`, og sidene havner under /dokumentasjon/ bak
      # ruteregelen i staticwebapp.config.json. Uten --strict — en død lenke
      # i et dokument skal ikke kunne stoppe en utrulling. CI bygger strengt.
      - name: Installer pandoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pandoc
      - name: Bygg dokumentasjonen
        run: scripts/bygg-dokumentasjon.sh

      - name: Build And Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "./frontend"
          api_location: ""
          output_location: ""
          skip_app_build: true
