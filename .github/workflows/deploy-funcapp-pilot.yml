name: Deploy API til Function App

# Deployer BARE api/ til en frittstående Function App. Frontend og
# SWA-oppsettet røres ikke av denne jobben.
#
# Skrevet for steg 1-forsøket 14.10.2026. Det er besvart, og prøveoppsettet
# er revet — men denne jobben er IKKE stillas: den er deploy-veien steg 0
# bruker for dev-miljøet (8g i docs/BESLUTNING-EGEN-FUNCTION-APP.md).
# Filnavnet sier «pilot» av historiske grunner; `appnavn` avgjør hvor det går.
#
# `miljo` må utvides med `dev` når det miljøet opprettes. Den står i lista
# over filer som må endres i 8g.3 — ikke stol på et antall her, lista er
# fasiten.
#
# KUN manuell kjøring. Function App-en finnes ikke før noen har opprettet
# den (scripts/steg1-funcapp.ps1), og en jobb som feiler ved hver push er en
# jobb folk slutter å lese.
on:
  workflow_dispatch:
    inputs:
      # NAVNET PÅ RESSURSEN, ikke visningsnavnet på SWA-en ved siden av.
      # 22.10.2026 ble `Skjema-3-dev` oppgitt, og handlingen svarte «Resource
      # Skjema-3-dev of type Microsoft.Web/Sites doesn't exist». Den riktige
      # er `fa-skjema-3-dev` — konvensjonen er `fa-skjema-3-<miljø>`.
      appnavn:
        description: 'Function App-ressursen, f.eks. fa-skjema-3-dev (ikke .azurewebsites.net)'
        required: true
      miljo:
        description: 'Miljø config bygges for'
        required: true
        default: 'pilot'
        type: choice
        options: [dev, pilot, prod]
      # EKSPLISITT, ikke vars.SWA_URL. Den faller tilbake til repo-nivå når
      # miljøet ikke har sin egen, og da ville verifiseringen lest ET ANNET
      # MILJØ og meldt et falskt avvik. En sjekk som kan ta feil på den måten
      # er verre enn ingen.
      verifiser_url:
        description: 'Valgfritt: adressen /api/ping skal leses fra, f.eks. https://<swa>.azurestaticapps.net'
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.miljo }}
    steps:
      - uses: actions/checkout@v7

      - name: Sett opp Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Samme rekkefølge som deploy-prod.yml: testene først, og de stopper
      # deployen hvis de er røde.
      - name: Kjør tester
        run: node scripts/kjor-tester.js

      # Skriver api/src/versjon.json, som ping leser byggstempelet fra.
      # Uten dette steget svarer /api/ping med commit 'ukjent', og da kan
      # ikke forsøket skilles fra «ikke deployet».
      - name: Bygg konfigurasjon
        run: node scripts/build-config.js ${{ inputs.miljo }}

      # En Function App kjører ikke Oryx slik SWA gjør — avhengighetene må
      # være med i pakka. --omit=dev fordi testene ikke trenger å være der.
      - name: Installer avhengigheter
        run: npm ci --omit=dev
        working-directory: api

      - name: Logg inn i Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_FUNCAPP_CREDENTIALS }}

      # «doesn't exist» betyr TO ting, og handlingen sier ikke hvilken.
      #
      # Enten er navnet feil, eller så ser ikke tjenestehovedobjektet
      # ressursen — `Azure/functions-action` slår opp appen, og et oppslag
      # kan trenge leserett bredere enn den ene ressursen (se kapittel 8 i
      # KOKEBOK-PROD-V3.md). Forskjellen avgjøres av om vi ser NOEN
      # Function Apps i det hele tatt.
      #
      # Steget feiler ikke selv om oppslaget er tomt: en manglende leserett
      # hindrer ikke nødvendigvis deployen, og en vakt som stopper en
      # kjøring som ville gått er verre enn ingen. Den sier fra, og lar
      # handlingen avgjøre.
      - name: Finnes appen?
        env:
          APPNAVN: ${{ inputs.appnavn }}
        run: |
          SYNLIGE=$(az functionapp list --query "[].name" -o tsv 2>/dev/null || true)
          if echo "$SYNLIGE" | grep -qx "$APPNAVN"; then
            echo "Fant $APPNAVN."
          elif [ -z "$SYNLIGE" ]; then
            echo "::warning::Ser ingen Function Apps i det hele tatt. Feiler deployen med «doesn't exist», er det LESERETT som mangler — ikke navnet. Se kapittel 8 i KOKEBOK-PROD-V3.md."
          else
            echo "::error::Fant ikke «$APPNAVN». Disse ser jeg:"
            echo "$SYNLIGE" | sed 's/^/  /'
            echo "::error::Konvensjonen er fa-skjema-3-<miljø>. Oppgi ressursnavnet, ikke visningsnavnet på SWA-en."
            exit 1
          fi

      - name: Deploy
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ inputs.appnavn }}
          package: api
          respect-funcignore: true

      # En grønn deploy er ikke et bevis på at koden er ute.
      #
      # 20.10.2026: sertifikatet var satt opp i dev og GRAPH_CLIENT_SECRET
      # fjernet, men Function App-en kjørte kode fra før sertifikatstøtten.
      # erKonfigurert() ble usann, backupen gikk stille via PA-flyten, og
      # feilsøkingen gikk mot flyten i stedet for mot deployen.
      #
      # deploy-prod.yml fikk dette steget 19.10. Denne workflowen deployer
      # dev sitt API og hadde det ikke.
      - name: Verifiser at deployen faktisk landet
        env:
          MAAL: ${{ inputs.verifiser_url }}
          FORVENTET: ${{ github.sha }}
        run: |
          KORT="${FORVENTET:0:7}"
          if [ -z "$MAAL" ]; then
            echo "::warning::Deployen er IKKE verifisert — ingen adresse oppgitt. Åpne <miljøets adresse>/api/ping og sjekk at den melder commit $KORT. Kjør workflowen med «verifiser_url» utfylt for å få det gjort automatisk."
            echo "### Deployet, men IKKE verifisert. Sjekk \`/api/ping\` manuelt mot \`$KORT\`" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          MAAL="${MAAL%/}"
          echo "Forventer commit $KORT på $MAAL/api/ping"
          for FORSOK in 1 2 3 4 5 6 7 8; do
            SVAR=$(curl -sS --max-time 20 "$MAAL/api/ping" || echo '')
            UTE=$(printf '%s' "$SVAR" | python3 -c "import json,sys; print(json.load(sys.stdin).get('bygg',{}).get('commit',''))" 2>/dev/null || echo '')
            echo "  forsøk $FORSOK: /api/ping melder '${UTE:-(intet svar)}'"
            if [ "$UTE" = "$KORT" ] || [ "$UTE" = "$FORVENTET" ]; then
              echo "### Deploy verifisert: ${{ inputs.appnavn }} kjører \`$KORT\`" >> $GITHUB_STEP_SUMMARY
              exit 0
            fi
            sleep 15
          done
          echo "::error::Deployen ble rapportert vellykket, men /api/ping på $MAAL melder fortsatt '${UTE:-(intet svar)}' og ikke '$KORT'. ${{ inputs.appnavn }} kjører IKKE denne commiten."
          echo "### Deploy IKKE verifisert — melder \`${UTE:-ukjent}\`, forventet \`$KORT\`" >> $GITHUB_STEP_SUMMARY
          exit 1
