<!DOCTYPE html>
<html lang="nb">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Skjemasystemet har flyttet</title>
    <!--
        Videresending fra v2-prod (gentle-dune) til www.fskjema.no.

        Valg A i «Gentle-dune etter cutover» (trinn 7c og 13b) i
        docs/KOKEBOK-PROD-V3.md. Nettlesere som besøkte fskjema.no før
        28.10.2026, har lagret en permanent 301 til gentle-dune. Uten denne
        siden havner de i v2-appen, med v2 sin kode mot produksjonsdataene.

        Stien og spørrestrengen beholdes: en lenke til
        /visning.html?id=… på gentle-dune skal havne på samme side på www.
        Det gjelder bokmerker, og lenker i e-poster som ble sendt mens
        SWA_URL på v3-prod fortsatt pekte hit.

        Alle stier serveres av denne fila (navigationFallback i
        staticwebapp.config.json). Den rulles ut med
        .github/workflows/deploy-v2-videresending.yml, aldri med deploy-prod.
    -->
    <meta http-equiv="refresh" content="3; url=https://www.fskjema.no/">
    <script>
        (function () {
            var sti = window.location.pathname + window.location.search + window.location.hash;
            window.location.replace('https://www.fskjema.no' + (sti.charAt(0) === '/' ? sti : '/' + sti));
        })();
    </script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
               max-width: 560px; margin: 80px auto; padding: 0 16px; color: #1c1c1e; background: #fff; }
        a { color: #0a84ff; }
    </style>
</head>
<body>
    <h1>Skjemasystemet har flyttet</h1>
    <p>Du sendes videre til <a href="https://www.fskjema.no/">www.fskjema.no</a>.</p>
    <p>Skjer ingenting, trykk på lenken. Har du et bokmerke til denne adressen, bør du bytte det ut.</p>
</body>
</html>
